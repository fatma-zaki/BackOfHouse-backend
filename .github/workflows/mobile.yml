# Mobile app (apps/mobile, Flutter): analyze and test on Linux. Store builds are
# not made here. Also runs when the app contract changes.
name: mobile

on:
  push:
    branches: [main]
    paths: ['apps/mobile/**', 'contracts/app/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['apps/mobile/**', 'contracts/app/**', '.github/workflows/mobile.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/mobile

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
