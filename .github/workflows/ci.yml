# Stage 1 CI (backend-development-order.md): lint, typecheck, test, audit,
# secret scan. Integration tests run against a Postgres service container of
# the same major version family as Supabase.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run depcruise
      # Expand/contract migrations: squawk on migrations added or changed by this PR or push.
      - name: Lint new migrations
        env:
          MIGRATIONS_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: npm run migrations:lint
      - run: npm test
      # Surface boundary rules against fixtures (spawns dependency-cruiser; kept out of the parallel unit pool).
      - run: npm run test:architecture
      # Contract-first (ADR-031): every operation has an x-phase, and the spec generated
      # from code matches contracts/<surface>/openapi.yaml up to contracts/phase.json.
      - run: npm run contract:coverage
      - run: npm run contract:generate
      - run: npm run contract:check
      - name: Admin client types are up to date
        run: npm run contract:types && git diff --exit-code contracts/admin/types
      - run: npm run test:integration
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
