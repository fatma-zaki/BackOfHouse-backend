# Admin web app (apps/admin-web): lint and production build. Also runs when the
# admin contract changes, since the web app reads its types.
name: admin-web

on:
  push:
    branches: [main]
    paths: ['apps/admin-web/**', 'contracts/admin/**', '.github/workflows/admin-web.yml']
  pull_request:
    paths: ['apps/admin-web/**', 'contracts/admin/**', '.github/workflows/admin-web.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/admin-web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
