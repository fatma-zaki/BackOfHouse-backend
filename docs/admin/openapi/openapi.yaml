components:
  securitySchemes:
    memberAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Member access token (15 min) from /auth/login or /auth/refresh.
    adminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Admin session token from /admin/auth/mfa/verify. Separate signing key and audience from member tokens.
        Idle timeout 30 min.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 64
      description: Client-generated UUID. Repeating the request with the same key returns the first result instead of acting
        twice (kept 24 h).
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        enum:
        - en
        - ar
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or expired token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Role lacks the permission (code FORBIDDEN or PERSONAL_DATA_FORBIDDEN)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found or not visible to the caller
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: State conflict, e.g. LISTING_NOT_EDITABLE, ALREADY_APPLIED
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Business rule failed, e.g. INSUFFICIENT_POINTS, MONTHLY_CAP_REACHED
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable error code, e.g. LISTING_NOT_EDITABLE
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
        traceId:
          type: string
      required:
      - title
      - status
      - code
      description: RFC 7807 problem details. Content-Type application/problem+json.
    LocalizedText:
      type: object
      properties:
        en:
          type: string
        ar:
          type: string
      description: Bilingual text. Admin endpoints read and write both languages; member endpoints return the single language
        chosen by Accept-Language as a plain string.
    PageMeta:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
        totalPages:
          type: integer
      required:
      - page
      - pageSize
      - total
      - totalPages
    CursorMeta:
      type: object
      properties:
        nextCursor:
          oneOf:
          - type: string
          - type: 'null'
        hasMore:
          type: boolean
      required:
      - nextCursor
      - hasMore
    Money:
      type: object
      properties:
        amount:
          type: integer
          description: Whole SAR (no halalas) unless stated
        currency:
          type: string
          enum:
          - SAR
      required:
      - amount
      - currency
    MoneyRange:
      type: object
      properties:
        min:
          oneOf:
          - type: integer
          - type: 'null'
        max:
          oneOf:
          - type: integer
          - type: 'null'
        currency:
          type: string
          enum:
          - SAR
        note:
          oneOf:
          - type: string
            description: e.g. 'Discussed at interview'
          - type: 'null'
    City:
      type: object
      properties:
        id:
          type: string
          description: Slug, e.g. riyadh
        name:
          type: string
        nameAr:
          type: string
      required:
      - id
      - name
    Upload:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          description: Short-lived signed URL for private files
        mime:
          type: string
        size:
          type: integer
        purpose:
          type: string
          enum:
          - avatar
          - company_logo
          - company_cover
          - portfolio
          - verification_doc
          - article_cover
          - event_cover
          - reward_image
          - import_file
          - ticket_attachment
      required:
      - id
      - url
      - mime
      - purpose
    UploadRequest:
      type: object
      properties:
        purpose:
          type: string
          enum:
          - avatar
          - company_logo
          - company_cover
          - portfolio
          - verification_doc
          - article_cover
          - event_cover
          - reward_image
          - import_file
          - ticket_attachment
        mime:
          type: string
        size:
          type: integer
          maximum: 20971520
        fileName:
          type: string
      required:
      - purpose
      - mime
      - size
    UploadTicket:
      type: object
      properties:
        uploadId:
          type: string
          format: uuid
        putUrl:
          type: string
          format: uri
          description: Pre-signed PUT URL, valid 10 minutes
        headers:
          type: object
          additionalProperties:
            type: string
      required:
      - uploadId
      - putUrl
    Ok:
      type: object
      properties:
        ok:
          type: boolean
      required:
      - ok
    JobAccepted:
      type: object
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - queued
          - processing
      required:
      - jobId
      - status
    RegisterRequest:
      type: object
      properties:
        accountType:
          type: string
          enum:
          - individual
          - company
        fullName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          description: E.164, e.g. +9665XXXXXXXX
        password:
          type: string
          minLength: 8
        isStudent:
          type: boolean
          description: Individuals only. Unlocks co-op opportunities.
        companyName:
          type: string
          description: Required when accountType = company
        locale:
          type: string
          enum:
          - en
          - ar
      required:
      - accountType
      - fullName
      - email
      - password
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
    TokenPair:
      type: object
      properties:
        accessToken:
          type: string
        accessTokenExpiresIn:
          type: integer
          description: seconds
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/Me'
      required:
      - accessToken
      - refreshToken
    AdminLoginResponse:
      type: object
      properties:
        mfaRequired:
          type: boolean
        mfaToken:
          type: string
          description: Short-lived token for the /mfa/verify step
        mfaSetupRequired:
          type: boolean
          description: True on first sign-in after an invite
      required:
      - mfaRequired
      - mfaToken
    AdminSession:
      type: object
