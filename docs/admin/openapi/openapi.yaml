openapi: 3.1.0
info:
  title: Back of House API
  version: 1.0.0
  description: 'Contract for the Back of House mobile app (members and companies), the company workspace, and the admin back-office
    with team roles.


    Read docs/04-api-conventions.md for auth, errors, pagination, languages and idempotency. `x-permission` on admin operations
    names the permission key the caller''s role must hold; `x-screens` lists the HTML screens (file slugs) that use the operation
    (admin screens are prefixed `admin:`).'
servers:
- url: https://api.backofhouse.sa/v1
  description: Production (example)
- url: http://localhost:3000/v1
  description: Local
security:
- memberAuth: []
tags:
- name: Auth
- name: Me
- name: Uploads
- name: Home
- name: Events
- name: Listings
- name: Companies
- name: Professionals
- name: News
- name: Notifications
- name: Rewards
- name: Verification
- name: Reports & support
- name: Company workspace
- name: Admin auth
- name: Admin dashboards
- name: Admin analytics
- name: Admin listings
- name: Admin applications
- name: Admin supplier requests
- name: Admin users
- name: Admin companies
- name: Admin verification
- name: Admin claims & imports
- name: Admin events
- name: Admin news
- name: Admin rewards & points
- name: Admin moderation
- name: Admin support
- name: Admin broadcasts
- name: Admin team
- name: Admin audit
- name: Admin reports & exports
- name: Admin settings
- name: Meta
paths:
  /auth/register:
    post:
      tags:
      - Auth
      summary: Create an account (individual or company)
      operationId: postAuthRegister
      description: Creates the user. For accountType=company also creates an unverified Company with the user as owner. Sends
        an email-verification link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '409': &id006
          $ref: '#/components/responses/Conflict'
        '422': &id002
          $ref: '#/components/responses/Unprocessable'
      security: []
      x-screens:
      - sign-up
  /auth/login:
    post:
      tags:
      - Auth
      summary: Sign in
      operationId: postAuthLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400': *id001
      security: []
      x-screens:
      - sign-in
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: Rotate tokens
      operationId: postAuthRefresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required:
              - refreshToken
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400': *id001
      security: []
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Revoke the refresh token
      operationId: postAuthLogout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '204':
          description: No content
        '401': &id003
          $ref: '#/components/responses/Unauthorized'
  /auth/password/forgot:
    post:
      tags:
      - Auth
      summary: Send a password reset email
      operationId: postAuthPasswordForgot
      description: Always returns 204 so emails can't be enumerated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
              - email
      responses:
        '204':
          description: No content
        '400': *id001
      security: []
  /auth/password/reset:
    post:
      tags:
      - Auth
      summary: Set a new password with a reset token
      operationId: postAuthPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
              required:
              - token
              - password
      responses:
        '204':
          description: No content
        '400': *id001
        '422': *id002
      security: []
  /me:
    get:
      tags:
      - Me
      summary: Current member profile, points and settings
      operationId: getMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400': *id001
        '401': *id003
        '403': &id004
          $ref: '#/components/responses/Forbidden'
        '404': &id005
          $ref: '#/components/responses/NotFound'
      x-screens:
      - profile
      - home
    patch:
      tags:
      - Me
      summary: Update profile
      operationId: patchMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400': *id001
        '401': *id003
        '422': *id002
      x-screens:
      - edit-profile
  /me/contact-sharing:
    put:
      tags:
      - Me
      summary: Set contact privacy (share email / phone with companies)
      operationId: putMeContactSharing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactSharing'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactSharing'
        '400': *id001
        '401': *id003
        '403': *id004
        '404': *id005
      x-screens:
      - edit-profile
  /me/preferences:
    patch:
      tags:
      - Me
      summary: Language, theme and notification preferences
      operationId: patchMePreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '400': *id001
        '401': *id003
        '403': *id004
        '404': *id005
      x-screens:
      - profile
  /me/data-requests:
    post:
      tags:
      - Me
      summary: Ask for a copy of my data or account deletion
      operationId: postMeDataRequests
      description: Creates a request handled by Super admins (see /admin/users/{id}/data-requests).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum:
                  - download
                  - delete
              required:
              - type
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '400': *id001
        '401': *id003
        '403': *id004
        '404': *id005
  /uploads:
    post:
      tags:
      - Uploads
      summary: Get a pre-signed upload URL
      operationId: postUploads
      description: Client PUTs the file to putUrl, then sends uploadId in the related request. verification_doc and import_file
        are stored privately and only served through short-lived signed URLs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadTicket'
        '400': *id001
        '401': *id003
        '403': *id004
        '404': *id005
  /home:
    get:
      tags:
      - Home
      summary: 'Home feed: featured event, opportunities for you, points summary'
      operationId: getHome
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  greetingName:
                    type: string
                  points:
                    $ref: '#/components/schemas/PointsSummary'
                  featuredEvent:
                    oneOf:
                    - $ref: '#/components/schemas/Event'
                    - type: 'null'
                  opportunities:
                    type: array
                    items:
                      $ref: '#/components/schemas/Listing'
                  unreadNotifications:
                    type: integer
        '400': *id001
        '401': *id003
        '403': *id004
        '404': *id005
      x-screens:
      - home
  /search:
    get:
      tags:
      - Home
      summary: Search everything (events, listings, companies, professionals, news)
      operationId: getSearch
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
      - name: types
        in: query
        required: false
        schema:
          type: string
          description: Comma list
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
                  listings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Listing'
                  companies:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompanySummary'
                  professionals:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProfessionalCard'
                  articles:
                    type: array
                    items:
                      $ref: '#/components/schemas/ArticleCard'
                  suggestions:
                    type: array
                    items:
                      type: string
                      description: Shown on the no-results screen
        '400': *id001
        '401': *id003
        '403': *id004
        '404': *id005
      x-screens:
      - search-no-results
      - discover
  /events:
    get:
      tags:
      - Events
      summary: Browse events
      operationId: getEvents
      parameters:
      - &id009
        name: q
        in: query
        required: false
        schema:
          type: string
          description: Free-text search
      - &id007
        name: cursor
        in: query
        required: false
        schema:
          type: string
          description: Opaque cursor from meta.nextCursor
      - &id008
        name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      - name: city
        in: query
        required: false
        schema:
          type: string
      - name: type
        in: query
        required: false
        schema:
          type: string
      - name: topic
        in: query
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: featured
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
                  meta:
                    $ref: '#/components/schemas/CursorMeta'
                required:
                - items
                - meta
        '400': *id001
        '401': *id003
        '403': *id004
        '404': *id005
      x-screens:
      - discover
  /events/{id}:
    get:
      tags:
      - Events
      summary: Event details (with my registration if any)
      operationId: getEventsId
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400': *id001
        '401': *id003
        '403': *id004
        '404': *id005
      x-screens:
      - event-details
  /events/{id}/registrations:
    post:
      tags:
      - Events
      summary: Register for an event (earns 0 points)
      operationId: postEventsIdRegistrations
      description: Registering never awards points. Points are awarded only after attendance is verified (see admin attendance
        endpoints). 409 EVENT_FULL / ALREADY_REGISTERED.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registration'
        '401': *id003
        '404': *id005
        '409': *id006
      x-screens:
      - event-details
      - event-registered
  /events/{id}/registrations/me:
    delete:
      tags:
      - Events
      summary: Cancel my registration
      operationId: deleteEventsIdRegistrationsMe
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No content
        '401': *id003
        '404': *id005
  /me/registrations:
    get:
      tags:
      - Events
      summary: My events (upcoming and past)
      operationId: getMeRegistrations
      parameters:
      - *id007
      - *id008
      - name: when
        in: query
        required: false
        schema:
          type: string
          enum:
          - upcoming
          - past
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        event:
                          $ref: '#/components/schemas/Event'
                        registration:
                          $ref: '#/components/schemas/Registration'
                  meta:
                    $ref: '#/components/schemas/CursorMeta'
                required:
                - items
                - meta
        '400': *id001
        '401': *id003
        '403': *id004
        '404': *id005
      x-screens:
      - profile
      - event-registered
  /me/saved/events/{id}:
    put:
      tags:
      - Events
      summary: Save an event
      operationId: putMeSavedEventsId
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No content
        '401': *id003
        '404': *id005
    delete:
      tags:
      - Events
      summary: Unsave an event
      operationId: deleteMeSavedEventsId
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No content
        '401': *id003
        '404': *id005
  /listings:
    get:
      tags:
      - Listings
      summary: Browse live opportunities
      operationId: getListings
      parameters:
      - *id009
      - *id007
      - *id008
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - job
          - coop
          - project
          - volunteer
      - name: city
        in: query
        required: false
        schema:
          type: string
      - name: companyId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: forMe
        in: query
        required: false
        schema:
          type: boolean
          description: Ranked for the signed-in member
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Listing'
                  meta:
                    $ref: '#/components/schemas/CursorMeta'
                required:
                - items
                - meta
        '400': *id001
        '401': *id003
        '403': *id004
        '404': *id005
      x-screens:
      - discover
      - home
      - company-page
  /listings/{id}:
    get:
      tags:
      - Listings
      summary: Opportunity details with my eligibility
      operationId: getListingsId
      description: eligibility.eligible is false e.g. for co-op listings when the member is not a student.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '400': *id001
        '401': *id003
        '403': *id004
        '404': *id005
      x-screens:
      - opportunity-details
  /me/saved/listings/{id}:
    put:
      tags:
      - Listings
      summary: Save an opportunity
      operationId: putMeSavedListingsId
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No content
        '401': *id003
        '404': *id005
      x-screens:
      - home
      - opportunity-details
    delete:
      tags:
      - Listings
      summary: Unsave an opportunity
      operationId: deleteMeSavedListingsId
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No content
        '401': *id003
        '404': *id005
  /listings/{id}/applications:
    post:
      tags:
      - Listings
      summary: Apply to an opportunity
      operationId: postListingsIdApplications
      description: Email and phone are shared only if shareEmail / sharePhone are true. 409 ALREADY_APPLIED, 422 NOT_ELIGIBLE
        or LISTING_CLOSED.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400': *id001
        '401': *id003
        '404': *id005
        '409': *id006
        '422': *id002
      x-screens:
      - apply
  /me/applications:
    get:
      tags:
      - Listings
      summary: My applications
      operationId: getMeApplications
      parameters:
      - *id007
      - *id008
      - name: status
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Application'
                  meta:
                    $ref: '#/components/schemas/CursorMeta'
                required:
                - items
                - meta
        '400': *id001
        '401': *id003
        '403': *id004
        '404': *id005
      x-screens:
      - my-applications
      - profile
  /me/applications/{id}:
    get:
      tags:
      - Listings
      summary: One application with its status tracker
      operationId: getMeApplicationsId
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400': *id001
        '401': *id003
        '403': *id004
        '404': *id005
      x-screens:
      - my-applications
  /me/applications/{id}/withdraw:
    post:
      tags:
      - Listings
      summary: Withdraw an application
      operationId: postMeApplicationsIdWithdraw
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '401': *id003
        '404': *id005
        '409': *id006
  /companies:
    get:
      tags:
      - Companies
      summary: Companies index (A–Z)
      operationId: getCompanies
      description: Sorted by name using the collation of the request language (Arabic names sort by Arabic letters).
      parameters:
      - *id009
      - *id007
      - *id008
      - name: category
        in: query
        required: false
        schema:
          type: string
          enum:
          - organizer
          - venue
          - supplier
          - agency
          - production
      - name: city
        in: query
        required: false
        schema:
          type: string
      - name: verified
        in: query
        required: false
        schema:
          type: boolean
      - name: hiring
        in: query
        required: false
        schema:
          type: boolean
          description: Only companies with open roles
      - name: letter
        in: query
        required: false
        schema:
          type: string
          description: Jump to a letter from the side rail
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyIndexResponse'
        '400': *id001
        '401': *id003
        '403': *id004
        '404': *id005
      x-screens:
      - companies-directory
  /companies/{idOrSlug}:
    get:
      tags:
      - Companies
      summary: Public company page
      operationId: getCompaniesIdorslug
      parameters:
      - name: idOrSlug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyPage'
        '400': *id001
        '401': *id003
        '403': *id004
        '404': *id005
      x-screens:
      - company-page
  /companies/{id}/events:
    get:
      tags:
      - Companies
      summary: Events organised by the company
      operationId: getCompaniesIdEvents
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - *id007
      - *id008
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
                  meta:
                    $ref: '#/components/schemas/CursorMeta'
                required:
                - items
                - meta
        '400': *id001
        '401': *id003
        '403': *id004
        '404': *id005
      x-screens:
      - company-page
  /companies/{id}/follow:
    put:
      tags:
      - Companies
      summary: Follow a company
      operationId: putCompaniesIdFollow
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No content
        '401': *id003
        '404': *id005
      x-screens:
      - companies-directory
      - company-page
    delete:
      tags:
      - Companies
      summary: Unfollow a company
      operationId: deleteCompaniesIdFollow
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No content
        '401': *id003
        '404': *id005
  /companies/{id}/claims:
    post:
      tags:
      - Companies
      summary: Claim a company page that was created from an import
      operationId: postCompaniesIdClaims
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workEmail:
                  type: string
                  format: email
                documentUploadIds:
                  type: array
                  items:
                    type: string
                    format: uuid
              required:
              - workEmail
      responses:
