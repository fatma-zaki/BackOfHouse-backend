<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Dark · English</title>

<style>
html,body{margin:0;padding:0}
body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;background:#000000}

</style>

<body>
<div dir="ltr" lang="en" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #05050d; color: #f4f3ff; font-family: Poppins, &quot;IBM Plex Sans Arabic&quot;, sans-serif; padding-top: 40px">
<header style="display: flex; align-items: center; justify-content: space-between; padding-inline: 16px; height: 56px; box-sizing: border-box; flex-shrink: 0">
<button type="button" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #1d1f3d; background: #0b0c1d; color: #f4f3ff; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="transform: none"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg></button>
<img src="../../assets/aed6800614143886079e141957cfdccd.png" alt="Back of House" style="height: 38px; width: auto; display: block">
<span style="width: 44px"></span>
</header>
<main style="flex-grow: 1; display: flex; flex-direction: column; padding: 32px 24px 0; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: Poppins, sans-serif; font-size: 30px; line-height: 38px; font-weight: 700; letter-spacing: -0.6px">Welcome <span style="color: #a78bfa">back.</span></h1>
<p style="margin: 0; font-size: 14px; line-height: 21px; color: #a9a8c3">Sign in to pick up where you left off.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 14px">
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 700">Email</span>
<span style="height: 52px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 10px; border-radius: 16px; background: #0b0c1d; border: 1.5px solid #6437fa; color: #a9a8c3">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
<input type="email" value="fatma@example.com" dir="ltr" style="flex-grow: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 14px; color: #f4f3ff; text-align: start">
</span>
</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; justify-content: space-between"><span style="font-size: 12px; font-weight: 700">Password</span><a href="#" style="font-size: 12px; font-weight: 700; color: #a78bfa; text-decoration: none">Forgot password?</a></span>
<span style="height: 52px; box-sizing: border-box; padding: 0 6px 0 16px; padding-inline: 16px 6px; display: flex; align-items: center; gap: 10px; border-radius: 16px; background: #0b0c1d; border: 1px solid #1d1f3d; color: #a9a8c3">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
<input type="password" value="password123" style="flex-grow: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 14px; color: #f4f3ff">
<button type="button" aria-label="Show password" style="width: 40px; height: 40px; border: 0; background: transparent; color: #a9a8c3; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
</span>
</label>
</div>
<button type="button" style="height: 54px; border: 0; border-radius: 27px; background: #6437fa; color: #ffffff; font-family: inherit; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 10px 30px rgba(100,55,250,0.4); cursor: pointer">Sign in<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform: none"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
<div style="display: flex; align-items: center; gap: 12px; color: #a9a8c3; font-size: 12px"><span style="flex-grow: 1; height: 1px; background: #1d1f3d"></span>or<span style="flex-grow: 1; height: 1px; background: #1d1f3d"></span></div>
<button type="button" style="height: 54px; border: 1.5px solid #2a2c4d; border-radius: 27px; background: #0b0c1d; color: #f4f3ff; font-family: inherit; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"></rect><path d="M11 18h2"></path></svg>Continue with a phone code</button>
</main>
<p style="margin: 0; padding: 0 24px 40px; text-align: center; font-size: 13px; color: #a9a8c3">New to Back of House? <a href="#" style="color: #a78bfa; font-weight: 700; text-decoration: none">Create account</a></p>
</div>
</body>
</html>
