<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Light · Arabic (RTL)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0;padding:0}
body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;background:#e9e7f0}
*{-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<div dir="rtl" lang="ar" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #f6f4fc; color: #15122e; font-family: &quot;IBM Plex Sans Arabic&quot;, Poppins, sans-serif; padding-top: 40px">
<header style="display: flex; align-items: center; justify-content: space-between; padding-inline: 16px; height: 56px; box-sizing: border-box; flex-shrink: 0">
<button type="button" aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #e4dff3; background: #ffffff; color: #15122e; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="transform: scaleX(-1)"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg></button>
<img src="../../assets/8a2f7555266c2b4d939a8907788882f5.png" alt="Back of House" style="height: 38px; width: auto; display: block">
<span style="width: 44px"></span>
</header>
<main style="flex-grow: 1; display: flex; flex-direction: column; padding: 32px 24px 0; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: &quot;IBM Plex Sans Arabic&quot;, sans-serif; font-size: 30px; line-height: 38px; font-weight: 700; letter-spacing: 0">أهلًا <span style="color: #5424e0">بعودتك.</span></h1>
<p style="margin: 0; font-size: 14px; line-height: 21px; color: #5e5a78">سجّل الدخول لتكمل من حيث توقفت.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 14px">
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 700">البريد الإلكتروني</span>
<span style="height: 52px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 10px; border-radius: 16px; background: #ffffff; border: 1.5px solid #6437fa; color: #5e5a78">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
<input type="email" value="fatma@example.com" dir="ltr" style="flex-grow: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 14px; color: #15122e; text-align: start">
</span>
</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; justify-content: space-between"><span style="font-size: 12px; font-weight: 700">كلمة المرور</span><a href="#" style="font-size: 12px; font-weight: 700; color: #5424e0; text-decoration: none">نسيت كلمة المرور؟</a></span>
<span style="height: 52px; box-sizing: border-box; padding: 0 6px 0 16px; padding-inline: 16px 6px; display: flex; align-items: center; gap: 10px; border-radius: 16px; background: #ffffff; border: 1px solid #e4dff3; color: #5e5a78">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
<input type="password" value="password123" style="flex-grow: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 14px; color: #15122e">
<button type="button" aria-label="إظهار كلمة المرور" style="width: 40px; height: 40px; border: 0; background: transparent; color: #5e5a78; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
</span>
</label>
</div>
<button type="button" style="height: 54px; border: 0; border-radius: 27px; background: #6437fa; color: #ffffff; font-family: inherit; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 10px 30px rgba(100,55,250,0.4); cursor: pointer">تسجيل الدخول<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform: scaleX(-1)"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
<div style="display: flex; align-items: center; gap: 12px; color: #5e5a78; font-size: 12px"><span style="flex-grow: 1; height: 1px; background: #e4dff3"></span>أو<span style="flex-grow: 1; height: 1px; background: #e4dff3"></span></div>
<button type="button" style="height: 54px; border: 1.5px solid #cbbdfb; border-radius: 27px; background: #ffffff; color: #15122e; font-family: inherit; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"></rect><path d="M11 18h2"></path></svg>المتابعة برمز الجوال</button>
</main>
<p style="margin: 0; padding: 0 24px 40px; text-align: center; font-size: 13px; color: #5e5a78">جديد في باك أوف هاوس؟ <a href="#" style="color: #5424e0; font-weight: 700; text-decoration: none">إنشاء حساب</a></p>
</div>
</body>
</html>
