<style>

<body>
<div dir="rtl" lang="ar" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #f6f4fc; color: #15122e; font-family: &quot;IBM Plex Sans Arabic&quot;, Poppins, sans-serif; padding-top: 40px">
<header style="display: flex; align-items: center; gap: 12px; padding-inline: 16px; height: 56px; box-sizing: border-box; flex-shrink: 0">
<button type="button" aria-label="رجوع" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid #e4dff3; background: #ffffff; color: #15122e; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="transform: scaleX(-1)"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg></button>
<h1 style="margin: 0; font-family: &quot;IBM Plex Sans Arabic&quot;, sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 0">ردّك</h1>

<main style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; padding: 8px 20px 0; gap: 14px">
<section style="display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #ffffff; border: 1.5px solid #cbbdfb; border-radius: 20px; box-shadow: 0 8px 30px rgba(40,20,120,0.06)">
<div style="display: flex; align-items: center; gap: 10px">
<img src="../../assets/fe99293a7d78b5eec8cf75c718f91260.jpg" alt="" style="width: 40px; height: 40px; display: block; object-fit: cover; border-radius: 12px">
<div style="display: flex; flex-direction: column"><span style="font-size: 12px; font-weight: 700">فعاليات واجهة الرياض</span><span style="font-size: 11px; color: #5e5a78">الرد قبل 5 أكتوبر</span></div>
</div>
<span style="font-family: &quot;IBM Plex Sans Arabic&quot;, sans-serif; font-size: 15px; font-weight: 700">مسرح وإضاءة لقمة مدتها 3 أيام</span>
<span style="font-size: 12px; color: #5e5a78">الميزانية 60 – 90 ألف ر.س · الرياض · 15 – 17 أكتوبر</span>
</section>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 700">سعرك</span><span style="height: 48px; box-sizing: border-box; padding: 0 14px; display: flex; align-items: center; gap: 8px; border-radius: 14px; background: #ffffff; border: 1.5px solid #6437fa"><span style="font-size: 12px; font-weight: 700; color: #5e5a78">ر.س</span><input type="text" value="78,000" dir="ltr" style="flex-grow: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #15122e; font-family: inherit; font-size: 15px; font-weight: 700; text-align: start"></span></label>
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 700">مدة التجهيز</span><input type="text" value="يومان" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; background: #ffffff; border: 1px solid #e4dff3; color: #15122e; font-family: inherit; font-size: 14px; outline: 0"></label>
</div>
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 700">الرسالة</span><textarea rows="4" style="height: 96px; box-sizing: border-box; resize: none; padding: 10px 14px; border-radius: 14px; background: #ffffff; border: 1px solid #e4dff3; color: #15122e; font-family: inherit; font-size: 13px; line-height: 19px; outline: 0">نفّذنا تجهيز المسارح والإضاءة لقمم مشابهة في واجهة الرياض، ويمكننا حجز هذه التواريخ.</textarea></label>
<section style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between"><span style="font-size: 12px; font-weight: 700">إرفاق مشاريع</span><span style="font-size: 11px; color: #5e5a78">تم اختيار 2</span></div>
<div style="display: flex; gap: 10px">

<button type="button" aria-pressed="true" style="position: relative; flex-grow: 1; flex-basis: 0; padding: 0; border: 2px solid #6437fa; border-radius: 16px; overflow: hidden; background: #ffffff; font-family: inherit; color: #15122e; text-align: start; cursor: pointer">
<img src="../../assets/fe99293a7d78b5eec8cf75c718f91260.jpg" alt="" style="width: 100%; height: 58px; display: block; object-fit: cover">
<span style="display: block; padding: 6px 8px 8px; font-size: 10.5px; line-height: 13px; font-weight: 700">قمة الرياض للتقنية</span>
<span style="position: absolute; top: 6px; inset-inline-end: 6px; width: 20px; height: 20px; border-radius: 10px; background: #6437fa; display: flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
</button>

<button type="button" aria-pressed="true" style="position: relative; flex-grow: 1; flex-basis: 0; padding: 0; border: 2px solid #6437fa; border-radius: 16px; overflow: hidden; background: #ffffff; font-family: inherit; color: #15122e; text-align: start; cursor: pointer">
<img src="../../assets/1f47ac5ede8419f266fd886cee9a6f94.jpg" alt="" style="width: 100%; height: 58px; display: block; object-fit: cover">
<span style="display: block; padding: 6px 8px 8px; font-size: 10.5px; line-height: 13px; font-weight: 700">المعرض الإبداعي</span>
<span style="position: absolute; top: 6px; inset-inline-end: 6px; width: 20px; height: 20px; border-radius: 10px; background: #6437fa; display: flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
</button>

<button type="button" aria-pressed="false" style="position: relative; flex-grow: 1; flex-basis: 0; padding: 0; border: 2px solid #e4dff3; border-radius: 16px; overflow: hidden; background: #ffffff; font-family: inherit; color: #15122e; text-align: start; cursor: pointer">
<img src="../../assets/612f64f6131a4c2dec0861b2ac2b577b.jpg" alt="" style="width: 100%; height: 58px; display: block; object-fit: cover">
<span style="display: block; padding: 6px 8px 8px; font-size: 10.5px; line-height: 13px; font-weight: 700">مستقبل العمل</span>
<span style="position: absolute; top: 6px; inset-inline-end: 6px; width: 20px; height: 20px; border-radius: 10px; background: rgba(5,5,13,0.35); display: flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
</button>

</div>
</section>
<div style="display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 14px; background: #efeafe">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5424e0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
<span style="font-size: 11px; line-height: 16px; color: #5e5a78">لا يرى ردّك وسعرك إلا فعاليات واجهة الرياض.</span>

</main>
<div style="flex-shrink: 0; padding: 14px 20px 30px; background: #ffffff; border-top: 1px solid #e4dff3; border-radius: 24px 24px 0 0; box-shadow: 0 -10px 30px rgba(40,20,120,0.07)">
<button type="button" style="width: 100%; height: 52px; border: 0; border-radius: 26px; background: #6437fa; color: #ffffff; font-family: inherit; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 10px 26px rgba(100,55,250,0.4); cursor: pointer">إرسال الرد<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform: scaleX(-1)"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
