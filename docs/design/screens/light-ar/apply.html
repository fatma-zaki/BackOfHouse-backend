<label style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #ffffff; border: 1.5px solid #e4dff3; border-radius: 16px; cursor: pointer">

<button type="button" aria-pressed="true" style="position: relative; flex-grow: 1; flex-basis: 0; padding: 0; border: 2px solid #6437fa; border-radius: 16px; overflow: hidden; background: #ffffff; font-family: inherit; color: #15122e; text-align: start; cursor: pointer">

<span style="position: absolute; top: 6px; inset-inline-end: 6px; width: 20px; height: 20px; border-radius: 10px; background: rgba(5,5,13,0.35); display: flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>

<span style="position: absolute; bottom: 8px; inset-inline-end: 12px; font-size: 10px; color: #5e5a78">72 / 500</span>

<div style="display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 14px; background: #efeafe">
