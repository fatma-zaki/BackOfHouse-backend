<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New listing — Light · Arabic (RTL)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0;padding:0}
body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;background:#e9e7f0}
*{-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<div dir="rtl" lang="ar" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #f6f4fc; color: #15122e; font-family: &quot;IBM Plex Sans Arabic&quot;, Poppins, sans-serif; padding-top: 40px">
<header style="display: flex; align-items: center; justify-content: space-between; padding-inline: 16px; height: 56px; box-sizing: border-box; flex-shrink: 0">
<div style="display: flex; align-items: center; gap: 12px">
<button type="button" aria-label="إغلاق" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid #e4dff3; background: #ffffff; color: #15122e; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
<h1 style="margin: 0; font-family: &quot;IBM Plex Sans Arabic&quot;, sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 0">فرصة جديدة</h1>
</div>
<div style="display: flex; align-items: center; gap: 4px"><span style="width: 18px; height: 5px; border-radius: 3px; background: #6437fa"></span><span style="width: 18px; height: 5px; border-radius: 3px; background: #6437fa"></span><span style="width: 18px; height: 5px; border-radius: 3px; background: #e4dff3"></span></div>
</header>
<main style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; padding: 8px 20px 0; gap: 14px">
<section style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 700">نوع الفرصة</span>
<div role="radiogroup" aria-label="نوع الفرصة" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">

<button type="button" role="radio" aria-checked="true" style="height: 64px; padding: 0; border-radius: 16px; border: 1.5px solid #6437fa; background: #6437fa; color: #ffffff; font-family: inherit; font-size: 11px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; cursor: pointer; box-shadow: 0 8px 20px rgba(100,55,250,0.35)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>



<span>وظيفة</span>
</button>

<button type="button" role="radio" aria-checked="false" style="height: 64px; padding: 0; border-radius: 16px; border: 1.5px solid #e4dff3; background: #ffffff; color: #15122e; font-family: inherit; font-size: 11px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; cursor: pointer; box-shadow: none">

<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V8l8-5 8 5v12z"></path><path d="M9 20v-6h6v6"></path></svg>


<span>مشروع</span>
</button>

<button type="button" role="radio" aria-checked="false" style="height: 64px; padding: 0; border-radius: 16px; border: 1.5px solid #e4dff3; background: #ffffff; color: #15122e; font-family: inherit; font-size: 11px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; cursor: pointer; box-shadow: none">


<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5z"></path><path d="M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"></path></svg>

<span>تعاوني</span>
</button>

<button type="button" role="radio" aria-checked="false" style="height: 64px; padding: 0; border-radius: 16px; border: 1.5px solid #e4dff3; background: #ffffff; color: #15122e; font-family: inherit; font-size: 11px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; cursor: pointer; box-shadow: none">



<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
<span>تطوع</span>
</button>

</div>
</section>
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 700">المسمى</span><input type="text" value="مدير المسرح" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; background: #ffffff; border: 1.5px solid #6437fa; color: #15122e; font-family: inherit; font-size: 14px; outline: 0"></label>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 700">المدينة</span><span style="height: 48px; box-sizing: border-box; padding: 0 12px 0 14px; padding-inline: 14px 12px; display: flex; align-items: center; justify-content: space-between; border-radius: 14px; background: #ffffff; border: 1px solid #e4dff3; font-size: 14px">الرياض<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5e5a78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></span></label>
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 700">تُغلق في</span><span style="height: 48px; box-sizing: border-box; padding: 0 12px 0 14px; padding-inline: 14px 12px; display: flex; align-items: center; justify-content: space-between; border-radius: 14px; background: #ffffff; border: 1px solid #e4dff3; font-size: 14px">30 أكتوبر<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5e5a78" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span></label>
</div>
<section style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 700">طبيعة العمل</span>
<div role="radiogroup" aria-label="طبيعة العمل" style="display: flex; padding: 4px; border-radius: 22px; background: #efeafe">

<button type="button" role="radio" aria-checked="true" style="flex-grow: 1; flex-basis: 0; height: 34px; border: 0; border-radius: 17px; background: #ffffff; color: #5424e0; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(40,20,120,0.10)">حضوري</button>

<button type="button" role="radio" aria-checked="false" style="flex-grow: 1; flex-basis: 0; height: 34px; border: 0; border-radius: 17px; background: transparent; color: #5e5a78; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; box-shadow: none">مرن</button>

<button type="button" role="radio" aria-checked="false" style="flex-grow: 1; flex-basis: 0; height: 34px; border: 0; border-radius: 17px; background: transparent; color: #5e5a78; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; box-shadow: none">عن بُعد</button>

</div>
</section>
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 700">الوصف</span><textarea rows="4" style="height: 96px; box-sizing: border-box; resize: none; padding: 10px 14px; border-radius: 14px; background: #ffffff; border: 1px solid #e4dff3; color: #15122e; font-family: inherit; font-size: 13px; line-height: 19px; outline: 0">إدارة عمليات المسرح لقمة تقنية مدتها ثلاثة أيام، وتنسيق الطاقم والإشارات والموردين.</textarea></label>
<div style="display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 14px; background: #e0ebff; color: #1c4aab">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>
<span style="font-size: 11px; line-height: 16px; font-weight: 600">يراجع فريق باك أوف هاوس كل فرصة قبل نشرها، وسيصلك إشعار عند الموافقة أو طلب تعديلات.</span>
</div>
</main>
<div style="flex-shrink: 0; display: flex; gap: 10px; padding: 14px 20px 30px; background: #ffffff; border-top: 1px solid #e4dff3; border-radius: 24px 24px 0 0; box-shadow: 0 -10px 30px rgba(40,20,120,0.07)">
<button type="button" style="flex-grow: 1; flex-basis: 0; height: 52px; border: 1.5px solid #6437fa; border-radius: 26px; background: transparent; color: #5424e0; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">حفظ كمسودة</button>
<button type="button" style="flex-grow: 1.4; flex-basis: 0; height: 52px; border: 0; border-radius: 26px; background: #6437fa; color: #ffffff; font-family: inherit; font-size: 14px; font-weight: 700; box-shadow: 0 10px 26px rgba(100,55,250,0.4); cursor: pointer">إرسال للمراجعة</button>
</div>
</div>
</body>
</html>
