<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Welcome</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div dir="{{dir}}" lang="{{lang}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; overflow: hidden; background: {{c.bg}}; color: {{c.ink}}; font-family: {{body}}">
<div style="position: relative; height: 440px; flex-shrink: 0; overflow: hidden">
<img src="/_blob/020f78127b72fb4cbd70e1aa545dcaf8" alt="{{s.heroAlt}}" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: cover">
<div style="position: absolute; left: 0; right: 0; top: 0; height: 140px; background: linear-gradient(to bottom, rgba(5,5,13,0.55) 0%, rgba(5,5,13,0) 100%)"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 200px; background: {{fade}}"></div>
<div style="position: absolute; top: 52px; inset-inline: 20px; display: flex; align-items: center; justify-content: space-between">
<img src="/_blob/aed6800614143886079e141957cfdccd" alt="Back of House" style="height: 44px; width: auto; display: block">
<div role="radiogroup" aria-label="{{s.language}}" style="display: flex; padding: 3px; border-radius: 18px; background: rgba(5,5,13,0.55); border: 1px solid rgba(255,255,255,0.18)">
<sc-for list="{{langs}}" as="l" hint-placeholder-count="2">
<button type="button" role="radio" aria-checked="{{l.sel}}" style="height: 30px; min-width: 40px; padding: 0 10px; border: 0; border-radius: 15px; background: {{l.bg}}; color: #ffffff; font-family: {{l.font}}; font-size: 12px; font-weight: 700; cursor: pointer">{{l.label}}</button>
</sc-for>
</div>
</div>
</div>
<main style="flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 0 24px 36px; margin-top: -40px; position: relative">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 10px; font-size: 11px; letter-spacing: {{wide}}; font-weight: 800; color: {{c.vt}}"><span style="width: 28px; height: 2px; background: #6437fa"></span>{{s.eyebrow}}</div>
<h1 style="margin: 0; font-family: {{disp}}; font-size: 30px; line-height: 38px; font-weight: 700; letter-spacing: {{tt}}">{{s.h1a}} <span style="color: {{c.vt}}">{{s.h1b}}</span></h1>
<p style="margin: 0; font-size: 14px; line-height: 22px; color: {{c.muted}}">{{s.body}}</p>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<a href="#" style="height: 54px; border-radius: 27px; background: #6437fa; color: #ffffff; text-decoration: none; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 10px 30px rgba(100,55,250,0.4)">{{s.create}}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform: {{flip}}"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
<a href="#" style="height: 54px; box-sizing: border-box; border-radius: 27px; border: 1.5px solid {{c.line2}}; background: {{c.card}}; color: {{c.ink}}; text-decoration: none; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{s.signin}}</a>
<p style="margin: 4px 0 0; text-align: center; font-size: 11px; line-height: 16px; color: {{c.muted}}">{{s.terms1}} <a href="#" style="color: {{c.vt}}; font-weight: 700">{{s.terms2}}</a></p>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light"},"locale":{"editor":"enum","options":["en","ar"],"default":"en"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.mode === 'dark';
    const ar = this.props.locale === 'ar';
    const P = {
      light: { bg: '#f6f4fc', bgClear: 'rgba(246,244,252,0)', card: '#ffffff', line: '#e4dff3', line2: '#cbbdfb', ink: '#15122e', muted: '#5e5a78', vt: '#5424e0' },
      dark: { bg: '#05050d', bgClear: 'rgba(5,5,13,0)', card: '#0b0c1d', line: '#1d1f3d', line2: '#2a2c4d', ink: '#f4f3ff', muted: '#a9a8c3', vt: '#a78bfa' }
    };
    const c = dark ? P.dark : P.light;
    const S = {
      en: {
        heroAlt: 'Concert stage lit in violet', language: 'Language',
        eyebrow: 'SAUDI ARABIA’S EVENTS COMMUNITY', h1a: 'We build the community behind', h1b: 'every experience.',
        body: 'Connect with the professionals, companies and emerging talent shaping the events industry.',
        create: 'Create account', signin: 'Sign in', terms1: 'By continuing you agree to our', terms2: 'Terms & Privacy'
      },
      ar: {
        heroAlt: 'مسرح حفل مضاء باللون البنفسجي', language: 'اللغة',
        eyebrow: 'مجتمع الفعاليات في السعودية', h1a: 'نبني المجتمع خلف', h1b: 'كل تجربة.',
        body: 'تواصل مع المحترفين والشركات والمواهب الصاعدة التي تصنع قطاع الفعاليات.',
        create: 'إنشاء حساب', signin: 'تسجيل الدخول', terms1: 'بالمتابعة فإنك توافق على', terms2: 'الشروط والخصوصية'
      }
    };
    const s = ar ? S.ar : S.en;
    const langs = [
      { label: 'EN', font: 'Poppins, sans-serif', sel: ar ? 'false' : 'true', bg: ar ? 'transparent' : '#6437fa' },
      { label: 'ع', font: '"IBM Plex Sans Arabic", sans-serif', sel: ar ? 'true' : 'false', bg: ar ? '#6437fa' : 'transparent' }
    ];
    return {
      c, s, langs,
      fade: 'linear-gradient(to bottom, ' + c.bgClear + ' 0%, ' + c.bg + ' 100%)',
      dir: ar ? 'rtl' : 'ltr', lang: ar ? 'ar' : 'en',
      disp: ar ? '"IBM Plex Sans Arabic", sans-serif' : 'Poppins, sans-serif',
      body: ar ? '"IBM Plex Sans Arabic", Poppins, sans-serif' : 'Poppins, "IBM Plex Sans Arabic", sans-serif',
      tt: ar ? '0' : '-0.6px', wide: ar ? '0' : '2px', flip: ar ? 'scaleX(-1)' : 'none'
    };
  }
}
</script>
</body>
</html>
