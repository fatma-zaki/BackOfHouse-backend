<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Company profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div dir="{{dir}}" lang="{{lang}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: {{c.bg}}; color: {{c.ink}}; font-family: {{body}}">
<div style="position: relative; height: 170px; flex-shrink: 0">
<img src="/_blob/020f78127b72fb4cbd70e1aa545dcaf8" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: cover">
<div style="position: absolute; left: 0; right: 0; top: 0; height: 110px; background: linear-gradient(to bottom, rgba(5,5,13,0.55) 0%, rgba(5,5,13,0) 100%)"></div>
<div style="position: absolute; top: 48px; inset-inline-end: 16px; display: flex; gap: 8px">
<button type="button" aria-label="{{s.share}}" style="width: 40px; height: 40px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.25); background: rgba(5,5,13,0.45); color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5M4 14v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"></path></svg></button>
</div>
</div>
<main style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; padding: 0 16px 24px; gap: 12px; margin-top: -36px; position: relative">
<div style="display: flex; align-items: flex-end; justify-content: space-between; padding-inline: 4px">
<img src="/_blob/959bcd8bd2cfb6539f98a4500b4be775" alt="" style="width: 76px; height: 76px; display: block; object-fit: cover; border-radius: 20px; border: 4px solid {{c.bg}}">
<button type="button" style="height: 38px; padding: 0 16px; border: 1.5px solid #6437fa; border-radius: 19px; background: {{c.card}}; color: {{c.vt}}; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer">{{s.edit}}</button>
</div>
<div style="display: flex; flex-direction: column; gap: 3px; padding-inline: 4px">
<h1 style="margin: 0; display: flex; align-items: center; gap: 6px; font-family: {{disp}}; font-size: 20px; line-height: 26px; font-weight: 700; letter-spacing: {{tt}}">{{s.name}}<svg width="18" height="18" viewBox="0 0 24 24" fill="#6437fa" aria-label="{{s.verified}}"><path d="M12 2l2.4 2.2 3.2-.4.9 3.1 2.9 1.5-1 3.1 1 3.1-2.9 1.5-.9 3.1-3.2-.4L12 22l-2.4-2.2-3.2.4-.9-3.1-2.9-1.5 1-3.1-1-3.1 2.9-1.5.9-3.1 3.2.4z"></path><path d="M8.5 12l2.5 2.5 4.5-5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></h1>
<span style="font-size: 12px; font-weight: 700; color: {{c.vt}}">{{s.type}}</span>
<span style="font-size: 12px; color: {{c.muted}}">{{s.meta}}</span>
</div>
<section style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 12px 4px; background: {{c.card}}; border: 1px solid {{c.line}}; border-radius: 18px; box-shadow: {{c.shadow}}">
<sc-for list="{{stats}}" as="st" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; align-items: center; gap: 1px; border-inline-start: 1px solid {{st.rule}}"><span style="font-family: Poppins, sans-serif; font-size: 18px; font-weight: 700; color: {{c.vt}}">{{st.n}}</span><span style="font-size: 10.5px; color: {{c.muted}}">{{st.l}}</span></div>
</sc-for>
</section>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{services}}" as="sv" hint-placeholder-count="4"><span style="padding: 5px 10px; border-radius: 14px; background: {{c.soft}}; color: {{c.vt}}; font-size: 11px; font-weight: 700">{{sv}}</span></sc-for>
</div>
<section style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center; padding-inline: 4px">
<div style="display: flex; align-items: center; gap: 10px"><div style="width: 4px; height: 20px; background: #6437fa; transform: skewX(-18deg)"></div><h2 style="margin: 0; font-family: {{disp}}; font-size: 17px; font-weight: 700">{{s.portfolio}}</h2></div>
<a href="#" style="display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: {{c.vt}}; text-decoration: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>{{s.addProject}}</a>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{projects}}" as="p" hint-placeholder-count="4">
<article style="background: {{c.card}}; border: 1px solid {{c.line}}; border-radius: 16px; overflow: hidden; box-shadow: {{c.shadow}}">
<img src="{{p.img}}" alt="" style="width: 100%; height: 70px; display: block; object-fit: cover">
<div style="padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 12px; line-height: 16px; font-weight: 700">{{p.t}}</span><span style="font-size: 10.5px; color: {{c.muted}}">{{p.m}}</span></div>
</article>
</sc-for>
</div>
</section>
</main>
<nav aria-label="{{s.nav}}" style="flex-shrink: 0; height: 84px; box-sizing: border-box; padding: 8px 6px 22px; background: {{c.card}}; border-top: 1px solid {{c.line}}; border-radius: 24px 24px 0 0; box-shadow: {{c.navShadow}}; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0">
<sc-for list="{{nav}}" as="t" hint-placeholder-count="5">
<button type="button" aria-current="{{t.current}}" style="border: 0; background: transparent; padding: 0; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 3px; color: {{t.color}}; font-size: 10.5px; line-height: 14px; font-weight: {{t.weight}}; cursor: pointer">
<span style="width: 52px; height: 30px; border-radius: 15px; background: {{t.pill}}; color: {{t.icon}}; display: flex; align-items: center; justify-content: center">
<sc-if value="{{t.k0}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg></sc-if>
<sc-if value="{{t.k1}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"></path></svg></sc-if>
<sc-if value="{{t.k2}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l4-4 4 2 3-2 4 1 3 3M3 11l5 5c1 1 2 1 3 0l1-1M21 11l-5 5M12 15l2 2M14 13l2 2"></path></svg></sc-if>
<sc-if value="{{t.k3}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg></sc-if>
<sc-if value="{{t.k4}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="11" height="18" rx="1"></rect><path d="M15 9h5v12h-5M8 7h3M8 11h3M8 15h3"></path></svg></sc-if>
</span>
<span>{{t.label}}</span>
</button>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light"},"locale":{"editor":"enum","options":["en","ar"],"default":"en"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.mode === 'dark';
    const ar = this.props.locale === 'ar';
    const P = {
      light: { bg: '#f6f4fc', card: '#ffffff', line: '#e4dff3', ink: '#15122e', muted: '#5e5a78', vt: '#5424e0', soft: '#efeafe', shadow: '0 8px 30px rgba(40,20,120,0.06)', navShadow: '0 -10px 30px rgba(40,20,120,0.07)' },
      dark: { bg: '#05050d', card: '#0b0c1d', line: '#1d1f3d', ink: '#f4f3ff', muted: '#a9a8c3', vt: '#a78bfa', soft: '#141233', shadow: '0 8px 30px rgba(0,0,0,0.35)', navShadow: '0 -10px 30px rgba(0,0,0,0.5)' }
    };
    const c = dark ? P.dark : P.light;
    const S = {
      en: {
        share: 'Share profile', edit: 'Edit profile', nav: 'Company', verified: 'Verified company',
        name: 'Saudi Events Group', type: 'Event Management & Production', meta: 'Riyadh · Verified by Back of House',
        stats: [['12', 'Projects'], ['3', 'Live listings'], ['1.2K', 'Followers']],
        services: ['Conferences', 'Brand launches', 'Staging', 'Festivals'],
        portfolio: 'Portfolio', addProject: 'Add project',
        projects: [['Riyadh Tech Summit', '2025 · Riyadh', '/_blob/fe99293a7d78b5eec8cf75c718f91260'], ['Saudi Creative Expo', '2025 · Jeddah', '/_blob/1f47ac5ede8419f266fd886cee9a6f94'], ['Future of Work Summit', '2025 · Riyadh', '/_blob/612f64f6131a4c2dec0861b2ac2b577b'], ['Women in Tech Night', '2024 · Riyadh', '/_blob/f24ebc38adb28cb2e96a8856980b10e6']],
        navL: ['Dashboard', 'Listings', 'Suppliers', 'News', 'Profile']
      },
      ar: {
        share: 'مشاركة الملف', edit: 'تعديل الملف', nav: 'الشركة', verified: 'شركة موثّقة',
        name: 'مجموعة الفعاليات السعودية', type: 'إدارة وإنتاج الفعاليات', meta: 'الرياض · موثّقة من باك أوف هاوس',
        stats: [['12', 'مشروعًا'], ['3', 'فرص منشورة'], ['1.2 ألف', 'متابع']],
        services: ['مؤتمرات', 'إطلاق العلامات', 'تجهيز المسارح', 'مهرجانات'],
        portfolio: 'الأعمال', addProject: 'إضافة مشروع',
        projects: [['قمة الرياض للتقنية', '2025 · الرياض', '/_blob/fe99293a7d78b5eec8cf75c718f91260'], ['معرض الإبداع السعودي', '2025 · جدة', '/_blob/1f47ac5ede8419f266fd886cee9a6f94'], ['قمة مستقبل العمل', '2025 · الرياض', '/_blob/612f64f6131a4c2dec0861b2ac2b577b'], ['أمسية النساء في التقنية', '2024 · الرياض', '/_blob/f24ebc38adb28cb2e96a8856980b10e6']],
        navL: ['اللوحة', 'الفرص', 'التوريد', 'الأخبار', 'الملف']
      }
    };
    const s = ar ? S.ar : S.en;
    const active = 4;
    const nav = s.navL.map((label, i) => {
      const on = i === active;
      const t = { label, color: on ? c.vt : c.muted, icon: on ? (dark ? '#a78bfa' : '#6437fa') : c.muted, pill: on ? c.soft : 'transparent', weight: on ? 800 : 600, current: on ? 'page' : 'false' };
      for (let j = 0; j < 5; j++) t['k' + j] = i === j;
      return t;
    });
    const stats = s.stats.map((x, i) => ({ n: x[0], l: x[1], rule: i === 0 ? 'transparent' : c.line }));
    const projects = s.projects.map((p) => ({ t: p[0], m: p[1], img: p[2] }));
    return {
      c, s, nav, stats, projects, services: s.services,
      dir: ar ? 'rtl' : 'ltr', lang: ar ? 'ar' : 'en',
      disp: ar ? '"IBM Plex Sans Arabic", sans-serif' : 'Poppins, sans-serif',
      body: ar ? '"IBM Plex Sans Arabic", Poppins, sans-serif' : 'Poppins, "IBM Plex Sans Arabic", sans-serif',
      tt: ar ? '0' : '-0.5px', flip: ar ? 'scaleX(-1)' : 'none'
    };
  }
}
</script>
</body>
</html>
