<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Applicant details</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div dir="{{dir}}" lang="{{lang}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: {{c.bg}}; color: {{c.ink}}; font-family: {{body}}; padding-top: 40px">
<header style="display: flex; align-items: center; gap: 12px; padding-inline: 16px; height: 56px; box-sizing: border-box; flex-shrink: 0">
<button type="button" aria-label="{{s.back}}" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid {{c.line}}; background: {{c.card}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="transform: {{flip}}"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg></button>
<div style="display: flex; flex-direction: column"><span style="font-size: 11px; color: {{c.muted}}; font-weight: 600">{{s.for}}</span><span style="font-family: {{disp}}; font-size: 16px; font-weight: 700">{{s.role}}</span></div>
</header>
<main style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; padding: 8px 20px 0; gap: 14px">
<section style="display: flex; align-items: center; gap: 14px; padding: 14px; background: {{c.card}}; border: 1px solid {{c.line}}; border-radius: 20px; box-shadow: {{c.shadow}}">
<img src="/_blob/17c4ffa8b33f8d93c5fc6d4d6e5955ea" alt="" style="width: 60px; height: 60px; display: block; object-fit: cover; border-radius: 30px; border: 2px solid {{c.card}}; box-shadow: 0 0 0 2px #6437fa; flex-shrink: 0">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-family: {{disp}}; font-size: 17px; font-weight: 700">{{s.name}}</span><span style="font-size: 12px; color: {{c.muted}}">{{s.head}}</span><span style="align-self: flex-start; margin-top: 4px; padding: 2px 8px; border-radius: 10px; background: {{c.infoBg}}; color: {{c.infoFg}}; font-size: 10.5px; font-weight: 800">{{s.status}}</span></div>
</section>
<section style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-family: {{disp}}; font-size: 14px; font-weight: 700">{{s.msgH}}</h2>
<p style="margin: 0; padding: 12px 14px; border-radius: 16px; background: {{c.soft}}; font-size: 13px; line-height: 20px">{{s.msg}}</p>
</section>
<section style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-family: {{disp}}; font-size: 14px; font-weight: 700">{{s.expH}}</h2>
<div style="display: flex; gap: 12px; align-items: center; padding: 12px 14px; background: {{c.card}}; border: 1px solid {{c.line}}; border-radius: 16px">
<span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 12px; background: {{c.soft}}; color: {{c.vt}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></span>
<div style="display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 700">{{s.exp}}</span><span style="font-size: 11px; color: {{c.muted}}">{{s.expSub}}</span></div>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-family: {{disp}}; font-size: 14px; font-weight: 700">{{s.projH}}</h2>
<div style="display: flex; gap: 10px">
<sc-for list="{{projects}}" as="p" hint-placeholder-count="2">
<div style="flex-grow: 1; flex-basis: 0; border-radius: 14px; overflow: hidden; background: {{c.card}}; border: 1px solid {{c.line}}"><img src="{{p.img}}" alt="" style="width: 100%; height: 64px; display: block; object-fit: cover"><span style="display: block; padding: 6px 10px 8px; font-size: 11px; font-weight: 700">{{p.t}}</span></div>
</sc-for>
</div>
</section>
<div style="display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 14px; border: 1px dashed {{c.line2}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.muted}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
<span style="font-size: 11px; line-height: 16px; color: {{c.muted}}">{{s.contact}}</span>
</div>
</main>
<div style="flex-shrink: 0; display: flex; gap: 10px; padding: 14px 20px 30px; background: {{c.card}}; border-top: 1px solid {{c.line}}; border-radius: 24px 24px 0 0; box-shadow: {{c.navShadow}}">
<button type="button" style="flex-grow: 1; flex-basis: 0; height: 52px; border: 1.5px solid {{c.danger}}; border-radius: 26px; background: transparent; color: {{c.danger}}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">{{s.reject}}</button>
<button type="button" style="flex-grow: 1.4; flex-basis: 0; height: 52px; border: 0; border-radius: 26px; background: #6437fa; color: #ffffff; font-family: inherit; font-size: 14px; font-weight: 700; box-shadow: 0 10px 26px rgba(100,55,250,0.4); cursor: pointer">{{s.shortlist}}</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light"},"locale":{"editor":"enum","options":["en","ar"],"default":"en"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.mode === 'dark';
    const ar = this.props.locale === 'ar';
    const P = {
      light: { bg: '#f6f4fc', card: '#ffffff', line: '#e4dff3', line2: '#cbbdfb', ink: '#15122e', muted: '#5e5a78', vt: '#5424e0', soft: '#efeafe', danger: '#b42318', infoBg: '#e0ebff', infoFg: '#1c4aab', shadow: '0 8px 30px rgba(40,20,120,0.06)', navShadow: '0 -10px 30px rgba(40,20,120,0.07)' },
      dark: { bg: '#05050d', card: '#0b0c1d', line: '#1d1f3d', line2: '#2a2c4d', ink: '#f4f3ff', muted: '#a9a8c3', vt: '#a78bfa', soft: '#141233', danger: '#f87171', infoBg: '#0f2350', infoFg: '#7fb0ff', shadow: '0 8px 30px rgba(0,0,0,0.35)', navShadow: '0 -10px 30px rgba(0,0,0,0.5)' }
    };
    const c = dark ? P.dark : P.light;
    const S = {
      en: {
        back: 'Back', for: 'Application for', role: 'Event Producer',
        name: 'Fatma Zaki', head: 'Event Attendee · Cairo, Egypt', status: 'New · Applied 2h ago',
        msgH: 'Message', msg: 'I’ve coordinated conferences of 2,000+ guests and would love to bring that experience to your team.',
        expH: 'Experience shared', exp: 'Freelance Event Coordinator', expSub: '2023 – 2025 · Riyadh',
        projH: 'Projects shared', projects: [['Tech summit stage', '/_blob/fe99293a7d78b5eec8cf75c718f91260'], ['Creative expo', '/_blob/1f47ac5ede8419f266fd886cee9a6f94']],
        contact: 'Fatma hasn’t shared contact details. You’ll see only the details she chooses to share.',
        reject: 'Not selected', shortlist: 'Shortlist'
      },
      ar: {
        back: 'رجوع', for: 'طلب لوظيفة', role: 'منتج فعاليات',
        name: 'فاطمة زكي', head: 'مهتمة بالفعاليات · القاهرة، مصر', status: 'جديد · قُدّم قبل ساعتين',
        msgH: 'الرسالة', msg: 'نسّقت مؤتمرات تجاوز حضورها 2,000 ضيف، ويسعدني نقل هذه الخبرة إلى فريقكم.',
        expH: 'الخبرة المُشاركة', exp: 'منسقة فعاليات مستقلة', expSub: '2023 – 2025 · الرياض',
        projH: 'المشاريع المُشاركة', projects: [['مسرح قمة التقنية', '/_blob/fe99293a7d78b5eec8cf75c718f91260'], ['معرض إبداعي', '/_blob/1f47ac5ede8419f266fd886cee9a6f94']],
        contact: 'لم تشارك فاطمة بيانات التواصل. سترى فقط البيانات التي تختار مشاركتها.',
        reject: 'لم يُختر', shortlist: 'إضافة للمختصرة'
      }
    };
    const s = ar ? S.ar : S.en;
    const projects = s.projects.map((p) => ({ t: p[0], img: p[1] }));
    return {
      c, s, projects,
      dir: ar ? 'rtl' : 'ltr', lang: ar ? 'ar' : 'en',
      disp: ar ? '"IBM Plex Sans Arabic", sans-serif' : 'Poppins, sans-serif',
      body: ar ? '"IBM Plex Sans Arabic", Poppins, sans-serif' : 'Poppins, "IBM Plex Sans Arabic", sans-serif',
      tt: ar ? '0' : '-0.5px', flip: ar ? 'scaleX(-1)' : 'none'
    };
  }
}
</script>
</body>
</html>
