<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Points history</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div dir="{{dir}}" lang="{{lang}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: {{c.bg}}; color: {{c.ink}}; font-family: {{body}}; padding-top: 40px">
<header style="display: flex; align-items: center; gap: 12px; padding-inline: 16px; height: 56px; box-sizing: border-box; flex-shrink: 0">
<button type="button" aria-label="{{s.back}}" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid {{c.line}}; background: {{c.card}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="transform: {{flip}}"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg></button>
<h1 style="margin: 0; font-family: {{disp}}; font-size: 20px; font-weight: 700; letter-spacing: {{tt}}">{{s.title}}</h1>
</header>
<main style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; padding: 8px 16px 24px; gap: 14px">
<section style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 14px 4px; border-radius: 20px; background: #6437fa; color: #ffffff; box-shadow: 0 12px 30px rgba(100,55,250,0.35)">
<sc-for list="{{sum}}" as="x" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px; border-inline-start: {{x.rule}}"><span style="font-family: Poppins, sans-serif; font-size: 20px; font-weight: 700">{{x.n}}</span><span style="font-size: 10.5px; opacity: 0.85">{{x.l}}</span></div>
</sc-for>
</section>
<div role="tablist" aria-label="{{s.title}}" style="display: flex; padding: 4px; border-radius: 22px; background: {{c.soft}}; flex-shrink: 0">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" role="tab" aria-selected="{{t.sel}}" style="flex-grow: 1; flex-basis: 0; height: 34px; border: 0; border-radius: 17px; background: {{t.bg}}; color: {{t.color}}; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; box-shadow: {{t.shadow}}">{{t.label}}</button>
</sc-for>
</div>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<span style="font-size: 11px; font-weight: 800; letter-spacing: {{tag}}; color: {{c.muted}}; padding-inline: 4px">{{g.label}}</span>
<div style="background: {{c.card}}; border: 1px solid {{c.line}}; border-radius: 20px; box-shadow: {{c.shadow}}">
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid {{r.rule}}">
<span style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 12px; background: {{r.iBg}}; color: {{r.iFg}}; display: flex; align-items: center; justify-content: center">
<sc-if value="{{r.earn}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></sc-if>
<sc-if value="{{r.spend}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"></rect><path d="M5 12v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8M12 8v13"></path></svg></sc-if>
</span>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 700">{{r.t}}</span><span style="font-size: 11px; color: {{c.muted}}">{{r.d}}</span></div>
<span dir="ltr" style="font-family: Poppins, sans-serif; font-size: 14px; font-weight: 700; color: {{r.amtColor}}">{{r.amt}}</span>
</div>
</sc-for>
</div>
</sc-for>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light"},"locale":{"editor":"enum","options":["en","ar"],"default":"en"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.mode === 'dark';
    const ar = this.props.locale === 'ar';
    const P = {
      light: { bg: '#f6f4fc', card: '#ffffff', line: '#e4dff3', ink: '#15122e', muted: '#5e5a78', vt: '#5424e0', soft: '#efeafe', okBg: '#dcf4ea', okFg: '#0d6446', shadow: '0 8px 30px rgba(40,20,120,0.06)' },
      dark: { bg: '#05050d', card: '#0b0c1d', line: '#1d1f3d', ink: '#f4f3ff', muted: '#a9a8c3', vt: '#a78bfa', soft: '#141233', okBg: '#0c2e24', okFg: '#4ade80', shadow: '0 8px 30px rgba(0,0,0,0.35)' }
    };
    const c = dark ? P.dark : P.light;
    const S = {
      en: {
        back: 'Back', title: 'Points history',
        sum: [['1,250', 'Balance'], ['1,550', 'Earned'], ['300', 'Spent']],
        tabs: ['All', 'Earned', 'Spent'],
        groups: [
          ['SEPTEMBER 2026', [['+', 'Profile completed', 'Sep 26', '+50'], ['+', 'Attendance verified', 'Saudi Creative Expo · Sep 18', '+150'], ['+', 'Workshop attended', 'Event Tech 101 · Sep 9', '+100']]],
          ['AUGUST 2026', [['-', 'Reward redeemed', 'Members’ meetup pass · Aug 28', '−300'], ['+', 'Volunteer shift completed', 'Riyadh Season · Aug 14', '+200']]]
        ]
      },
      ar: {
        back: 'رجوع', title: 'سجل النقاط',
        sum: [['1,250', 'الرصيد'], ['1,550', 'المكتسبة'], ['300', 'المستخدمة']],
        tabs: ['الكل', 'المكتسبة', 'المستخدمة'],
        groups: [
          ['سبتمبر 2026', [['+', 'اكتمال الملف الشخصي', '26 سبتمبر', '+50'], ['+', 'تم التحقق من الحضور', 'معرض الإبداع السعودي · 18 سبتمبر', '+150'], ['+', 'حضور ورشة عمل', 'أساسيات تقنية الفعاليات · 9 سبتمبر', '+100']]],
          ['أغسطس 2026', [['-', 'استبدال مكافأة', 'دخول لقاء الأعضاء · 28 أغسطس', '−300'], ['+', 'إتمام نوبة تطوع', 'موسم الرياض · 14 أغسطس', '+200']]]
        ]
      }
    };
    const s = ar ? S.ar : S.en;
    const sum = s.sum.map((x, i) => ({ n: x[0], l: x[1], rule: i === 0 ? '0' : '1px solid rgba(255,255,255,0.25)' }));
    const tabs = s.tabs.map((label, i) => ({ label, sel: i === 0 ? 'true' : 'false', bg: i === 0 ? c.card : 'transparent', color: i === 0 ? c.vt : c.muted, shadow: i === 0 ? '0 4px 12px rgba(40,20,120,0.10)' : 'none' }));
    const groups = s.groups.map((g) => ({
      label: g[0],
      rows: g[1].map((r, i) => ({ earn: r[0] === '+', spend: r[0] === '-', t: r[1], d: r[2], amt: r[3], amtColor: r[0] === '+' ? c.okFg : c.vt, iBg: r[0] === '+' ? c.okBg : c.soft, iFg: r[0] === '+' ? c.okFg : c.vt, rule: i === g[1].length - 1 ? 'transparent' : c.line }))
    }));
    return {
      c, s, sum, tabs, groups,
      dir: ar ? 'rtl' : 'ltr', lang: ar ? 'ar' : 'en',
      disp: ar ? '"IBM Plex Sans Arabic", sans-serif' : 'Poppins, sans-serif',
      body: ar ? '"IBM Plex Sans Arabic", Poppins, sans-serif' : 'Poppins, "IBM Plex Sans Arabic", sans-serif',
      tt: ar ? '0' : '-0.5px', tag: ar ? '0' : '1px', flip: ar ? 'scaleX(-1)' : 'none'
    };
  }
}
</script>
</body>
</html>
