<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Verification request</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div dir="{{dir}}" lang="{{lang}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: {{c.bg}}; color: {{c.ink}}; font-family: {{body}}; padding-top: 40px">
<header style="display: flex; align-items: center; gap: 12px; padding-inline: 16px; height: 56px; box-sizing: border-box; flex-shrink: 0">
<button type="button" aria-label="{{s.back}}" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid {{c.line}}; background: {{c.card}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="transform: {{flip}}"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg></button>
<h1 style="margin: 0; font-family: {{disp}}; font-size: 20px; font-weight: 700; letter-spacing: {{tt}}">{{s.title}}</h1>
</header>
<main style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; padding: 8px 20px 0; gap: 16px">
<section style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 20px 16px; border-radius: 22px; background: {{c.soft}}; text-align: center">
<span style="width: 60px; height: 60px; border-radius: 30px; background: #6437fa; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(100,55,250,0.35)"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg></span>
<span style="font-family: {{disp}}; font-size: 18px; font-weight: 700">{{s.h}}</span>
<span style="font-size: 12px; line-height: 18px; color: {{c.muted}}">{{s.p}}</span>
</section>
<section style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{steps}}" as="st" hint-placeholder-count="3">
<div style="display: flex; gap: 12px; align-items: center; padding: 14px; background: {{c.card}}; border: {{st.border}}; border-radius: 18px">
<span style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 16px; background: {{st.dotBg}}; color: {{st.dotFg}}; font-family: Poppins, sans-serif; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center"><sc-if value="{{st.done}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></sc-if><sc-if value="{{st.notDone}}" hint-placeholder-val="{{ true }}">{{st.n}}</sc-if></span>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 13px; font-weight: 700">{{st.t}}</span><span style="font-size: 11px; line-height: 15px; color: {{c.muted}}">{{st.d}}</span></div>
<sc-if value="{{st.upload}}" hint-placeholder-val="{{ false }}"><button type="button" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1.5px solid #6437fa; background: transparent; color: {{c.vt}}; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; flex-shrink: 0">{{s.upload}}</button></sc-if>
</div>
</sc-for>
</section>
<div style="display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 14px; border: 1px dashed {{c.line2}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.muted}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7v1"></path></svg>
<span style="font-size: 11px; line-height: 16px; color: {{c.muted}}">{{s.note}}</span>
</div>
</main>
<div style="flex-shrink: 0; padding: 14px 20px 30px; background: {{c.card}}; border-top: 1px solid {{c.line}}; border-radius: 24px 24px 0 0; box-shadow: {{c.navShadow}}">
<button type="button" disabled="{{true}}" style="width: 100%; height: 52px; border: 0; border-radius: 26px; background: {{c.disabledBg}}; color: {{c.disabledFg}}; font-family: inherit; font-size: 15px; font-weight: 700; cursor: not-allowed">{{s.submit}}</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light"},"locale":{"editor":"enum","options":["en","ar"],"default":"en"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.mode === 'dark';
    const ar = this.props.locale === 'ar';
    const P = {
      light: { bg: '#f6f4fc', card: '#ffffff', line: '#e4dff3', line2: '#cbbdfb', ink: '#15122e', muted: '#5e5a78', vt: '#5424e0', soft: '#efeafe', okBg: '#dcf4ea', okFg: '#0d6446', disabledBg: '#e4dff3', disabledFg: '#5e5a78', navShadow: '0 -10px 30px rgba(40,20,120,0.07)' },
      dark: { bg: '#05050d', card: '#0b0c1d', line: '#1d1f3d', line2: '#2a2c4d', ink: '#f4f3ff', muted: '#a9a8c3', vt: '#a78bfa', soft: '#141233', okBg: '#0c2e24', okFg: '#4ade80', disabledBg: '#1d1f3d', disabledFg: '#a9a8c3', navShadow: '0 -10px 30px rgba(0,0,0,0.5)' }
    };
    const c = dark ? P.dark : P.light;
    const S = {
      en: {
        back: 'Back', title: 'Get verified', h: 'Show companies it’s really you',
        p: 'A verified badge tells companies your identity and experience were checked by Back of House.',
        upload: 'Upload', submit: 'Submit for review',
        steps: [['Identity document', 'National ID or Iqama · uploaded', 'done'], ['Proof of experience', 'A certificate, contract or reference letter', 'upload'], ['Review by Back of House', 'We’ll notify you when it’s done', 'todo']],
        note: 'Verification is never granted by points, payments or activity. Your documents are only used for this review.'
      },
      ar: {
        back: 'رجوع', title: 'طلب التوثيق', h: 'أثبت للشركات أنك أنت',
        p: 'تخبر شارة التوثيق الشركات بأن فريق باك أوف هاوس تحقق من هويتك وخبرتك.',
        upload: 'رفع', submit: 'إرسال للمراجعة',
        steps: [['وثيقة الهوية', 'الهوية الوطنية أو الإقامة · تم الرفع', 'done'], ['إثبات الخبرة', 'شهادة أو عقد أو خطاب توصية', 'upload'], ['مراجعة باك أوف هاوس', 'سنبلغك عند اكتمالها', 'todo']],
        note: 'لا يُمنح التوثيق أبدًا مقابل النقاط أو الدفع أو النشاط. تُستخدم مستنداتك لهذه المراجعة فقط.'
      }
    };
    const s = ar ? S.ar : S.en;
    const steps = s.steps.map((x, i) => ({
      n: String(i + 1), t: x[0], d: x[1], done: x[2] === 'done', notDone: x[2] !== 'done', upload: x[2] === 'upload',
      dotBg: x[2] === 'done' ? c.okBg : (x[2] === 'upload' ? '#6437fa' : c.soft), dotFg: x[2] === 'done' ? c.okFg : (x[2] === 'upload' ? '#ffffff' : c.muted),
      border: x[2] === 'upload' ? '1.5px solid #6437fa' : '1px solid ' + c.line
    }));
    return {
      c, s, steps,
      dir: ar ? 'rtl' : 'ltr', lang: ar ? 'ar' : 'en',
      disp: ar ? '"IBM Plex Sans Arabic", sans-serif' : 'Poppins, sans-serif',
      body: ar ? '"IBM Plex Sans Arabic", Poppins, sans-serif' : 'Poppins, "IBM Plex Sans Arabic", sans-serif',
      tt: ar ? '0' : '-0.5px', flip: ar ? 'scaleX(-1)' : 'none'
    };
  }
}
</script>
</body>
</html>
