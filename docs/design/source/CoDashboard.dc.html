<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Company dashboard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div dir="{{dir}}" lang="{{lang}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: {{c.bg}}; color: {{c.ink}}; font-family: {{body}}; padding-top: 40px">
<header style="display: flex; align-items: center; justify-content: space-between; padding-inline: 16px 8px; height: 56px; box-sizing: border-box; flex-shrink: 0">
<div style="display: flex; align-items: center; gap: 10px">
<img src="/_blob/959bcd8bd2cfb6539f98a4500b4be775" alt="" style="width: 40px; height: 40px; display: block; object-fit: cover; border-radius: 12px">
<div style="display: flex; flex-direction: column"><span style="display: flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 700">{{s.co}}<svg width="14" height="14" viewBox="0 0 24 24" fill="#6437fa" aria-label="{{s.verified}}"><path d="M12 2l2.4 2.2 3.2-.4.9 3.1 2.9 1.5-1 3.1 1 3.1-2.9 1.5-.9 3.1-3.2-.4L12 22l-2.4-2.2-3.2.4-.9-3.1-2.9-1.5 1-3.1-1-3.1 2.9-1.5.9-3.1 3.2.4z"></path><path d="M8.5 12l2.5 2.5 4.5-5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span><span style="font-size: 11px; color: {{c.muted}}">{{s.workspace}}</span></div>
</div>
<button type="button" aria-label="{{s.notifications}}" style="position: relative; width: 44px; height: 44px; border: 0; padding: 0; background: transparent; color: {{c.ink}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg><span style="position: absolute; top: 10px; inset-inline-end: 11px; width: 8px; height: 8px; border-radius: 4px; background: #6437fa; border: 2px solid {{c.bg}}"></span></button>
</header>
<main style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; padding: 8px 16px 24px; gap: 14px">
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-inline: 4px">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: {{c.muted}}; font-weight: 600">{{s.date}}</span><h1 style="margin: 0; font-family: {{disp}}; font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: {{tt}}">{{s.hello}}</h1></div>
<button type="button" style="height: 40px; padding: 0 14px; border: 0; border-radius: 20px; background: #6437fa; color: #ffffff; font-family: inherit; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; box-shadow: 0 8px 20px rgba(100,55,250,0.35); cursor: pointer; flex-shrink: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>{{s.newListing}}</button>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{stats}}" as="st" hint-placeholder-count="4">
<div style="padding: 14px; background: {{st.bg}}; border: 1px solid {{st.border}}; border-radius: 18px; display: flex; flex-direction: column; gap: 6px; box-shadow: {{st.shadow}}">
<span style="font-size: 11px; font-weight: 700; color: {{st.sub}}">{{st.label}}</span>
<div style="display: flex; align-items: baseline; gap: 6px"><span style="font-family: Poppins, sans-serif; font-size: 26px; line-height: 30px; font-weight: 700; color: {{st.fg}}">{{st.n}}</span><span style="font-size: 11px; font-weight: 700; color: {{st.sub}}">{{st.delta}}</span></div>
</div>
</sc-for>
</div>
<section style="display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 18px; background: {{c.warnBg}}; border: 1px solid {{c.warnLine}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{c.warnFg}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M12 3l9.5 16.5h-19z"></path><path d="M12 10v4M12 17v.5"></path></svg>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; font-weight: 700; color: {{c.ink}}">{{s.attnT}}</span>
<span style="font-size: 12px; line-height: 17px; color: {{c.muted}}">{{s.attnB}}</span>
<a href="#" style="align-self: flex-start; margin-top: 2px; font-size: 12px; font-weight: 700; color: {{c.warnFg}}; text-decoration: none">{{s.attnCta}}</a>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center; padding-inline: 4px">
<div style="display: flex; align-items: center; gap: 10px"><div style="width: 4px; height: 20px; background: #6437fa; transform: skewX(-18deg)"></div><h2 style="margin: 0; font-family: {{disp}}; font-size: 17px; font-weight: 700">{{s.recent}}</h2></div>
<a href="#" style="font-size: 13px; font-weight: 700; color: {{c.vt}}; text-decoration: none">{{s.viewAll}}</a>
</div>
<div style="background: {{c.card}}; border: 1px solid {{c.line}}; border-radius: 20px; box-shadow: {{c.shadow}}">
<sc-for list="{{people}}" as="p" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-bottom: 1px solid {{p.rule}}">
<span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 20px; background: {{p.av}}; color: #ffffff; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{p.ini}}</span>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 700">{{p.name}}</span><span style="font-size: 11px; color: {{c.muted}}">{{p.role}}</span></div>
<span style="font-size: 11px; color: {{c.muted}}">{{p.time}}</span>
</div>
</sc-for>
</div>
</section>
</main>
<nav aria-label="{{s.nav}}" style="flex-shrink: 0; height: 84px; box-sizing: border-box; padding: 8px 6px 22px; background: {{c.card}}; border-top: 1px solid {{c.line}}; border-radius: 24px 24px 0 0; box-shadow: {{c.navShadow}}; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<button type="button" aria-current="{{t.current}}" style="border: 0; background: transparent; padding: 0; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 3px; color: {{t.color}}; font-size: 10.5px; line-height: 14px; font-weight: {{t.weight}}; cursor: pointer">
<span style="width: 52px; height: 30px; border-radius: 15px; background: {{t.pill}}; color: {{t.icon}}; display: flex; align-items: center; justify-content: center">
<sc-if value="{{t.k0}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg></sc-if>
<sc-if value="{{t.k1}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"></path></svg></sc-if>
<sc-if value="{{t.k2}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l4-4 4 2 3-2 4 1 3 3M3 11l5 5c1 1 2 1 3 0l1-1M21 11l-5 5M12 15l2 2M14 13l2 2"></path></svg></sc-if>
<sc-if value="{{t.k3}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg></sc-if>
<sc-if value="{{t.k4}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="11" height="18" rx="1"></rect><path d="M15 9h5v12h-5M8 7h3M8 11h3M8 15h3"></path></svg></sc-if>
</span>
<span>{{t.label}}</span>
</button>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light"},"locale":{"editor":"enum","options":["en","ar"],"default":"en"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.mode === 'dark';
    const ar = this.props.locale === 'ar';
    const P = {
      light: { bg: '#f6f4fc', card: '#ffffff', line: '#e4dff3', ink: '#15122e', muted: '#5e5a78', vt: '#5424e0', soft: '#efeafe', warnBg: '#fdf6e7', warnLine: '#f3dfb2', warnFg: '#80520a', shadow: '0 8px 30px rgba(40,20,120,0.06)', navShadow: '0 -10px 30px rgba(40,20,120,0.07)' },
      dark: { bg: '#05050d', card: '#0b0c1d', line: '#1d1f3d', ink: '#f4f3ff', muted: '#a9a8c3', vt: '#a78bfa', soft: '#141233', warnBg: '#1c1608', warnLine: '#4a3a12', warnFg: '#fbbf24', shadow: '0 8px 30px rgba(0,0,0,0.35)', navShadow: '0 -10px 30px rgba(0,0,0,0.5)' }
    };
    const c = dark ? P.dark : P.light;
    const S = {
      en: {
        co: 'Saudi Events Group', verified: 'Verified company', workspace: 'Company workspace', notifications: 'Notifications', nav: 'Company',
        date: 'Sunday, 27 September', hello: 'Welcome back', newListing: 'New listing',
        stats: [['Live listings', '3', ''], ['New applicants', '12', '+5 this week'], ['Supplier invites', '2', ''], ['Profile views', '148', '+18%']],
        attnT: 'Changes requested on “Stage Manager”', attnB: 'Back of House asked you to add the working hours before it can go live.', attnCta: 'Edit listing',
        recent: 'Recent applicants', viewAll: 'View All',
        people: [['FZ', 'Fatma Zaki', 'Event Producer', '2h'], ['OH', 'Omar Al-Harbi', 'Event Producer', '5h'], ['SQ', 'Sara Al-Qahtani', 'Event Coordinator', '1d']],
        tabs: ['Dashboard', 'Listings', 'Suppliers', 'News', 'Profile']
      },
      ar: {
        co: 'مجموعة الفعاليات السعودية', verified: 'شركة موثّقة', workspace: 'مساحة عمل الشركة', notifications: 'الإشعارات', nav: 'الشركة',
        date: 'الأحد، 27 سبتمبر', hello: 'مرحبًا بعودتك', newListing: 'فرصة جديدة',
        stats: [['فرص منشورة', '3', ''], ['متقدمون جدد', '12', '+5 هذا الأسبوع'], ['دعوات توريد', '2', ''], ['مشاهدات الملف', '148', '+18%']],
        attnT: 'مطلوب تعديل على «مدير المسرح»', attnB: 'طلب فريق باك أوف هاوس إضافة ساعات العمل قبل النشر.', attnCta: 'تعديل الفرصة',
        recent: 'أحدث المتقدمين', viewAll: 'عرض الكل',
        people: [['فز', 'فاطمة زكي', 'منتج فعاليات', 'قبل ساعتين'], ['عح', 'عمر الحربي', 'منتج فعاليات', 'قبل 5 ساعات'], ['سق', 'سارة القحطاني', 'منسقة فعاليات', 'أمس']],
        tabs: ['اللوحة', 'الفرص', 'التوريد', 'الأخبار', 'الملف']
      }
    };
    const s = ar ? S.ar : S.en;
    const active = 0;
    const tabs = s.tabs.map((label, i) => {
      const on = i === active;
      const t = { label, color: on ? c.vt : c.muted, icon: on ? (dark ? '#a78bfa' : '#6437fa') : c.muted, pill: on ? c.soft : 'transparent', weight: on ? 800 : 600, current: on ? 'page' : 'false' };
      for (let j = 0; j < 5; j++) t['k' + j] = i === j;
      return t;
    });
    const stats = s.stats.map((x, i) => i === 1
      ? { label: x[0], n: x[1], delta: x[2], bg: '#6437fa', border: '#6437fa', fg: '#ffffff', sub: 'rgba(255,255,255,0.85)', shadow: '0 10px 24px rgba(100,55,250,0.35)' }
      : { label: x[0], n: x[1], delta: x[2], bg: c.card, border: c.line, fg: c.ink, sub: c.muted, shadow: c.shadow });
    const avs = ['#6437fa', '#0d6446', '#1c4aab'];
    const people = s.people.map((p, i) => ({ ini: p[0], name: p[1], role: p[2], time: p[3], av: avs[i], rule: i === s.people.length - 1 ? 'transparent' : c.line }));
    return {
      c, s, tabs, stats, people,
      dir: ar ? 'rtl' : 'ltr', lang: ar ? 'ar' : 'en',
      disp: ar ? '"IBM Plex Sans Arabic", sans-serif' : 'Poppins, sans-serif',
      body: ar ? '"IBM Plex Sans Arabic", Poppins, sans-serif' : 'Poppins, "IBM Plex Sans Arabic", sans-serif',
      tt: ar ? '0' : '-0.5px', flip: ar ? 'scaleX(-1)' : 'none'
    };
  }
}
</script>
</body>
</html>
