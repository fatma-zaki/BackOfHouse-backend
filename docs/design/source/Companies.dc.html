<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Companies directory</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div dir="{{dir}}" lang="{{lang}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: {{c.bg}}; color: {{c.ink}}; font-family: {{body}}; padding-top: 40px">
<header style="display: flex; align-items: center; gap: 12px; padding-inline: 16px; height: 56px; box-sizing: border-box; flex-shrink: 0">
<button type="button" aria-label="{{s.back}}" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid {{c.line}}; background: {{c.card}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="transform: {{flip}}"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg></button>
<h1 style="margin: 0; font-family: {{disp}}; font-size: 20px; font-weight: 700; letter-spacing: {{tt}}">{{s.title}}</h1>
</header>
<main style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; padding: 8px 16px 24px; gap: 12px">
<label style="height: 48px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 10px; border-radius: 24px; background: {{c.card}}; border: 1px solid {{c.line}}; color: {{c.ink}}; flex-shrink: 0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input type="search" placeholder="{{s.search}}" aria-label="{{s.search}}" style="flex-grow: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 14px; color: {{c.ink}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
</label>
<div style="display: flex; gap: 8px; overflow: hidden; flex-shrink: 0">
<sc-for list="{{chips}}" as="k" hint-placeholder-count="5">
<button type="button" aria-pressed="{{k.sel}}" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid {{k.border}}; background: {{k.bg}}; color: {{k.color}}; font-family: inherit; font-size: 12px; font-weight: 700; white-space: nowrap; flex-shrink: 0; cursor: pointer">{{k.label}}</button>
</sc-for>
</div>
<section style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 20px; background: {{c.soft}}">
<div style="display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="#6437fa"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"></path></svg><span style="font-family: {{disp}}; font-size: 14px; font-weight: 700">{{s.watch}}</span><span style="font-size: 10.5px; color: {{c.muted}}">{{s.watchNote}}</span></div>
<div style="display: flex; gap: 10px">
<sc-for list="{{watch}}" as="w" hint-placeholder-count="3">
<div style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px; border-radius: 16px; background: {{c.card}}; text-align: center">
<img src="{{w.img}}" alt="" style="width: 44px; height: 44px; display: block; object-fit: cover; border-radius: 12px">
<span style="font-size: 11px; line-height: 14px; font-weight: 700">{{w.name}}</span>
</div>
</sc-for>
</div>
</section>
<sc-for list="{{cos}}" as="co" hint-placeholder-count="3">
<article style="display: flex; flex-direction: column; gap: 10px; padding: 14px; background: {{c.card}}; border: 1px solid {{c.line}}; border-radius: 20px; box-shadow: {{c.shadow}}">
<div style="display: flex; align-items: center; gap: 12px">
<img src="{{co.img}}" alt="" style="width: 50px; height: 50px; display: block; object-fit: cover; border-radius: 14px; flex-shrink: 0">
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
<span style="display: flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 700">{{co.name}}<sc-if value="{{co.verified}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="#6437fa" aria-label="{{s.verified}}"><path d="M12 2l2.4 2.2 3.2-.4.9 3.1 2.9 1.5-1 3.1 1 3.1-2.9 1.5-.9 3.1-3.2-.4L12 22l-2.4-2.2-3.2.4-.9-3.1-2.9-1.5 1-3.1-1-3.1 2.9-1.5.9-3.1 3.2.4z"></path><path d="M8.5 12l2.5 2.5 4.5-5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if></span>
<span style="font-size: 12px; color: {{c.muted}}">{{co.meta}}</span>
</div>
<button type="button" aria-pressed="{{co.followSel}}" style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1.5px solid #6437fa; background: {{co.fBg}}; color: {{co.fFg}}; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; flex-shrink: 0">{{co.follow}}</button>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{co.tags}}" as="tg" hint-placeholder-count="3"><span style="padding: 3px 9px; border-radius: 12px; background: {{c.soft}}; color: {{c.vt}}; font-size: 11px; font-weight: 700">{{tg}}</span></sc-for></div>
</article>
</sc-for>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light"},"locale":{"editor":"enum","options":["en","ar"],"default":"en"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.mode === 'dark';
    const ar = this.props.locale === 'ar';
    const P = {
      light: { bg: '#f6f4fc', card: '#ffffff', line: '#e4dff3', ink: '#15122e', muted: '#5e5a78', vt: '#5424e0', soft: '#efeafe', shadow: '0 8px 30px rgba(40,20,120,0.06)' },
      dark: { bg: '#05050d', card: '#0b0c1d', line: '#1d1f3d', ink: '#f4f3ff', muted: '#a9a8c3', vt: '#a78bfa', soft: '#141233', shadow: '0 8px 30px rgba(0,0,0,0.35)' }
    };
    const c = dark ? P.dark : P.light;
    const img = { seg: '/_blob/959bcd8bd2cfb6539f98a4500b4be775', stage: '/_blob/fe99293a7d78b5eec8cf75c718f91260', expo: '/_blob/1f47ac5ede8419f266fd886cee9a6f94', hero: '/_blob/020f78127b72fb4cbd70e1aa545dcaf8', tech: '/_blob/b4722c75c2e1ead44b6a49cc3ff4884a' };
    const S = {
      en: {
        back: 'Back', title: 'Companies', search: 'Search companies, services, cities', verified: 'Verified company',
        chips: ['All', 'Organizers', 'Venues', 'Suppliers', 'Agencies'],
        watch: 'Companies to Watch', watchNote: 'Editor’s pick',
        watchList: [['Riyadh Front Events', img.stage], ['Creative Expo Co.', img.expo], ['Desert Stage', img.hero]],
        cos: [
          ['Saudi Events Group', 'Event Management & Production · Riyadh', true, ['Conferences', 'Staging', 'Festivals'], img.seg, true],
          ['Riyadh Front Events', 'Organizer · Riyadh', true, ['Summits', 'Exhibitions'], img.stage, false],
          ['LiveTech Solutions', 'AV & Event Technology · Jeddah', false, ['Audio-visual', 'Streaming'], img.tech, false]
        ],
        follow: 'Follow', following: 'Following'
      },
      ar: {
        back: 'رجوع', title: 'الشركات', search: 'ابحث عن شركات أو خدمات أو مدن', verified: 'شركة موثّقة',
        chips: ['الكل', 'منظمون', 'قاعات', 'موردون', 'وكالات'],
        watch: 'شركات تستحق المتابعة', watchNote: 'اختيار المحرر',
        watchList: [['فعاليات واجهة الرياض', img.stage], ['شركة المعرض الإبداعي', img.expo], ['مسرح الصحراء', img.hero]],
        cos: [
          ['مجموعة الفعاليات السعودية', 'إدارة وإنتاج الفعاليات · الرياض', true, ['مؤتمرات', 'تجهيز المسارح', 'مهرجانات'], img.seg, true],
          ['فعاليات واجهة الرياض', 'منظم فعاليات · الرياض', true, ['قمم', 'معارض'], img.stage, false],
          ['لايف تك للحلول', 'تقنيات الفعاليات والصوتيات · جدة', false, ['صوتيات ومرئيات', 'بث مباشر'], img.tech, false]
        ],
        follow: 'متابعة', following: 'تتابعها'
      }
    };
    const s = ar ? S.ar : S.en;
    const chips = s.chips.map((label, i) => ({ label, sel: i === 0 ? 'true' : 'false', bg: i === 0 ? c.ink : c.card, color: i === 0 ? c.bg : c.ink, border: i === 0 ? c.ink : c.line }));
    const watch = s.watchList.map((w) => ({ name: w[0], img: w[1] }));
    const cos = s.cos.map((x) => ({ name: x[0], meta: x[1], verified: x[2], tags: x[3], img: x[4], followSel: x[5] ? 'true' : 'false', follow: x[5] ? s.following : s.follow, fBg: x[5] ? '#6437fa' : 'transparent', fFg: x[5] ? '#ffffff' : c.vt }));
    return {
      c, s, chips, watch, cos,
      dir: ar ? 'rtl' : 'ltr', lang: ar ? 'ar' : 'en',
      disp: ar ? '"IBM Plex Sans Arabic", sans-serif' : 'Poppins, sans-serif',
      body: ar ? '"IBM Plex Sans Arabic", Poppins, sans-serif' : 'Poppins, "IBM Plex Sans Arabic", sans-serif',
      tt: ar ? '0' : '-0.5px', flip: ar ? 'scaleX(-1)' : 'none'
    };
  }
}
</script>
</body>
</html>
