on)\n\n| Interaction | Why synchronous | Mechanism |\n|---|---|---|\n| Audit logging | An audit row must exist if and only if the mutation committed (§18) | `AuditLogger.record(tx, …)` |\n| Verification decision → subject state (claim → owner) | Ownership must not change without a correct review (§20.2); no window of inconsistency | `VerificationSubjectHandler` port |\n| Organization merge → moving children | All-or-nothing merge (ORG-09) | `OrganizationMergeParticipant` port |\n| Subscription change → entitlements | Access must match what was paid (§20.2 billing) | `EntitlementsRecalculator(tx)` |\n| Point entry → balance projection | The balance must never disagree with the ledger inside a request | Same transaction in `PointsService` |\n| Onboarding → profile creation | One user action | `profiles.OnboardingService` |\n\n---\n\n## 3. Event catalog: Phase 1\n\nConsumer abbreviations: **NTF** notifications · **ENG** engagement (P2+) · **SRC** search · **ANL** analytics · **ORG** organizations · **PRJ** projects · **ADM** admin dashboard counters.\n\n### 3.1 Identity & access\n\n| Event | Producer | Consumers | Payload | Purpose | Mode |\n|---|---|---|---|---|---|\n| `user.registered` | identity | ANL | `user_id`, `channel` (email/phone) | Registration funnel (§1.2 KPI) | async |\n| `user.onboarding.completed` | profiles (onboarding) | ANL, ENG (P2: profile completion baseline) | `user_id`, `account_type` | Onboarding funnel | async |\n| `user.suspended` | identity | SRC (hide profile), NTF (none by default) | `user_id`, `reason_code` | Remove from public surfaces | async |\n| `user.reinstated` | identity | SRC | `user_id` | Restore visibility | async |\n| `user.sessions.revoked` | identity | — (audit only) | `user_id`, `scope` | Traceability | — |\n| `consent.changed` | identity | ANL (stop linking events if withdrawn) | `user_id`, `purpose`, `granted` | §16.1 consent-based linking | async |\n| `invitation.created` | access | NTF (email/SMS to invitee) | `invitation_id`, `organization_id`, `role`, `channel` | AUTH-05 | async |\n| `invitation.accepted` | access | NTF (inform owner) | `invitation_id`, `organization_id`, `user_id`, `role` | | async |\n| `membership.visibility_changed` | access | — (SRC team section) | `membership_id`, `organization_id`, `show_on_company_profile` | BQ-64 | async |\n| `membership.removed` | access | NTF | `membership_id`, `organization_id`, `user_id` | | async |\n| `organization.account_linked` | organizations | NTF, ANL | `organization_id`, `account_user_id`, `source` (CREATION/CLAIM/ADMIN_FLOW) | The company's single Company Account (BQ-68) | async |\n| `staff_role.granted` / `staff_role.revoked` | access | NTF (the staff member) | `user_id`, `role` | §18 | async |\n\n### 3.2 Organizations\n\n| Event | Producer | Consumers | Payload | Purpose | Mode |\n|---|---|---|---|---|---|\n| `organization.created` | organizations | SRC (if public), ANL, ADM | `organization_id`, `status`, `origin` (IMPORT/COMPANY_REGISTRATION) | Index, KPI \"companies in base\" | async |\n| `organization.updated` | organizations | SRC, ENG (PROFILE_COMPLETION sync, P2) | `organization_id`, `changed_fields[]`, `completion_score` | Reindex public fields; completeness points | async (debounced) |\n| `organization.status_changed` | organizations | SRC, PRJ (public visibility), NTF (owner), ANL | `organization_id`, `from`, `to`, `reason_code` | Lifecycle effects | async |\n| `organization.claim.submitted` | organizations | ANL (`profile_claim_started`), ADM | `claim_id`, `organization_id`, `claimant_user_id` | §16 claim funnel | async |\n| `organization.claim.approved` | organizations (handler) | NTF (claimant: \"invite your team\"), ANL (`profile_claim_completed`), SRC | `claim_id`, `organization_id`, `user_id` | §5.2 | async |\n| `organization.claim.rejected` | organizations (handler) | NTF, ANL | `claim_id`, `organization_id`, `user_id` | | async |\n| `organization.approval.submitted` | organizations | ADM (approval queue) | `approval_id`, `organization_id`, `submitted_by` | BQ-05 | async |\n| `organization.approved` | organizations (T-29) | SRC (publish listing), NTF (owner), ANL | `approval_id`, `organization_id`, `decided_by` | Admin approval — **not** verification; ENG does **not** consume it (BQ-46) | async |\n| `organization.approval.changes_requested` / `organization.approval.rejected` | organizations (T-29) | NTF (owner) | `approval_id`, `organization_id` | BQ-05, BQ-57 | async |\n| `organization.ownership.transferred` | organizations (T-30) | NTF (old and new Company Account), ANL | `organization_id`, `from_account_user_id`, `to_account_user_id` | BQ-56, BQ-69 | async |\n| `organization.verification_signal.approved` / `.expired` | organizations (signal handlers) | SRC (`verification_signals`), ENG (TRUST rule per signal, P2), NTF | `organization_id`, `verification_id`, `signal` (REGISTRATION/DOMAIN/CREDENTIAL/CONTACT) | Independent signals (BQ-47) | async |\n| `organization.verified` | organizations (status derivation) | SRC (`is_verified`), NTF, ANL | `organization_id` | Company reached the VERIFIED rule (BQ-53). KPI \"verified companies\". Trust points come from the signal events, not this one | async |\n| `organization.needs_update` | organizations (job) | NTF (owner), SRC (freshness) | `organization_id`, `reason` (STALE/CREDENTIAL_EXPIRED) | ORG-08 | async |\n| `organization.credential.expiring` | organizations (job) | NTF (owner) | `organization_id`, `credential_id`, `expires_on` | ORG-05, ORG-08 | async |\n| `organization.merged` | organizations | SRC (delete source doc, reindex target), NTF (owners), ANL | `source_organization_id`, `target_organization_id`, `merge_id` | ORG-09 | async (children moved synchronously) |\n| `correction.suggested` | organizations | NTF (owner/editors) | `suggestion_id`, `organization_id` | §4 | async |\n\n### 3.3 Projects\n\n| Event | Producer | Consumers | Payload | Purpose | Mode |\n|---|---|---|---|---|---|\n| `project.submitted` | projects | ADM (queue) | `project_id`, `organization_id` | Review queue | async |\n| `project.published` | projects | SRC, NTF (org), ANL (`project_published`: completeness, verification, type), ENG (P2) | `project_id`, `organization_id`, `completion_score`, `points_score`, `is_verified`, `project_type` | §7.3, §16 | async |\n| `project.changes_requested` | projects | NTF | `project_id`, `organization_id` | | async |\n| `project.rejected` | projects | NTF | `project_id`, `organization_id` | | async |\n| `project.archived` | projects | SRC, ENG (PROJECTS sync) | `project_id`, `organization_id` | | async |\n| `project.score_changed` | projects | ENG (PROJECTS sync, top 10 ≤ 300) | `project_id`, `organization_id`, `points_score` | §7.3, §8.3 | async (debounced) |\n\n### 3.4 Verification\n\n| Event | Producer | Consumers | Payload | Purpose | Mode |\n|---|---|---|---|---|---|\n| `verification.submitted` | verification | ADM | `verification_id`, `type`, `due_at` | Queue and SLA | async |\n| `verification.info_requested` | verification | NTF (applicant) | `verification_id`, `type`, `subject_ref` | §5.1 status visibility | async |\n| `verification.approved` | verification | NTF, ENG (TRUST/EXPERIENCE points, P2), SRC | `verification_id`, `type`, `subject_ref` | Trust derivation | async (subject state already changed in TX) |\n| `verification.rejected` | verification | NTF | `verification_id`, `type`, `subject_ref` | | async |\n| `verification.expired` | verification (job) | NTF, ENG (reverse trust points), SRC | `verification_id`, `type`, `subject_ref` | BQ-23 | async |\n\n`subject_ref` = `{ kind: \"organization\" | \"user\" | \"project\" | \"credential\" | \"experience\", id }`.\n\n### 3.5 Profiles, media, content, moderation, imports\n\n| Event | Producer | Consumers | Payload | Purpose | Mode |\n|---|---|---|---|---|---|\n| `profile.updated` | profiles | SRC (P3 professionals) | `profile_id`, `user_id`, `changed_fields[]` | | async |\n| `profile.completion_changed` | profiles | ENG (PROFILE_COMPLETION once-only items) | `user_id`, `completed_items[]`, `completion_score` | §8.2 | async |\n| `profile.visibility_changed` | profiles | SRC | `profile_id`, `is_searchable` | §5.1 privacy | async |\n| `media.ready` | media | owning module (e.g. ORG attach) | `asset_id`, `purpose` | Upload pipeline | async |\n| `media.rejected` | media | ORG / PRJ (detach), NTF (uploader) | `asset_id`, `reason_code` | §18 malware and type | async |\n| `content.published` | content | SRC (sitemap) | `content_item_id`, `type`, `slug` | SEO | async |\n| `abuse_report.created` | moderation | ADM, NTF (moderators, urgent types) | `report_id`, `target_type`, `category`, `sla_due_at` | §23 24 h target | async |\n| `abuse_report.resolved` | moderation | NTF (reporter) | `report_id`, `outcome` | | async |\n| `appeal.submitted` | moderation | ADM | `appeal_id`, `subject_type` | §8.6 | async |\n| `appeal.upheld` | moderation | ENG (reversal), ORG (status recompute), NTF | `appeal_id`, `subject_type`, `subject_ref` | Corrective action by owning module | async |\n| `appeal.denied` | moderation | NTF | `appeal_id` | | async |\n| `import.committed` | imports | ADM, SRC (bulk reindex) | `batch_id`, `created_count`, `updated_count` | §22 | async |\n| `import.rolled_back` | imports | SRC | `batch_id`, `archived_organization_ids[]` | §22.1 | async |\n| `taxonomy.changed` | taxonomy | SRC (reindex affected docs) | `entity` (category/service/location/skill), `id` | | async |\n\n---\n\n## 4. Event catalog: Phases 2–4\n\n### 4.1 Billing & entitlements — ⏸ deferred (business rules §11)\n\n| Event | Producer | Consumers | Payload | Purpose |\n|---|---|---|---|---|\n| `subscription.started` | billing | NTF, ANL (`membership_started`: plan, value) | `subscription_id`, `subscriber_ref`, `plan_code`, `status` (TRIAL/ACTIVE), `amount_minor` | §16 |\n| `subscription.renewed` | billing | NTF, ANL (`membership_renewed`) | `subscription_id`, `period_end`, `amount_minor` | §7.5 |\n| `subscription.plan_changed` | billing | NTF, ANL | `subscription_id`, `from_plan`, `to_plan`, `effective_at` | Upgrade now / downgrade at period end |\n| `subscription.grace_started` / `subscription.past_due` | billing | NTF (owner) | `subscription_id`, `grace_ends_at` | Dunning |\n| `subscription.cancelled` | billing | NTF, ANL (`membership_cancelled`: reason) | `subscription_id`, `reason_code`, `access_until` | §16 |\n| `subscription.expired` | billing | NTF | `subscription_id` | |\n| `payment.succeeded` / `payment.failed` | billing | NTF | `payment_id`, `invoice_id`, `amount_minor` | |\n| `invoice.issued` | billing | NTF (invoice ready) | `invoice_id`, `subscription_id`, `total_minor` | Tax invoice |\n| `coupon.redeemed` | billing | ANL | `coupon_id`, `subscription_id` | |\n| `entitlements.changed` | entitlements | SRC (partner label), NTF (none), ENG (none: **never** trust) | `subscriber_ref`, `feature_keys[]` | Feature gates |\n\n### 4.2 Engagement (Phase 2)\n\n| Event | Producer | Consumers | Payload | Purpose |\n|---|---|---|---|---|\n| `points.credited` / `points.debited` | engagement | ENG (levels, badges, visibility debounce), NTF (optional milestone) | `entry_id`, `subject_ref`, `category`, `amount`, `rule_code` | Downstream projections |\n| `points.reversed` | engagement | ENG (levels), NTF (subject, if user-visible, BQ-13) | `entry_id`, `reverses_entry_id`, `subject_ref`, `amount` | §8.1 |\n| `points.balance_frozen` | engagement | NTF, SRC (visibility) | `subject_ref`, `reason_code` | §8.2 |\n| `level.review_requested` | engagement | ADM, NTF (staff) | `assignment_id`, `user_id`, `level_code` | §8.6 human review |\n| `level.changed` | engagement | NTF (member), SRC (P3), ANL | `user_id`, `from_level`, `to_level` | §9.1 |\n| `badge.awarded` / `badge.revoked` | engagement | NTF, SRC | `award_id`, `badge_code`, `subject_ref` | §14 |\n| `visibility.recomputed` | engagement | SRC (`visibility_score`) | `subject_ref`, `score`, `formula_version` | §8.4 |\n| `engagement.anomaly_detected` | engagement (job) | ADM, NTF (staff) | `alert_id`, `alert_type`, `subject_ref` | §8.6 |\n\n### 4.3 Events (Phase 2)\n\n| Event | Producer | Consumers | Payload | Purpose |\n|---|---|---|---|---|\n| `event.published` | events | NTF (optional audience), ANL | `event_id`, `kind`, `starts_at` | |\n| `event.cancelled` | events | NTF (all registrants) | `event_id` | |\n| `event.registration.confirmed` | events | NTF (entry code), ANL (`event_registered`: membership) | `registration_id`, `event_id`, `user_id`, `ticket_type_id` | §16 |\n| `event.registration.waitlisted` | events | NTF | same + `waitlist_position` | §9.2 |\n| `event.registration.promoted` | events | NTF (seat available) | `registration_id`, `event_id`, `user_id` | §9.2 |\n| `event.registration.cancelled` | events | NTF, ENG (repeated-cancellation penalty pattern, ❓) | `registration_id`, `event_id`, `user_id`, `cancelled_at` | §8.2 penalties |\n| `event.registration.transferred` | events | NTF (both users) | `from_registration_id`, `to_registration_id` | §9.2 |\n| `event.attendance.verified` | events | **ENG (ACTIVITY points: the only trigger)**, ANL (`event_attended`) | `registration_id`, `event_id`, `event_kind`, `user_id`, `method`, `occurred_at` | §9.2, §20.2 |\n| `event.completed` | events | NTF (survey links), job (certificates) | `event_id` | §9.2 |\n| `event.feedback.submitted` | events | ANL | `event_id`, `rating` | Satisfaction |\n| `event.certificate.issued` | events | NTF | `registration_id`, `document_id` | §9.2 |\n\n### 4.4 Talent & opportunities (Phase 3)\n\n| Event | Producer | Consumers | Payload | Purpose |\n|---|---|---|---|---|\n| `experience.confirmation_requested` | talent | NTF (organization confirmers) | `experience_id`, `organization_id`, `user_id` | §10.1 |\n| `experience.confirmed` | talent | ENG (TRUST employer 25 / org confirmation 20), NTF, SRC | `experience_id`, `organization_id`, `user_id` | §8.2 |\n| `experience.declined` | talent | NTF | `experience_id` | |\n| `opportunity.published` | opportunities | SRC, ENG (org RECENT_ACTIVITY/CONTRIBUTION), ANL | `opportunity_id`, `organization_id`, `type`, `audience` | Rules §5, §6 |\n| `opportunity.paused` / `opportunity.closed` | opportunities | NTF (applicants), ANL (`opportunity_closed`: result), SRC | `opportunity_id`, `outcome` | §10.3, §16 |\n| `opportunity.match_found` ⏸ | opportunities (matching) | NTF | `opportunity_id`, `user_id`, `score` | Deferred (rules §9) |\n| `application.submitted` | opportunities | NTF (publishing company), ANL (`opportunity_applied`) | `application_id`, `opportunity_id`, `applicant_user_id` | §16, rules §8 |\n| `application.status_changed` | opportunities | NTF (applicant) | `application_id`, `from`, `to` (any company-chosen status, flexible, BQ-67) | Rules §8 |\n| `application.withdrawn` | opportunities | NTF (publishing company) | `application_id`, `opportunity_id` | Rules §8 |\n| `supplier_response.submitted` / `supplier_response.withdrawn` | opportunities | NTF (buyer company), ANL | `response_id`, `opportunity_id`, `responding_organization_id` | B2B flow, rules §7 |\n| `application.message_sent` ⏸ | opportunities | NTF (other side) | `application_id`, `message_id`, `sender_side` | Deferred (rules §9) |\n\n### 4.5 Intelligence & institutional (Phase 4)\n\n| Event | Producer | Consumers | Payload | Purpose |\n|---|---|---|---|---|\n| `report.requested` | intelligence | job (generate) | `report_id`, `type` | |\n| `report.ready` / `report.failed` | intelligence | NTF, ANL (`report_generated`: type, entity, purpose) | `report_id`, `organization_id` | §16 |\n| `report.exported` | intelligence | ANL (`report_exported`), ADM | `export_id`, `report_id`, `format`, `purpose` | §12.3, §16 |\n| `benchmark.competitor_changed` | intelligence | ANL | `benchmark_set_id`, `added_id`, `removed_id` | §11.1 |\n| `rfi.sent` | institutional (on hold, BQ-51) | NTF (recipient companies) | `rfi_id`, `recipient_organization_ids[]` | §12.1 |\n| `rfi.responded` | institutional | NTF (requester) | `rfi_id`, `recipient_organization_id` | |\n| `saved_search.matches_found` | institutional (job) | NTF | `saved_search_id`, `new_company_ids[]` | §12.1 alerts |\n\n---\n\n## 5. Consumer summary\n\n```mermaid\nflowchart LR\n    subgraph Producers\n        identity & access & organizations & projects & verification & profiles & moderation\n        billing & engagement & events & talent & opportunities & intelligence & institutional\n    end\n    subgraph Consumers\n        NTF[notifications\u003cbr/>leaf]\n        SRC[search\u003cbr/>leaf indexer]\n        ENG[engagement\u003cbr/>points · levels · visibility]\n        ANL[analytics\u003cbr/>server-side funnel events]\n    end\n    organizations & projects & verification & profiles & entitlements & engagement --> SRC\n    verification & projects & profiles & events & talent & opportunities & moderation & organizations --> ENG\n    identity & access & organizations & projects & verification & billing & engagement & events & talent & opportunities & intelligence & institutional & moderation --> NTF\n    identity & organizations & projects & billing & events & opportunities & intelligence --> ANL\n```\n\n---\n\n## 6. Domain events vs analytics events (§16)\n\n| | Domain events | Analytics events |\n|---|---|---|\n| Purpose | Trigger business side effects between modules | Measure product usage and conversion (§16), feed Phase 4 metrics |\n| Source of names | This document | PRD §16 dictionary (`search_performed`, `profile_impression`, `profile_viewed`, `contact_clicked`, `profile_claim_started/completed`, `project_published`, `membership_started/renewed/cancelled`, `event_registered/attended`, `opportunity_viewed/applied/closed`, `report_generated/exported`) |\n| Transport | `outbox_events` → handlers | `analytics_events` table (+ forwarding to provider) |\n| Reliability | At least once, must not be lost | Best effort, batched |\n| Personal data | ids only | Linked to the user only after consent (§16.1) |\n| Emitted by | Server only | Client (impressions, views, clicks) + server (funnel events derived from domain events) |\n\nServer-side analytics events (`profile_claim_*`, `project_published`, `membership_*`, `event_*`, `opportunity_applied/closed`, `report_*`) are produced by the **analytics module consuming domain events**. Business modules never write analytics directly (except `search` logging `search_performed`, a read path).\n"},{"name":"points-architecture","title":"Points, Levels, Badges & Visibility Architecture","keywords":"points ledger levels badges visibility","markdown":"# Points, Levels, Badges & Visibility Architecture\n\n> PRD sources: §7.3 (project points), §8.1–8.6 (points, trust, visibility, decay, anti-abuse), §9.1 (levels), §13 (admin: rules, versions, ledger, reversal, alerts), §14 (`point_rules`, `point_ledger`, `badges`, `badge_awards`, `visibility_snapshots`), §20.2 (\"a movement happens once, can be explained and can be reversed\"; \"no points for booking without attendance\"), §24 (manipulation risk).\n> Module: `engagement` (Phase 2). Decisions: ADR-014. Decided: BQ-07 (verification independent of points and levels), BQ-08 (points are not a currency). Open: BQ-09..13, BQ-40, BQ-52, RG-16, RG-22..24, TQ-13, TQ-14.\n\n---\n\n## 1. Points are not trust, verification, visibility or membership\n\n```text\n VERIFICATION ─────────────►  facts: \"this evidence was checked\"          (verification module)\n      │ approved case\n      ▼\n TRUST points  ─────────────►  PRD §8.1: trust is its OWN balance         (engagement · category TRUST)\n ACTIVITY / CONTRIBUTION /\n EXPERIENCE / PROJECTS /\n PROFILE_COMPLETION points ─►  engagement value                           (engagement · other categories)\n      │ inputs (weighted, capped, decayed)\n      ▼\n VISIBILITY score ──────────►  one ranking signal, never a guarantee      (engagement → search)\n\n MEMBERSHIP (paid) ─────────►  entitlements + a LABELLED partner badge    (billing/entitlements)\n                               ✗ never a point · ✗ never trust · ✗ never organic score\n```\n\n| Rule | PRD |\n|---|---|\n| Activity does not equal trust; each has an independent balance | §8.1 |\n| Sponsorship buys **declared visibility**, never credibility | §8.1, §7.5 |\n| No points for signing in alone or for low-quality interaction | §8.1 |\n| Every movement goes to a ledger that is not directly editable; corrections are reverse movements | §8.1, §29.2 |\n| Rules and versions are kept so any historical result can be explained | §8.1 |\n| Paid visibility is separate, clearly labelled, and excluded from trust | §8.3 |\n| Verification is independent of points and levels: no level requires verification, and no amount of points means \"verified\" | Decision BQ-07 |\n| Points are used for levels and benefits only. They are never spent, redeemed or exchanged | Decision BQ-08 |\n| Points represent activity and engagement and **unlock** Levels, Rewards and Benefits without ever being deducted; they never grant verification, and paying or being featured never grants verification | Business rules §10, BQ-59 |\n\n**Never model points as `users.points = 320`.** A balance is a *projection* of the ledger (§3).\n\n---\n\n## 2. Core flow\n\n```text\nBusiness fact (verified)          e.g. attendance verified for registration R\n        │\n        ▼\nPoint rule (active version)       MEMBER_MEETUP_ATTENDED v3 → +10, weekly cap 40\n        │   + eligibility: requires verification? requires review? once-only?\n        │   + cap check (daily/weekly/lifetime) under lock\n        │   + idempotency key  \"MEMBER_MEETUP_ATTENDED:R\"\n        ▼\nPoint ledger entry (append-only)  CREDIT +10  ACTIVITY  source=event_registration:R  rule_version=v3\n        │\n        ▼\nBalance projection                point_balances(user, ACTIVITY) += 10   (same transaction)\n        │\n        ├──► Level evaluation      (§9.1 thresholds + gates)\n        ├──► Badge evaluation      (criteria RG-16)\n        └──► Visibility recompute  (§8.4 weights · §8.5 decay) → search ranking signal\n```\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant EV as events module\n    participant OBX as outbox\n    participant PS as engagement.PointsService\n    participant DB as Postgres\n\n    EV->>DB: TX: registration.attended_at = now() + outbox(event.attendance.verified)\n    OBX->>PS: deliver event.attendance.verified {registrationId, userId, eventKind, occurredAt}\n    PS->>PS: resolve rule by eventKind → active version (effective at occurredAt)\n    PS->>DB: BEGIN\n    PS->>DB: SELECT … FROM point_balances WHERE user & ACTIVITY FOR UPDATE\n    PS->>DB: SUM(amount) in ledger for this rule this week (cap check)\n    alt cap reached or balance frozen\n        PS->>DB: no entry (optionally a zero-effect record in engagement_alerts)\n    else within cap\n        PS->>DB: INSERT point_ledger (idempotency_key UNIQUE)\n        Note over PS,DB: duplicate delivery → unique violation → treated as success (exactly-once)\n        PS->>DB: UPDATE point_balances SET balance = balance + 10, last_entry_id\n        PS->>DB: INSERT outbox(points.credited)\n    end\n    PS->>DB: COMMIT\n```\n\n---\n\n## 3. Data model (owned by `engagement`)\n\n| Table | Role | Mutability |\n|---|---|---|\n| `point_rules` | Named way to earn or lose points; subject type + category | Mutable metadata (`is_active`) |\n| `point_rule_versions` | Values: points, caps, gates, effective period | **Immutable once effective** |\n| `point_ledger` | **Source of truth**; every movement | **Append-only** (DB privileges revoked) |\n| `point_balances` | Projection: balance per subject × category; freeze flag | Updated only with a ledger insert; rebuildable |\n| `member_levels` | §9.1 thresholds and gates | Staff-managed |\n| `level_assignments` | Level history per user, review status | Append-mostly |\n| `badges` / `badge_awards` | Definitions; award and revoke history | Awards revoked, never deleted |\n| `visibility_snapshots` | Score + component breakdown + formula version | Append-only; `is_current` flag |\n| `engagement_alerts` | Anomalies and reconciliation mismatches | Status workflow |\n\nFull field lists: `database-entities.md` §14.\n\n---\n\n## 4. Earning rules\n\n### 4.1 Member points (§8.2)\n\n| Category | PRD examples | Values (PRD) | Cap / control (PRD) | Trigger event | Rule codes (proposed) |\n|---|---|---|---|---|---|\n| `PROFILE_COMPLETION` | Photo, bio, skills, languages | ❓ not given | **Once** per item | `profile.completion_changed` | `MEMBER_PROFILE_PHOTO`, `MEMBER_PROFILE_BIO`, `MEMBER_PROFILE_SKILLS`, `MEMBER_PROFILE_LANGUAGES` (`max_per_subject = 1`) |\n| `ACTIVITY` | Meetup attendance **10**, workshop **15**, accepted content **8** | 10 / 15 / 8 | **Weekly cap** (value ❓ BQ-10) | `event.attendance.verified`; accepted content ❓ BQ-34 | `MEMBER_MEETUP_ATTENDED`, `MEMBER_WORKSHOP_ATTENDED` |\n| `TRUST` | Identity **20**, employer **25**, organization confirmation **20** | 20 / 25 / 20 | **After verification** | `verification.approved` (USER_IDENTITY), `experience.confirmed` (P3) | `MEMBER_IDENTITY_VERIFIED`, `MEMBER_EMPLOYER_VERIFIED`, `MEMBER_ORG_CONFIRMED` |\n| `EXPERIENCE` | Previous experience **10**, documented project **15–30** | 10 / 15–30 | By quality of evidence (criteria ❓ BQ-10) | `verification.approved` (USER_EXPERIENCE), P3 profile projects | `MEMBER_EXPERIENCE_VERIFIED`, `MEMBER_DOCUMENTED_PROJECT` (amount chosen by reviewer within 15–30) |\n| `CONTRIBUTION` | Volunteering, training, helpful answer, initiative | ❓ | **Review or confirmation** | ❓ RG-23, BQ-34 | Not seeded until defined |\n| `PENALTY` | Misleading content, manipulation, repeated attendance cancellation | ❓ | **Deduction or freeze** | Admin decision; `event.registration.cancelled` pattern ❓ | `MEMBER_PENALTY_MISLEADING`, `MEMBER_PENALTY_MANIPULATION`, `MEMBER_PENALTY_REPEATED_CANCELLATION` |\n\n**Explicitly never earns points:** signing in (§8.1), registering for an event without attending (§9.2), low-quality interaction (§8.1).\n\n### 4.2 Company points (§8.3)\n\n| Component (category) | Max | PRD notes | Mode |\n|---|---|---|---|\n| `PROFILE_COMPLETION` | **100** | From basic fields, verification and freshness | **Computed** |\n| `PROJECTS` | **300** | Top **10** projects; each **≤ 50** (§7.3) | **Computed** |\n| `TRUST` | **100** | Registration, domain, licenses, contact confirmation — **one rule per independent signal** (BQ-47): `ORG_REGISTRATION_VERIFIED`, `ORG_DOMAIN_VERIFIED`, `ORG_CREDENTIAL_VERIFIED`, `ORG_CONTACT_VERIFIED`; values BQ-10. Company **approval** earns nothing (BQ-46) | **Event** (signal approved or expired) with component cap |\n| `RECENT_ACTIVITY` | **100** | Updates, opportunities, responsiveness within a time window (RG-24) | **Event** + time window |\n| `CONTRIBUTION` | **100** | Training, jobs, data, hosting, support | **Event** with review (RG-23) |\n| Paid visibility | **separate** | Clearly labelled; never part of trust | **Not points.** Entitlement only |\n\n### 4.3 Two earning modes\n\n**(A) Event mode.** A discrete fact produces one entry. The key is `RULE_CODE:source_id`.\n\n**(B) Computed mode** (TQ-13). Some company components are *scores that can go up and down* (profile completeness, project quality). §8.1 still requires every movement in the ledger, so the engine **recomputes and writes the difference**:\n\n```text\non organization.updated / project.score_changed / nightly:\n    target  = min(cap, calculate(component, current data))        # e.g. PROJECTS = Σ top-10 project scores ≤ 300\n    current = point_balances(org, component).balance\n    delta   = target - current\n    if delta ≠ 0:\n        INSERT point_ledger(entry_type = delta > 0 ? CREDIT : DEBIT,\n                            amount = delta,\n                            rule_version = ORG_\u003cCOMPONENT>_SYNC vN,\n                            source_type = 'score_sync',\n                            idempotency_key = 'ORG_\u003cCOMPONENT>_SYNC:\u003corg>:\u003cinput_hash>')\n```\n\nThe history then shows *why* a company's project points went from 180 to 210 on a given date: the source is the input hash, and the snapshot of project scores is kept in the entry's metadata.\n\n---\n\n## 5. Deductions, freezes, reversals\n\n| Operation | Ledger effect | Who | Transaction |\n|---|---|---|---|\n| **Penalty** (§8.2) | `DEBIT` with a negative amount, `rule_version` = penalty rule, `reason` required | `SYSTEM_ADMIN` / moderation decision | T-08 |\n| **Freeze** (§8.2 \"or freeze\") | No entry. `point_balances.frozen_at` set on all subject categories; new credits are **skipped** while frozen (❓ whether frozen points also drop out of visibility: proposed **yes**) | `SYSTEM_ADMIN` | audited |\n| **Reversal** (§8.1) | `REVERSAL` with `amount = -original.amount`, `reverses_entry_id = original.id` (unique → at most once) | System (verification expired, appeal upheld, attendance undone) or admin with reason | T-09 |\n| **Manual adjustment** (§13 \"correction\") | `CREDIT`/`DEBIT` with no rule version, `reason` required, `created_by` = admin | `SYSTEM_ADMIN` + `Idempotency-Key` | T-08 |\n| **Rule value change** | **No retroactive change.** A new `point_rule_versions` row applies from `effective_from`. Past entries keep their original version | `SYSTEM_ADMIN` | audited |\n\nAutomatic reversal triggers:\n\n| Trigger | Reversed entries |\n|---|---|\n| `verification.expired` / trust evidence revoked | TRUST entries whose `source_id` = that verification |\n| `appeal.upheld` on a `POINT_LEDGER_ENTRY` | That entry |\n| Attendance cancelled by admin (check-in error) | ACTIVITY entry for that registration |\n| Duplicate media or project confirmed (§8.6) | Entries sourced from the duplicate |\n\n---\n\n## 6. Balance calculation\n\n```sql\n-- Source of truth (used by reconciliation and explainability)\nSELECT category, SUM(amount) AS balance\nFROM point_ledger\nWHERE subject_user_id = $1\nGROUP BY category;\n\n-- Fast path (used by APIs): point_balances, maintained in the SAME transaction as each insert.\n```\n\n| Concern | Approach |\n|---|---|\n| Concurrency | `SELECT … FOR UPDATE` on the `point_balances` row (created lazily with an `INSERT … ON CONFLICT DO NOTHING` first) |\n| Exactly once | `UNIQUE (idempotency_key)` → a duplicate delivery is a no-op success |\n| Drift | Nightly `ReconciliationJob` compares `SUM(ledger)` with the projection; a mismatch → `engagement_alerts(BALANCE_MISMATCH)` + rebuild |\n| Total per member | Σ categories (**which categories count toward level → BQ-09**) |\n| Negative balances | Allowed in `PENALTY`. Whether other categories may go below 0 → proposed **no** (DEBIT is clamped to the balance and the clamp is recorded in `reason`) |\n\n---\n\n## 7. Caps and windows\n\n| Cap | Stored in | Enforcement |\n|---|---|---|\n| Once per subject | `point_rule_versions.max_per_subject = 1` | `COUNT` of non-reversed entries for the rule and subject under the balance lock |\n| Daily / weekly (§8.6) | `daily_cap`, `weekly_cap` (points) | `SUM(amount)` for the rule (or category) within the window under the lock |\n| Component maximum (company §8.3) | Rule metadata `component_cap` | Computed mode uses `min(cap, target)`; event mode clamps at the cap |\n| Top-10 projects (§7.3) | Calculator | Only the 10 highest project scores (weighted by recency and verification, BQ-12) count |\n\nWindow boundaries use **Asia/Riyadh** calendar days and weeks (Saturday or Sunday week start → proposed Sunday; confirm).\n\n---\n\n## 8. Levels (§9.1)\n\n```mermaid\nflowchart LR\n    B[Balance changed\u003cbr/>points.credited / debited] --> E[LevelsService.evaluate user]\n    E --> T{Threshold band}\n    T -->|0–99| L1[NEW_MEMBER]\n    T -->|100–249| L2[ACTIVE_MEMBER]\n    T -->|250–499| L3[CONTRIBUTING]\n    T -->|500–799| L4[LEVEL_500\u003cbr/>no verification gate · BQ-07\u003cbr/>name BQ-52]\n    T -->|800–1199| G2{Staff review}\n    G2 -- approved --> L5[COMMUNITY_LEADER]\n    G2 -- pending --> PR[level_assignments\u003cbr/>PENDING_REVIEW]\n    T -->|1200+| G3{Nomination +\u003cbr/>admin approval}\n    G3 -- approved --> L6[AMBASSADOR]\n    G3 -- none --> KEEP[Keep current level]\n```\n\n- Automatic levels (1–4) are assigned by the system from points alone. §9.1's verification condition on the 500–799 level is **removed** by decision BQ-07; its name is pending BQ-52.\n- **Upper levels require human review** (§8.6): COMMUNITY_LEADER needs review, AMBASSADOR needs nomination and admin approval, \"administrative not automatic\" (§9.1).\n- **Downgrade policy** when points fall (penalty or reversal) → ❓ BQ-09. Proposed: automatic levels follow the balance; review-based levels are revoked only by a staff decision.\n- Level **benefits** (RG-22) are expressed as entitlement-like eligibility checks (e.g. `event_ticket_types.min_level_id`), never as roles.\n\n---\n\n## 9. Badges\n\n- Catalog and criteria: RG-16. `badges.is_manual` supports staff-awarded badges immediately. `criteria` (jsonb) supports automatic badges once they are defined.\n- Awards and revocations are recorded (§14 \"granting **and revoking** badges\"), with a reason on revocation.\n- The **paid partner badge is not a badge row**. It is rendered from the `directory.partner_badge` entitlement and **labelled as paid** (§7.5).\n\n---\n\n## 10. Visibility score (§8.4, §8.5)\n\n### 10.1 Formulas\n\n```text\nCompany visibility (0–100)  =  30% × ProfileCompletion/100\n                             + 25% × Trust/100\n                             + 20% × ProjectQuality/300\n                             + 15% × RecentActivity_decayed/100\n                             + 10% × Contribution/100\n\nProfessional visibility (0–100) = 30% × Trust\n                                + 25% × ProfileCompletion\n                                + 20% × VerifiedExperience\n                                + 15% × Contribution\n                                + 10% × RecentActivity_decayed\n                                (each component normalised to 0–1; maximums for individuals → BQ-11)\n```\n\n### 10.2 Activity decay (§8.5)\n\n| Age of activity | Weight |\n|---|---|\n| 0–30 days | 100% |\n| 31–90 days | 70% |\n| 91–180 days | 40% |\n| > 180 days | 20% |\n\n```sql\n-- decayed recent activity for an organization (component input)\nSELECT SUM(amount * CASE\n          WHEN occurred_at >= now() - interval '30 days'  THEN 1.0\n          WHEN occurred_at >= now() - interval '90 days'  THEN 0.7\n          WHEN occurred_at >= now() - interval '180 days' THEN 0.4\n          ELSE 0.2 END)\nFROM point_ledger\nWHERE subject_organization_id = $1 AND category = 'RECENT_ACTIVITY';\n```\n\nDecay is **applied at calculation time**. Ledger amounts are never mutated. Decay applies to the **activity** component only (§8.5 is titled \"activity decay\"); whether it also applies to contribution → ❓ (proposed no).\n\n### 10.3 Worked example (company)\n\n| Component | Raw | Max | Normalised | Weight | Contribution |\n|---|---|---|---|---|---|\n| Profile completion | 80 | 100 | 0.80 | 30% | 24.0 |\n| Trust | 60 | 100 | 0.60 | 25% | 15.0 |\n| Project quality (top 10) | 210 | 300 | 0.70 | 20% | 14.0 |\n| Recent activity (decayed) | 50 | 100 | 0.50 | 15% | 7.5 |\n| Contribution | 20 | 100 | 0.20 | 10% | 2.0 |\n| **Visibility** | | | | | **62.5** |\n\n### 10.4 Recompute and use\n\n- **When** (TQ-14): after relevant events (debounced per subject, e.g. 5 minutes) + a **nightly** full recompute (decay changes daily).\n- **Stored** as a `visibility_snapshots` row (components JSON + `formula_version = company-v1`), with the previous snapshot's `is_current` set to false, then copied to `search_documents.visibility_score` through `visibility.recomputed`.\n- **Used** by search as one signal: `final_rank = f(text relevance, filter match on specialty/city/language/availability, visibility_score)`. A higher score **does not guarantee first place** (§8.4). Sponsored results are **labelled** and **not** blended into this score.\n- **Explainable** to staff: `GET /admin/visibility/:subjectType/:subjectId` returns the snapshot components and the contributing ledger entries.\n\n---\n\n## 11. Rewards\n\n> **Decisions BQ-08 (2026-09-15) and BQ-59 (2026-09-17):** points are **not a currency** and are **never deducted** when a Reward is used. Points **unlock** Levels, Rewards and Benefits.\n\n- `rewards` is a **catalog of unlockable benefits** (`database-entities.md`). A reward is unlocked when the subject reaches `unlock_level_id` or `unlock_min_points`. Unlocking is **computed**; there is no redemption row, no spendable balance and no \"spend points\" endpoint.\n- A `DEBIT` in the ledger only ever means a **penalty** or a **decrease of a computed score**. It never means spending.\n- **Profile Highlight** (`PROFILE_HIGHLIGHT`) is a reward benefit. It is **separate from Verification** and from **Featured / Promoted** paid placement: the API exposes it as its own `highlight` field with its own label. Unlock level, activation, duration and whether it affects ranking → **BQ-71**.\n- **Companies to Watch** is a discovery section, not a reward and not paid placement (criteria → BQ-70).\n- Level **benefits** (§9.1, RG-22) are also delivered as eligibility checks (e.g. `event_ticket_types.min_level_id`), without consuming points.\n- \"Coupons & perks\" (§6) belong to deferred **billing** (rules §11), not to points.\n\n## 12. Anti-abuse (§8.6)\n\n| PRD control | Implementation |\n|---|---|\n| Daily and weekly limits | `daily_cap` / `weekly_cap` on rule versions, enforced under the balance lock (§7) |\n| Unique events marked with a non-repeat key | `point_ledger.idempotency_key` UNIQUE; `reverses_entry_id` UNIQUE |\n| Detect mutual recommendations and linked accounts | ❓ RG-06. No recommendation feature exists. Linked-account signals (shared verified phone or email domain patterns, same device or anonymous id across accounts) → `engagement_alerts(LINKED_ACCOUNTS)` for review. **No automatic penalty** |\n| Fingerprints for images and projects | `media_assets.content_sha256` + `perceptual_hash`; `projects.fingerprint`. Duplicates across organizations → `engagement_alerts(DUPLICATE_MEDIA/DUPLICATE_PROJECT)`; points for the duplicate are held until reviewed |\n| Human review for upper levels | `level_assignments.status = PENDING_REVIEW` (§8) |\n| Alert on abnormal changes in points or visibility | Nightly `AnomalyDetectionJob`: z-score or threshold on daily delta per subject → `engagement_alerts` |\n| Appeal with a decision record | `appeals` (moderation) → `appeal.upheld` → reversal (T-09) |\n| Attendance-only points (§9.2, §20.2) | ACTIVITY event rules subscribe **only** to `event.attendance.verified` |\n| Owner/staff activity not inflating metrics (§16.1) | `analytics_events.is_internal` excluded from RECENT_ACTIVITY inputs derived from analytics |\n\n---\n\n## 13. Explainability and audit\n\n| Question | Answer from |\n|---|---|\n| \"Why does member X have 340 points?\" | `point_ledger` entries with rule code + version + source + reason |\n| \"Why did company Y's visibility drop last week?\" | Two `visibility_snapshots` compared by component |\n| \"What was the rule value on 2026-11-02?\" | `point_rule_versions` effective at that timestamp |\n| \"Who changed a rule, reversed an entry, froze a balance?\" | `audit_logs` (every admin engagement mutation) |\n\n---\n\n## 14. Testing checklist (§20.1, §20.2)\n\n- [ ] The same `event.attendance.verified` delivered twice → exactly one ledger entry\n- [ ] Registration without attendance → zero entries\n- [ ] Reversal of a reversal → rejected; reversing the same entry twice → rejected\n- [ ] Weekly cap reached → no entry beyond the cap; the next week earns again\n- [ ] Rule version changed → old entries keep their version; new entries use the new one\n- [ ] Balance projection equals `SUM(ledger)` after concurrent awards (parallel test)\n- [ ] Frozen subject → credits skipped\n- [ ] Paid subscription change → zero TRUST entries and no visibility component change\n- [ ] Level evaluation never reads verification state (BQ-07)\n- [ ] Company approval (T-29) produces no ledger entry; each approved signal produces exactly one TRUST entry (BQ-46, BQ-47)\n- [ ] No endpoint or service debits points for anything other than a penalty, reversal or score decrease (BQ-08)\n- [ ] Visibility snapshot reproducible from its components and formula version\n"},{"name":"api-map","title":"REST API Map","keywords":"rest endpoints routes api","markdown":"# REST API Map\n\n> Base path: **`/api/v1`**. Only endpoints backed by PRD requirements are listed. The phase is shown per group.\n> Permissions refer to the catalog in `auth-architecture.md` §2.2. `🔐` = requires MFA (`aal2`). `💳` = also requires an entitlement.\n> One API serves both the **web** and the **Flutter** clients (BQ-01). **Mandatory business rules:** `business-rules.md`. ⏸ = deferred endpoints, not built unless requested. Open contract decisions: JSON casing (TQ-05), pagination (TQ-06), envelope (TQ-07).\n\n---\n\n## 1. Conventions\n\n### 1.1 Access levels\n\n| Symbol | Meaning |\n|---|---|\n| **Public** | No token. Returns only public data. Rate-limited per IP |\n| **Auth** | Valid token, account ACTIVE, registration complete |\n| **Individual** | Auth + `account_type = INDIVIDUAL` (separate security context, BQ-60) |\n| **Company** | Auth + `account_type = COMPANY` (separate security context, BQ-60) |\n| **Auth⁰** | Valid token; onboarding may be incomplete |\n| **Self** | Auth + the resource belongs to the caller |\n| **Org** | **Company** + `:organizationId` is the caller's own company (`organizations.account_user_id = caller`, BQ-68) + the resource belongs to that company. The Company Account holds all company permissions; there are no roles |\n| **Staff:`perm`** 🔐 | Platform role with `perm` + `aal2` |\n\n### 1.2 URL shapes\n\n```text\n/api/v1\n├── /me/...                                 the caller's own resources\n├── /companies, /professionals, /events,\n│   /opportunities, /news, /pages, /...     public read models\n├── /organizations/:organizationId/...     company-scoped management (every organization is a company, BQ-06)\n├── /admin/...                              staff back office (🔐)\n└── /webhooks/...                           signed inbound provider callbacks\n```\n\n### 1.3 Response and error format (proposal, TQ-05/06/07)\n\n```jsonc\n// 200 collection\n{ \"data\": [ ... ], \"meta\": { \"next_cursor\": \"eyJpZCI6...\", \"has_more\": true } }\n\n// 200 single\n{ \"data\": { ... } }\n\n// 4xx / 5xx   (fits the existing frontend parser: root-level message + errors map)\n{\n  \"code\": \"VALIDATION_FAILED\",          // stable machine code (clients localise, TQ-26)\n  \"message\": \"Validation failed\",       // English, for logs/devs only\n  \"trace_id\": \"01J9...\",                // §15.1 trace id, never sensitive details\n  \"errors\": { \"trade_name_en\": [\"must be at most 200 characters\"] }\n}\n```\n\n| HTTP | When |\n|---|---|\n| 400 | Malformed request |\n| 401 | Missing or invalid token |\n| 403 | Authenticated but not permitted (`FORBIDDEN`, `MFA_REQUIRED`, `REGISTRATION_REQUIRED`, `WRONG_ACCOUNT_CONTEXT`, `ACCOUNT_SUSPENDED`, `ENTITLEMENT_REQUIRED`) |\n| 404 | Not found **or belongs to another organization** (no existence leak) |\n| 409 | State conflict (`INVALID_STATE_TRANSITION`, `DUPLICATE_ORGANIZATION`, `CAPACITY_FULL`, `COMPANY_ALREADY_LINKED`, `COMPANY_NOT_VERIFIED`, `APPROVAL_PENDING`) |\n| 422 | Validation failed (the frontend maps 422 → validation) |\n| 429 | Rate limited |\n\n### 1.4 Cross-cutting headers\n\n| Header | Purpose |\n|---|---|\n| `Authorization: Bearer \u003csupabase access token>` | Authentication |\n| `Accept-Language: ar \\| en` | Locale for server-rendered text (notifications, PDFs); JSON carries both `_ar`/`_en` fields |\n| `Idempotency-Key` | **Required** on payment, check-in and point-adjustment calls (§15.1), and accepted everywhere a POST creates something |\n| `X-Request-Id` | Optional client correlation id; echoed as `trace_id` |\n| `X-Anonymous-Id` | Analytics visitor id (§16.1) on public endpoints |\n\n### 1.5 Pagination\n\nCursor-based on public and user lists (stable under inserts, §15.1): `?limit=20&cursor=…`. Admin tables may use `?page=&page_size=`. Maximum `limit` = 100.\n\n---\n\n## 2. Identity & onboarding (Phase 1)\n\nAuthentication itself happens against **Supabase Auth** from the web or mobile client (ADR-003): sign-up with email or phone **and password**, one-time code confirmation, password sign-in, password recovery by one-time code, refresh and MFA challenge (BQ-30). The endpoints below are the backend's side.\n\n| Method | Path | Access | Description | PRD |\n|---|---|---|---|---|\n| GET | `/me` | Auth⁰ | Current user; creates the `users` row on first call; includes `onboarding_required` | AUTH-01 |\n| PATCH | `/me` | Auth⁰ | Locale, timezone | §14.1 |\n| POST | `/registration/individual` | Auth⁰ | Individual flow: full name, consents, basic profile → `account_type = INDIVIDUAL` (T-25) | §5.1, BQ-60 |\n| POST | `/registration/company` | Auth⁰ | Company flow: company names, `company_types[]` (one or more, BQ-61), `industry_ids[]` (one or more, BQ-63), contact, consents → `account_type = COMPANY` + DRAFT company with `account_user_id` = this account (T-25, T-02). For an imported company, register then claim (§5.2) | §5.3, BQ-60 |\n| GET | `/me/consents` | Auth⁰ | Current consent state | §5.1, §18 |\n| PUT | `/me/consents/:purpose` | Auth⁰ | Give or withdraw consent (append-only) | §18 |\n| DELETE | `/me/sessions` | Auth⁰ | Terminate **all** sessions | AUTH-02 |\n| GET | `/me/company` | Company | The caller's single company (BQ-68) | BQ-68 |\n| GET | `/me/company-memberships` | Individual | Companies the individual is a member of (no permissions) | BQ-68 |\n| DELETE | `/me/company-memberships/:membershipId` | Individual | Leave a company | BQ-68 |\n| — | `/me/data-export`, `/me/deletion-request` | Self | **Later** (AUTH-06, RG-17) | AUTH-06 |\n\n**Admin: users**\n\n| Method | Path | Access | Description |\n|---|---|---|---|\n| GET | `/admin/users` | Staff:`admin.users.manage` | Search users (§13) |\n| GET | `/admin/users/:userId` | Staff:`admin.users.manage` | Detail + memberships + roles |\n| POST | `/admin/users/:userId/suspend` | Staff:`admin.users.manage` | `reason` required; revokes sessions |\n| POST | `/admin/users/:userId/reinstate` | Staff:`admin.users.manage` | |\n| POST | `/admin/users/:userId/sessions/revoke` | Staff:`admin.users.manage` | |\n| — | `/admin/users/:userId/merge` | — | **Not designed** (RG-07) |\n\n## 3. Company members, invitations, staff roles (Phase 1)\n\nA company has **one user — its Company Account**. Members are **Individual accounts** with no company permissions (BQ-68). How members join → **BQ-75**; the invitation routes below are the candidate flow.\n\n| Method | Path | Access | Rules | Source |\n|---|---|---|---|---|\n| GET | `/organizations/:organizationId/members` | Org | All members incl. hidden, with `show_on_company_profile` | BQ-64, BQ-68 |\n| PATCH | `/organizations/:organizationId/members/:memberId` | Org | `{ show_on_company_profile }` — public visibility only | BQ-64 |\n| DELETE | `/organizations/:organizationId/members/:memberId` | Org | Remove member (membership → REMOVED) | BQ-68 |\n| GET / POST | `/organizations/:organizationId/invitations` | Org | Invite a person by `email\\|phone` (no role) — candidate flow, BQ-75 | BQ-75 |\n| DELETE | `/organizations/:organizationId/invitations/:invitationId` | Org | Revoke | BQ-75 |\n| GET | `/invitations/:token` | Auth⁰ | Preview (company name) | BQ-75 |\n| POST | `/invitations/:token/accept` | Individual | Caller's verified email or phone must match; creates a membership (T-05) | BQ-75 |\n| PUT | `/admin/organizations/:organizationId/owner` | Staff:`admin.organizations.manage` | Admin ownership flow: link the company to another Company Account (T-30, BQ-56) | BQ-69 |\n| GET | `/admin/staff-roles` | Staff:`admin.staff_roles.manage` | | §3 |\n| POST | `/admin/staff-roles` | Staff:`admin.staff_roles.manage` | `user_id`, `role`, `reason` (staff account type → BQ-68) | §3, §18 |\n| DELETE | `/admin/staff-roles/:grantId` | Staff:`admin.staff_roles.manage` | `reason` | §18 |\n\n## 4. Profiles (Phase 1; public professionals Phase 3)\n\n| Method | Path | Access | Description | PRD |\n|---|---|---|---|---|\n| GET | `/me/profile` | Individual | Own individual profile (all sections) | §5.1 |\n| PATCH | `/me/profile` | Individual | Name, headline, summary, avatar, languages, `is_searchable`, section visibility | §5.1, §10.1 |\n| PUT | `/me/profile/skills` | Self | Replace skill set | §5.1 |\n| PUT | `/me/profile/locations` | Self | Replace cities | §5.1 |\n| GET | `/professionals` | Public | Search professionals (**Phase 3**) | §6 P3 |\n| GET | `/professionals/:slug` | Public | Public profile, privacy applied (**Phase 3**) | §10.1 |\n\n## 5. Taxonomy (Phase 1)\n\n| Method | Path | Access | Notes |\n|---|---|---|---|\n| GET | `/categories` | Public | Tree; `?include=services` |\n| GET | `/categories/:slug` | Public | SEO category page data |\n| GET | `/services` | Public | `?category=` |\n| GET | `/locations` | Public | `?type=REGION\\|CITY&parent=` |\n| GET | `/locations/:slug` | Public | SEO city page data |\n| GET | `/skills` | Public | `?q=` |\n| GET | `/industries` | Public | Industry list (BQ-63) |\n| POST / PATCH | `/admin/categories[/:id]`, `/admin/services[/:id]`, `/admin/locations[/:id]`, `/admin/skills[/:id]` | Staff:`taxonomy.manage` | Deactivate instead of DELETE |\n\n## 6. Media & documents (Phase 1)\n\n| Method | Path | Access | Description | PRD |\n|---|---|---|---|---|\n| POST | `/uploads` | Auth | Request a signed upload: `purpose` (`ORGANIZATION_LOGO`, `PROJECT_MEDIA`, `VERIFICATION_EVIDENCE`, …), `mime_type`, `size_bytes`, `organization_id?` → `{ upload_id, upload_url, expires_at }`. Type and size limits per purpose | §18 |\n| POST | `/uploads/:uploadId/complete` | Self (uploader) | Starts the scan; returns asset or document id (status SCANNING) | §18 |\n| GET | `/uploads/:uploadId` | Self | Poll status (READY / REJECTED) | |\n| GET | `/documents/:documentId/access-url` | Auth + `DocumentAccessPolicy` | Short-lived (≤ 5 min) signed URL; **audited** | §18 |\n\n## 7. Companies: public directory & search (Phase 1)\n\n| Method | Path | Access | Description | PRD |\n|---|---|---|---|---|\n| GET | `/companies` | Public | Search: `q`, `company_type` (any of the company's types), `industry` (any, BQ-63), `category`, `service`, `city`, `coverage`, `verified`, `languages`, `certification`, `capacity`, `updated_within`, `sort=relevance\\|newest\\|most_complete`, cursor | §7.4 |\n| GET | `/companies/:slug` | Public | Public profile core: information, about, `company_type`, services, contacts (only PUBLIC fields). Other sections have **their own endpoints** so they evolve independently (rules §3). Verification (`is_verified`, `verification_signals`) and any future paid placement (`promotion`) are **separate fields** (rules §12) | ORG-10 |\n| GET | `/companies/:slug/opportunities` | Public | The company's published individual-facing opportunities | Rules §3 |\n| GET | `/companies/:slug/team` | Public | Individual members with `show_on_company_profile = true` (default); data from their Individual profiles (name, headline, avatar, profile link) | BQ-64, BQ-74 |\n| GET | `/companies/to-watch` | Public | **Companies to Watch**: admin picks + companies computed from activity, verification signals and completeness (BQ-70). Neutral section — **not paid**, **not** a verification statement, never labelled Featured | BQ-70 |\n| GET / POST / DELETE | `/admin/companies-to-watch[/:selectionId]` | Staff:`admin.organizations.manage` | Manage admin picks (`starts_at`, `ends_at`, `reason`); audited | BQ-70 |\n| GET | `/companies/:slug/projects` | Public | Published projects; client name only if disclosed | §7.3 |\n| GET | `/companies/:slug/projects/:projectId` | Public | Published company project (portfolio item) | §7.3, rules §4 |\n| POST | `/companies/:slug/contact-clicks` | Public | Logs `contact_clicked` (§16); returns contact value only if public | §16 |\n| GET | `/seo/sitemap-entries` | Public | Canonical URLs for approved companies, categories, cities, news (web client confirmed, BQ-01) | §7.4, §17 |\n| POST | `/analytics/events` | Public (rate-limited) | Batch: `profile_impression`, `profile_viewed`, … (§16 dictionary) | §16 |\n\n## 8. Organizations: management (Phase 1)\n\n| Method | Path | Access | Ownership / rules | PRD |\n|---|---|---|---|---|\n| POST | `/organizations/duplicate-check` | Auth | `legal_name`, `trade_name`, `cr_number`, `website` → candidate matches (public fields only) | §5.3, ORG-09 |\n| POST | `/organizations` | Auth | Only for a Company Account that has no company yet: creates the DRAFT company (normally done by `/registration/company`); a second company needs a second Company Account (BQ-68) → 409 `COMPANY_ALREADY_LINKED` | §5.3, BQ-05, BQ-49 |\n| POST | `/organizations/:organizationId/approval-requests` | Org | Submit the DRAFT for admin approval; mandatory fields checked (422); one open request (409 `APPROVAL_PENDING`) | BQ-05 |\n| GET | `/organizations/:organizationId/approval-requests` | Org | Request history with admin reasons | BQ-05 |\n| GET | `/organizations/:organizationId` | Org | Full record incl. private fields and status facts | ORG-01..10 |\n| PATCH | `/organizations/:organizationId` | Org | Not while SUSPENDED/ARCHIVED; updates `last_confirmed_at` | ORG-01..08 |\n| PUT | `/organizations/:organizationId/services` | Org | Replace set | ORG-03 |\n| PUT | `/organizations/:organizationId/coverage` | Org | Replace set | ORG-03 |\n| PUT | `/organizations/:organizationId/field-visibility` | Org | | ORG-10 |\n| GET / POST | `/organizations/:organizationId/contacts` | read_private / profile.update | | ORG-04 |\n| PATCH / DELETE | `/organizations/:organizationId/contacts/:contactId` | Org | | ORG-04 |\n| GET / POST | `/organizations/:organizationId/credentials` | read_private / profile.update | | ORG-05 |\n| PATCH / DELETE | `/organizations/:organizationId/credentials/:credentialId` | Org | Editing a verified credential clears `verified_at` | ORG-05 |\n| PUT | `/organizations/:organizationId/media` | Org | Gallery order | ORG-02 |\n| POST | `/organizations/:organizationId/confirm-data` | Org | \"Data is still accurate\": sets `last_confirmed_at`, clears NEEDS_UPDATE | ORG-08 |\n| POST | `/organizations/:organizationId/verification-requests` | Org | Opens **one signal** case: `ORGANIZATION_REGISTRATION`, `ORGANIZATION_DOMAIN`, `ORGANIZATION_CREDENTIAL` (+ `credential_id`) or `ORGANIZATION_CONTACT` (+ `contact_id`). Only for approved companies | §8.3, BQ-47 |\n| GET | `/organizations/:organizationId/verification-signals` | Org | Status of each signal (approved, in review, expired) | BQ-47 |\n| GET | `/organizations/:organizationId/correction-suggestions` | Org | | §4 |\n| POST | `/organizations/:organizationId/correction-suggestions/:id/accept` · `/dismiss` | Org | Accept applies the change through the normal update path | §4 |\n\n**Claims (§5.2)**\n\n| Method | Path | Access | Rules |\n|---|---|---|---|\n| POST | `/companies/:organizationId/claims` | Company | Organization must be UNCLAIMED; one open claim per claimant; creates claim + verification case (NOT_STARTED) |\n| GET | `/me/claims` | Self | |\n| GET | `/me/claims/:claimId` | Self | Status + applicant-visible decision reasons |\n\nEvidence upload and submission use the verification endpoints (§10).\n\n**Admin: organizations (§13)**\n\n| Method | Path | Access | Rules |\n|---|---|---|---|\n| GET | `/admin/organizations` | Staff:`admin.organizations.manage` or `verification.review` | Filters by status, approval, verification signals, staleness |\n| GET | `/admin/organization-approvals` | Staff:`organization.approval.decide` | Approval queue (`status=PENDING`, oldest first) |\n| POST | `/admin/organization-approvals/:approvalId/approve` · `/request-changes` · `/reject` | Staff:`organization.approval.decide` | Reason required for request-changes and reject; approve runs T-29 (publishes, no verification) |\n| GET | `/admin/organizations/:organizationId` | same | Full record + history |\n| POST | `/admin/organizations/:organizationId/suspend` · `/unsuspend` | Staff:`admin.organizations.manage` | `reason` |\n| POST | `/admin/organizations/:organizationId/archive` | Staff:`admin.organizations.manage` | `reason` |\n| POST | `/admin/organizations/:organizationId/correction-suggestions` | Staff:`organization.correction.suggest` | |\n| GET | `/admin/organization-merges` | Staff:`admin.organizations.manage` | Duplicate candidates (system-proposed + manual) |\n| POST | `/admin/organization-merges` | Staff:`admin.organizations.manage` | Propose `source`, `target` |\n| POST | `/admin/organization-merges/:mergeId/approve` · `/reject` | Staff:`admin.organizations.manage` | `reason`; approve runs T-03 |\n| PUT | `/admin/organizations/:organizationId/owner` | Staff:`admin.organizations.manage` | Replace the single owner (T-30); `user_id`, `reason`; audited. Owner-initiated transfer → BQ-56 |\n\n## 9. Projects (Phase 1)\n\n| Method | Path | Access | Rules | PRD |\n|---|---|---|---|---|\n| GET | `/organizations/:organizationId/projects` | Org | All statuses | §7.3 |\n| POST | `/organizations/:organizationId/projects` | Org | DRAFT | §7.3 |\n| GET | `/organizations/:organizationId/projects/:projectId` | Org | | |\n| PATCH | `/organizations/:organizationId/projects/:projectId` | Org | Not while IN_REVIEW (409); editing PUBLISHED → BQ-54 | §7.3 |\n| DELETE | `/organizations/:organizationId/projects/:projectId` | Org | DRAFT only (otherwise archive) | |\n| PUT | `/organizations/:organizationId/projects/:projectId/services` · `/media` | Org | | §7.3 |\n| POST | `/organizations/:organizationId/projects/:projectId
