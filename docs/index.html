mpetitor\n\n```text\nBEGIN\n  SELECT benchmark_sets WHERE organization_id=$org FOR UPDATE\n  active = members WHERE removed_at IS NULL\n  if adding and count(active) \u003c 3 → INSERT member            (initial selection, no rule)\n  if replacing:\n      last_change = MAX(added_at of members added after initial fill, removed_at)\n      assert last_change IS NULL OR now() - last_change >= 90 days   else 409 CHANGE_TOO_SOON\n      UPDATE old SET removed_at; INSERT new\n  assert competitor is a listed COMPANY ≠ own organization\n  INSERT audit_logs · outbox(benchmark.competitor_changed)\nCOMMIT\n```\n\n(Exact semantics of \"initial fill\" vs \"change\" → BQ-37.)\n\n### T-20 · Export (log before release)\n\n```text\nBEGIN\n  assert permission + entitlement quota (SELECT COUNT exports this period FOR UPDATE on a quota row)\n  INSERT data_exports (user, organization, purpose, format, filters, row_count, watermark_id)\n  INSERT audit_logs\nCOMMIT\nTHEN generate the file (job) with the watermark → store in private bucket → return a signed URL\n```\n\nThe export record **commits before** any data leaves the system, so every released file is traceable (§12.3, §20.2).\n\n---\n\n## Later\n\n### T-22 · Account deactivation (AUTH-06)\n\n```text\nBEGIN\n  SELECT users … FOR UPDATE\n  assert (COMPANY accounts) the account is not linked to a company (ownership flow first, T-30 / BQ-56)\n  UPDATE organization_members SET status=REMOVED\n  anonymise profiles, experiences, contact fields; keep ledger/audit rows (pseudonymous id)\n  UPDATE users SET status=DEACTIVATED, email=NULL, phone=NULL, deactivated_at\n  INSERT audit_logs · outbox(user.deactivated)\nCOMMIT\nAFTER COMMIT: delete/ban Supabase auth user; purge personal documents per retention\n```\n\n---\n\n## Operations that deliberately span multiple transactions\n\n| Flow | Why not one transaction | Consistency mechanism |\n|---|---|---|\n| Attendance → points | Different modules; points must not block check-in | Outbox + ledger idempotency key |\n| Verification approved → trust points | Same | Outbox + idempotency key |\n| Payment at gateway → webhook | External system | Pending subscription + webhook dedupe (T-14) |\n| Suspend user → Supabase ban | External call | Immediate DB-level block + retried outbox handler |\n| Search indexing | Projection | Outbox; full rebuild available |\n| Notifications | External delivery | Outbox + `notification_deliveries` retries |\n| Import commit | Size | Chunked transactions + batch status + rollback (T-21) |\n| Report generation | Duration | Report status machine; export log committed first (T-20) |\n"},{"name":"auth-architecture","title":"Authentication, Authorization & Trust Architecture","keywords":"authentication authorization permissions roles mfa jwt","markdown":"# Authentication, Authorization & Trust Architecture\n\n> PRD sources: §3 (user types), §4 (permission model), §5 (journeys), §7.1 AUTH-01..06, §12.3, §18.\n> Decisions: ADR-003 (Supabase Auth), ADR-004 (authorization model). Resolved 2026-09-15: BQ-01 (web + mobile), BQ-03, BQ-04 (one owner), BQ-05, BQ-06 (companies only), BQ-30 (OTP + password), BQ-48 (human verification), BQ-49. Open: TQ-01..04, BQ-29, BQ-51, BQ-56, BQ-58.\n\n---\n\n## 0. Six concerns that must never be mixed\n\nThis is the most important rule in the backend. Each concern has its **own tables, its own module and its own question**. None of them can stand in for another.\n\n```mermaid\nflowchart LR\n    subgraph AUTHN[\"Authentication\u003cbr/>\u003ci>Who are you?\u003c/i>\"]\n        A1[Supabase Auth\u003cbr/>OTP · password · MFA · sessions]\n        A2[users]\n    end\n    subgraph AUTHZ[\"Authorization\u003cbr/>\u003ci>What may you do?\u003c/i>\"]\n        B1[user_platform_roles]\n        B2[organization_members]\n        B3[organizations.account_user_id\u003cbr/>one Company Account per company]\n        B4[Permission catalog in code]\n    end\n    subgraph TRUST[\"Verification / Trust\u003cbr/>\u003ci>Can we trust this information?\u003c/i>\"]\n        C1[verifications]\n        C2[verified_at facts]\n        C3[TRUST point category]\n    end\n    subgraph VIS[\"Visibility\u003cbr/>\u003ci>How prominent is this profile?\u003c/i>\"]\n        D1[visibility_snapshots]\n        D2[search_documents.visibility_score]\n    end\n    subgraph PTS[\"Points\u003cbr/>\u003ci>What engagement value accumulated?\u003c/i>\"]\n        E1[point_ledger]\n        E2[point_balances]\n        E3[levels · badges]\n    end\n    subgraph MEM[\"Membership\u003cbr/>\u003ci>What has been paid for?\u003c/i>\"]\n        F1[subscriptions]\n        F2[entitlements]\n    end\n\n    AUTHN --> AUTHZ\n    TRUST -- \"trust score is an input\" --> VIS\n    PTS -- \"activity & contribution are inputs\" --> VIS\n    TRUST -- \"approved verification earns TRUST points\" --> PTS\n    MEM -. \"paid visibility shown as a LABEL only\u003cbr/>never enters trust or organic score\" .-> VIS\n```\n\n| Concern | Question | Source of truth | Owning module | Must NOT |\n|---|---|---|---|---|\n| **Authentication** | Who are you, and in which **account context** (INDIVIDUAL or COMPANY, separate security contexts, BQ-60)? | Supabase Auth + `users` | `identity` | Carry roles, organization or plan in the token |\n| **Authorization** | What are you allowed to do? | `user_platform_roles` (staff) and **the company's single Company Account** (`organizations.account_user_id`, BQ-68), code permission catalog. Memberships, ownership claims and classification never grant anything | `access` | Depend on verification level, points or plan to *grant roles* |\n| **Verification / Trust** | Can we trust this information? | `verifications` (+ `verified_at` facts on subjects) | `verification` | Be purchasable (§7.5, §8.1). Be granted by activity |\n| **Visibility** | How discoverable is this profile? | `visibility_snapshots` → `search_documents` | `engagement` (calculation), `search` (use) | Guarantee rank (\"a higher score does not guarantee first place\", §8.4) |\n| **Points** | What engagement value has accumulated? | `point_ledger` (append-only) | `engagement` | Stand in for trust (§8.1 \"activity ≠ trust\"). Be a mutable column |\n| **Membership** | What subscription and entitlements exist? | `subscriptions` → `entitlements` | `billing`, `entitlements` | Affect trust or organic ranking (§7.5) |\n\n### 0.1 Account contexts (BQ-60, BQ-68)\n\n```text\nINDIVIDUAL account ── own login ── individual profile · applications · events · points · rewards · company memberships (no permissions)\nCOMPANY account    ── own login ── exactly ONE company (organizations.account_user_id) ── all company actions\n                         ✗ no permission ever flows from one context to the other\n                         ✗ an individual member or employee of a company holds no company permission\n```\n\n- Every non-public route declares its context with `@AccountContext('INDIVIDUAL' | 'COMPANY')`; `AccountContextGuard` rejects the other type with 403 `WRONG_ACCOUNT_CONTEXT`.\n- Company routes additionally require `CompanyAccountGuard`: `:organizationId` must be the caller's company (`account_user_id = caller`), otherwise 404.\n- Profile Highlight (a reward), Companies to Watch (neutral discovery) and future Featured / Promoted (paid) never touch verification or authorization.\n\n**Where they meet.** Some checks combine several concerns, but each is evaluated independently:\n\n- *Publish a job* = **authorization** (`opportunity.manage` in the company). Whether it also requires **trust** (verified company) → BQ-62. Plan limits are future monetization (rules §11).\n- *Respond to a supplier request* = **authorization** (`supplier_response.submit` in the responding company). Company type is **not** a permission (rules §2).\n- *Read market reports* (§4) = **authorization** (member of the organization) **AND** **membership** (`reports.market` entitlement).\n\n---\n\n## 1. Authentication: \"Who are you?\"\n\n### 1.1 Recommendation (ADR-003, pending confirmation of TQ-01/TQ-02)\n\n**Supabase Auth authenticates. NestJS authorizes.**\n\n| PRD requirement | How Supabase Auth covers it | Backend responsibility |\n|---|---|---|\n| AUTH-01 register with email **or** phone + one-time code; no active account without verification. **Decision BQ-30: OTP + password** | `signUp` with email or phone **and a password**; identifier confirmed by a one-time code (`verifyOtp`) | Create the `users` row **only** from a confirmed identifier's token |\n| Sign-in (BQ-30) | `signInWithPassword` (email or phone). OTP-only sign-in → BQ-58 | — |\n| Password recovery (BQ-30) | `resetPasswordForEmail` / phone OTP → `updateUser({ password })` | Revoke all other sessions after a reset (security-and-audit §2) |\n| AUTH-02 secure login, session refresh, terminate all sessions | Short-lived access JWT + rotating refresh tokens; `signOut({ scope: 'global' })` | Reject tokens whose `session_id` no longer exists (§1.4); admin revocation endpoint |\n| AUTH-03 MFA mandatory for admin, reviewer, entities | TOTP MFA; the JWT carries `aal` (`aal1` / `aal2`) | **Enforce `aal2`** for staff roles (the roles live in *our* DB). \"Entities\" have no organization type any more → BQ-51 |\n| AUTH-04 password policy (passwords **are** used, BQ-30); block leaked passwords; attempt limits | Password strength settings, leaked-password protection, built-in rate limits | API rate limits (§5 of `security-and-audit.md`) |\n| AUTH-05 team invitations with role, duration, organization | — (not an auth concern) | `invitations` table in the `access` module |\n| AUTH-06 suspend, delete, export (later) | Admin API: ban user, delete user | Orchestrated by NestJS: anonymise app data, then ban or delete the auth user |\n| §18 log sign-ins | Auth audit log + auth hooks | Mirror important auth events into `audit_logs` |\n| Saudi SMS delivery | *Send SMS* auth hook | Hook → Saudi SMS provider (TQ-04) |\n\n**Why not custom NestJS auth?** Custom auth means building and securing OTP generation, rate limits, refresh-token rotation and reuse detection, TOTP enrolment and recovery, and leaked-password checks. This is security-critical code that adds nothing to Back Of House as a product. The main costs of Supabase Auth are vendor coupling and the need to confirm data residency (BQ-31). Both are recorded in ADR-003.\n\n**When custom auth would be the right call instead:** if BQ-31 requires personal data to stay in a region Supabase cannot serve, or if the chosen Saudi SMS provider cannot be integrated through the SMS hook.\n\n### 1.2 Identity model\n\n```text\nauth.users  (Supabase-managed, schema \"auth\")\n   │  id  ═══════════════ same UUID ═══════════════╗\n   │                                                ▼\n   │                                          app.users            (identity module)\n   │                                             │ 1:1\n   │                                             ▼\n   │                                          app.profiles          (profiles module)\n   │\n   ├── auth.sessions      ← session_id claim checked by NestJS\n   ├── auth.mfa_factors   ← aal claim\n   └── auth.identities    ← email / phone identities\n```\n\n- `app.users.id` **=** `auth.users.id`. No cross-schema FK (it would break Prisma shadow databases; ADR-007).\n- `app.users` copies only **verified** identifiers (`email`, `phone`, `*_verified_at`) from token claims on each sign-in. **Supabase remains the source of truth for credentials.**\n- Changing email or phone goes through Supabase (re-verification). NestJS updates its copy the next time it sees the token.\n\n### 1.3 Registration, sign-in and onboarding (§5.1, BQ-30, BQ-60)\n\nThe same flow serves the **web** and **Flutter** clients through one API (BQ-01). The user chooses **Individual** or **Company** at registration; each type has its own flow and data.\n\n```mermaid\nsequenceDiagram\n    autonumber\n    actor U as User (web or app)\n    participant SA as Supabase Auth\n    participant SMS as SMS/Email provider\n    participant API as NestJS API\n    participant DB as Postgres (app schema)\n\n    U->>SA: signUp(email or phone, password)\n    SA->>SA: password policy + leaked-password check (AUTH-04)\n    SA->>SMS: send one-time code (Send SMS hook for phone)\n    SMS-->>U: code\n    U->>SA: verifyOtp(code)\n    SA-->>U: access JWT (aal1) + refresh token\n    Note over SA: identifier confirmed.\u003cbr/>No app account yet (AUTH-01)\n\n    U->>API: GET /api/v1/me  (Bearer JWT)\n    API->>DB: UPSERT users (id = sub, confirmed email/phone)\n    API-->>U: 200 { registration_required: true }\n\n    alt Individual\n        U->>API: POST /api/v1/registration/individual { full_name, consents[], … }\n        API->>DB: TX (T-25): account_type=INDIVIDUAL · consents · profile · audit · outbox\n    else Company\n        U->>API: POST /api/v1/registration/company { company names, company_types[], industry_ids[], contact, consents[], … }\n        API->>DB: TX (T-25 + T-02): account_type=COMPANY · consents · DRAFT company with account_user_id = this account · audit · outbox\n    end\n    API-->>U: 200 me { account_type }\n    Note over U,API: The account type fixes the security context for this login (BQ-60).\u003cbr/>Type change, and one identifier holding both types → BQ-68\n```\n\n**Returning users** sign in with identifier + password (`signInWithPassword`). **Forgotten password:** a one-time code to the confirmed email or phone, then a new password; all other sessions are revoked. Whether a one-time code may also be used to sign in, or is required as a second step, is open → **BQ-58**. Social login is excluded (BQ-30).\n\n⚠️ The current Flutter app calls `/auth/register`, `/auth/login`, `/auth/forgot-password` and `/auth/reset-password` on the API, and `/auth/social` (TQ-02). With Supabase Auth, both clients call Supabase for credentials and NestJS for everything else; `/auth/social` is removed. If one API contract for both clients is preferred, NestJS can expose a thin `/auth/*` facade over Supabase (alternative in ADR-003).\n\n### 1.4 Authenticated request pipeline\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant C as Client\n    participant G1 as AuthGuard\n    participant G2 as UserStateGuard + AccountContextGuard\n    participant G3 as AssuranceGuard\n    participant G4 as PermissionGuard\n    participant S as Service (policy + query scope)\n    participant DB as Postgres\n\n    C->>G1: request + Bearer JWT\n    G1->>G1: verify signature (JWKS, cached), iss, aud=\"authenticated\", exp\n    G1->>DB: session_id still exists? (auth.sessions, 30 s cache)\n    G1->>DB: load users row (status, onboarding)\n    G1->>G2: RequestContext{ userId, sessionId, aal }\n    G2->>G2: status = ACTIVE? registration done? account_type matches route context (INDIVIDUAL or COMPANY)?\n    G2->>G3: ok\n    G3->>DB: load platform roles + memberships for route org (request-scoped cache)\n    G3->>G3: staff role in play → require aal = aal2\n    G3->>G4: ok\n    G4->>G4: @RequirePermission('organization.profile.update')\u003cbr/>org id taken from route :organizationId\n    G4->>S: ok (ActorContext attached)\n    S->>S: resource policy: row.organization_id == route org? state allows? conflict of interest?\n    S->>DB: query ALWAYS filtered by organization_id / owner (query-level enforcement, §4)\n    S-->>C: response shaped by visibility rules\n```\n\n| Token claim used | Purpose |\n|---|---|\n| `sub` | User id |\n| `session_id` | Session revocation check (AUTH-02 \"terminate all sessions\"; admin suspend) |\n| `aal` | MFA assurance (AUTH-03) |\n| `email`, `phone`, `email_confirmed_at`/`phone_confirmed_at` | Refresh the verified identifier copy |\n| `exp`, `iss`, `aud` | Standard validation |\n\n**Deliberately not in the token:** platform roles, organization memberships, active organization, plan and entitlements. They change often, and **revocation must take effect on the next request**, not when the token expires (§12.3 automatic expiry, §18 periodic review). ADR-004.\n\n### 1.5 Sessions, refresh, revocation\n\n| Operation | Mechanism |\n|---|---|\n| Refresh | Client SDK refreshes against Supabase; NestJS is not involved |\n| \"Log out everywhere\" (AUTH-02) | Client `signOut({scope:'global'})`, or `DELETE /api/v1/me/sessions` → NestJS calls the Supabase admin API. Access tokens die on the next request because of the `session_id` check |\n| Admin suspends user | NestJS: `users.status = SUSPENDED` (immediate effect through `UserStateGuard`) + Supabase ban + session revocation + audit |\n| Access token lifetime | Short (recommend 10 minutes, set in the Supabase project) |\n\n### 1.6 MFA enforcement (AUTH-03)\n\n```mermaid\nsequenceDiagram\n    autonumber\n    actor R as Reviewer\n    participant SA as Supabase Auth\n    participant API as NestJS\n\n    R->>API: GET /api/v1/admin/verifications (JWT aal1)\n    API->>API: user holds VERIFICATION_REVIEWER → requires aal2\n    API-->>R: 403 { code: \"MFA_REQUIRED\" }\n    R->>SA: mfa.challenge + mfa.verify (TOTP)\n    SA-->>R: new JWT (aal2)\n    R->>API: GET /api/v1/admin/verifications (JWT aal2)\n    API-->>R: 200\n```\n\nRules:\n- **Staff roles** (all four `PlatformRole` values): `aal2` is required on every `/admin/*` route.\n- **Entities** (AUTH-03): there are no entity organizations since every organization is a company (BQ-06). MFA for buyer features is decided with **BQ-51**.\n- Granting a staff role to a user **without** an enrolled MFA factor is allowed, but the role cannot be used until enrolment is done.\n- Whether **company owners** also need MFA is not stated (AUTH-03 names only admins, reviewers and entities). Not enforced; passwords are always required (BQ-30).\n\n---\n\n## 2. Authorization: \"What are you allowed to do?\"\n\n### 2.1 Model (§4 \"RBAC with the ability to scope a permission to a specific organization or entity\")\n\n```text\n                        ┌──────────────────────────────┐\n                        │  PERMISSION CATALOG (code)   │  permissions.ts — versioned in git,\n                        │  'organization.profile.update'│  covered by positive & negative tests (§20.1)\n                        └──────────────┬───────────────┘\n                     role → permissions│mapping (code)\n            ┌──────────────────────────┴──────────────────────────┐\n            ▼                                                     ▼\n   PLATFORM SCOPE (staff)                              COMPANY CONTEXT (company context only)\n   user_platform_roles                                 organizations.account_user_id — one Company Account per company\n   VERIFICATION_REVIEWER · CONTENT_MODERATOR           the company's single Company Account\n   SYSTEM_ADMIN · AUDITOR                              no roles, no delegation (BQ-68)\n            │                                                     │\n            ▼                                                     ▼\n   applies platform-wide                               applies ONLY inside organization_id\n```\n\nRoles and their permission sets are **defined in code**, not in database tables (ADR-004). The PRD does not require administrators to define roles at runtime. Keeping them in code makes the matrix reviewable, type-checked and testable. Staff role **assignments** are data; company access is the `account_user_id` link (BQ-68).\n\n### 2.2 Permission catalog\n\nLegend: ✅ granted by role · 💳 also requires an entitlement (deferred) · 🔐 requires `aal2` · ❓ not defined in PRD (proposed default, question ID)\n\n#### Company context permissions (BQ-60, BQ-68)\n\nA company has **one user — its Company Account** — which holds **every** company permission below for **its own company** only. There are no OWNER / EDITOR / ANALYST roles and no delegation. Individual members and employees hold **none** of these. Company type and industries never add or remove a permission (BQ-61, BQ-63).\n\n| Permission (held by the Company Account for its own company) | Source | Phase |\n|---|---|---|\n| `organization.profile.read_private` / `organization.profile.update` | §4 \"Edit company profile\" | 1 |\n| `organization.approval.submit` | BQ-05 | 1 |\n| `organization.verification.submit` (registration, domain, credential, contact signals) | §5.3, BQ-47 | 1 |\n| `organization.corrections.resolve` | §4 | 1 |\n| `organization.members.manage` (view all members, hide / show on public profile, remove) — no permission effect | BQ-64, BQ-68 | 1 |\n| `project.manage` (company projects / portfolio) | §7.3, rules §4 | 1 |\n| `opportunity.manage` (create, edit, publish, pause, close) | rules §9 | 3 |\n| `opportunity.applications.read` / `opportunity.applications.manage` (flexible statuses, BQ-67) | rules §8, §9 | 3 |\n| `supplier_response.submit` (any supplier request, no type restriction) | rules §7, BQ-66 | 3 |\n| Read supplier requests (any Company Account) | BQ-65 | 3 |\n| `organization.employment.confirm` | §10.1 | 3 |\n| `organization.reports.read`, `organization.benchmark.manage`, `organization.data.export` | §4, §11 | 4 |\n| `organization.billing.*`, `market.reports.read` (plan-based) | ⏸ deferred monetization | — |\n| Ownership change | Admin ownership flow only (T-30, BQ-56) | 1 |\n\nPRD §4 role columns (owner, editor, analyst, delegation) are superseded (inconsistency I-10).\n\n#### ~~Organization-scoped: institution roles~~ — removed (BQ-06)\n\nEvery organization is a company, so the §12.1 institution roles (BUYER, READER, AUDITOR) and the `institution.*` permissions are **not in the catalog**. How buyer features (§5.4, §12) will be granted — for example to company roles or through a plan entitlement — is decided with **BQ-51**.\n\n#### Platform-scoped: staff roles (§3, §4, §13) · 🔐 all\n\n| Permission | REVIEWER | MODERATOR | ADMIN | AUDITOR | Source |\n|---|---|---|---|---|---|\n| `verification.review` (decide cases — always a person in Phase 1) | ✅ | — | ✅ | — | §4 \"Approve profiles\", BQ-48 |\n| `organization.approval.decide` (approve, request changes, reject new companies) | — | — | ✅ | — | BQ-05 |\n| `documents.access` (signed URL; audited) | ✅ (own queue) | — | ✅ | — | §18 |\n| `organization.correction.suggest` | ✅ | — | ✅ | — | §4 \"suggest correction\" |\n| `project.review` | ✅ ❓ | ✅ ❓ | ✅ | — | §13, §23 (BQ-39) |\n| `market.reports.read` | ✅ (read) | — | ✅ | — | §4 |\n| `content.manage` | — | ✅ | ✅ | — | §3 |\n| `taxonomy.manage` | — | ✅ | ✅ | — | §3 \"classifications\" |\n| `moderation.reports.handle` | — | ✅ | ✅ | — | §3 \"reports/flags\" |\n| `admin.users.manage` (suspend, revoke sessions) | — | — | ✅ | — | §13 |\n| `admin.organizations.manage` (suspend, archive, merge, replace owner) | — | — | ✅ | — | §13, BQ-56 |\n| `admin.staff_roles.manage` | — | — | ✅ | — | §3 \"permissions\" |\n| `admin.imports.manage` | — | — | ✅ | — | §22 |\n| `admin.billing.manage` (plans, coupons, exemptions) | — | — | ✅ | — | §13 · P2 |\n| `admin.points.manage` (rules, reversals, freezes) | — | — | ✅ | — | §13 · P2 |\n| `admin.events.manage` (incl. check-in) | — | — | ✅ ❓ | — | §13 · P2 (BQ-17) |\n| `admin.opportunities.moderate` | — | ✅ ❓ | ✅ | — | §13 · P3 |\n| `admin.reports.manage` | — | — | ✅ | — | §13 · P4 |\n| `admin.data.export` (monitored) | — | — | ✅ | — | §4 \"admin: monitored\" |\n| `audit.read` | — | — | ✅ | ✅ | §3 auditor |\n\nUnless marked ❓, `SYSTEM_ADMIN` holds every platform permission. `AUDITOR` is **read-only**: it holds no mutation permission at all.\n\n### 2.3 Enforcement layers\n\n| # | Layer | Where | Example |\n|---|---|---|---|\n| 1 | Authentication | `AuthGuard` (global) | Invalid or expired JWT → 401 |\n| 2 | Account state | `UserStateGuard` (global) | Suspended → 403 `ACCOUNT_SUSPENDED`; registration not completed → 403 `REGISTRATION_REQUIRED` |\n| 2b | Account context | `AccountContextGuard` + `@AccountContext()` (BQ-60); `CompanyAccountGuard` checks `account_user_id` on company routes (BQ-68) | Individual token on `/organizations/:id/*` → 403 `WRONG_ACCOUNT_CONTEXT`; Company token applying to a job → 403 `WRONG_ACCOUNT_CONTEXT` |\n| 3 | Assurance | `AssuranceGuard` (global) | Staff route with `aal1` → 403 `MFA_REQUIRED` |\n| 4 | Permission | `PermissionGuard` + `@RequirePermission()` | Staff permission checks; Individual member calling a company route → 403 `WRONG_ACCOUNT_CONTEXT` |\n| 5 | Entitlement | `@RequireEntitlement('reports.market')` or service check | No plan → 402-style `ENTITLEMENT_REQUIRED` (sent as 403) |\n| 6 | Resource policy | Domain service (`*Policy` classes) | Project belongs to another organization → 404; edit while IN_REVIEW → 409; reviewer deciding their own claim → 403 |\n| 7 | Query scoping | Repository signatures require `organizationId` / `ownerUserId` | `projectsRepo.findForOrganization(orgId, projectId)`, never `findById(projectId)` on tenant routes |\n| 8 | Response shaping | Serializers + `search_documents` | Private fields, internal notes and undisclosed client names are never serialised to public DTOs |\n\n**Rules**\n- **Deny by default.** A controller route with no `@Public()` and no `@RequirePermission()` fails a startup check.\n- **404 rather than 403** when a resource exists in *another* organization, so ids cannot be probed.\n- **Frontend hiding is not a control** (§4). Every rule above is covered by negative tests (§20.1 \"negative permission tests\").\n\n### 2.4 Resource-level ownership rules\n\n| Resource | Owner concept | Rule |\n|---|---|---|\n| users / profiles / consents / experiences | `user_id` | Only the user (+ admin through dedicated admin routes) |\n| organizations and child tables | `organization_id` | Only the company's Company Account (`account_user_id`); members never |\n| projects | `projects.organization_id` | Must equal the route `:organizationId` |\n| verifications | `requested_by_user_id` / `on_behalf_of_organization_id` | Applicant reads their own case; reviewers read the queue; a reviewer cannot decide a case about themselves or an organization they belong to |\n| documents | `uploaded_by`, `organization_id`, linked verification | Signed URL only for the uploader, members of the owning organization with `organization.profile.read_private`, or reviewers of a linked case; every access audited |\n| applications | individual applicant / publishing company | Applicant, or the publishing company's Company Account |\n| supplier_responses | responding company / buyer company | The responding or the buyer company's Company Account; never other suppliers or individuals |\n| saved lists and notes (P4, BQ-51) | buyer company `organization_id` | **Never** exposed to the listed company |\n| rfi_recipients | recipient organization | The recipient company sees only its own row, never the other recipients |\n\n### 2.5 Admin authorization\n\n- All admin endpoints live under `/api/v1/admin/*` in **the owning module's** admin controller (e.g. `organizations/controllers/admin-organizations.controller.ts`).\n- Admin routes require a platform permission + `aal2`. **Every admin mutation requires a `reason`** and writes `audit_logs` in the same transaction.\n- Admins act **as themselves**. There is no impersonation feature (not in the PRD).\n\n---\n\n## 3. Verification / Trust: \"Can we trust this information?\"\n\n- A verification is **evidence-specific**: \"reviewing specific evidence without guaranteeing overall performance\" (§29.2 glossary).\n- **Company approval is not verification** (BQ-46). An admin approving a listing (BQ-05) publishes it; it checks no signal.\n- **Company verification is several independent signals** (BQ-47): commercial registration, website domain, each license/certification, each contact channel. Which signals make a company show as VERIFIED → BQ-53.\n- **Verified professional** = identity + experience verifications approved (§3). It is independent of points and levels (BQ-07).\n- In Phase 1 every verification decision is made by a `VERIFICATION_REVIEWER` or `SYSTEM_ADMIN` (BQ-48). Automated checks are hints only.\n- Trust is **derived** from approved verifications. It is represented as `verified_at` facts on subjects and as `TRUST` point entries (§8.2 identity 20, employer 25, organization confirmation 20; §8.3 organization trust ≤ 100, one rule per signal).\n- **Nothing in billing, points or events may create a verification or a TRUST ledger entry.** This is enforced by module boundaries: only the `verification` module emits `verification.approved`, and the TRUST point rules listen only to that event.\n- Details of cases, states and handlers: `enums-and-statuses.md` §3 and `domain-events.md`.\n\n## 4. Visibility: \"How discoverable is this profile?\"\n\n- The score comes from the formulas in §8.4. It is stored in `visibility_snapshots` and copied to `search_documents.visibility_score`.\n- It is **one ranking signal among several**. The search engine also applies relevance to specialty, city, language and availability (§8.4).\n- A **sponsored** or paid partner label is shown next to the result. It **does not** change `visibility_score` (§7.5, §8.3 \"separate\").\n\n## 5. Points: \"What engagement value has accumulated?\"\n\n- The ledger is the source of truth, and `point_balances` is a projection. Full design: `points-architecture.md`.\n- Points **never** grant authorization or verification (rules §10) and are **never spent** (BQ-08; \"Rewards\" meaning → BQ-59). Levels depend on points only, never on verification (BQ-07). A level may unlock *benefits* (§9.1). If a benefit needs a capability, it is modelled as an entitlement or eligibility rule (e.g. `event_ticket_types.min_level_id`), never as a role.\n\n## 6. Membership: \"What has been paid for?\" — ⏸ deferred (business rules §11)\n\n- No monetization is built now. When it is: `Featured` / `Sponsored` / `Promoted` stay separate from `Verified`, in data, API fields and UI (rules §12).\n\n- `subscriptions` hold the commercial relationship. `entitlements` hold the effective features and limits.\n- Feature checks call `EntitlementsService.check(subject, featureKey)`, which reads `entitlements` only.\n- Membership **never** grants a role (the plan's `team.max_members` *limits* invitations; it does not grant permissions).\n\n---\n\n## 7. Company context\n\nSee **`company-context.md`**: multi-organization membership, how the active organization is selected, owner vs member rules, and why the organization is never stored in the token.\n\n---\n\n## 8. What is explicitly out of scope\n\n| Item | Reason |\n|---|---|\n| Social login | Excluded by decision BQ-30 (OTP + password). Remove `/auth/social` from the app |\n| Admin impersonation | Not in the PRD. It would complicate auditing |\n| Custom runtime roles | Not in the PRD (ADR-004) |\n| API keys / partner OAuth | Phase 5 partner API (RG-19) |\n| Row Level Security as the authorization mechanism | App-layer authorization. RLS is a deny-all backstop only (ADR-007) |\n"},{"name":"company-context","title":"Account Contexts & Company Context","keywords":"multi-tenancy organization membership","markdown":"# Account Contexts & Company Context\n\n> PRD sources: §3 (company owner, team member), §4 (\"restrict a permission … enforced at server **and query** level\"), §5.2, §5.3, AUTH-05.\n> **Decisions applied (latest 2026-09-17):**\n> - **BQ-60:** Individual and Company accounts are separate security contexts.\n> - **BQ-68 / BQ-74:** a company has **exactly one user — the Company Account**. Members and employees have **Individual accounts**; their relation to the company is **membership only**.\n> - **Ownership** is created or changed only through the company creation / ownership flow and the admin rules (BQ-04, BQ-05, BQ-56).\n> - BQ-61 / BQ-63: company types and industries are classification only.\n> - BQ-64: members are shown on the public profile by default.\n>\n> Related: `auth-architecture.md`, `business-rules.md`, ADR-029, ADR-030. Open: **BQ-68** (remaining details), **BQ-75** (how individuals become members), **BQ-56** (ownership transfer flow), **BQ-57** (approval details).\n\n---\n\n## 1. What is decided\n\n| Rule | Source | Consequence |\n|---|---|---|\n| Only two account types: `INDIVIDUAL` and `COMPANY` | Rules §1 | `users.account_type`, chosen at registration |\n| Each account type has its own registration flow and data | BQ-60 | Individual registration vs company registration |\n| Individual and Company accounts are **separate security contexts** | BQ-60 | A token belongs to one account; company routes reject Individual tokens and vice versa |\n| **A company has exactly one user: its Company Account** | BQ-68 (2026-09-17) | `organizations.account_user_id` (unique). No company team logins, no company roles |\n| One Company Account manages exactly **one** company | BQ-68 | Unique `account_user_id`; a second company needs a second Company Account |\n| Employees and members are **Individual accounts** related to the company by **membership** | BQ-68, BQ-74 | `organization_members` = affiliation of INDIVIDUAL accounts; **grants no company permissions** |\n| Owning or belonging to a company as an individual grants **no** Company Account permissions | BQ-60 | Company permissions come only from being the company's Company Account |\n| **Ownership** is created or changed only by the company creation / ownership flow and admin rules | BQ-04, BQ-05, BQ-56 | Set by company registration (T-02) or an approved claim (T-01); changed only by the admin flow (T-30) |\n| The owner creates the company; an admin approves it | BQ-05 | `organization_approvals` (T-29) |\n| Members are shown on the public company profile by default; the company can hide specific members | BQ-64 | `organization_members.show_on_company_profile`; public display only |\n| Public team data comes from the members' **Individual profiles** | BQ-74 | Name, headline, avatar from `profiles`; no separate team data entry |\n| Company types (one or more) and industries (one or more) are classification only | BQ-61, BQ-63 | Never permissions, never verification |\n| Supplier requests are visible to and answered by Company Accounts only | BQ-65, BQ-66 | Individual context never sees them |\n\n## 2. Model\n\n```text\nINDIVIDUAL ACCOUNT (person)                                   COMPANY ACCOUNT (the company's single login)\n │  own login · own session · own token                         │  own login · own session · own token\n │                                                              │\n ├── individual profile                                         └── COMPANY (organizations.account_user_id = this account)\n ├── applications (JOB · CO_OP · VOLUNTEERING)                        ├── profile · types · industries · projects\n ├── events · points · levels · rewards                               ├── opportunities · applicants · supplier responses\n ├── experiences (employment history)                                 ├── approval requests · verification signals\n └── company memberships ──── member of ────────────────────────────► └── members (Individual accounts, shown/hidden publicly)\n       (affiliation only — grants NO company permissions)\n```\n\n```mermaid\nflowchart LR\n    subgraph IND[\"Individual security context\"]\n        IU[INDIVIDUAL account] --> IP[Individual profile]\n        IU --> AP[Applications]\n        IU --> MB[Company memberships\u003cbr/>affiliation only]\n    end\n    subgraph CMP[\"Company security context\"]\n        CU[COMPANY account\u003cbr/>the only company user] --> CO[Company\u003cbr/>account_user_id]\n        CO --> OP[Opportunities · applicants]\n        CO --> SR[Supplier responses]\n        CO --> TM[Members list\u003cbr/>show_on_company_profile]\n    end\n    MB -. appears in .-> TM\n    MB -. never grants permissions .-x CU\n```\n\n## 3. How the company context is selected\n\n**The Company Account acts on its own company.** Company routes keep the explicit id for clarity and auditing, and the id must be the caller's company:\n\n```text\n/api/v1/organizations/:organizationId/...     :organizationId = organizations.id WHERE account_user_id = caller\n/api/v1/me/company                            shortcut to the caller's company\n```\n\n| Option | Verdict | Reason |\n|---|---|---|\n| **A. Company id in the URL, checked against `account_user_id`** | ✅ **Chosen** | Explicit, stateless, auditable; an Individual token can never act on a company |\n| B. Company id or permissions in the JWT | ❌ | Stale until refresh |\n| C. Individual token + \"switch to company\" | ❌ | Would let the Individual context borrow company permissions (BQ-60) |\n\n## 4. How authorization checks company access\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant C as Client (company context)\n    participant AG as AccountContextGuard\n    participant CG as CompanyAccountGuard\n    participant S as ProjectsService\n    participant DB as Postgres\n\n    C->>AG: PATCH /organizations/ORG1/projects/P9 (COMPANY-account JWT)\n    AG->>AG: users.account_type = COMPANY? else 403 WRONG_ACCOUNT_CONTEXT\n    AG->>CG: ok\n    CG->>DB: SELECT id, status FROM organizations WHERE id=ORG1 AND account_user_id=$caller\n    alt not the caller's company\n        CG-->>C: 404 NOT_FOUND\n    else caller's company\n        Note over CG: memberships of Individual accounts are never read here (BQ-60)\n        CG->>S: update(actor, orgId=ORG1, projectId=P9, dto)\n        S->>DB: SELECT ... FROM company_projects WHERE id=P9 AND organization_id=ORG1\n        S->>DB: TX update + audit_logs + outbox\n        S-->>C: 200\n    end\n```\n\nGuarantees:\n1. **Context check.** Company routes require a COMPANY account; individual routes require an INDIVIDUAL account → 403 `WRONG_ACCOUNT_CONTEXT`.\n2. **Company match.** `organizations.account_user_id` must equal the caller → otherwise 404 (no id probing).\n3. **Resource belongs to the company.** Every repository method on a company route filters by `organizationId`.\n4. **No inheritance.** Memberships, employment or ownership claims made by Individual accounts are never consulted for company permissions.\n\n## 5. Members (Individual accounts)\n\n| Capability | Company Account | Member (Individual account) |\n|---|---|---|\n| See the member list (incl. hidden members) | ✅ | ❌ (sees only the public team) |\n| Hide or show a member on the public profile (BQ-64) | ✅ | ❌ (whether members can hide themselves → BQ-75) |\n| Remove a member | ✅ | — |\n| Leave the company | — | ✅ |\n| Manage company profile, opportunities, applicants, supplier responses | ✅ | ❌ **never** |\n\nHow an individual becomes a member (company invites, individual requests, or both; whether the company must confirm) → **BQ-75**. The invitation design below is kept as the candidate flow.\n\n**Invariants** (T-02, T-04, T-05, T-30):\n- `organizations.account_user_id` references a **COMPANY** account and is **unique** (one company per Company Account).\n- `organization_members.user_id` references an **INDIVIDUAL** account (service check + trigger).\n- Membership never changes `account_user_id`. Ownership changes only through T-01 (claim), T-02 (creation) or T-30 (admin ownership flow).\n\n## 6. Registration and ownership flows\n\n```mermaid\nflowchart TD\n    S[Sign up: email or phone + password\u003cbr/>OTP confirmation · BQ-30] --> T{Account type\u003cbr/>at registration}\n    T -- INDIVIDUAL --> I1[Individual registration\u003cbr/>profile · consents]\n    I1 --> I2[Individual context\u003cbr/>profile · applications · memberships]\n    T -- COMPANY --> C1[Company registration\u003cbr/>names · company types · industries · contact · consents]\n    C1 --> C2[T-02: DRAFT company\u003cbr/>account_user_id = this Company Account]\n    C2 --> C3[Admin approval · T-29] --> C4[Company context]\n    C1 -. imported company .-> CL[Claim §5.2 · T-01\u003cbr/>approved → account_user_id set]\n    ADM[SYSTEM_ADMIN ownership flow · T-30 · BQ-56] -. only way to change .-> C2\n```\n\n## 7. Where the context appears in each layer\n\n| Layer | Representation |\n|---|---|\n| JWT / session | Belongs to exactly one account; no company id, no permissions |\n| Account type | `users.account_type`, checked by `AccountContextGuard` |\n| Company access | `organizations.account_user_id = caller`, checked by `CompanyAccountGuard` |\n| Membership | `organization_members` (Individual accounts): public team display only |\n| Audit logs | `actor_user_id` + `organization_id` |\n| Row Level Security | ❌ Not used for tenancy (ADR-007) |\n\n## 8. Buyer and government entities — still on hold\n\nSupplier requests are B2B between Company Accounts (rules §7). Institutional workspaces for government entities (§12) remain on hold → **BQ-51**.\n"},{"name":"security-and-audit","title":"Security & Audit Architecture","keywords":"audit privacy pdpl uploads rate limit","markdown":"# Security & Audit Architecture\n\n> PRD sources: §4 (server- and query-level enforcement), §12.3 (usage limits), §15.1 (errors, idempotency, signed webhooks), §17 (non-functional), §18 (security, privacy, PDPL), §18.1 (data classification), §20 (security tests), §23.1 (incident priorities), §28 (Definition of Done: no sensitive data in logs).\n> This document **identifies** mechanisms and their phase. Mechanisms marked *later* are not built until needed.\n\n---\n\n## 1. Security layers\n\n```mermaid\nflowchart TB\n    subgraph Edge\n        CDN[CDN + WAF §19\u003cbr/>TQ-09]\n        TLS[TLS 1.2+ everywhere §18]\n    end\n    subgraph API[NestJS API]\n        RL[Rate limits]\n        HD[Security headers · CORS allow-list]\n        AUTH[AuthGuard · UserStateGuard · AssuranceGuard]\n        AZ[PermissionGuard · EntitlementGuard · resource policies]\n        VAL[DTO validation · size limits]\n        ERR[Error filter · no internals leaked §15.1]\n        LOG[Redacting logger §28]\n    end\n    subgraph Data\n        DB[(Postgres\u003cbr/>app role least privilege\u003cbr/>RLS deny-all backstop)]\n        ST[(Storage\u003cbr/>private buckets · signed URLs)]\n        AUD[(audit_logs append-only)]\n    end\n    subgraph Secrets\n        SM[Secrets manager §18\u003cbr/>never in repo or logs]\n    end\n    CDN --> TLS --> RL --> HD --> AUTH --> AZ --> VAL --> ERR\n    AZ --> DB & ST\n    AZ --> AUD\n    API -.-> SM\n    API --> LOG\n```\n\n---\n\n## 2. Authentication security\n\n| Control | Mechanism | Phase | PRD |\n|---|---|---|---|\n| No active account without verification | Supabase OTP; the `users` row is created only from a verified token | 1 | AUTH-01 |\n| OTP brute force | Supabase OTP rate limits + attempt limits; API throttles on `/me` bootstrap | 1 | AUTH-04 |\n| Session theft | Short access-token lifetime (10 min recommended); refresh-token rotation with reuse detection (Supabase); `session_id` checked on each request | 1 | AUTH-02 |\n| Terminate all sessions | `DELETE /me/sessions`; admin revocation | 1 | AUTH-02 |\n| MFA for sensitive roles | `aal2` enforced for staff roles. \"Entities\" (AUTH-03) depend on BQ-51 | 1 | AUTH-03 |\n| Password policy (passwords are used, BQ-30) | Minimum length, leaked-password protection, attempt limits (Supabase settings) | 1 | AUTH-04 |\n| Password recovery | One-time code to the confirmed email or phone; all other sessions revoked after a reset; identical responses whether or not the account exists | 1 | AUTH-02, AUTH-04, BQ-30 |\n| Token validation | Asymmetric JWT signing keys; JWKS cached; `iss`, `aud`, `exp` checked; HS256 shared secret not used | 1 | §18 |\n| Account enumeration | OTP request responses are identical whether or not the account exists (Supabase behaviour; verify configuration) | 1 | OWASP |\n| Sign-in logging | Supabase auth audit log + mirrored `audit_logs` entries for sign-in of staff users | 1 | §18 |\n\n## 3. Authorization security\n\n| Control | Mechanism |\n|---|---|\n| Deny by default | Startup check: every route has `@Public()` or `@AccountContext()` + `@RequirePermission()` where applicable |\n| Account context separation (BQ-60, BQ-68) | `AccountContextGuard`: Individual tokens never reach company routes and Company tokens never reach individual routes. `CompanyAccountGuard`: company routes only for the company's own Company Account (`account_user_id`). Members (Individual accounts) never gain company permissions. Negative tests for all directions |\n| Server- **and query-level** enforcement (§4) | Guards + repositories that require `organizationId` / owner id |\n| No id probing | Cross-organization access returns 404 |\n| Negative tests (§20.1) | `test/authz/` suite generated from the permission matrix: every role × every endpoint, **including the must-fail cases** |\n| Periodic access review (§12.3, §18) | Report of staff roles and company memberships with `last_reviewed_at`; automatic expiry job (never expires an owner) |\n| Conflict of interest | A reviewer cannot decide a case they requested or one about an organization they belong to |\n| Least privilege for staff | Four separate staff roles; `AUDITOR` read-only |\n\n---\n\n## 4. Sensitive operations and audit requirements\n\nEvery row below writes `audit_logs` **in the same transaction**. \"Reason\" = the caller must supply a free-text reason.\n\n| Area | Operation | Reason required | Extra | Phase |\n|---|---|---|---|---|\n| **Authentication** | Staff sign-in; sign-in failures above threshold | — | Mirrored from the auth provider | 1 |\n| | Revoke all sessions (self/admin) | admin: ✅ | | 1 |\n| **Accounts** | Suspend / reinstate user | ✅ | Sessions revoked | 1 |\n| | Account deletion / anonymisation | ✅ | Later (AUTH-06) | Later |\n| **Roles & permissions** (§18) | Grant / revoke staff role | ✅ | MFA of actor | 1 |\n| | Membership created / removed / public visibility changed | admin: ✅ | Memberships grant no permissions (BQ-68) | 1 |\n| | Permission grant / revoke (delegation) | — | | 1 |\n| | Invitation created / revoked / accepted | — | Invitee contact **masked** in `changes` | 1 |\n| **Company ownership** | Claim approved / rejected → owner granted | ✅ (reject) | Automated check results referenced | 1 |\n| | Company approval decision: approve / request changes / reject (T-29) | changes, reject: ✅ | Approval sets no verification (BQ-46) | 1 |\n| | Admin ownership flow (T-30) | ✅ | Old and new Company Account recorded; process BQ-56 | 1 |\n| | Companies to Watch admin picks (add / remove) | ✅ | Neutral, not paid (BQ-70) | 1 |\n| | Merge approved / executed | ✅ | Moved child counts | 1 |\n| | Suspend / unsuspend / archive organization | ✅ | | 1 |\n| **Verification** (§5.2) | Every decision (approve / request info / reject / expire) | reject, request-info: ✅ | `verification_decisions` also kept | 1 |\n| | **Access to a sensitive document** (signed URL issued) | — | `action = document.access` | 1 |\n| **Data changes** | Organization profile, contacts, credentials, visibility settings | — | Redacted before/after | 1 |\n| | Project review decisions | changes/reject: ✅ | | 1 |\n| | Taxonomy changes | — | | 1 |\n| | Import commit / rollback | — | Batch counts | 1 |\n| **Moderation** | Abuse report resolution; appeal decision | ✅ | | 1 |\n| **Billing** ⏸ deferred | Plan / feature changes; coupon creation; exemptions and manual grants; manual subscription approval; refunds | ✅ (exemption, grant, refund) | Amounts | 2 |\n| **Points** (§8.1, §13) | Rule version created; manual adjustment; reversal; freeze / unfreeze; level approval; ambassador assignment; badge award / revoke | ✅ (all manual) | Ledger itself is also immutable | 2 |\n| **Events** | Manual check-in; attendance removal | ✅ (removal) | | 2 |\n| **Opportunities** | Application status changes by the company; supplier response submit / withdraw; opportunity unpublish by staff | staff: ✅ | Company decides; platform never decides (rules §8) | 3 |\n| **Exports & reports** (§12.3) | Every export (organization, user, date, purpose, format, row count, watermark) | purpose: ✅ | `data_exports` + audit | 4 |\n| | Report regeneration | ✅ | | 4 |\n| **Buyer access log** (§12.1, on hold BQ-51) | Buyer user views a company profile / runs advanced search / exports | — | Scope RG-18; high volume → may go to a partitioned log | 4 |\n| **Admin** | Any `/admin/*` mutation not listed above | ✅ | | all |\n\n### 4.1 Audit record rules\n\n- **Immutable:** the app DB role has only `INSERT, SELECT` on `audit_logs`, `point_ledger`, `consents`, `verification_decisions` and `data_exports`. A trigger additionally raises on UPDATE or DELETE (defence in depth).\n- **Redaction:** `changes` never contains document contents, full phone numbers, full emails of third parties, tokens, or secrets. A shared `redact()` helper has a field deny-list, and unit tests cover it.\n- **Correlation:** `request_id` links the audit row to logs, the outbox event and the error response `trace_id`.\n- **Access:** `AUDITOR` and `SYSTEM_ADMIN` only, through `/admin/audit-logs` (which itself logs `audit.search` for auditor queries on personal data).\n- **Retention and scale:** monthly partitions once volume warrants; retention per BQ-33.\n\n---\n\n## 5. Rate limiting and abuse prevention\n\n| Surface | Limit (initial proposal) | Key | Phase |\n|---|---|---|---|\n| Auth OTP send/verify | Supabase project limits (tighten from defaults) | phone / email / IP | 1 |\n| Public search `GET /companies` | 60 / min | IP (+ anonymous id) | 1 |\n| Public profile views | 120 / min | IP | 1 |\n| `POST /analytics/events` | 30 batches / min, max 50 events per batch | anonymous id + IP | 1 |\n| Authenticated writes | 60 / min | user | 1 |\n| Claims, organization creation, abuse reports, appeals | 5 / hour | user | 1 |\n| Uploads | 30 / hour, size limits per purpose | user | 1 |\n| Document access URLs | 60 / hour | user | 1 |\n| Invitations | 50 / day per organization | organization | 1 |\n| Exports | Plan quota + monitoring (§4, BQ-38) | organization + user | 4 |\n| Webhooks | Signature required; unsigned → 401, counted | provider | 2 |\n\n**Anti-scraping (§2.2 \"no bulk download of personal data\", §12.3):** individuals' contact data is never in list responses; contact reveal is per profile, logged (`contact_clicked`) and rate-limited; cursor pagination with a maximum page size; no \"export all companies\" endpoint.\n\n**Directory integrity abuse:** duplicate detection (ORG-09), claim checks (§5.2), perceptual hashes (§8.6), abuse reports with SLA (§23), impersonation reports handled within 24 h.\n\n---\n\n## 6. Input validation\n\n| Layer | Rule |\n|---|---|\n| DTOs | `class-validator` with `whitelist: true, forbidNonWhitelisted: true` (unknown fields rejected); explicit max lengths on every string; UUID validation on ids |\n| Body size | Global JSON limit (e.g. 256 KB); uploads never go through the API (signed direct upload) |\n| Rich text (news/pages, descriptions) | Stored as Markdown or sanitised HTML allow-list; sanitised again on render by clients |\n| JSONB fields (`capacity`, `field_visibility`, `section_visibility`, `agenda`, `answers`) | Validated against a schema (zod) before persistence |\n| URLs (`website_url`, `official_url`, `external_url`) | `https` only; host validation; never fetched server-side without an SSRF guard (no server-side fetch planned) |\n| Search input | Parameterised queries only; `q` length ≤ 200; normalisation before `to_tsquery` (escape operators) |\n| Raw SQL | Only through Prisma tagged templates (`$queryRaw\\`…\\``); `$queryRawUnsafe` forbidden by lint |\n| Errors | Validation → 422 with field map; never echo stack traces or SQL (§15.1) |\n\n---\n\n## 7. File and document handling (§18)\n\n```mermaid\nsequenceDiagram\n    autonumber\n    actor U as User\n    participant API as media\n    participant ST as Supabase Storage\n    participant W as Worker (scan)\n    participant AV as Malware scanner (TQ-10)\n\n    U->>API: POST /uploads {purpose, mime_type, size_bytes}\n    API->>API: authorize purpose (e.g. org member for ORGANIZATION_LOGO)\u003cbr/>check type allow-list + size limit\n    API->>ST: create signed upload URL → quarantine/{uuid}\n    API-->>U: upload_url (short-lived)\n    U->>ST: PUT file (direct, not through the API)\n    U->>API: POST /uploads/:id/complete\n    API->>W: job scan(uploadId)\n    W->>ST: download from quarantine\n    W->>W: verify magic bytes = declared mime · compute sha256 (+ perceptual hash for images)\n    W->>AV: scan\n    alt clean\n        W->>ST: move → public-media/… or private-documents/…\n        W->>API: status READY · outbox media.ready\n    else infected / mismatch\n        W->>ST: delete\n        W->>API: status REJECTED · outbox media.rejected\n    end\n```\n\n| Rule | Detail |\n|---|---|\n| Buckets | `quarantine` (private, 24 h lifecycle), `public-media` (public read: logos, covers, published project media), `private-documents` (**private**: CR, authorization letters, identity evidence, invoices), `reports` (private, Phase 4) |\n| Type allow-lists | Images: JPEG, PNG, WebP. Documents: PDF, JPEG, PNG. Video: MP4 (or external links). SVG **not accepted** (script risk) |\n| Size limits | Images ≤ 5 MB; documents ≤ 10 MB; video ≤ 100 MB (or external link only; decide) |\n| Metadata stripping | EXIF removed from public images (location privacy) |\n| Private access | Only through `GET /documents/:id/access-url`: authorization via `DocumentAccessPolicy`, URL lifetime ≤ 5 min, **audited** |\n| Public media for unpublished entities | Stored in `public-media` under unguessable UUID paths. Stricter isolation would require private storage until publish (decide per purpose) |\n| Encryption | At rest by the storage provider; app-level envelope encryption for identity documents → TQ-11 |\n| Retention | `documents.retention_until`; purge job deletes the object and marks the row DELETED (BQ-33) |\n\n---\n\n## 8. Data privacy (PDPL, §18, §18.1)\n\n### 8.1 Classification applied\n\n| Class | Examples in this schema | Handling |\n|---|---|---|\n| **Public** | Organization names, services, coverage, published projects (without undisclosed client), public contacts, published content | May be indexed (`search_documents`), cached, shown to visitors |\n| **Internal** | Detailed point entries, internal notes, verification internal notes, engagement alerts, admin dashboards | Staff with permission only; never in public DTOs |\n| **Confidential** | Commercial registration documents, authorization letters, invoices, payment references | Private bucket, signed URLs, access audited, minimum staff |\n| **Personal** | User email and phone, identity evidence, experiences, applications, messages, analytics linked to a user | Purpose + consent + data-subject rights; masked in logs; not bulk-exportable |\n| **Aggregated** | Metric facts for benchmarks, market reports | Minimum sample 5 (§11.3), minimum event thresholds, no re-identification |\n\n### 8.2 Privacy controls\n\n| Requirement (§18) | Implementation |\n|---|---|\n| Legal basis and purpose per data category; minimisation | Data dictionary annotates each column's class and purpose (Phase 0 deliverable); DTOs expose only what the purpose needs |\n| Consent and preferences (§5.1) | `consents` append-only with policy version; analytics linking only after consent (§16.1) |\n| Encryption in transit and at rest | TLS; Supabase disk encryption; private storage |\n| Short-lived access links for sensitive documents | ≤ 5 min signed URLs |\n| Rights: access, correction, objection, deletion (§18 retention and rights policy) | AUTH-06 **later**: export and anonymisation workflows; correction through normal edits; objection through `appeals` / support |\n| Individuals' contact data not shown without a legal basis or consent (§12.3) | Contact fields are not part of public or institution DTOs unless the user made them public |\n| Unique visitors without aggressive fingerprinting (§16.1) | Random time-limited anonymous id; no device fingerprinting |\n| No sale or bulk download of personal databases (§2.2) | No such endpoints; export API excludes personal data of individuals |\n| Client names | Never exposed unless DISCLOSED/CONFIRMED (§7.3, §27) |\n| Logs | Pino redaction paths: `authorization`, `cookie`, `password`, `token`, `email`, `phone`, `*.document*`; request bodies not logged by default (§28) |\n\n---\n\n## 9. Secrets and configuration\n\n| Rule | Detail |\n|---|---|\n| Storage | Hosting platform secrets manager (TQ-09); local `.env` git-ignored; `.env.example` committed without values |\n| Supabase `service_role` key | **Server only.** Used just for the admin auth API and storage admin operations; never sent to clients; never used for DB queries (Prisma uses the dedicated DB role) |\n| Rotation | DB passwords, provider API keys and webhook secrets rotatable without a deploy (read at boot, restart) |\n| Validation | Boot fails if a required secret is missing (config schema) |\n| CI | Secret scanning (e.g. gitleaks) on every push |\n\n---\n\n## 10. Webhooks and idempotency (§15.1)\n\n| Direction | Control |\n|---|---|\n| Inbound (payment gateway, SMS delivery receipts) | Verify signature and timestamp tolerance; store in `payment_provider_events` with a unique provider event id; process in a transaction; respond 2xx only after persisting |\n| Outbound (Phase 5 partners) | HMAC-SHA256 signature + timestamp + event id; retries with backoff (TQ-24) |\n| Client idempotency | `Idempotency-Key` required for payments, check-in and admin point adjustments; stored response replayed for 24 h (TQ-21) |\n\n---\n\n## 11. Security testing and operations\n\n| Activity | When | PRD |\n|---|---|---|\n| Negative authorization tests | Every PR (CI) | §20.1 |\n| Dependency and vulnerability scanning (`npm audit` / Dependabot / Snyk) | Every PR + weekly | §18 OWASP |\n| Static analysis (ESLint security rules, no `$queryRawUnsafe`) | Every PR | §18 |\n| Upload tests (malware sample EICAR, type spoofing, oversize) | Before Phase 1 launch | §20.1 |\n| Rate-limit tests | Before Phase 1 launch | §20.1 |\n| Penetration test | Before the institutional launch (Phase 4) and after major changes | §18 |\n| Backup restore test | Quarterly | §17 |\n| Incident response plan (P1 immediate + executive escalation; P2 1 h; P3 1 business day) | Before production | §18, §23.1 |\n| Staff and institution account review | Periodic (cadence BQ-43) | §18 |\n\n---\n\n## 12. Deferred mechanisms (identified, not built yet)\n\n| Mechanism | Trigger to build |\n|---|---|\n| Redis / shared rate-limit store | More than one API instance (TQ-16) |\n| WAF rules beyond platform defaults | Public launch traffic patterns |\n| App-level document encryption | Before identity verification goes live (TQ-11) |\n| Institutional read-access logging at scale | Phase 4 (RG-18) |\n| DLP / watermark service for exports | Phase 4 (RG-27) |\n| Anomaly detection for points | Phase 2 |\n| Data-subject request automation | AUTH-06 (later) |\n"},{"name":"business-workflows","title":"Business Workflow Maps","keywords":"workflow lifecycle journey","markdown":"# Business Workflow Maps\n\n> Visual maps of the major workflows **supported by the PRD**. Every step cites its PRD source.\n> The state machines for each entity are in `enums-and-statuses.md`. The atomic operations (T-xx) are in `transaction-boundaries.md`.\n>\n> **Deliberately not drawn:** *points → rewards → redemption*. Points are never spent or redeemed, by decision BQ-08. The points workflow ends at levels, badges and visibility.\n\n---\n\n## 1. User lifecycle (§5.1, AUTH-01..06) · Phase 1\n\n```mermaid\nflowchart TD\n    A([Visitor · web or app]) --> B[Sign up: email or phone + password\u003cbr/>AUTH-01 · BQ-30]\n    B --> C{One-time code\u003cbr/>verified?}\n    C -- no --> B\n    C -- yes --> D[First API call\u003cbr/>users row created]\n    D --> E{Choose account type\u003cbr/>at registration · BQ-60}\n    E -- COMPANY --> CO[Company registration flow\u003cbr/>see §2.2 · separate security context]\n    E -- INDIVIDUAL --> F[Individual registration\u003cbr/>terms · consents · skills · cities · languages]\n    F --> G{Request identity /\u003cbr/>experience verification?}\n    G -- later / never --> H[Active member\u003cbr/>profile hidden until opted in]\n    G -- yes --> I[Verification case\u003cbr/>attach evidence]\n    I --> J{Reviewer decision}\n    J -- needs info --> I\n    J -- rejected --> H\n    J -- approved --> K[Verified identity / experience\u003cbr/>TRUST points in P2]\n    K --> H\n    H --> L{Profile searchable?\u003cbr/>privacy setting}\n    L -- yes --> M[Appears in search\u003cbr/>professionals: P3]\n    H -. joins a company as a member\u003cbr/>no company permissions · BQ-68 .-> N[Company membership\u003cbr/>shown on public team · BQ-64]\n    H -. admin .-> S[SUSPENDED] -. admin .-> H\n    H -. AUTH-06 later .-> X[DEACTIVATED\u003cbr/>anonymised]\n```\n\n| Step | Module | Transaction |\n|---|---|---|\n| Password sign-up, code confirmation, sessions, password recovery | Supabase Auth | — |\n| User row + individual or company registration | identity, profiles, organizations | T-25 (+ T-02 for companies) |\n| Verification | verification | T-06 |\n| Suspension | identity | T-26 |\n\n---\n\n## 2. Company lifecycle: overview (§5.2, §5.3, §7.2, §22, decisions BQ-04/05/46/47) · Phase 1 → 4\n\nThree separate tracks — **ownership**, **approval** and **verification** — never stand in for one another.\n\n```mermaid\nflowchart LR\n    subgraph ORIGIN[Origin]\n        IMP[Bulk import §22\u003cbr/>UNCLAIMED]\n        NEW[Owner creates company\u003cbr/>DRAFT · BQ-05]\n    end\n    subgraph OWN[Ownership · exactly one owner · BQ-04]\n        CLM[Claim §5.2\u003cbr/>reviewer decides → owner]\n        OWNNEW[Creator = owner]\n    end\n    subgraph APR[Approval · BQ-05]\n        ADM[Admin approves listing\u003cbr/>→ CLAIMED, public]\n    end\n    subgraph TRUST[Verification signals · BQ-47]\n        S1[Commercial registration]\n        S2[Website domain]\n        S3[Each license / certification]\n        S4[Each contact channel]\n        VER[VERIFIED rule · BQ-53]\n    end\n    subgraph PROFILE[Profile]\n        PRF[Profile fields ORG-01..10]\n        PRJ[Projects §7.3]\n        TEAM[Team · invitations AUTH-05]\n    end\n    subgraph GROWTH[Later phases]\n        SUB[Subscription P2]\n        PTS[Trust points per signal · visibility P2]\n        OPP[Opportunities P3]\n        RPT[Reports · benchmarks P4]\n    end\n\n    IMP --> CLM --> PRF\n    NEW --> OWNNEW --> PRF --> ADM\n    PRF --> PRJ\n    PRF --> TEAM\n    ADM --> S1 & S2 & S3 & S4\n    CLM --> S1\n    S1 & S2 & S3 & S4 --> VER\n    S1 & S2 & S3 & S4 --> PTS\n    ADM --> SUB --> RPT\n    VER --> OPP\n```\n\n### 2.1 Claim an existing company (§5.2)\n\n```mermaid\nsequenceDiagram\n    autonumber\n    actor U as Company representative\n    participant API as organizations\n    participant V as verification\n    participant R as Reviewer or admin\n    participant ACC as access\n    participant N as notifications\n\n    U->>API: search company · \"Do you represent this company?\"\n    U->>API: POST /companies/:id/claims {applicant_title, work_email}\n    API->>API: automated checks: CR · name · domain · contacts (hints only, BQ-48)\n    API->>V: open ORGANIZATION_CLAIM case\n    Note over API: analytics profile_claim_started\n    U->>V: attach CR + authorization letter · submit\n    V->>R: queue (SLA 2 business days, §23)\n    Note over R: a person always decides in Phase 1 (BQ-48)\n    alt approved\n        R->>V: approve\n        V->>API: ClaimVerificationHandler.onApproved (same TX, T-01)\n        API->>API: organizations.account_user_id = claimant Company Account (BQ-68)\n        API->>API: claimed_at · status → CLAIMED · audit\n        Note over API: no verification signal is set (BQ-46)\n        V-->>N: verification.approved / organization.claim.approved\n        N-->>U: \"You are now the owner — invite your team\"\n    else needs info\n        R->>V: request-info (reason)\n        V-->>N: notify → U responds → back to review\n    else rejected\n        R->>V: reject (reason)\n        V-->>N: notify U (appeal possible, BQ-41)\n    end\n```\n\n### 2.2 Add a new company: owner creates, admin approves (§5.3, BQ-05, BQ-46)\n\n```mermaid\nflowchart TD\n    A[COMPANY account registration · BQ-60] --> B[Duplicate check\u003cbr/>legal name · trade name · CR · domain]\n    B --> C{Likely duplicate?}\n    C -- yes --> D[Show candidates\u003cbr/>→ claim instead §5.2]\n    C -- no --> E[Create DRAFT · T-02\u003cbr/>account_user_id = this Company Account\u003cbr/>one company per Company Account · BQ-68]\n    E --> F[Company types and industries · BQ-61 · BQ-63\u003cbr/>services · contacts · cities · capabilities]\n    F --> G[Owner submits for approval\u003cbr/>organization_approvals PENDING]\n    G --> H{SYSTEM_ADMIN decision · T-29}\n    H -- request changes --> F\n    H -- rejected --> R[REJECTED · resubmission BQ-57]\n    H -- approved --> I[Listing published · CLAIMED\u003cbr/>no verification signal set · BQ-46]\n    I --> J[Owner requests verification signals\u003cbr/>each reviewed separately · BQ-47]\n    I --> K[Plan features · Phase 2]\n```\n\n### 2.3 Keep company data fresh (ORG-05, ORG-08)\n\n```mermaid\nflowchart LR\n    J1[[Daily job]] --> K1{Credential expiring\u003cbr/>within N days?}\n    K1 -- yes --> N1[Notify owner]\n    J1 --> K2{Credential expired?}\n    K2 -- yes --> S1[Clear verified_at\u003cbr/>recalculate status]\n    J1 --> K3{last_confirmed_at older\u003cbr/>than threshold BQ-20?}\n    K3 -- yes --> S2[VERIFIED → NEEDS_UPDATE\u003cbr/>notify owner]\n    S2 --> O[Owner updates or\u003cbr/>confirms data] --> S3[→ VERIFIED]\n```\n\n### 2.4 Duplicate merge (ORG-09, §22.1)\n\n```mermaid\nflowchart LR\n    D1[Import preview or\u003cbr/>nightly similarity job] --> D2[organization_merges\u003cbr/>PROPOSED + signals]\n    D2 --> D3{Admin decision\u003cbr/>with reason}\n    D3 -- reject --> D4[REJECTED\u003cbr/>not duplicates]\n    D3 -- approve --> D5[T-03 one transaction:\u003cbr/>move memberships, projects,\u003cbr/>claims, subscriptions…\u003cbr/>source → ARCHIVED\u003cbr/>merged_into set · audit]\n    D5 --> D6[Search reindex\u003cbr/>redirect old slug]\n```\n\n---\n\n## 3. Project lifecycle (§7.3) · Phase 1\n\n```mermaid\nflowchart TD\n    A[Owner/editor creates DRAFT] --> B[Mandatory fields:\u003cbr/>name · type · city · date · role · scope]\n    B --> C[Quality fields:\u003cbr/>services · challenge · solution · results ·\u003cbr/>size · media · official link · client]\n    C --> D{Client disclosure}\n    D -- NOT_DISCLOSED --> E[Client name never exposed]\n    D -- DISCLOSED / CONFIRMED --> E2[Client name may be shown]\n    E --> F[Submit → IN_REVIEW]\n    E2 --> F\n    F --> G{Reviewer §13\u003cbr/>SLA 3 business days}\n    G -- needs changes --> H[NEEDS_CHANGES] --> F\n    G -- rejected --> R[REJECTED]\n    G -- approved --> P[PUBLISHED\u003cbr/>completion score · points ≤ 50]\n    P --> S[Search index · company page]\n    P --> V[Top 10 projects → visibility P2]\n    P --> Z[ARCHIVED]\n```\n\n---\n\n## 4. Verification lifecycle (generic) · Phase 1\n\n```mermaid\nflowchart LR\n    O[Subject module opens case\u003cbr/>NOT_STARTED] --> E[Applicant attaches\u003cbr/>evidence documents]\n    E --> S[Submit → IN_REVIEW\u003cbr/>due_at = SLA]\n    S --> Q[Reviewer or admin queue\u003cbr/>ordered by due_at · human decision BQ-48]\n    Q --> C{Conflict of interest?}\n    C -- yes --> Q2[Reassign]\n    C -- no --> D{Decision}\n    D -- NEEDS_INFO --> E\n    D -- REJECTED --> X[Final\u003cbr/>reason shown]\n    D -- APPROVED --> H[Subject handler in same TX\u003cbr/>e.g. claim → owner · signal verified_at]\n    H --> T[verification.approved\u003cbr/>→ TRUST points P2\u003cbr/>→ notification]\n    H --> EXP[[Expiry job]] --> EX[EXPIRED\u003cbr/>subject recalculated\u003cbr/>trust points reversed]\n```\n\n---\n\n## 5. Buyer entity journey (§5.4, §12) · Phase 4 · ⚠️ on hold (BQ-51)\n\n> Every organization is a company (BQ-06), so the separate institution workspace below cannot be built as drawn. Kept for reference until BQ-51 decides how buyers are handled.\n\n```mermaid\nflowchart TD\n    A[Entity representative registers] --> B[Verify email · capacity · authorization\u003cbr/>ENTITY_REPRESENTATIVE case]\n    B --> C[Institution workspace created\u003cbr/>owner membership · MFA required]\n    C --> D[Invite users\u003cbr/>buyer · analyst · reader · auditor]\n    D --> E[Advanced search\u003cbr/>service · city · verification · experience · capacity]\n    E --> F[Save to private supplier list\u003cbr/>+ internal notes]\n    F --> G[Side-by-side comparison]\n    G --> H[Send RFI to companies]\n    H --> I[Companies respond]\n    E --> K[Saved search + alerts]\n    G --> J[Authorised report / export\u003cbr/>purpose · watermark · export log T-20]\n    J --> L[(audit_logs · data_exports)]\n```\n\n---\n\n## 6. Event lifecycle (§9.2) · Phase 2\n\n```mermaid\nflowchart TD\n    A[Staff creates DRAFT\u003cbr/>location · capacity · schedule ·\u003cbr/>speakers · sponsors] --> B[Ticket types\u003cbr/>eligibility by membership BQ-16]\n    B --> C[PUBLISHED]\n    C --> D[User registers T-11]\n    D --> E{Eligible &\u003cbr/>capacity available?}\n    E -- not eligible --> X[Rejected 403]\n    E -- full --> W[WAITLISTED]\n    E -- yes --> R[CONFIRMED\u003cbr/>unique entry code]\n    R --> RC[Cancel T-12] --> PR[Promote next waitlisted]\n    PR --> R\n    R --> TR[Transfer → new CONFIRMED\u003cbr/>for recipient]\n    R --> CI{Event day check-in T-13}\n    CI -- entry code --> AT[attended_at · ENTRY_CODE]\n    CI -- manual fallback --> AT2[attended_at · MANUAL]\n    CI -- no show --> NS[No attendance]\n    AT --> P[event.attendance.verified\u003cbr/>→ ACTIVITY points\u003cbr/>meetup 10 / workshop 15]\n    AT2 --> P\n    C --> DONE[COMPLETED]\n    DONE --> SV[Post-event survey]\n    DONE --> CERT[Attendance certificate\u003cbr/>when eligible BQ-19]\n    DONE --> REP[Report: registrations ·\u003cbr/>attendance · no-shows · satisfaction]\n```\n\n**Rule (§9.2, §20.2):** points are added **after attendance is verified, never after booking**. A registration with no `attended_at` never produces a ledger entry.\n\n---\n\n## 7. Opportunities, applications and supplier requests (business rules §5–§9) · Phase 3\n\n### 7.1 One opportunity lifecycle for every type\n\n```mermaid\nflowchart TD\n    A[Company member creates DRAFT\u003cbr/>type: JOB · CO_OP · VOLUNTEERING · SUPPLIER_REQUEST] --> P[Type policy map\u003cbr/>audience · required fields · who responds]\n    P --> PUB[PUBLISHED]\n    PUB \u003c--> PA[PAUSED]\n    PUB --> AUD{audience}\n    AUD -- INDIVIDUAL --> IND[Listed in /opportunities\u003cbr/>individuals apply]\n    AUD -- COMPANY --> CMP[Listed in /supplier-requests\u003cbr/>Company Accounts only · any company responds]\n    IND --> CL[CLOSED with outcome · T-18]\n    CMP --> CL\n    CL --> AR[ARCHIVED]\n```\n\n### 7.2 Individual application (rules §8, BQ-67)\n\n```mermaid\nflowchart LR\n    S[SUBMITTED\u003cbr/>individual applies · T-17] --> CH{Company chooses\u003cbr/>any status · flexible}\n    CH --> R[REVIEWED]\n    CH --> SL[SHORTLISTED]\n    CH --> C[CONTACT]\n    CH --> ACC[ACCEPTED]\n    CH --> REJ[REJECTED]\n    R & SL & C --> CH\n    S -. applicant · rule BQ-67 .-> W[WITHDRAWN]\n```\n\nExamples: `SUBMITTED → ACCEPTED`, `SUBMITTED → SHORTLISTED → ACCEPTED`, `SUBMITTED → REJECTED`. The company decides; Back Of House only connects the parties. Company projects (portfolio) never receive applications (BQ-62).\n\n### 7.3 Supplier request (B2B, rules §7)\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant B as Buyer company member\n    participant API as opportunities\n    participant S as Supplier company member\n    participant N as notifications\n\n    B->>API: POST /organizations/:buyer/opportunities {type: SUPPLIER_REQUEST}\n    B->>API: publish\n    API-->>N: opportunity.published (company audience)\n    S->>API: GET /supplier-requests\n    S->>API: POST /supplier-requests/:id/responses {organization_id: supplier}\n    API->>API: T-31: supplier ≠ buyer · one response per company · no individual responses\n    API-->>N: supplier_response.submitted → buyer notified\n    B->>API: GET /organizations/:buyer/opportunities/:id/supplier-responses\n    Note over B,S: Any company may respond, no type restriction (BQ-66).\u003cbr/>Individuals never see or answer supplier requests (BQ-65)\n```\n\n**Deferred (rules §9):** messaging, interviews, offers, matching, surveys, recruitment analytics.\n\n**Legal constraint (§10.3):** Back Of House is a discovery and matching intermediary. It is not the employer and does not guarantee the contract or payment. The backend does **not** model contracts, payroll or escrow (§2.2).\n\n---\n\n## 8. Points & engagement lifecycle (§8, §9.1) · Phase 2\n\n```mermaid\nflowchart LR\n    subgraph SRC[Verified business facts]\n        S1[Verification approved]\n        S2[Attendance verified]\n        S3[Project published / score changed]\n        S4[Profile completion changed]\n        S5[Employment confirmed P3]\n        S6[Penalty decision]\n    end\n    subgraph RULES[Rules]\n        R1[point_rules\u003cbr/>+ active version]\n        R2[Caps · once-only ·\u003cbr/>requires verification/review]\n        R3[Idempotency key]\n    end\n    subgraph LEDGER[Source of truth]\n        L1[(point_ledger\u003cbr/>append-only)]\n    end\n    subgraph PROJ[Projections]\n        B1[point_balances\u003cbr/>per category]\n        LV[Level evaluation]\n        BD[Badge evaluation]\n        VS[Visibility score\u003cbr/>+ activity decay]\n    end\n    subgraph OUT[Effects]\n        O1[Level benefits RG-22]\n        O2[Badges shown]\n        O3[Search ranking signal]\n    end\n\n    S1 & S2 & S3 & S4 & S5 & S6 --> R1 --> R2 --> R3 --> L1\n    L1 --> B1 --> LV --> O1\n    B1 --> BD --> O2\n    L1 --> VS --> O3\n    LV -- upper levels --> HR[Human review §8.6]\n    L1 -- corrections --> REV[REVERSAL entry\u003cbr/>never UPDATE]\n```\n\nLevels depend on points only, never on verification (BQ-07). Points are never spent or redeemed (BQ-08). Full design: `points-architecture.md`.\n\n---\n\n## 9. Subscription lifecycle (§7.5) · ⏸ DEFERRED future monetization (business rules §11)\n\n```mermaid\nflowchart TD\n    A[Owner picks plan] --> B{Trial available?}\n    B -- yes --> TR[TRIAL]\n    B -- no --> CO[Checkout · payment gateway]\n    TR --> CO\n    CO --> WH[Signed webhook\u003cbr/>deduplicated T-14]\n    WH -- success --> AC[ACTIVE\u003cbr/>invoice issued · entitlements recalculated]\n    WH -- failure --> F[Payment failed → retry]\n    AC --> RN{Renewal}\n    RN -- paid --> AC\n    RN -- failed --> GR[GRACE_PERIOD] --> PD[PAST_DUE] --> EXP[EXPIRED\u003cbr/>entitlements → free]\n    GR -- paid --> AC\n    PD -- paid --> AC\n    AC --> UP[Upgrade → immediate T-15]\n    AC --> DN[Downgrade → end of cycle]\n    AC --> CN[Cancel → CANCELLED\u003cbr/>access until period end] --> EXP\n    MAN[Admin manual approval\u003cbr/>for entities] --> AC\n```\n\n**Invariant (§7.5, §8.1):** subscription changes **never** touch trust, verification or organic visibility. Only entitlements (including the labelled paid partner badge) change.\n\n---\n\n## 10. Bulk import (§22, §22.1) · Phase 1\n\n```mermaid\nflowchart LR\n    U[Upload source file] --> P[Parse → import_rows\u003cbr/>source_record_id]\n    P --> V[Validate · normalise\u003cbr/>error log per row]\n    V --> DD[Duplicate detection\u003cbr/>vs existing + within batch]\n    DD --> PV[PREVIEW report\u003cbr/>nothing written]\n    PV --> DEC{Admin commits?}\n    DEC -- no --> FIX[Fix file · re-upload]\n    DEC -- yes --> CM[COMMIT job\u003cbr/>chunks · UNCLAIMED orgs\u003cbr/>unconfirmed contacts private]\n    CM --> QR[Quality & completeness report]\n    CM --> RB{Rollback needed?}\n    RB -- yes --> RBK[ROLLED_BACK\u003cbr/>archive created orgs\u003cbr/>without dependants T-21]\n    QR --> INV[Claim invitations\u003cbr/>first 150 companies §22]\n```\n\n---\n\n## 11. Report generation (§11, §29.1) · Phase 4\n\n```mermaid\nflowchart LR\n    RQ[Request or schedule\u003cbr/>purpose required] --> SC[SCHEDULED]\n    SC --> GN[GENERATING\u003cbr/>worker]\n    GN --> CHK{Sample ≥ 5?\u003cbr/>confidential data excluded?}\n    CHK -- suppress segment --> GN\n    GN -- error --> FL[FAILED] -- admin regenerate --> SC\n    GN --> RD[READY\u003cbr/>data_version + rule_versions stored]\n    RD --> EXPT[Export PDF/XLSX\u003cbr/>export log + watermark T-20]\n    RD --> EX[EXPIRED]\n```\n\n---\n\n## 12. Launch & migration sequence (§22)\n\n```mermaid\nflowchart LR\n    M1[Clean company data\u003cbr/>normalise names & taxonomy] --> M2[Pilot import 50]\n    M2 --> M3[Internal run with BOH team]\n    M3 --> M4[Closed pilot\u003cbr/>10 companies + 2 buyers BQ-26 · BQ-51]\n    M4 --> M5[Fix · freeze schema]\n    M5 --> M6[Import 500 UNCLAIMED]\n    M6 --> M7[Claim invitations to 150]\n    M7 --> M8[Gradual public launch\u003cbr/>daily monitoring]\n    M8 --> M9[30-day review → go/no-go\u003cbr/>for memberships P2]\n```\n"},{"name":"domain-events","title":"Domain Events","keywords":"events outbox notifications","markdown":"# Domain Events\n\n> Internal business events that decouple modules (notifications, points, search, analytics) from the modules where things happen.\n> Mechanism: **transactional outbox + worker dispatcher** (ADR-011). No Kafka or Redis.\n> Naming: `\u003caggregate>.\u003cpast-tense-fact>` (e.g. `organization.claim.approved`). Names come from PRD workflows. PRD analytics events (§16) are a **separate** dictionary (§6).\n\n---\n\n## 1. Delivery model\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant S as Producer service\n    participant DB as Postgres\n    participant W as Worker (OutboxDispatcher)\n    participant H1 as Consumer: notifications\n    participant H2 as Consumer: engagement\n    participant H3 as Consumer: search\n\n    S->>DB: BEGIN\n    S->>DB: business writes + audit_logs\n    S->>DB: INSERT outbox_events (PENDING)\n    S->>DB: COMMIT  ← the event exists if and only if the state change committed\n    loop poll (FOR UPDATE SKIP LOCKED, batch)\n        W->>DB: claim PENDING events\n        W->>H1: handle(event)\n        W->>H2: handle(event)\n        W->>H3: handle(event)\n        W->>DB: mark PROCESSED per handler (or retry with backoff → FAILED + alert)\n    end\n```\n\n| Property | Guarantee |\n|---|---|\n| Atomicity | The event is written in the **same transaction** as the state change. There are no \"ghost\" or lost events |\n| Delivery | **At least once**, per consumer (a per-handler record keeps one slow or failing consumer from blocking others) |\n| Consumer idempotency | **Required.** Points use `idempotency_key`; search upserts; notifications dedupe on `(event_id, recipient, type)` |\n| Ordering | Best effort per `aggregate_id`. Consumers must not rely on global order; they re-read current state when order matters |\n| Retries | Exponential backoff, maximum 10 attempts → `FAILED` + ops alert |\n| Payload versioning | `event_version` field. Additive changes only; breaking changes use a new version, with both published during migration |\n\n### Envelope\n\n```jsonc\n{\n  \"event_id\": \"0192f7a1-…\",            // uuid v7\n  \"event_name\": \"organization.claim.approved\",\n  \"event_version\": 1,\n  \"occurred_at\": \"2026-10-01T09:12:44Z\",\n  \"aggregate_type\": \"organization\",\n  \"aggregate_id\": \"…\",\n  \"actor\": { \"type\": \"STAFF\", \"user_id\": \"…\" },   // null user_id for SYSTEM\n  \"organization_id\": \"…\",               // tenant context when relevant\n  \"request_id\": \"…\",                    // trace correlation\n  \"payload\": { /* event-specific, ids + minimal facts, NO personal contact data */ }\n}\n```\n\n**Payload rule:** ids and minimal facts only. No emails, phone numbers, document contents or free-text reasons marked internal. Consumers fetch what they need through query services (§18 data minimisation).\n\n---\n\n## 2. What is NOT an event (runs synchronously in the same transacti
