/notifications`, `/me/notification-preferences`) |\n| Services | `NotificationsService`, `NotificationRouter` (event → recipients → channels), `TemplateRenderer`, `DeliveryJob` |\n| Depends on | platform: messaging, jobs · `identity` (recipient locale and contacts) · `access` (resolve organization owners and members as recipients) |\n| Emits | — |\n| Consumes | **Leaf consumer.** Catalog RG-14. Phase 1: `organization.claim.approved/rejected`, `verification.info_requested/approved/rejected`, `invitation.created`, `project.published/changes_requested/rejected`, `organization.credential.expiring`, `organization.needs_update`, `abuse_report.resolved`, `appeal.upheld/denied`. Later phases: billing, events, opportunities, reports |\n| External | Email provider, SMS provider |\n\n### 4.13 `audit`: Phase 1 (data_exports in Phase 4)\n\n| Aspect | Detail |\n|---|---|\n| Responsibility | Append-only audit log and export log; audit search for auditors |\n| Entities owned | `audit_logs`, `data_exports` (P4) |\n| Controllers | `AdminAuditController` (`/admin/audit-logs`, `/admin/data-exports`) |\n| Services | `AuditLogger.record(tx, entry)` (**synchronous, same transaction**), `AuditQueryService`, `ExportLogService` |\n| Depends on | platform: database only (**leaf**, so everyone can depend on it) |\n| Emits / Consumes | — / — |\n\n### 4.14 `analytics`: Phase 1\n\n| Aspect | Detail |\n|---|---|\n| Responsibility | First-party analytics events from the §16 dictionary; visitor id; bot and internal-traffic flags; forwarding to a product analytics provider |\n| Entities owned | `analytics_events` |\n| Controllers | `AnalyticsController` (`POST /analytics/events`: public, rate-limited, batched) |\n| Services | `AnalyticsIngestService` (validate event names, attach `is_internal`), `AnalyticsForwarder` (job) |\n| Depends on | platform · `access` (query: is the viewer a member of the viewed organization → internal, §16.1) |\n| Emits / Consumes | — / `organization.claim.submitted/approved` → `profile_claim_started/completed` server events; `project.published` → `project_published` |\n| External | Product analytics provider (§15.2) |\n\n### 4.15 `imports`: Phase 1\n\n| Aspect | Detail |\n|---|---|\n| Responsibility | Bulk company import with preview, validation, duplicate detection, commit, rollback, quality report (§22.1) |\n| Entities owned | `import_batches`, `import_rows` |\n| Controllers | `AdminImportsController` |\n| Services | `ImportParser` (format RG-09), `ImportPreviewService`, `ImportCommitJob`, `ImportRollbackService` |\n| Depends on | platform · `organizations` (create UNCLAIMED, duplicate detection) · `taxonomy` · `media` (source file as document) · `audit` |\n| Emits | `import.previewed`, `import.committed`, `import.rolled_back` |\n\n### 4.16 `admin`: Phase 1\n\n| Aspect | Detail |\n|---|---|\n| Responsibility | **Thin.** Admin dashboard aggregates (queue sizes, SLA breaches, counts) and operational endpoints that belong to no single domain. Domain admin endpoints live in their own modules |\n| Entities owned | — |\n| Controllers | `AdminDashboardController` (`/admin/dashboard`) |\n| Depends on | query services of `verification`, `organizations`, `projects`, `moderation`, `imports` (**leaf: nothing depends on admin**) |\n\n### 4.17 `entitlements`: ⏸ DEFERRED (future monetization, business rules §11)\n\n| Aspect | Detail |\n|---|---|\n| Responsibility | The single answer to \"does subject S have feature F, and with what limit?\" (§14 `entitlements`) |\n| Entities owned | `entitlements` |\n| Controllers | `OrganizationEntitlementsController` (`/organizations/:organizationId/entitlements`), `AdminEntitlementsController` (exemptions, manual grants) |\n| Services | `EntitlementsService.check/limit/usage`, `EntitlementsRecalculator(tx, subscriber)` |\n| Decorator | `@RequireEntitlement(featureKey)` |\n| Depends on | platform · `audit` (**near-leaf**: billing, events, opportunities, intelligence and institutional depend on it) |\n| Emits | `entitlements.changed` |\n\n### 4.18 `billing`: ⏸ DEFERRED (future monetization, business rules §11)\n\n> No payment gateway, invoices, wallets, commissions or subscriptions are built now. The design below is kept only as a compatibility reference. Future `promotions` (featured opportunities, featured companies, sponsored content) would be a **separate** module that never writes verification, trust points or organic ranking (rules §12).\n\n\n| Aspect | Detail |\n|---|---|\n| Responsibility | Plan catalog, subscriptions, trials, upgrades and downgrades, renewals, grace period, cancellation, invoices, payments, coupons, payment webhooks (§7.5) |\n| Entities owned | `membership_plans`, `plan_features`, `subscriptions`, `invoices`, `payments`, `coupons`, `coupon_redemptions`, `payment_provider_events`, `idempotency_records` (via platform/idempotency) |\n| Controllers | `PlansController` (`/membership-plans`), `OrganizationSubscriptionController`, `InvoicesController`, `PaymentWebhooksController` (`/webhooks/payments/:provider`), `AdminBillingController` |\n| Services | `SubscriptionsService`, `CheckoutService`, `RenewalJob`, `DunningJob`, `InvoicingService`, `CouponsService`, `PaymentGatewayPort` + adapter, `EInvoicingPort` + adapter |\n| Depends on | platform · `entitlements` · `organizations` (query) · `media` (invoice PDF) · `audit` |\n| Emits | `subscription.started`, `subscription.renewed`, `subscription.plan_changed`, `subscription.grace_started`, `subscription.past_due`, `subscription.cancelled`, `subscription.expired`, `payment.succeeded`, `payment.failed`, `invoice.issued`, `coupon.redeemed` |\n| External | Saudi payment gateway, e-invoicing/accounting (§15.2, TQ-18) |\n\n### 4.19 `engagement`: Phase 2\n\n| Aspect | Detail |\n|---|---|\n| Responsibility | Points ledger, balances, rules and versions, caps and anti-abuse, levels, badges, visibility score (§8, §9.1). Full design: `points-architecture.md` |\n| Entities owned | `point_rules`, `point_rule_versions`, `point_ledger`, `point_balances`, `member_levels`, `level_assignments`, `badges`, `badge_awards`, `visibility_snapshots`, `engagement_alerts` |\n| Controllers | `MyEngagementController` (`/me/points`, `/me/level`, `/me/badges`), `OrganizationEngagementController`, `PublicLevelsController` (`/levels`, `/badges`), `AdminPointsController`, `AdminLevelsController`, `AdminBadgesController`, `AdminVisibilityController` |\n| Services | `PointsService.award/deduct/reverse`, `PointRuleEngine`, `CapGuard`, `ComputedScoreSync` (company components → ledger deltas), `LevelsService`, `BadgesService`, `VisibilityCalculator`, `ReconciliationJob`, `AnomalyDetectionJob`, `LevelsQuery` (exported) |\n| Depends on | platform · `organizations` / `projects` / `profiles` / `identity` queries (score inputs) · `audit` |\n| Emits | `points.credited`, `points.debited`, `points.reversed`, `points.balance_frozen`, `level.changed`, `level.review_requested`, `badge.awarded`, `badge.revoked`, `visibility.recomputed`, `engagement.anomaly_detected` |\n| Consumes | `verification.approved/expired` (TRUST), `profile.completion_changed`, `organization.updated` (completion), `project.score_changed/archived` (PROJECTS), `event.attendance.verified` (ACTIVITY), `experience.confirmed` (P3 TRUST/EXPERIENCE), `opportunity.published` (P3 org RECENT_ACTIVITY), `appeal.upheld` (reversal) |\n\n### 4.20 `events`: Phase 2\n\n| Aspect | Detail |\n|---|---|\n| Responsibility | Events, ticket types and eligibility, capacity and waitlist, cancellation and transfer, entry codes, check-in, attendance verification, feedback, certificates, event reports (§9.2) |\n| Entities owned | `events`, `event_ticket_types`, `event_speakers`, `event_sponsors`, `event_registrations`, `event_feedback` |\n| Controllers | `PublicEventsController` (`/events`), `EventRegistrationsController` (`/events/:eventId/registrations`, `/me/event-registrations`), `AdminEventsController` (CRUD, publish, check-in, reports) |\n| Services | `EventsService`, `RegistrationService` (capacity lock, T-11), `WaitlistService` (T-12), `CheckInService` (T-13), `CertificateJob`, `EventReportsQuery` |\n| Depends on | platform · `identity` · `entitlements` (eligibility) · `engagement` (LevelsQuery for eligibility) · `taxonomy` · `media` · `audit` |\n| Emits | `event.published`, `event.cancelled`, `event.completed`, `event.registration.confirmed`, `event.registration.waitlisted`, `event.registration.promoted`, `event.registration.cancelled`, `event.registration.transferred`, `event.attendance.verified`, `event.feedback.submitted`, `event.certificate.issued` |\n| External | Signed entry codes / QR (§15.2 Phase 2) |\n\n### 4.21 `talent`: Phase 3\n\n| Aspect | Detail |\n|---|---|\n| Responsibility | Professional profile extensions (§10.1): experiences with company confirmation, education, certifications, profile projects, media portfolio, section privacy |\n| Entities owned | `experiences`, `educations`, `user_certifications`, `profile_projects`, `profile_media` |\n| Controllers | `MyTalentController` (`/me/experiences`, `/me/educations`, …), `OrganizationEmploymentConfirmationsController` |\n| Services | `ExperiencesService`, `EmploymentConfirmationService` (T-24), `TalentQuery` |\n| Handlers | `ExperienceVerificationHandler` |\n| Depends on | platform · `profiles` · `organizations` (query) · `access` (permission `organization.employment.confirm`) · `verification` · `taxonomy` · `media` · `audit` |\n| Emits | `experience.confirmation_requested`, `experience.confirmed`, `experience.declined`, `talent.profile_updated` |\n| Consumes | — |\n\n### 4.22 `opportunities`: Phase 3 — unified model (business rules §5–§9)\n\n| Aspect | Detail |\n|---|---|\n| Responsibility | **One** Opportunity model for JOB, CO_OP, VOLUNTEERING and SUPPLIER_REQUEST (PROJECT is company portfolio, not an opportunity — BQ-62). Supplier requests are visible to Company Accounts only (BQ-65); any company may respond (BQ-66); application statuses are flexible (BQ-67). A single **type policy map** decides audience (INDIVIDUAL / COMPANY), who may respond and required fields. Individual applications with the one status model (rules §8). B2B supplier responses (rules §7). Company opportunity management kept simple (rules §9) |\n| Entities owned | `opportunities`, `opportunity_skills`, `opportunity_services`, `applications`, `supplier_responses` · ⏸ deferred: `application_messages`, `opportunity_feedback` |\n| Controllers | `PublicOpportunitiesController` (`/opportunities`, individual audience), `SupplierRequestsController` (`/supplier-requests`, company audience), `OrganizationOpportunitiesController`, `ApplicationsController`, `SupplierResponsesController`, `AdminOpportunitiesController` |\n| Services | `OpportunitiesService`, `OpportunityTypePolicy` (single source of type rules), `ApplicationsService` (T-17, status changes), `SupplierResponsesService` (T-31) |\n| Deferred (rules §9) | Messaging, interview scheduling, offers, matching and match notifications, surveys, recruitment analytics |\n| Depends on | platform · `organizations` (query: status, company type for display) · `access` · `profiles` (query) · `taxonomy` · `media` · `audit` |\n| Emits | `opportunity.published`, `opportunity.paused`, `opportunity.closed`, `application.submitted`, `application.status_changed`, `application.withdrawn`, `supplier_response.submitted`, `supplier_response.withdrawn` |\n\n### 4.23 `intelligence`: Phase 4\n\n| Aspect | Detail |\n|---|---|\n| Responsibility | Metric dictionary, metric facts (rollups of analytics and domain data), benchmark sets (3 competitors, 90-day rule), direct comparison (public data), anonymous benchmarks (sample ≥ 5), report generation and expiry, authorised exports (§11, §12.2) |\n| Entities owned | `metric_definitions`, `metric_facts`, `benchmark_sets`, `benchmark_set_members`, `reports` |\n| Controllers | `OrganizationReportsController`, `BenchmarkSetController`, `MarketReportsController`, `AdminMetricsController`, `AdminReportsController` |\n| Services | `MetricRollupJob`, `BenchmarkService` (T-19), `ComparisonService`, `ReportGenerationJob`, `ExportService` (T-20, writes via `audit.ExportLogService`) |\n| Depends on | platform · `analytics` (raw) · `organizations` / `projects` (query) · `entitlements` · `media` · `audit` |\n| Emits | `report.requested`, `report.ready`, `report.failed`, `report.exported`, `benchmark.competitor_changed` |\n| External | PDF/XLSX generation (TQ-20) |\n\n### 4.24 `institutional`: Phase 4\n\n| Aspect | Detail |\n|---|---|\n| Responsibility | ⚠️ **On hold (BQ-51)** — no institution organizations exist (BQ-06). Planned buyer features: advanced search, supplier lists and internal notes, side-by-side comparison, saved searches and alerts, RFIs, access log view (§12.1) |\n| Entities owned | `saved_lists`, `saved_list_items`, `saved_searches`, `rfis`, `rfi_recipients` |\n| Controllers | `SavedListsController`, `SavedSearchesController`, `RfisController` (institution side), `IncomingRfisController` (company side), `InstitutionAccessLogController` |\n| Services | `SavedListsService`, `SavedSearchAlertJob`, `RfisService` |\n| Depends on | platform · `organizations` (query) · `search` (advanced query) · `intelligence` (comparison) · `entitlements` · `audit` |\n| Emits | `rfi.sent`, `rfi.responded`, `saved_search.matches_found` |\n\n### 4.25 Phase 5 (placeholders, not designed; RG-19)\n\n| Module | Purpose |\n|---|---|\n| `observatory` | Aggregated sector data, time-series indicators, periodic reports (§6 Phase 5) |\n| `partner-api` | Partner integration API, API clients and keys, signed outbound webhooks (§15.1, §15.2) |\n\n---\n\n## 5. Cross-cutting request flow\n\n```mermaid\nflowchart LR\n    REQ[HTTP request] --> RID[RequestId interceptor]\n    RID --> RL[Rate limit]\n    RL --> AG[AuthGuard\u003cbr/>identity]\n    AG --> US[UserStateGuard\u003cbr/>identity]\n    US --> AS[AssuranceGuard\u003cbr/>access]\n    AS --> PG[PermissionGuard\u003cbr/>access]\n    PG --> EG[EntitlementGuard\u003cbr/>entitlements P2]\n    EG --> VP[ValidationPipe 422]\n    VP --> CTL[Controller]\n    CTL --> SVC[Application service]\n    SVC --> TX{{TransactionRunner}}\n    TX --> REPO[Repository\u003cbr/>org-scoped query]\n    TX --> AUD[AuditLogger]\n    TX --> OBX[OutboxWriter]\n    SVC --> RESP[Serializer\u003cbr/>visibility rules]\n    RESP --> ENV[Envelope + ErrorFilter]\n```\n\n## 6. Deployment units\n\n| Unit | Entrypoint | Runs |\n|---|---|---|\n| **api** | `src/main.ts` | HTTP controllers only |\n| **worker** | `src/worker.ts` | Outbox dispatcher, pg-boss job handlers, cron schedules |\n\nBoth are built from the **same codebase and modules**. Splitting them keeps slow jobs (reports, scans, recalculation) away from request latency (§17 \"stateless services, queues for heavy tasks\"). Phase 1 may run both in one process when traffic is small. The split is a configuration flag, not a code change.\n"},{"name":"module-dependency-map","title":"Module Dependency Map","keywords":"dependencies circular layers","markdown":"# Module Dependency Map\n\n> `A --> B` means **module A imports module B's public API** (compile-time and Nest DI dependency).\n> Every domain module also depends on the platform modules (`database`, `outbox`, `jobs`, `config`, `observability`). Those edges are omitted.\n> Dashed arrows are **not imports**: they are domain events delivered through the outbox, or ports implemented by the higher module.\n\n---\n\n## 1. Rules\n\n1. **The graph must stay acyclic.** CI runs `dependency-cruiser` with a `no-circular` rule over `src/modules/**`, plus a check that other modules import only from each module's `index.ts`.\n2. **`forwardRef()` is forbidden** in business modules. If you need it, the design is wrong. Use one of the three techniques in §4.\n3. **Dependencies point from volatile/specific modules to stable/general ones.** `audit`, `taxonomy`, `identity`, `media` and `entitlements` sit at the bottom; `admin`, `institutional` and `events` at the top.\n4. **Writes stay inside the owning module.** Crossing a boundary to *change* state happens through (a) a service call along a declared edge, (b) a port implemented by the higher module, or (c) a domain event.\n5. **Leaf consumers** (`notifications`, `analytics` for events, `search` for indexing, `admin`) must never be imported by business modules for side effects. They only listen.\n\n---\n\n## 2. Dependency graphs\n\n### 2.1 Phase 1: core & directory\n\n```mermaid\nflowchart BT\n    audit[audit]\n    identity[identity]\n    taxonomy[taxonomy]\n    media[media]\n    access[access]\n    profiles[profiles]\n    verification[verification]\n    content[content]\n    analytics[analytics]\n    notifications[notifications]\n    organizations[organizations]\n    projects[projects]\n    imports[imports]\n    moderation[moderation]\n    search[search]\n    admin[admin]\n\n    identity --> audit\n    taxonomy --> audit\n    media --> audit\n    access --> identity\n    access --> audit\n    profiles --> identity\n    profiles --> taxonomy\n    profiles --> media\n    verification --> media\n    verification --> access\n    verification --> audit\n    content --> media\n    analytics --> access\n    notifications --> identity\n    notifications --> access\n    organizations --> access\n    organizations --> taxonomy\n    organizations --> media\n    organizations --> verification\n    projects --> organizations\n    projects --> taxonomy\n    projects --> media\n    projects --> verification\n    imports --> organizations\n    imports --> taxonomy\n    imports --> media\n    moderation --> organizations\n    moderation --> projects\n    moderation --> profiles\n    moderation --> content\n    moderation --> verification\n    search --> organizations\n    search --> projects\n    search --> profiles\n    search --> taxonomy\n    search --> analytics\n    admin --> verification\n    admin --> organizations\n    admin --> projects\n    admin --> moderation\n    admin --> imports\n```\n\n### 2.2 Phases 2–4 (Phase 1 modules shown as the base)\n\n```mermaid\nflowchart BT\n    subgraph P1[\"Phase 1 base\"]\n        audit[audit]\n        identity[identity]\n        taxonomy[taxonomy]\n        media[media]\n        access[access]\n        profiles[profiles]\n        verification[verification]\n        organizations[organizations]\n        projects[projects]\n        analytics[analytics]\n        search[search]\n    end\n\n    subgraph P2[\"Phase 2\"]\n        entitlements[entitlements]\n        billing[billing]\n        engagement[engagement]\n        events[events]\n    end\n\n    subgraph P3[\"Phase 3\"]\n        talent[talent]\n        opportunities[opportunities]\n    end\n\n    subgraph P4[\"Phase 4\"]\n        intelligence[intelligence]\n        institutional[institutional]\n    end\n\n    entitlements --> audit\n    billing --> entitlements\n    billing --> organizations\n    billing --> media\n    engagement --> organizations\n    engagement --> projects\n    engagement --> profiles\n    engagement --> identity\n    events --> identity\n    events --> entitlements\n    events --> engagement\n    events --> taxonomy\n    events --> media\n\n    talent --> profiles\n    talent --> organizations\n    talent --> access\n    talent --> verification\n    talent --> taxonomy\n    opportunities --> organizations\n    opportunities --> access\n    opportunities --> entitlements\n    opportunities --> talent\n    opportunities --> taxonomy\n\n    intelligence --> analytics\n    intelligence --> organizations\n    intelligence --> projects\n    intelligence --> entitlements\n    intelligence --> media\n    institutional --> organizations\n    institutional --> search\n    institutional --> intelligence\n    institutional --> entitlements\n```\n\n> **Business rules §11:** `billing` and `entitlements` are deferred. In the MVP no module imports them; the edges above apply only when monetization is built.\n\n### 2.3 Layering (proof of acyclicity)\n\nEvery module depends only on modules in **lower** layers.\n\n| Layer | Modules | Depends on layers |\n|---|---|---|\n| **L0** | `audit` | platform only |\n| **L1** | `identity`, `taxonomy`, `media`, `entitlements` | L0 |\n| **L2** | `access` | L0–L1 |\n| **L3** | `profiles`, `verification`, `content`, `analytics`, `notifications` | L0–L2 |\n| **L4** | `organizations` | L0–L3 |\n| **L5** | `projects`, `imports`, `billing`, `talent` | L0–L4 |\n| **L6** | `search`, `engagement`, `moderation`, `intelligence`, `opportunities` | L0–L5 |\n| **L7** | `events`, `admin`, `institutional` | L0–L6 |\n\n```mermaid\nflowchart TB\n    L7[\"L7 · events · admin · institutional\"]\n    L6[\"L6 · search · engagement · moderation · intelligence · opportunities\"]\n    L5[\"L5 · projects · imports · billing · talent\"]\n    L4[\"L4 · organizations\"]\n    L3[\"L3 · profiles · verification · content · analytics · notifications\"]\n    L2[\"L2 · access\"]\n    L1[\"L1 · identity · taxonomy · media · entitlements\"]\n    L0[\"L0 · audit\"]\n    PL[\"platform · database · outbox · jobs · storage · messaging · supabase · config\"]\n    L7 --> L6 --> L5 --> L4 --> L3 --> L2 --> L1 --> L0 --> PL\n```\n\n---\n\n## 3. Event flows (not dependencies)\n\nThese arrows show **who reacts to whom** through the outbox. A consumer never imports the producer for this. It subscribes to the event name and payload type from the producer's `index.ts`, which is a **type-only** import and allowed in any direction. See `domain-events.md`.\n\n```mermaid\nflowchart LR\n    verification -. \"verification.*\" .-> notifications\n    verification -. \"verification.approved / expired\" .-> engagement\n    organizations -. \"organization.*\" .-> search\n    organizations -. \"organization.*\" .-> notifications\n    organizations -. \"organization.claim.*\" .-> analytics\n    projects -. \"project.*\" .-> search\n    projects -. \"project.score_changed\" .-> engagement\n    projects -. \"project.published\" .-> notifications\n    profiles -. \"profile.*\" .-> search\n    profiles -. \"profile.completion_changed\" .-> engagement\n    access -. \"invitation.created\" .-> notifications\n    events -. \"event.attendance.verified\" .-> engagement\n    events -. \"event.registration.*\" .-> notifications\n    engagement -. \"visibility.recomputed\" .-> search\n    engagement -. \"level.changed / badge.awarded\" .-> notifications\n    billing -. \"subscription.* / invoice.issued\" .-> notifications\n    entitlements -. \"entitlements.changed\" .-> search\n    talent -. \"experience.confirmed\" .-> engagement\n    opportunities -. \"application.* / match_found\" .-> notifications\n    moderation -. \"appeal.upheld\" .-> engagement\n    intelligence -. \"report.ready\" .-> notifications\n    institutional -. \"rfi.sent\" .-> notifications\n```\n\n**Allowed type-only import exception.** `import type { VerificationApprovedEvent } from '@modules/verification'` is allowed from any module, because event contracts are data, not behaviour. dependency-cruiser is configured with `dependencyTypesNot: [\"type-only\"]` for the event-contract path.\n\n---\n\n## 4. Potential circular dependencies and how they are solved\n\n### C-1 · `organizations` ⟷ `verification`\n\n**Problem.** Organizations opens verification cases (org → verification). When a reviewer approves a claim, the verification module must create the owner and update the organization's status (verification → org).\n\n**Solution: dependency inversion with a handler registry, run inside the same transaction.**\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant ORG as organizations (L4)\n    participant REG as verification.SubjectRegistry (L3)\n    participant REV as verification.ReviewService (L3)\n    participant ACC as access (L2)\n\n    Note over ORG,REG: at module init\n    ORG->>REG: register(ORGANIZATION_CLAIM, ClaimVerificationHandler)\n    Note over REV: reviewer approves case\n    REV->>REV: BEGIN TX · lock case · insert decision · audit\n    REV->>REG: handlerFor(ORGANIZATION_CLAIM)\n    REV->>ORG: handler.onApproved(tx, case)\n    ORG->>ORG: link account_user_id = claimant Company Account\n    ORG->>ORG: claim closed · status → CLAIMED · outbox\n    REV->>REV: outbox(verification.approved) · COMMIT\n```\n\n`verification` defines the `VerificationSubjectHandler` interface. `organizations`, `projects` and `talent` implement it. The **lower** module defines the port and the **higher** module implements it, so the import edge still points downward.\n\n### C-2 · `access` ⟷ `organizations`\n\n**Problem.** Organizations grants owners (org → access). Access needs the organization's **status** (e.g. a suspended or archived company) when resolving permissions (access → org).\n\n**Solution: allowed identity-column join.** `access.MembershipsRepository` reads `organizations.status` through a Prisma relation `include` (read-only). The allow-list of cross-module identity columns is:\n\n| Table | Columns readable by other modules via joins |\n|---|---|\n| organizations | `id`, `status`, `slug`, `legal_name_*`, `trade_name_*`, `logo_media_id` |\n| users | `id`, `status`, `preferred_locale` |\n| profiles | `id`, `user_id`, `slug`, `full_name`, `avatar_media_id` |\n| company_projects | `id`, `organization_id`, `status`, `slug`, `name_*` |\n\nAnything beyond these columns must go through the owning module's query service. Writes are never allowed.\n\n### C-3 · `organizations` merge ⟷ `projects`, `billing`, `engagement`, …\n\n**Problem.** A merge (ORG-09, T-03) must move rows owned by *other* modules (projects, subscriptions, point ledger subjects, etc.) inside one transaction. But those modules depend on `organizations`, not the other way round.\n\n**Solution: `OrganizationMergeParticipant` port.** `organizations` defines `{ moveToTarget(tx, sourceId, targetId): Promise\u003cvoid> }` and a registry. `projects`, `billing`, `engagement`, `opportunities`, `intelligence` and `institutional` each register a participant that moves **their own** rows. `access` is **below** `organizations`, so organizations simply calls `access.MembershipsService.mergeMemberships(tx, …)` directly.\n\n### C-4 · `identity` ⟷ `profiles` (onboarding)\n\n**Problem.** Onboarding marks the user onboarded and records consents (identity), and it creates a profile (profiles).\n\n**Solution: put the use case in the higher module.** `profiles.OnboardingService` calls `identity.UsersService.markOnboarded(tx)` and `identity.ConsentsService.record(tx)`. Identity never needs profiles.\n\n### C-5 · `events` ⟷ `engagement`\n\n**Problem.** Ticket eligibility may depend on a member level (events → engagement). Attendance earns points (engagement → events).\n\n**Solution: an event for the reverse direction.** `events` imports `engagement.LevelsQuery`. `engagement` consumes `event.attendance.verified` from the outbox and never imports `events`.\n\n### C-6 · `media` ⟷ every module that stores documents\n\n**Problem.** Deciding whether actor X may download document D depends on what D is attached to (a verification case, a credential, an invoice, a report).\n\n**Solution: `DocumentAccessPolicy` port.** `media` defines the port. `verification`, `organizations`, `billing` and `intelligence` register policies. `media` asks every registered policy and grants access if one allows it, then audits the access.\n\n### C-7 · `search` ⟷ `analytics`\n\n`search` logs `search_performed` through `analytics.AnalyticsIngestService` (search → analytics). `analytics` never needs search. **No cycle**, but keep it that way: zero-result reporting reads `analytics_events`, not `search`.\n\n### C-8 · `notifications` ⟷ everyone\n\n`notifications` imports only `identity` and `access` (to resolve recipients). Every producer reaches it **only through events**. If a module ever calls `NotificationsService` directly, a cycle risk appears. That is forbidden by lint (`notifications` is not exported for business modules).\n\n### C-9 · `moderation` ⟷ modules it acts on\n\n`moderation` reads targets (moderation → organizations, projects, …). Corrective actions are done by the owning modules, either through admin endpoints or by consuming `appeal.upheld` / `abuse_report.resolved`. Moderation never calls a mutating service of a module above or beside it.\n\n---\n\n## 5. Dependency matrix\n\n✅ = direct import · 📨 = consumes events from · 🔌 = implements a port defined by\n\n| Module ↓ depends on → | audit | identity | taxonomy | media | entitlements | access | profiles | verification | analytics | organizations | projects | talent | engagement | search | intelligence |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|\n| identity | ✅ | | | | | | | | | | | | | | |\n| access | ✅ | ✅ | | | | | | | | | | | | | |\n| profiles | ✅ | ✅ | ✅ | ✅ | | | | | | | | | | | |\n| verification | ✅ | | | ✅ 🔌 | | ✅ | | | | | | | | | |\n| organizations | ✅ | | ✅ | ✅ 🔌 | | ✅ | | ✅ 🔌 | | | | | | | |\n| projects | ✅ | | ✅ | ✅ | | | | ✅ 🔌 | | ✅ 🔌 📨 | | | | | |\n| search | | | ✅ 📨 | | 📨 | | ✅ 📨 | | ✅ | ✅ 📨 | ✅ 📨 | | 📨 | | |\n| notifications | | ✅ | | | | ✅ 📨 | | 📨 | | 📨 | 📨 | 📨 | 📨 | | 📨 |\n| billing | ✅ | | | ✅ 🔌 | ✅ | | | | | ✅ 🔌 | | | | | |\n| engagement | ✅ | ✅ | | | | | ✅ 📨 | 📨 | | ✅ 🔌 📨 | ✅ 📨 | 📨 | | | |\n| events | ✅ | ✅ | ✅ | ✅ | ✅ | | | | | | | | ✅ | | |\n| talent | ✅ | | ✅ | ✅ | | ✅ | ✅ | ✅ 🔌 | | ✅ | | | | | |\n| opportunities | ✅ | | ✅ | ✅ | ✅ | ✅ | ✅ | | | ✅ 🔌 | | ✅ | | | |\n| intelligence | ✅ | | | ✅ 🔌 | ✅ | | | | ✅ | ✅ 🔌 | ✅ | | | | |\n| institutional | ✅ | | | | ✅ | | | | | ✅ 🔌 | | | | ✅ | ✅ |\n\n---\n\n## 6. How to add a new dependency\n\n1. Check the layer table (§2.3). If the target is in the same or a higher layer, **stop**. Use an event or a port.\n2. Add the import only from the target's `index.ts`.\n3. Update this document (graph + matrix) in the same pull request.\n4. CI (`dependency-cruiser`) must pass.\n"},{"name":"database-erd","title":"Database ERD","keywords":"erd diagram tables schema","markdown":"# Database ERD\n\n> PostgreSQL entity-relationship diagrams, split into **focused diagrams** by domain. Field meanings, full constraints and lifecycles are in `database-entities.md`.\n>\n> - Standard columns (`created_at`, `updated_at`, `created_by`, `updated_by`) are **omitted** from diagrams.\n> - `PK` = primary key, `FK` = foreign key, `UK` = unique (alone or as part of a composite unique key; the comment says which).\n> - Types are simplified for Mermaid: `uuid_arr` = `uuid[]`, `text_arr` = `text[]`, `enum_X` = PostgreSQL enum `X`.\n> - All primary keys are `uuid` unless the table is a join table with a composite key.\n\n## Cardinality legend\n\n| Mermaid | Meaning | Written as |\n|---|---|---|\n| `\\|\\|--\\|\\|` | exactly one to exactly one | **ONE-TO-ONE** |\n| `\\|\\|--o\\|` | one to zero-or-one | **ONE-TO-ONE (optional)** |\n| `\\|\\|--o{` | one to zero-or-many | **ONE-TO-MANY** |\n| `\\|o--o{` | zero-or-one to zero-or-many (nullable FK) | **ONE-TO-MANY (optional parent)** |\n| `}o--o{` via join table | many to many | **MANY-TO-MANY** (always implemented with a join table) |\n\n---\n\n## 0. Core overview (key tables only, no attributes)\n\nShows the backbone that every later phase builds on.\n\n```mermaid\nerDiagram\n    users ||--|| profiles : \"has (1:1)\"\n    users ||--o{ organization_members : \"belongs via\"\n    organizations ||--o{ organization_members : \"has team\"\n    users ||--o{ user_platform_roles : \"staff roles\"\n    organizations ||--o{ company_projects : \"publishes\"\n    organizations ||--o{ organization_claims : \"claimed through\"\n    organization_claims ||--|| verifications : \"reviewed as\"\n    organizations ||--o{ organization_approvals : \"admin approval\"\n    users ||--o{ verifications : \"subject of\"\n    organizations ||--o{ verifications : \"subject of\"\n    company_projects ||--o{ verifications : \"subject of\"\n    organizations ||--o{ subscriptions : \"subscribes (P2)\"\n    subscriptions ||--o{ entitlements : \"grants (P2)\"\n    users ||--o{ point_ledger : \"earns (P2)\"\n    organizations ||--o{ point_ledger : \"earns (P2)\"\n    events ||--o{ event_registrations : \"has (P2)\"\n    users ||--o{ event_registrations : \"registers (P2)\"\n    organizations ||--o{ opportunities : \"publishes (P3)\"\n    opportunities ||--o{ applications : \"receives (P3)\"\n    users ||--o{ applications : \"submits (P3)\"\n    organizations ||--o| benchmark_sets : \"owns (P4)\"\n    organizations ||--o{ saved_lists : \"buyer company (P4, BQ-51)\"\n```\n\n---\n\n## 1. Identity & access (Phase 1)\n\n```mermaid\nerDiagram\n    users {\n        uuid id PK \"= Supabase auth.users.id\"\n        citext email UK \"nullable\"\n        text phone UK \"nullable, E.164\"\n        timestamptz email_verified_at\n        timestamptz phone_verified_at\n        enum_AccountType account_type \"security context, set at registration\"\n        enum_UserStatus status\n        text preferred_locale \"ar | en\"\n        text timezone\n        timestamptz onboarding_completed_at\n        timestamptz suspended_at\n        timestamptz deactivated_at\n    }\n    consents {\n        uuid id PK\n        uuid user_id FK\n        enum_ConsentPurpose purpose\n        text document_version\n        boolean granted\n        timestamptz recorded_at \"append-only\"\n    }\n    user_platform_roles {\n        uuid id PK\n        uuid user_id FK \"UK (user_id, role) where active\"\n        enum_PlatformRole role\n        uuid granted_by FK\n        timestamptz revoked_at\n    }\n    organization_members {\n        uuid id PK\n        uuid organization_id FK \"UK (organization_id, user_id)\"\n        uuid user_id FK \"INDIVIDUAL accounts only\"\n        enum_MembershipStatus status\n        uuid invitation_id FK \"nullable\"\n        boolean show_on_company_profile \"public team only\"\n    }\n    invitations {\n        uuid id PK\n        uuid organization_id FK\n        citext email \"email or phone required\"\n        text phone\n        text token_hash UK\n        enum_InvitationStatus status\n        timestamptz expires_at\n        timestamptz membership_expires_at\n        uuid invited_by FK\n        uuid accepted_by FK\n    }\n    profiles {\n        uuid id PK\n        uuid user_id FK,UK \"1:1\"\n        citext slug UK \"nullable\"\n        text full_name\n        text headline\n        uuid avatar_media_id FK\n        text_arr languages\n        boolean is_searchable\n        jsonb section_visibility\n        smallint completion_score\n    }\n    profile_skills {\n        uuid profile_id PK,FK\n        uuid skill_id PK,FK\n    }\n    profile_locations {\n        uuid profile_id PK,FK\n        uuid location_id PK,FK\n    }\n    organizations {\n        uuid id PK\n        text slug UK\n        uuid account_user_id FK,UK \"the single Company Account\"\n    }\n    skills {\n        uuid id PK\n    }\n    locations {\n        uuid id PK\n    }\n\n    users ||--|| profiles : \"ONE-TO-ONE\"\n    users ||--o{ consents : \"ONE-TO-MANY\"\n    users ||--o{ user_platform_roles : \"ONE-TO-MANY\"\n    users |o--o| organizations : \"Company Account (1 per company)\"\n    users ||--o{ organization_members : \"Individual memberships\"\n    organizations ||--o{ organization_members : \"ONE-TO-MANY\"\n    organizations ||--o{ invitations : \"ONE-TO-MANY\"\n    invitations |o--o| organization_members : \"accepted into (optional)\"\n    profiles ||--o{ profile_skills : \"M:N skills\"\n    skills ||--o{ profile_skills : \"\"\n    profiles ||--o{ profile_locations : \"M:N cities\"\n    locations ||--o{ profile_locations : \"\"\n```\n\n**Relationships**\n\n| Relationship | Type | Notes |\n|---|---|---|\n| users — profiles | ONE-TO-ONE | Profile created at onboarding. |\n| users (COMPANY) — organizations | **ONE-TO-ONE** via `organizations.account_user_id` | The company's single user; the only source of company permissions (BQ-68). |\n| users (INDIVIDUAL) ⟷ organizations | **MANY-TO-MANY** via `organization_members` | Membership only; no permissions (BQ-68, BQ-74). |\n| users — user_platform_roles | ONE-TO-MANY | Staff only. |\n| profiles ⟷ skills, profiles ⟷ locations | MANY-TO-MANY | Join tables. |\n\n---\n\n## 2. Organizations & taxonomy (Phase 1)\n\n```mermaid\nerDiagram\n    organizations {\n        uuid id PK\n        enum_OrganizationStatus status\n        citext slug UK\n        text legal_name_ar\n        text legal_name_en\n        text trade_name_ar\n        text trade_name_en\n        text commercial_registration_number UK \"partial, normalised\"\n        text legal_entity_type\n        uuid logo_media_id FK\n        uuid cover_media_id FK\n        smallint founded_year\n        text size_range\n        jsonb capacity \"ranges with source\"\n        text_arr languages\n        citext website_domain\n        uuid headquarters_location_id FK\n        jsonb field_visibility\n        smallint completion_score\n        timestamptz approved_at \"admin approval\"\n        timestamptz claimed_at\n        timestamptz registration_verified_at \"signal\"\n        timestamptz domain_verified_at \"signal\"\n        timestamptz verified_at \"derived, rule BQ-53\"\n        timestamptz last_confirmed_at\n        timestamptz suspended_at\n        timestamptz archived_at\n        uuid merged_into_organization_id FK \"self, nullable\"\n        uuid source_import_row_id FK \"nullable\"\n    }\n    organization_contacts {\n        uuid id PK\n        uuid organization_id FK\n        enum_ContactType type\n        text value\n        boolean is_public\n        boolean is_imported \"private until confirmed\"\n        timestamptz confirmed_at \"contact signal\"\n    }\n    organization_industries {\n        uuid organization_id PK,FK\n        uuid industry_id PK,FK \"one or more, classification only\"\n    }\n    industries {\n        uuid id PK\n        citext slug UK\n        text name_ar\n        text name_en\n    }\n    organization_company_types {\n        uuid organization_id PK,FK\n        enum_CompanyType company_type PK \"one or more, classification only\"\n    }\n    organization_services {\n        uuid organization_id PK,FK\n        uuid service_id PK,FK\n        boolean is_primary\n    }\n    organization_coverage {\n        uuid organization_id PK,FK\n        uuid location_id PK,FK\n    }\n    organization_credentials {\n        uuid id PK\n        uuid organization_id FK\n        enum_CredentialType type\n        text issuer\n        date issued_on\n        date expires_on \"indexed for alerts\"\n        uuid document_id FK\n        timestamptz verified_at\n        boolean is_public\n    }\n    organization_approvals {\n        uuid id PK\n        uuid organization_id FK \"UK one open request\"\n        enum_OrganizationApprovalStatus status\n        uuid submitted_by FK\n        uuid decided_by FK \"SYSTEM_ADMIN\"\n        text reason\n    }\n    organization_media {\n        uuid organization_id PK,FK\n        uuid media_asset_id PK,FK\n        int sort_order\n    }\n    organization_claims {\n        uuid id PK\n        uuid organization_id FK\n        uuid claimant_user_id FK\n        uuid verification_id FK,UK \"1:1\"\n        text applicant_title\n        citext work_email\n        boolean work_email_domain_matches\n        jsonb automated_checks\n        timestamptz closed_at \"UK open claim per claimant\"\n    }\n    organization_merges {\n        uuid id PK\n        uuid source_organization_id FK\n        uuid target_organization_id FK\n        enum_MergeStatus status\n        jsonb detection_signals\n        uuid decided_by FK\n        text decision_reason\n    }\n    correction_suggestions {\n        uuid id PK\n        uuid organization_id FK\n        text field_path\n        jsonb suggested_value\n        enum_CorrectionSuggestionStatus status\n        uuid suggested_by FK\n    }\n    categories {\n        uuid id PK\n        uuid parent_id FK \"self, nullable\"\n        citext slug UK\n        text name_ar\n        text name_en\n        boolean is_active\n    }\n    services {\n        uuid id PK\n        uuid category_id FK\n        citext slug UK\n        text name_ar\n        text name_en\n    }\n    locations {\n        uuid id PK\n        uuid parent_id FK \"self: city to region\"\n        enum_LocationType type\n        char country_code\n        citext slug UK\n        text name_ar\n        text name_en\n    }\n    users {\n        uuid id PK\n    }\n    verifications {\n        uuid id PK\n    }\n    media_assets {\n        uuid id PK\n    }\n    documents {\n        uuid id PK\n    }\n\n    organizations ||--|{ organization_company_types : \"one or more types\"\n    organizations ||--o{ organization_industries : \"M:N industries\"\n    industries ||--o{ organization_industries : \"\"\n    organizations ||--o{ organization_contacts : \"ONE-TO-MANY\"\n    organizations ||--o{ organization_services : \"M:N services\"\n    services ||--o{ organization_services : \"\"\n    organizations ||--o{ organization_coverage : \"M:N locations\"\n    locations ||--o{ organization_coverage : \"\"\n    organizations ||--o{ organization_credentials : \"ONE-TO-MANY\"\n    documents |o--o{ organization_credentials : \"evidence (optional)\"\n    organizations ||--o{ organization_media : \"M:N gallery\"\n    media_assets ||--o{ organization_media : \"\"\n    organizations ||--o{ organization_claims : \"ONE-TO-MANY\"\n    users ||--o{ organization_claims : \"claimant\"\n    verifications ||--|| organization_claims : \"ONE-TO-ONE\"\n    organizations ||--o{ organization_merges : \"as source\"\n    organizations ||--o{ organization_merges : \"as target\"\n    organizations |o--o{ organizations : \"merged_into (self)\"\n    organizations ||--o{ correction_suggestions : \"ONE-TO-MANY\"\n    organizations ||--o{ organization_approvals : \"ONE-TO-MANY\"\n    categories |o--o{ categories : \"parent (tree)\"\n    categories ||--o{ services : \"ONE-TO-MANY\"\n    locations |o--o{ locations : \"parent (region)\"\n    locations |o--o{ organizations : \"headquarters (optional)\"\n```\n\n**Relationships**\n\n| Relationship | Type | Notes |\n|---|---|---|\n| organizations ⟷ services | MANY-TO-MANY | `organization_services` |\n| organizations ⟷ locations (coverage) | MANY-TO-MANY | `organization_coverage` |\n| organizations ⟷ media_assets (gallery) | MANY-TO-MANY | `organization_media` |\n| organization_claims — verifications | ONE-TO-ONE | The claim holds claim data; the verification is the review case. Grants ownership only (BQ-46). |\n| organizations — organization_approvals | ONE-TO-MANY | Admin approval requests (BQ-05). Separate from verification (BQ-46). |\n| organizations — organizations | ONE-TO-MANY (self, optional) | `merged_into_organization_id` |\n| categories — categories, locations — locations | ONE-TO-MANY (self tree) | |\n\n---\n\n## 3. Company projects (portfolio), verification & media (Phase 1)\n\n```mermaid\nerDiagram\n    company_projects {\n        uuid id PK\n        uuid organization_id FK \"UK (organization_id, slug)\"\n        citext slug\n        enum_ProjectStatus status\n        text name_ar \"one name required\"\n        text name_en\n        text project_type\n        uuid location_id FK\n        date start_date\n        date end_date\n        text company_role\n        text client_name \"private unless disclosed\"\n        enum_ClientDisclosureStatus client_disclosure\n        smallint completion_score\n        smallint points_score \"0 to 50\"\n        text fingerprint\n        timestamptz published_at\n        timestamptz verified_at\n    }\n    company_project_services {\n        uuid company_project_id PK,FK\n        uuid service_id PK,FK\n    }\n    company_project_media {\n        uuid company_project_id PK,FK\n        uuid media_asset_id PK,FK\n        int sort_order\n    }\n    verifications {\n        uuid id PK\n        enum_VerificationType type\n        enum_VerificationStatus status\n        uuid subject_user_id FK \"exactly one subject\"\n        uuid subject_organization_id FK\n        uuid subject_project_id FK\n        uuid subject_credential_id FK\n        uuid subject_contact_id FK\n        uuid subject_experience_id FK \"added Phase 3\"\n        uuid requested_by_user_id FK\n        uuid on_behalf_of_organization_id FK\n        uuid assigned_reviewer_id FK\n        timestamptz due_at \"SLA\"\n        timestamptz decided_at\n        timestamptz expires_at\n    }\n    verification_documents {\n        uuid verification_id PK,FK\n        uuid document_id PK,FK\n        text document_role\n    }\n    verification_decisions {\n        uuid id PK\n        uuid verification_id FK\n        enum_VerificationStatus from_status\n        enum_VerificationStatus to_status\n        uuid decided_by FK \"null = system\"\n        text reason \"required for REJECTED, NEEDS_INFO\"\n        text internal_note\n    }\n    media_assets {\n        uuid id PK\n        uuid uploaded_by FK\n        uuid organization_id FK\n        enum_MediaType media_type\n        text storage_path UK \"with bucket\"\n        text external_url \"LINK only\"\n        text content_sha256\n        text perceptual_hash\n        enum_FileStatus status\n        timestamptz deleted_at\n    }\n    documents {\n        uuid id PK\n        uuid uploaded_by FK\n        uuid organization_id FK\n        text storage_path UK \"private bucket\"\n        text sha256\n        enum_DataClassification classification\n        enum_FileStatus status\n        timestamptz retention_until\n        timestamptz deleted_at\n    }\n    organizations {\n        uuid id PK\n    }\n    organization_credentials {\n        uuid id PK\n    }\n    users {\n        uuid id PK\n    }\n    services {\n        uuid id PK\n    }\n\n    organizations ||--o{ company_projects : \"ONE-TO-MANY\"\n    company_projects ||--o{ company_project_services : \"M:N services\"\n    services ||--o{ company_project_services : \"\"\n    company_projects ||--o{ company_project_media : \"M:N media\"\n    media_assets ||--o{ company_project_media : \"\"\n    users |o--o{ verifications : \"subject (optional)\"\n    organizations |o--o{ verifications : \"subject (optional)\"\n    company_projects |o--o{ verifications : \"subject (optional)\"\n    organization_credentials |o--o{ verifications : \"signal subject (optional)\"\n    organization_contacts |o--o{ verifications : \"signal subject (optional)\"\n    users ||--o{ verifications : \"requested_by\"\n    verifications ||--o{ verification_documents : \"M:N documents\"\n    documents ||--o{ verification_documents : \"\"\n    verifications ||--|{ verification_decisions : \"ONE-TO-MANY history\"\n    users |o--o{ media_assets : \"uploaded\"\n    users |o--o{ documents : \"uploaded\"\n```\n\n**Polymorphic subjects without losing referential integrity.** `verifications` uses **one nullable FK column per subject type** plus `CHECK (num_nonnulls(...) = 1)`, instead of a generic `subject_type + subject_id`. The same pattern is used by `abuse_reports`, `appeals`, `point_ledger`, `badge_awards`, `visibility_snapshots` and `entitlements`.\n\n---\n\n## 4. Search, content, moderation, notifications, audit, imports, platform (Phase 1)\n\n```mermaid\nerDiagram\n    search_documents {\n        uuid id PK\n        enum_SearchSubjectType subject_type\n        uuid organization_id FK,UK \"one of\"\n        uuid profile_id FK,UK \"one of\"\n        citext slug\n        text normalized_text \"GIN trigram\"\n        tsvector search_vector \"GIN\"\n        uuid_arr category_ids \"GIN\"\n        uuid_arr service_ids \"GIN\"\n        uuid_arr location_ids \"GIN\"\n        text_arr languages\n        boolean is_verified\n        numeric visibility_score \"P2\"\n        boolean is_sponsored \"P2, label only\"\n        timestamptz data_updated_at\n    }\n    companies_to_watch_selections {\n        uuid id PK\n        uuid organization_id FK \"admin pick, not paid\"\n        uuid selected_by FK\n        timestamptz starts_at\n        timestamptz ends_at\n    }\n    content_items {\n        uuid id PK\n        enum_ContentType type \"UK (type, slug)\"\n        enum_ContentStatus status\n        citext slug\n        text title_ar\n        text title_en\n        uuid author_user_id FK\n        timestamptz published_at\n    }\n    abuse_reports {\n        uuid id PK\n        enum_AbuseReportTargetType target_type\n        uuid target_organization_id FK \"exactly one target\"\n        uuid target_project_id FK\n        uuid target_user_id FK\n        uuid target_content_item_id FK\n        uuid reporter_user_id FK\n        text category\n        enum_AbuseReportStatus status\n        timestamptz sla_due_at\n    }\n    appeals {\n        uuid id PK\n        enum_AppealSubjectType subject_type\n        uuid subject_verification_decision_id FK \"exactly one subject\"\n        uuid subject_organization_id FK\n        uuid subject_merge_id FK\n        uuid subject_ledger_entry_id FK \"P2\"\n        uuid submitted_by FK\n        enum_AppealStatus status\n        uuid decided_by FK\n    }\n    notifications {\n        uuid id PK\n        uuid recipient_user_id FK\n        text type\n        uuid organization_id FK\n        jsonb payload\n        timestamptz read_at\n    }\n    notification_deliveries {\n        uuid id PK\n        uuid notification_id FK\n        enum_NotificationChannel channel\n        enum_DeliveryStatus status\n        text destination_masked\n        int attempt_count\n    }\n    notification_preferences {\n        uuid user_id PK,FK\n        text notification_type PK\n        enum_NotificationChannel channel PK\n        boolean enabled\n    }\n    audit_logs {\n        uuid id PK\n        timestamptz occurred_at\n        enum_AuditActorType actor_type\n        uuid actor_user_id FK \"nullable\"\n        uuid organization_id FK \"context\"\n        text action\n        text entity_type\n        uuid entity_id \"no FK\"\n        jsonb changes \"redacted\"\n        text request_id\n        inet ip_address\n    }\n    analytics_events {\n        uuid id PK\n        text event_name\n        timestamptz occurred_at \"partition key\"\n        text anonymous_id\n        uuid user_id \"after consent, no FK\"\n        uuid organization_id \"no FK\"\n        jsonb properties\n        boolean is_bot\n        boolean is_internal\n    }\n    import_batches {\n        uuid id PK\n        uuid source_document_id FK\n        enum_ImportBatchStatus status\n        int total_rows\n        int error_rows\n        jsonb quality_report\n    }\n    import_rows {\n        uuid id PK\n        uuid batch_id FK \"UK (batch_id, row_number)\"\n        int row_number\n        text source_record_id\n        jsonb normalized_data\n        jsonb errors\n        enum_ImportRowAction action\n        uuid duplicate_of_organization_id FK\n        uuid created_organization_id FK\n    }\n    outbox_events {\n        uuid id PK\n        text event_name\n        text aggregate_type\n        uuid aggregate_id\n        jsonb payload\n        enum_OutboxStatus status\n        int attempts\n        timestamptz available_at\n    }\n    organizations {\n        uuid id PK\n    }\n    profiles {\n        uuid id PK\n    }\n    users {\n        uuid id PK\n    }\n    documents {\n        uuid id PK\n    }\n\n    organizations |o--o| search_documents : \"projected to (optional)\"\n    organizations ||--o{ companies_to_watch_selections : \"admin picks\"\n    profiles |o--o| search_documents : \"projected to (optional)\"\n    users ||--o{ content_items : \"authors\"\n    users ||--o{ abuse_reports : \"reports\"\n    organizations |o--o{ abuse_reports : \"target (optional)\"\n    users ||--o{ appeals : \"submits\"\n    users ||--o{ notifications : \"receives\"\n    notifications ||--o{ notification_deliveries : \"ONE-TO-MANY\"\n    users ||--o{ notification_preferences : \"ONE-TO-MANY\"\n    users |o--o{ audit_logs : \"actor (optional)\"\n    documents ||--o{ import_batches : \"source file\"\n    import_batches ||--|{ import_rows : \"ONE-TO-MANY\"\n    import_rows |o--o| organizations : \"created (optional)\"\n```\n\n`audit_logs.entity_id`, `analytics_events.*_id` and `outbox_events.aggregate_id` have **no foreign keys on purpose**. They point to many tables, must survive deletion of the referenced row, and (analytics) live in a partitioned table.\n\n---\n\n## 5. Billing & entitlements — ⏸ DEFERRED future monetization (business rules §11)\n\n```mermaid\nerDiagram\n    membership_plans {\n        uuid id PK\n        text code UK\n        enum_PlanAudience audience\n        int price_amount_minor \"halalas\"\n        char currency \"SAR\"\n        enum_BillingInterval billing_interval\n        int trial_days\n        boolean is_public\n        boolean is_active\n    }\n    plan_features {\n        uuid id PK\n        uuid plan_id FK \"UK (plan_id, feature_key)\"\n        text feature_key\n        boolean is_enabled\n        int limit_value \"null = unlimited\"\n    }\n    subscriptions {\n        uuid id PK\n        uuid subscriber_organization_id FK \"exactly one subscriber\"\n        uuid subscriber_user_id FK \"BQ-14\"\n        uuid plan_id FK\n        enum_SubscriptionStatus status \"UK one live per subscriber\"\n        int price_amount_minor \"snapshot\"\n        timestamptz trial_ends_at\n        timestamptz current_period_start\n        timestamptz current_period_end\n        timestamptz grace_ends_at\n        boolean cancel_at_period_end\n        uuid pending_plan_id FK \"downgrade at period end\"\n        boolean is_manual\n    }\n    invoices {\n        uuid id PK\n        uuid subscription_id FK\n        text invoice_number UK \"sequential, legal\"\n        enum_InvoiceStatus status\n        int subtotal_minor\n        int discount_minor\n        int vat_minor\n        int total_minor\n        jsonb buyer_snapshot\n        uuid document_id FK\n        uuid coupon_redemption_id FK\n    }\n    payments {\n        uuid id PK\n        uuid invoice_id FK\n        text provider \"UK (provider, provider_payment_ref)\"\n        text provider_payment_ref\n        enum_PaymentStatus status\n        int amount_minor\n        text idempotency_key UK\n        timestamptz paid_at\n    }\n    coupons {\n        uuid id PK\n        citext code UK\n        enum_CouponDiscountType discount_type\n        int discount_value\n        uuid plan_id FK \"nullable\"\n        int max_redemptions\n        int redeemed_count\n    }\n    coupon_redemptions {\n        uuid id PK\n        uuid coupon_id FK \"UK (coupon_id, subscription_id)\"\n        uuid subscription_id FK\n        uuid redeemed_by_user_id FK\n    }\n    entitlements {\n        uuid id PK\n        uuid subscriber_organization_id FK \"exactly one subscriber\"\n        uuid subscriber_user_id FK\n        text feature_key\n        boolean is_enabled\n        int limit_value\n        enum_EntitlementSource source\n        uuid subscription_id FK \"when source = PLAN\"\n        uuid granted_by FK\n        timestamptz valid_until\n        timestamptz revoked_at\n    }\n    payment_provider_events {\n        uuid id PK\n        text provider \"UK (provider, provider_event_id)\"\n        text provider_event_id\n        jsonb payload\n        boolean signature_verified\n        timestamptz processed_at\n    }\n    idempotency_records {\n        uuid id PK\n        text scope_key \"UK (scope_key, idempotency_key)\"\n        text idempotency_key\n        text request_hash\n        jsonb response_body\n        timestamptz expires_at\n    }\n    organizations {\n        uuid id PK\n    }\n    users {\n        uuid id PK\n    }\n    documents {\n        uuid id PK\n    }\n\n    membership_plans ||--o{ plan_features : \"ONE-TO-MANY\"\n    membership_plans ||--o{ subscriptions : \"ONE-TO-MANY\"\n    organizations |o--o{ subscriptions : \"subscriber (optional)\"\n    users |o--o{ subscriptions : \"subscriber (optional)\"\n    subscriptions ||--o{ invoices : \"ONE-TO-MANY\"\n    invoices ||--o{ payments : \"ONE-TO-MANY\"\n    documents |o--o| invoices : \"PDF (optional)\"\n    coupons ||--o{ coupon_redemptions : \"ONE-TO-MANY\"\n    subscriptions ||--o{ coupon_redemptions : \"ONE-TO-MANY\"\n    coupon_redemptions |o--o| invoices : \"applied to (optional)\"\n    subscriptions |o--o{ entitlements : \"source PLAN (optional)\"\n    organizations |o--o{ entitlements : \"holder (optional)\"\n```\n\n---\n\n## 6. Engagement: points, levels, badges, visibility (Phase 2)\n\n```mermaid\nerDiagram\n    point_rules {\n        uuid id PK\n        text code UK\n        enum_PointSubjectType subject_type\n        enum_PointCategory category\n        boolean is_active\n    }\n    point_rule_versions {\n        uuid id PK\n        uuid rule_id FK \"UK (rule_id, version)\"\n        int version\n        int points \"negative for penalties\"\n        int max_per_subject\n        int daily_cap\n        int weekly_cap\n        boolean requires_verification\n        boolean requires_review\n        timestamptz effective_from \"no overlap per rule\"\n        timestamptz effective_to\n    }\n    point_ledger {\n        uuid id PK\n        enum_PointSubjectType subject_type\n        uuid subject_user_id FK \"exactly one subject\"\n        uuid subject_organization_id FK\n        enum_PointCategory category\n        enum_LedgerEntryType entry_type\n        int amount \"signed, not zero\"\n        uuid rule_version_id FK \"null only for admin adjustment\"\n        text source_type\n        uuid source_id\n        text idempotency_key UK\n        uuid reverses_entry_id FK,UK \"self, reversed at most once\"\n        text reason\n        timestamptz occurred_at \"decay basis\"\n    }\n    point_balances {\n        uuid id PK\n        uuid subject_user_id FK \"UK (subject, category)\"\n        uuid subject_organization_id FK\n        enum_PointCategory category\n        int balance \"projection\"\n        uuid last_entry_id FK\n        timestamptz frozen_at\n    }\n    rewards {\n        uuid id PK\n        text code UK\n        uuid unlock_level_id FK\n        int unlock_min_points\n        boolean is_active \"unlocked, never spent\"\n    }\n    member_levels {\n        uuid id PK\n        text code UK\n        int min_points\n        int max_points\n        boolean requires_verification\n        boolean requires_review\n        boolean requires_nomination\n    }\n    level_assignments {\n        uuid id PK\n        uuid user_id FK \"UK one ACTIVE per user\"\n        uuid level_id FK\n        enum_LevelAssignmentStatus status\n        int points_at_assignment\n        uuid nominated_by FK\n        uuid reviewed_by FK\n    }\n    badges {\n        uuid id PK\n        text code UK\n        enum_PointSubjectType subject_type\n        boolean is_manual\n        jsonb criteria\n    }\n    badge_awards {\n        uuid id PK\n        uuid badge_id FK \"UK (badge, subject) where not revoked\"\n        uuid subject_user_id FK\n        uuid subject_organization_id FK\n        timestamptz awarded_at\n        timestamptz revoked_at\n    }\n    visibility_snapshots {\n        uuid id PK\n        uuid subject_user_id FK \"UK current per subject\"\n        uuid subject_organization_id FK\n        numeric score \"0 to 100\"\n        jsonb components\n        text formula_version\n        boolean is_current\n        timestamptz computed_at\n    }\n    engagement_alerts {\n        uuid id PK\n        uuid subject_user_id FK\n        uuid subject_organization_id FK\n        text alert_type\n        enum_EngagementAlertStatus status\n    }\n    users {\n        uuid id PK\n    }\n    organizations {\n        uuid id PK\n    }\n\n    point_rules ||--|{ point_rule_versions : \"ONE-TO-MANY versions\"\n    point_rule_versions |o--o{ point_ledger : \"applied by (optional)\"\n    point_ledger |o--o| point_ledger : \"reversed by (self)\"\n    users |o--o{ point_ledger : \"subject (optional)\"\n    organizations |o--o{ point_ledger : \"subject (optional)\"\n    users |o--o{ point_balances : \"ONE-TO-MANY per category\"\n    organizations |o--o{ point_balances : \"ONE-TO-MANY per category\"\n    member_levels ||--o{ level_assignments : \"ONE-TO-MANY\"\n    member_levels |o--o{ rewards : \"unlocks\"\n    users ||--o{ level_assignments : \"history\"\n    badges ||--o{ badge_awards : \"ONE-TO-MANY\"\n    users |o--o{ badge_awards : \"subject (optional)\"\n    organizations |o--o{ badge_awards : \"subject (optional)\"\n    users |o--o{ visibility_snapshots : \"history\"\n    organizations |o--o{ visibility_snapshots : \"history\"\n    users |o--o{ engagement_alerts : \"subject\"\n    organizations |o--o{ engagement_alerts : \"subject\"\n```\n\n---\n\n## 7. Events (Phase 2)\n\n```mermaid\nerDiagram\n    events {\n        uuid id PK\n        citext slug UK\n        enum_EventStatus status\n        enum_EventKind kind\n        text title_ar\n        text title_en\n        uuid location_id FK\n        timestamptz starts_at\n        timestamptz ends_at\n        int capacity\n        jsonb agenda\n        uuid host_organization_id FK \"BQ-17\"\n    }\n    event_ticket_types {\n        uuid id PK\n        uuid event_id FK\n        text name_ar\n        int capacity\n        int price_amount_minor \"BQ-16\"\n        text required_feature_key \"plan eligibility\"\n        uuid min_level_id FK \"level eligibility\"\n    }\n    event_speakers {\n        uuid id PK\n        uuid event_id FK\n        uuid user_id FK \"nullable\"\n        text name\n    }\n    event_sponsors {\n        uuid id PK\n        uuid event_id FK\n        uuid organization_id FK \"nullable\"\n        text name\n        text tier\n    }\n    event_registrations {\n        uuid id PK\n        uuid event_id FK \"UK (event, user) where CONFIRMED or WAITLISTED\"\n        uuid ticket_type_id FK\n        uuid user_id FK\n        enum_RegistrationStatus status\n        int waitlist_position\n        text entry_code UK\n        timestamptz attended_at \"attendance fact\"\n        enum_AttendanceMethod attendance_method\n        uuid checked_in_by FK\n        uuid transferred_from_registration_id FK \"self\"\n        uuid certificate_document_id FK\n    }\n    event_feedback {\n        uuid id PK\n        uuid registration_id FK,UK\n        uuid event_id FK\n        smallint rating \"1 to 5\"\n        jsonb answers\n    }\n    users {\n        uuid id PK\n    }\n    organizations {\n        uuid id PK\n    }\n    member_levels {\n        uuid id PK\n    }\n\n    events ||--|{ event_ticket_types : \"ONE-TO-MANY\"\n    events ||--o{ event_speakers : \"ONE-TO-MANY\"\n    events ||--o{ event_sponsors : \"ONE-TO-MANY\"\n    events ||--o{ event_registrations : \"ONE-TO-MANY\"\n    event_ticket_types ||--o{ event_registrations : \"ONE-TO-MANY\"\n    users ||--o{ event_registrations : \"ONE-TO-MANY\"\n    event_registrations |o--o| event_registrations : \"transferred from (self)\"\n    event_registrations ||--o| event_feedback : \"ONE-TO-ONE (optional)\"\n    organizations |o--o{ events : \"hosts (optional)\"\n    organizations |o--o{ event_sponsors : \"sponsor (optional)\"\n    member_levels |o--o{ event_ticket_types : \"eligibility (optional)\"\n```\n\n**Users ⟷ events** is **MANY-TO-MANY** through `event_registrations`. The join row carries its own lifecycle (status, attendance, certificate).\n\n---\n\n## 8. Talent (Phase 3)\n\n```mermaid\nerDiagram\n    experiences {\n        uuid id PK\n        uuid user_id FK\n        uuid organization_id FK \"on-platform company, nullable\"\n        text organization_name \"off-platform\"\n        text title\n        date start_date\n        date end_date\n        boolean is_current\n        enum_EmploymentConfirmationStatus confirmation_status\n        uuid confirmed_by_user_id FK\n        timestamptz verified_at\n        boolean is_public\n    }\n    educations {\n        uuid id PK\n        uuid user_id FK\n        text institution_name\n        text degree ated from type\"\n        enum_OpportunityStatus status\n        text title_ar\n        text title_en\n        uuid location_id FK\n        timestamptz application_deadline\n        timestamptz published_at\n        enum_OpportunityOutcome outcome \"required when CLOSED\"\n    }\n    opportunity_skills {\n        uuid opportunity_id PK,FK\n        uuid skill_id PK,FK\n    }\n    opportunity_services {\n        uuid opportunity_id PK,FK\n        uuid service_id PK,FK\n    }\n    applications {\n        uuid id PK\n        uuid opportunity_id FK\n        uuid applicant_user_id FK \"individual; UK per opportunity\"\n        enum_ApplicationStatus status\n        jsonb availability\n        uuid attachment_document_id FK\n    }\n    supplier_responses {\n        uuid id PK\n        uuid opportunity_id FK \"SUPPLIER_REQUEST only, any company\"\n        uuid responding_organization_id FK \"UK per opportunity\"\n        uuid submitted_by_user_id FK\n        enum_SupplierResponseStatus status\n        text message\n    }\n    application_messages {\n        uuid id PK\n        uuid application_id FK\n        uuid sender_user_id FK\n        enum_MessageSide sender_side\n        text body\n        timestamptz read_at\n    }\n    opportunity_feedback {\n        uuid id PK\n        uuid opportunity_id FK \"UK (opportunity, application, side)\"\n        uuid application_id FK\n        uuid respondent_user_id FK\n        enum_MessageSide respondent_side\n        smallint rating\n    }\n    organizations {\n        uuid id PK\n    }\n    users {\n        uuid id PK\n    }\n    skills {\n        uuid id PK\n    }\n    services {\n        uuid id PK\n    }\n\n    organizations ||--o{ opportunities : \"publishes\"\n    opportunities ||--o{ opportunity_skills : \"M:N skills\"\n    skills ||--o{ opportunity_skills : \"\"\n    opportunities ||--o{ opportunity_services : \"M:N services\"\n    services ||--o{ opportunity_services : \"\"\n    opportunities ||--o{ applications : \"ONE-TO-MANY\"\n    users ||--o{ applications : \"individual applicant\"\n    opportunities ||--o{ supplier_responses : \"B2B responses\"\n    organizations ||--o{ supplier_responses : \"supplier company\"\n    applications ||--o{ application_messages : \"ONE-TO-MANY\"\n    opportunities ||--o{ opportunity_feedback : \"ONE-TO-MANY\"\n    applications |o--o{ opportunity_feedback : \"ONE-TO-MANY\"\n```\n\n---\n\n## 10. Intelligence & buyer features (Phase 4 · buyer features on hold, BQ-51)\n\n```mermaid\nerDiagram\n    metric_definitions {\n        uuid id PK\n        text code \"UK (code, version)\"\n        int version\n        enum_MetricGroup metric_group\n        text formula_description\n        int min_sample_size \"default 5\"\n    }\n    metric_facts {\n        uuid id PK\n        uuid metric_definition_id FK\n        uuid organization_id FK \"null = aggregate\"\n        text dimension_key\n        date period_start\n        date period_end\n        numeric value\n        int sample_size\n        boolean is_estimated\n        text data_version\n    }\n    benchmark_sets {\n        uuid id PK\n        uuid organization_id FK,UK \"1:1 subscriber company\"\n    }\n    benchmark_set_members {\n        uuid id PK\n        uuid benchmark_set_id FK \"max 3 active\"\n        uuid competitor_organization_id FK\n        timestamptz added_at\n        timestamptz removed_at \"1 change per 90 days\"\n    }\n    reports {\n        uuid id PK\n        enum_ReportType type\n        enum_ReportStatus status\n        uuid organization_id FK\n        uuid requested_by_user_id FK\n        text purpose\n        jsonb parameters\n        text data_version\n        jsonb rule_versions\n        uuid document_id FK\n        timestamptz expires_at\n    }\n    data_exports {\n        uuid id PK\n        uuid requested_by_user_id FK\n        uuid organization_id FK\n        enum_ExportFormat format\n        text purpose\n        int row_count\n        text watermark_id UK\n        uuid report_id FK\n    }\n    saved_lists {\n        uuid id PK\n        uuid organization_id FK \"buyer company BQ-51\"\n        text name\n        timestamptz deleted_at\n    }\n    saved_list_items {\n        uuid id PK\n        uuid saved_list_id FK \"UK (list, company)\"\n        uuid company_organization_id FK\n        text internal_note \"never shown to company\"\n    }\n    saved_searches {\n        uuid id PK\n        uuid organization_id FK\n        uuid created_by_user_id FK\n        jsonb query\n        boolean alerts_enabled\n    }\n    rfis {\n        uuid id PK\n        uuid requester_organization_id FK\n        uuid created_by FK\n        text subject\n        enum_RfiStatus status\n        timestamptz due_at\n    }\n    rfi_recipients {\n        uuid id PK\n        uuid rfi_id FK \"UK (rfi, recipient)\"\n        uuid recipient_organization_id FK\n        enum_RfiRecipientStatus status\n        text response_text\n        uuid response_document_id FK\n    }\n    organizations {\n        uuid id PK\n    }\n    users {\n        uuid id PK\n    }\n    documents {\n        uuid id PK\n    }\n\n    metric_definitions ||--o{ metric_facts : \"ONE-TO-MANY\"\n    organizations |o--o{ metric_facts : \"subject (optional)\"\n    organizations ||--o| benchmark_sets : \"ONE-TO-ONE (optional)\"\n    benchmark_sets ||--o{ benchmark_set_members : \"ONE-TO-MANY\"\n    organizations ||--o{ benchmark_set_members : \"as competitor\"\n    organizations ||--o{ reports : \"ONE-TO-MANY\"\n    documents |o--o| reports : \"file (optional)\"\n    users ||--o{ data_exports : \"ONE-TO-MANY\"\n    reports |o--o{ data_exports : \"exported as (optional)\"\n    organizations ||--o{ saved_lists : \"buyer company owns\"\n    saved_lists ||--o{ saved_list_items : \"ONE-TO-MANY\"\n    organizations ||--o{ saved_list_items : \"listed company\"\n    organizations ||--o{ saved_searches : \"ONE-TO-MANY\"\n    organizations ||--o{ rfis : \"requester\"\n    rfis ||--|{ rfi_recipients : \"ONE-TO-MANY\"\n    organizations ||--o{ rfi_recipients : \"recipient company\"\n```\n\n**Organizations ⟷ organizations** appears three times as **MANY-TO-MANY** with different meanings: benchmark competitors, supplier-list entries, and RFI recipients. Each is a separate join table, because each relationship has its own rules and privacy.\n\n---\n\n## Important indexes (summary)\n\n| Table | Index | Why |\n|---|---|---|\n| users | unique partial `email`, `phone` | Login lookup and duplicate-account prevention (§20.2). |\n| organizations | unique `account_user_id` | Company-access check on every company route; one Company Account per company (BQ-68). |\n| organization_members | `(organization_id, status, show_on_company_profile)` | Public team section (BQ-64). |\n| organizations | GIN trigram on normalised names; `commercial_registration_number` unique partial; `website_domain` | Duplicate detection (ORG-09, §5.3), claim matching (§5.2). |\n| organizations | `last_confirmed_at`; `organization_approvals (status, submitted_at)` | Staleness job (ORG-08); admin approval queue (BQ-05). |\n| verifications | `(status, type, due_at)` | Reviewer queue ordered by SLA (§23). |\n| search_documents | GIN `search_vector`, GIN trigram `normalized_text`, GIN arrays, `visibility_score DESC` | Search under 1 second (§17), Arabic spelling tolerance (§7.4). |\n| point_ledger | unique `idempotency_key`; unique `reverses_entry_id`; `(subject, category, occurred_at)` | Exactly-once points, single reversal, caps and decay (§8.5, §8.6, §20.2). |\n| subscriptions | unique partial live subscription per subscriber | No double subscription (§20.2). |\n| payment_provider_events | unique `(provider, provider_event_id)` | Webhook idempotency (§15.1). |\n| event_registrations | unique `entry_code`; partial unique `(event_id, user_id)` | Check-in lookup; one active registration per user. |\n| audit_logs | `(entity_type, entity_id, occurred_at)`, `(actor_user_id, occurred_at)`, `(organization_id, occurred_at)` | Investigations (§3 auditor), buyer access log (§12.1, BQ-51). |\n| analytics_events | monthly partitions; `(organization_id, event_name, occurred_at)` | Company performance metrics (§11.2) without scanning everything. |\n| outbox_events | `(status, available_at)` | Worker polling. |\n"},{"name":"database-entities","title":"Database Entity Catalog","keywords":"tables fields catalog columns","markdown":"# Database Entity Catalog\n\n> The authoritative description of every table. The ERD (`database-erd.md`) shows *shape*; this file defines *meaning*.\n> Conventions (UUIDs, timestamps, naming, soft delete) are in `database-design-rules.md`. Enum values are in `enums-and-statuses.md`.\n>\n> **Traceability tags:** `PRD §14` = the table name appears in the PRD's proposed data model. Other tables cite the requirement that makes them necessary.\n> **Phase** = the phase whose migration creates the table.\n> **Mandatory business rules** (`business-rules.md`, 2026-09-17) override PRD field lists where they differ. ⏸ = designed but **deferred** (not built unless explicitly requested).\n\n## Standard columns (not repeated below)\n\n| Column | Type | Applies to |\n|---|---|---|\n| `id` | `uuid` PK | Every table except pure join tables (composite PK) |\n| `created_at` | `timestamptz NOT NULL DEFAULT now()` | Every table |\n| `updated_at` | `timestamptz NOT NULL` (set by Prisma `@updatedAt`) | Every **mutable** table (not append-only tables) |\n| `created_by` / `updated_by` | `uuid NULL → users.id` | Tables marked **[sensitive]** (§14.1 \"creator, modifier and modification date for every sensitive entity\") |\n\nNullable = `NULL` allowed. Required = `NOT NULL`.\n\n---\n\n## Summary\n\n| Phase | Tables | Modules |\n|---|---|---|\n| **1 — Core & company directory** | 46 | identity, access, profiles, taxonomy, media, organizations, projects, verification, search, content, moderation, notifications, audit, analytics, imports, platform |\n| **2 — Points, events (+ ⏸ monetization)** | 27 | engagement, events; billing and entitlements (9 tables) ⏸ deferred — business rules §11 |\n| **3 — Professionals & opportunities** | 12 | talent, opportunities (2 tables ⏸ deferred) |\n| **4 — Intelligence & buyer features** | 11 | intelligence, institutional (on hold, BQ-51), audit |\n| **5 — Observatory & partner API** | 0 (not specified, RG-19) | — |\n| **Total** | **96** | 92 business tables + 4 technical (`search_documents`, `outbox_events`, `idempotency_records`, `payment_provider_events`) |\n\nNot stored in the app schema: password hashes, sessions, OTP challenges and MFA factors live in **Supabase Auth** (`auth` schema). See ADR-003 and BQ-30.\n\n### Index of tables\n\n| # | Table | Phase | Module | PRD §14 |\n|---|---|---|---|---|\n| 1 | users | 1 | identity | ✅ |\n| 2 | consents | 1 | identity | ✅ |\n| 3 | user_platform_roles | 1 | access | — (§3, §4) |\n| 4 | organization_members | 1 | access | ✅ |\n| 5 | invitations | 1 | access | — (AUTH-05) |\n| 6 | profiles | 1 | profiles | ✅ |\n| 7 | profile_skills | 1 | profiles | — (§5.1) |\n| 8 | profile_locations | 1 | profiles | — (§5.1) |\n| 9 | categories | 1 | taxonomy | ✅ |\n| 10 | services | 1 | taxonomy | ✅ |\n| 11 | locations | 1 | taxonomy | ✅ |\n| 12 | skills | 1 | taxonomy | — (§5.1, §10.1) |\n| 13 | industries | 1 | taxonomy | — (rules §3, BQ-63) |\n| 14 | media_assets | 1 | media | — (ORG-02, §8.6) |\n| 15 | documents | 1 | media | ✅ |\n| 16 | organizations | 1 | organizations | ✅ |\n| 17 | organization_contacts | 1 | organizations | — (ORG-04, §22.1) |\n| 18 | organization_services | 1 | organizations | ✅ |\n| 19 | organization_coverage | 1 | organizations | ✅ |\n| 20 | organization_credentials | 1 | organizations | — (ORG-05) |\n| 21 | organization_media | 1 | organizations | — (ORG-02) |\n| 22 | organization_claims | 1 | organizations | — (§5.2) |\n| 23 | organization_approvals | 1 | organizations | — (decisions BQ-05, BQ-46) |\n| 24 | organization_company_types | 1 | organizations | — (rules §2, BQ-61) |\n| 25 | organization_industries | 1 | organizations | — (rules §3, BQ-63) |\n| 26 | organization_merges | 1 | organizations | — (ORG-09) |\n| 27 | correction_suggestions | 1 | organizations | — (§4) |\n| 28 | company_projects | 1 | projects | ✅ (PRD `projects`, renamed by rules §4) |\n| 29 | company_project_services | 1 | projects | — (§7.3) |\n| 30 | company_project_media | 1 | projects | ✅ (PRD `project_media`) |\n| 31 | verifications | 1 | verification | ✅ |\n| 32 | verification_documents | 1 | verification | — (§5.1, §5.2) |\n| 33 | verification_decisions | 1 | verification | — (§5.2, §8.6 decision record) |\n| 34 | search_documents | 1 | search | — (§7.4 technical) |\n| 35 | companies_to_watch_selections | 1 | search | — (BQ-70) |\n| 36 | content_items | 1 | content | ✅ |\n| 37 | abuse_reports | 1 | moderation | — (§13, §23) |\n| 38 | appeals | 1 | moderation | — (§8.6, §13) |\n| 39 | notifications | 1 | notifications | ✅ |\n| 40 | notification_deliveries | 1 | notifications | — (§15.2) |\n| 41 | notification_preferences | 1 | notifications | — (§5.1 preferences) |\n| 42 | audit_logs | 1 | audit | ✅ |\n| 43 | analytics_events | 1 | analytics | — (§16) |\n| 44 | import_batches | 1 | imports | — (§22.1) |\n| 45 | import_rows | 1 | imports | — (§22.1) |\n| 46 | outbox_events | 1 | platform | — (technical, ADR-011) |\n| 47 | membership_plans ⏸ | 2 | billing | ✅ |\n| 48 | plan_features ⏸ | 2 | billing | — (§7.5) |\n| 49 | subscriptions ⏸ | 2 | billing | ✅ |\n| 50 | invoices ⏸ | 2 | billing | ✅ |\n| 51 | payments ⏸ | 2 | billing | ✅ |\n| 52 | coupons ⏸ | 2 | billing | — (§7.5) |\n| 53 | coupon_redemptions ⏸ | 2 | billing | — (§7.5) |\n| 54 | entitlements ⏸ | 2 | entitlements | ✅ |\n| 55 | payment_provider_events ⏸ | 2 | billing | — (§15.1 idempotency) |\n| 56 | idempotency_records | 2 | platform | — (§15.1) |\n| 57 | point_rules | 2 | engagement | ✅ |\n| 58 | point_rule_versions | 2 | engagement | ✅ (\"rules and their versions\") |\n| 59 | point_ledger | 2 | engagement | ✅ |\n| 60 | point_balances | 2 | engagement | — (§8.1 separate balances) |\n| 61 | member_levels | 2 | engagement | — (§9.1) |\n| rewards | 2 | engagement | — (rules §10, BQ-59) |\n| 62 | level_assignments | 2 | engagement | — (§9.1, §8.6) |\n| 63 | badges | 2 | engagement | ✅ |\n| 64 | badge_awards | 2 | engagement | ✅ |\n| 65 | visibility_snapshots | 2 | engagement | ✅ |\n| 66 | engagement_alerts | 2 | engagement | — (§8.6) |\n| 67 | events | 2 | events | ✅ |\n| 68 | event_ticket_types | 2 | events | — (§9.2) |\n| 69 | event_speakers | 2 | events | — (§9.2) |\n| 70 | event_sponsors | 2 | events | — (§9.2) |\n| 71 | event_registrations | 2 | events | ✅ |\n| 72 | event_feedback | 2 | events | — (§9.2) |\n| 73 | experiences | 3 | talent | — (§10.1) |\n| 74 | educations | 3 | talent | — (§10.1) |\n| 75 | user_certifications | 3 | talent | — (§10.1) |\n| 76 | profile_projects | 3 | talent | — (§10.1) |\n| 77 | profile_media | 3 | talent | — (§10.1) |\n| 78 | opportunities | 3 | opportunities | ✅ |\n| 79 | opportunity_skills | 3 | opportunities | — (§10) |\n| 80 | opportunity_services | 3 | opportunities | — (§10.2 supplier requests) |\n| 81 | applications | 3 | opportunities | ✅ |\n| 82 | application_messages ⏸ | 3 | opportunities | — (§6 \"controlled messaging\"; deferred, rules §9) |\n| supplier_responses | 3 | opportunities | — (rules §7) |\n| 83 | opportunity_feedback ⏸ | 3 | opportunities | — (§10.3; deferred, rules §9) |\n| 84 | metric_definitions | 4 | intelligence | ✅ |\n| 85 | metric_facts | 4 | intelligence | ✅ |\n| 86 | benchmark_sets | 4 | intelligence | ✅ |\n| 87 | benchmark_set_members | 4 | intelligence | — (§11.1) |\n| 88 | reports | 4 | intelligence | ✅ |\n| 89 | data_exports | 4 | audit | — (§12.3, §18) |\n| 90 | saved_lists | 4 | institutional | ✅ |\n| 91 | saved_list_items | 4 | institutional | ✅ |\n| 92 | saved_searches | 4 | institutional | — (§12.1) |\n| 93 | rfis | 4 | institutional | ✅ |\n| 94 | rfi_recipients | 4 | institutional | — (§1
