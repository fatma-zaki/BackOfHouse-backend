/organizations/:organizationId/employment-confirmations` | Org | PENDING requests | §10.1 |\n| POST | `/organizations/:organizationId/employment-confirmations/:experienceId/confirm` · `/decline` | Org | T-24 | §10.1 |\n\n## 18. Opportunities (Phase 3) — unified model (business rules §5–§9)\n\nOne set of endpoints for all opportunity types; responses include `type`, `audience` and `allowed_actions` so clients reuse one component set (rules §5, §14).\n\n**Individual-facing (audience INDIVIDUAL: JOB, CO_OP, VOLUNTEERING)** — company projects are **not** opportunities (BQ-62); they are served by `/companies/:slug/projects`\n\n| Method | Path | Access | Rules | Source |\n|---|---|---|---|---|\n| GET | `/opportunities` · `/opportunities/:id` | Public | Published, `audience = INDIVIDUAL` **only**; filters `type`, `city`, `skill`, `service`. Supplier requests never appear here | Rules §6 |\n| POST | `/opportunities/:id/applications` | Individual | Opportunity must be INDIVIDUAL audience and PUBLISHED; one per applicant (T-17). Company accounts cannot apply (BQ-60). CO_OP student eligibility → BQ-72 | Rules §8 |\n| GET | `/me/applications` · `/me/applications/:id` | Self | | Rules §8 |\n| POST | `/me/applications/:id/withdraw` | Self | → WITHDRAWN | Rules §8 |\n\n**Company-facing (audience COMPANY: SUPPLIER_REQUEST)**\n\n| Method | Path | Access | Rules | Source |\n|---|---|---|---|---|\n| GET | `/supplier-requests` · `/supplier-requests/:id` | Company | Published supplier requests, for **Company Accounts only** (BQ-65). Individuals and visitors get 403 / 404, never read-only access | Rules §6, §7, BQ-65 |\n| POST | `/supplier-requests/:id/responses` | Org (body `organization_id`) | **Any** company may respond; no company-type restriction (BQ-66); responding company ≠ buyer; one per company (T-31). **Individuals cannot respond** | Rules §7, BQ-66 |\n| GET | `/organizations/:organizationId/supplier-responses` | Org | Responses the company has sent | Rules §7 |\n| POST | `/organizations/:organizationId/supplier-responses/:responseId/withdraw` | Org | → WITHDRAWN | Rules §7 |\n\n**Company opportunity management (both audiences)**\n\n| Method | Path | Access | Rules | Source |\n|---|---|---|---|---|\n| GET / POST | `/organizations/:organizationId/opportunities` | Org | Create any type; the type policy map sets audience and required fields. JOB requires `employment_type` (PERMANENT \\| TEMPORARY \\| FREELANCE, BQ-73) | Rules §5, §9, BQ-73 |\n| PATCH | `/organizations/:organizationId/opportunities/:id` | Org | DRAFT or PAUSED only | Rules §9 |\n| POST | `…/:id/publish` · `/pause` · `/resume` · `/close` · `/archive` | Org | `close` needs `outcome`. **Publishing a JOB requires a verified company** → 409 `COMPANY_NOT_VERIFIED` (T-32, BQ-73) | Rules §9, BQ-73 |\n| GET | `/organizations/:organizationId/opportunities/:id/applications` | Org | Individual applicants (individual audience only) | Rules §9 |\n| POST | `…/applications/:applicationId/status` | Org | Body `{ status: REVIEWED \\| SHORTLISTED \\| CONTACT \\| ACCEPTED \\| REJECTED }`. **Any** of these from a non-final status (flexible, BQ-67). The company decides | Rules §8, BQ-67 |\n| GET | `/organizations/:organizationId/opportunities/:id/supplier-responses` | Org | Responses to the company's supplier request | Rules §7 |\n| GET | `/admin/opportunities` · POST `/:id/unpublish` | Staff:`admin.opportunities.moderate` | Moderation | §13 |\n\n**⏸ Deferred (rules §9):** `/applications/:id/messages`, interview and offer endpoints, `/applications/:id/feedback` (surveys), matching.\n\n## 19. Intelligence (Phase 4)\n\n| Method | Path | Access | Rules | PRD |\n|---|---|---|---|---|\n| GET | `/organizations/:organizationId/performance` | Org 💳 | Metrics by group (§11.2), period | §11.2 |\n| GET | `/organizations/:organizationId/benchmark-set` | Org | | §11.1 |\n| PUT | `/organizations/:organizationId/benchmark-set/competitors` | Org 💳 | Max 3; one change per 90 days (T-19) | §11.1 |\n| GET | `/organizations/:organizationId/comparisons/direct` | Org 💳 | Public data only | §11.1 |\n| GET | `/organizations/:organizationId/comparisons/benchmark` | Org 💳 | Sample ≥ 5, else suppressed | §11.1, §11.3 |\n| POST | `/organizations/:organizationId/reports` | Org 💳 | `type`, `period`, `purpose` → SCHEDULED | §11 |\n| GET | `/organizations/:organizationId/reports[/:reportId]` | Org | | §29.1 |\n| POST | `/organizations/:organizationId/reports/:reportId/exports` | Org 💳 | `format`, `purpose`; export log committed first (T-20) | §12.3 |\n| GET | `/market-reports` · `/:id` | Org:`market.reports.read` 💳 or Staff | | §4 |\n| CRUD | `/admin/metric-definitions` · POST `/admin/reports/:id/regenerate` | Staff:`admin.reports.manage` | New version on change | §13 |\n| GET | `/admin/data-exports` | Staff:`audit.read` | | §18 |\n\n## 20. Buyer features (Phase 4) — ⚠️ on hold, BQ-51\n\n> Every organization is a company (BQ-06), so `:institutionId` below would be a **buyer company** and the `institution.*` permissions no longer exist. These routes are a placeholder until BQ-51 is answered.\n\n| Method | Path | Access | PRD |\n|---|---|---|---|\n| GET | `/organizations/:institutionId/supplier-search` | Org:`institution.search.advanced` | §12.1 |\n| CRUD | `/organizations/:institutionId/saved-lists[/:listId]` | Org:`institution.lists.manage` | §12.1 |\n| CRUD | `/organizations/:institutionId/saved-lists/:listId/items[/:itemId]` | Org:`institution.lists.manage` (internal notes) | §12.1 |\n| GET | `/organizations/:institutionId/compare?companies=a,b,c` | Org:`institution.compare` | §12.1 |\n| CRUD | `/organizations/:institutionId/saved-searches[/:id]` | Org:`institution.search.advanced` | §12.1 |\n| CRUD | `/organizations/:institutionId/rfis[/:rfiId]` · POST `/send` · `/close` | Org:`institution.rfi.send` | §12.1 |\n| GET | `/organizations/:companyId/incoming-rfis` · POST `/:recipientId/respond` · `/decline` | Org | §12.1 |\n| GET | `/organizations/:institutionId/access-log` | Org:`institution.access_log.read` | §12.1 |\n| POST | `/organizations/:institutionId/exports` | Org 💳 · `purpose` | §12.3 |\n\n## 21. Phase 5 (not designed)\n\n`/partner/v1/*` (partner API with API clients) and outbound signed webhooks. RG-19.\n\n---\n\n## 22. Endpoint count by phase\n\n| Phase | Groups | Approx. endpoints |\n|---|---|---|\n| 1 | identity, access, profiles, taxonomy, media, companies/search, organizations, claims, projects, verification, content, moderation, notifications, audit, imports, admin | ~120 |\n| 2 | engagement, events (billing and entitlements ⏸ deferred) | ~35 |\n| 3 | talent, opportunities (+ supplier responses), professionals | ~35 |\n| 4 | intelligence, buyer features (on hold, BQ-51) | ~30 |\n\n## 23. Frontend contract gaps (current Flutter app)\n\n| Frontend expects | Backend plan | Action |\n|---|---|---|\n| `POST /auth/register`, `/auth/login`, `/auth/refresh`, `/auth/logout`, `/auth/forgot-password`, `/auth/reset-password` | Supabase Auth from the client (ADR-003): password sign-up + OTP confirmation, password sign-in, OTP recovery (BQ-30) | Agree TQ-02 |\n| `POST /auth/social` | Excluded (decision BQ-30) | Remove from the app |\n| `GET /me` | ✅ `GET /me` | Align payload casing (TQ-05) |\n| `GET /news`, `/news/:id`, `/news/categories` | ✅ `/news`, `/news/:slug`; categories RG-15 | Slug vs id |\n| `GET /companies` | ✅ `/companies` | — |\n| `GET /events` | ✅ `/events` (Phase 2) | Phase mismatch: frontend shows events now |\n| `GET /courses` | ❌ Not in PRD | BQ-02 |\n| Page-number pagination + `hasMore` | Cursor pagination + `has_more` | TQ-06 |\n"},{"name":"supabase-architecture","title":"Supabase Architecture","keywords":"supabase rls storage migrations connection","markdown":"# Supabase Architecture\n\n> Supabase provides **PostgreSQL**, **Auth** and **Storage** for Back Of House. **NestJS remains the application**: all business logic, authorization and data access go through the API.\n> Decisions: ADR-002 (Prisma), ADR-003 (Supabase Auth), ADR-007 (schema + RLS), ADR-009 (storage). Open: TQ-09 (hosting), TQ-22/23 (versions), BQ-31 (region), BQ-32 (RPO/RTO).\n>\n> ⚠️ Supabase and Prisma move fast. Connection-string formats, pooler options, key formats and Prisma configuration **must be checked against current documentation when the project is set up**, and the chosen versions recorded in ADR-002.\n\n---\n\n## 1. What Supabase is used for (and not)\n\n| Supabase capability | Used? | How |\n|---|---|---|\n| **Postgres** | ✅ | Primary transactional database. Prisma from NestJS |\n| **Auth** | ✅ (recommended, ADR-003) | Identity, OTP, sessions, MFA. NestJS verifies JWTs and authorizes |\n| **Storage** | ✅ | Public media + private documents; accessed by NestJS with the server key; clients use **signed** URLs only |\n| **Data API (PostgREST / GraphQL)** | ❌ | Clients never query the DB directly. App tables live in a schema that is **not exposed** |\n| **Realtime** | ❌ | No PRD requirement |\n| **Edge Functions** | ❌ (optional) | Only if the *Send SMS* auth hook needs a lightweight endpoint. It can equally be a NestJS route |\n| **Row Level Security** | ✅ as a **backstop** | Deny-all on app tables. Authorization is in NestJS (§6) |\n| **Supabase Vault** | ❌ | Secrets live in the hosting platform's secrets manager |\n| **pg_cron** | ❌ | Scheduling lives in the worker (pg-boss), under version control |\n\n```mermaid\nflowchart LR\n    subgraph Clients\n        APP[Flutter app / web]\n    end\n    subgraph Supabase[\"Supabase project (per environment)\"]\n        AUTH[Auth\u003cbr/>OTP · MFA · sessions]\n        PG[(Postgres\u003cbr/>schemas: app · auth · storage · pgboss)]\n        STO[Storage\u003cbr/>buckets]\n        POOL[Supavisor pooler]\n    end\n    subgraph Backend[\"NestJS (TQ-09 hosting)\"]\n        API[api]\n        WRK[worker]\n    end\n    APP -- \"sign-in, refresh, MFA (SDK)\" --> AUTH\n    APP -- \"REST + Bearer JWT\" --> API\n    APP -- \"PUT/GET signed URLs only\" --> STO\n    API -- \"JWKS verify\" --> AUTH\n    API -- \"admin API (server key)\" --> AUTH\n    API -- \"Prisma (app role)\" --> POOL --> PG\n    WRK -- \"Prisma + pg-boss (session conn)\" --> PG\n    API -- \"signed URLs, moves (server key)\" --> STO\n    AUTH -. \"Send SMS hook (signed)\" .-> API\n```\n\n---\n\n## 2. Database connection strategy\n\n### 2.1 Connection types\n\n| Connection | Typical endpoint (verify at setup) | Use |\n|---|---|---|\n| **Direct** | `db.\u003cproject-ref>.supabase.co:5432` | Migrations, admin tasks. Note: direct connections may be **IPv6-only** unless the IPv4 add-on is enabled → check the hosting platform (TQ-09) |\n| **Supavisor, session mode** | `\u003cpooler-host>:5432`, user `\u003crole>.\u003cproject-ref>` | Long-running NestJS **api** and **worker** when a direct IPv6 connection is not available. Supports prepared statements, advisory locks and `LISTEN` (needed by pg-boss) |\n| **Supavisor, transaction mode** | `\u003cpooler-host>:6543` | Only for serverless or high-fan-out deployments. Requires disabling prepared statements (`pgbouncer=true` in the Prisma URL). **Not used for the worker** |\n\n### 2.2 Recommendation\n\n| Process | Connection | Pool size |\n|---|---|---|\n| `api` (long-running container) | Direct (if IPv6 is available) **or** session pooler | Prisma pool ≈ 5–10 per instance; the total across instances must stay below the plan's connection limit |\n| `worker` | Direct **or** session pooler (pg-boss needs session features) | 3–5 |\n| Migrations (CI) | **Direct** (or session pooler) | 1 |\n| Local dev | Local Postgres from the Supabase CLI | — |\n\n```text\nDATABASE_URL          → runtime URL (api/worker), app role, schema=app\nDIRECT_DATABASE_URL   → migrations URL, owner role (postgres), direct connection\n```\n\n### 2.3 Connection budget\n\n`Σ(api instances × pool) + Σ(worker × pool) + pg-boss + migrations + Supabase internal services \u003c max_connections` of the compute size. Check the plan's limits before scaling horizontally, and alert at 80% connection usage.\n\n---\n\n## 3. Schemas, roles and privileges\n\n### 3.1 Schemas\n\n| Schema | Owner | Contents | Exposed via Data API |\n|---|---|---|---|\n| `app` | `postgres` (migration owner) | **All Back Of House tables** (`database-entities.md`) | ❌ **No** (do not add it to exposed schemas) |\n| `auth` | Supabase | Auth users, sessions, MFA factors | ❌ |\n| `storage` | Supabase | Bucket and object metadata | via Storage API only |\n| `pgboss` | `postgres` | Job queue tables (created by pg-boss) | ❌ |\n| `extensions` | Supabase | `citext`, `pg_trgm`, `unaccent`, `btree_gist` | — |\n| `public` | Supabase default | **Left empty** | Default exposed. Nothing sensitive may be placed here |\n\nWhy a dedicated `app` schema: even if the Data API is misconfigured, app tables are unreachable with the anon or authenticated keys. It also keeps Supabase-managed objects visibly separate from ours.\n\n### 3.2 Database roles\n\n| Role | Login | Privileges | Used by |\n|---|---|---|---|\n| `postgres` | ✅ (secret) | Owner; DDL | Migrations (CI) only |\n| `boh_app` | ✅ (secret) | `USAGE` on `app`, `extensions`; `SELECT, INSERT, UPDATE, DELETE` on app tables **except** append-only tables (INSERT, SELECT only); `USAGE` on sequences; `BYPASSRLS` (RLS is a backstop against Data API roles, not against the app); `SELECT` on `auth.sessions` (session revocation check); `search_path = app, extensions` | api, worker |\n| `boh_readonly` | ✅ (secret) | `SELECT` on app tables (excluding confidential columns through views, later) | Support and debugging, Phase 4 reporting jobs if split |\n| `anon`, `authenticated`, `service_role` | Supabase-managed | **No grants on `app`** | — |\n\nAppend-only enforcement (`audit_logs`, `point_ledger`, `consents`, `verification_decisions`, `data_exports`, `analytics_events`):\n\n```sql\nREVOKE UPDATE, DELETE, TRUNCATE ON app.audit_logs FROM boh_app;\nCREATE TRIGGER audit_logs_immutable BEFORE UPDATE OR DELETE ON app.audit_logs\n  FOR EACH ROW EXECUTE FUNCTION app.raise_immutable();\n```\n\nGranting `SELECT` on `auth.sessions` touches a Supabase-managed schema. Confirm this is allowed and stable on the chosen plan. If not, the fallback is short token lifetimes + `users.status` checks (see `auth-architecture.md` §1.5).\n\n---\n\n## 4. Migrations\n\n| Rule | Detail |\n|---|---|\n| **Single migration system for `app`** | **Prisma Migrate** owns the `app` schema. Supabase CLI migrations are **not** used for `app` objects (two tools on one schema cause drift) |\n| Hand-written SQL | Features Prisma's schema language cannot express are added **inside Prisma migration files** (`prisma migrate dev --create-only`, then edit): CHECK constraints, partial unique indexes, GIN / trigram indexes, `tsvector` columns and triggers, exclusion constraints, RLS enablement, grants, immutability triggers, partitioning |\n| Supabase-side configuration | Auth settings, SMS/Email hooks, storage buckets and bucket policies: kept as **code** (`supabase/config.toml` for local; a `scripts/supabase-provision.ts` idempotent script for staging/production using the management/admin APIs), reviewed like migrations |\n| No cross-schema foreign keys | `app.users.id` is **not** a FK to `auth.users.id` (would break Prisma shadow databases and couple migrations to Supabase internals). Consistency is kept by the app (ADR-003) |\n| Shadow database | `prisma migrate dev` uses a local shadow DB; never point it at a hosted project |\n| Deploy | CI runs `prisma migrate deploy` with `DIRECT_DATABASE_URL` **before** deploying the new app version. Migrations must be **backward compatible** with the running version (expand → migrate → contract) |\n| Destructive changes | Two-step (add column → backfill → switch code → drop in a later release). Never in the same deploy as the code that stops using the column |\n| Data migrations | Separate idempotent scripts run as jobs, not inside schema migrations, when large |\n| Extensions | Created in the first migration: `CREATE EXTENSION IF NOT EXISTS citext WITH SCHEMA extensions;` (+ `pg_trgm`, `unaccent`, `btree_gist`). Verify they are available on the Supabase Postgres version |\n\n---\n\n## 5. Environments\n\n| Environment | Database | Auth | Storage | Purpose |\n|---|---|---|---|---|\n| **local** | Supabase CLI (`supabase start`, Docker): Postgres + Auth + Storage + local mail catcher | Local Auth (OTP codes visible in the mail catcher; test phone numbers configured) | Local | Development |\n| **test / CI** | Ephemeral Postgres container (plain Postgres of the **same major version** as Supabase), created per CI run, `prisma migrate deploy` + seeds | **Mocked JWKS** (tests sign JWTs with a local key; AuthGuard is configured with the test JWKS) | Local storage adapter / MinIO | Unit, integration, e2e, authz |\n| **staging** | Separate Supabase project | Separate Auth config (SMS test mode or a restricted sender) | Separate buckets | Pre-production, pilot, UAT (§28 \"deploy to staging and product-owner acceptance\") |\n| **production** | Separate Supabase project, **region per BQ-31**, PITR per BQ-32 | Production SMS/email providers, MFA enforced | Separate buckets | Live |\n\nRules:\n- **One Supabase project per environment**, never shared. Separate keys and secrets.\n- Production data is **never** copied to lower environments without anonymisation (§18).\n- Supabase **branching** may be used for preview environments later. It is not required.\n\n---\n\n## 6. Row Level Security: where and why\n\n**Authorization is application-level** (NestJS guards + policies + query scoping). RLS is not the authorization mechanism, because:\n\n- the PRD's rules are contextual (organization role, delegation, entitlements, record state, conflict of interest, MFA assurance), which is awkward and hard to test in SQL policies;\n- NestJS connects with a single application role through a pooler, so per-user RLS would need `SET LOCAL` claims in every transaction, adding cost and risk with little extra protection given §3.1.\n\n**Where RLS is still used:**\n\n| Where | Policy | Purpose |\n|---|---|---|\n| All `app.*` tables | `ALTER TABLE … ENABLE ROW LEVEL SECURITY;` with **no policies** (= deny all for roles without `BYPASSRLS`) | Defence in depth: if the schema were ever exposed or a Supabase key leaked, nothing is readable |\n| `storage.objects` for `public-media` | Public `SELECT` on the bucket; **no** client INSERT/UPDATE/DELETE | Public read of logos and published media |\n| `storage.objects` for `private-documents`, `quarantine`, `reports` | **No** client policies | Access only via server-issued signed URLs |\n\n**Where application-level authorization remains necessary:** everywhere else. Every API route.\n\n---\n\n## 7. Storage\n\n| Bucket | Public | Contents | Access | Lifecycle |\n|---|---|---|---|---|\n| `quarantine` | ❌ | Freshly uploaded files | Signed **upload** URL issued by the API | Auto-delete after 24 h |\n| `public-media` | ✅ read | Logos, covers, gallery, published project media, avatars | Public CDN URL (unguessable path) | Deleted by purge job when the asset is deleted |\n| `private-documents` | ❌ | CR, authorization letters, identity evidence, invoices, certificates | Signed download URL ≤ 5 min, audited | Retention per BQ-33 |\n| `reports` (Phase 4) | ❌ | Generated PDF/XLSX | Signed URL, export log first | `reports.expires_at` |\n\nUpload flow and scanning: `security-and-audit.md` §7. Image transformations (thumbnails) can use Supabase image transformation if available on the plan, or pre-generated sizes in the worker. Decide at implementation.\n\n**Backups:** Supabase database backups **do not include storage object contents** (verify for the chosen plan). Storage needs its own backup or replication strategy for `private-documents` (BQ-32).\n\n---\n\n## 8. Authentication integration (ADR-003)\n\n### 8.1 NestJS validates Supabase tokens\n\n```text\nIssuer (iss):   https://\u003cproject-ref>.supabase.co/auth/v1\nAudience (aud): authenticated\nJWKS:           https://\u003cproject-ref>.supabase.co/auth/v1/.well-known/jwks.json\nAlgorithm:      asymmetric signing keys (enable in project; do not rely on the legacy shared HS256 secret)\n```\n\n```ts\n// platform/supabase/jwt-verifier.ts (illustrative)\nconst jwks = createRemoteJWKSet(new URL(config.supabase.jwksUrl));   // cached, rotates automatically\nconst { payload } = await jwtVerify(token, jwks, {\n  issuer: config.supabase.jwtIssuer,\n  audience: 'authenticated',\n});\n// payload.sub → users.id · payload.session_id → revocation check · payload.aal → MFA\n```\n\n### 8.2 Supabase Auth configuration checklist (per environment)\n\n| Setting | Value |\n|---|---|\n| Sign-in methods (BQ-30: OTP + password) | Email + password and phone + password sign-up; **email and phone confirmation by one-time code required**; password sign-in; password recovery by one-time code. OTP-only sign-in stays **disabled** until BQ-58. Social providers disabled |\n| Signups | Enabled (public registration) |\n| Email confirmation | Required |\n| JWT expiry | ~600 s (10 min) |\n| Refresh token rotation + reuse detection | Enabled |\n| MFA | TOTP enabled (enforcement in NestJS) |\n| Password policy | Minimum length and character requirements (AUTH-04) |\n| Leaked-password protection | Enabled — passwords are used (BQ-30); plan-dependent |\n| Rate limits | Reviewed and tightened for OTP send/verify |\n| SMS | *Send SMS* hook → NestJS endpoint `POST /internal/auth-hooks/send-sms` (signature-verified) → Saudi SMS provider (TQ-04) |\n| Email templates | Bilingual (AR/EN) OTP templates |\n| Redirect URLs | Flutter deep links + web origins per environment (BQ-01) |\n| Web sessions (BQ-01) | The web app keeps the Supabase session in secure HttpOnly cookies (Supabase SSR helpers) and sends the access token to the API; the Flutter app keeps tokens in secure storage. Both call the same API |\n| Custom access-token hook | **Not used** (no roles or organization in the token, ADR-004) |\n\n### 8.3 Admin operations via server key\n\nUsed only by `identity` (ban, sign-out, delete user) and `media` (storage admin). The key is loaded from the secrets manager and never logged.\n\n---\n\n## 9. Backups and recovery\n\n| Requirement (§17) | Supabase capability | Plan |\n|---|---|---|\n| Daily backups | Automatic daily backups on paid plans (retention depends on plan) | ✅ Production on a paid plan |\n| RPO/RTO defined before production | Point-in-time recovery (PITR) add-on gives recovery to within minutes | Decide with BQ-32; PITR recommended for production once billing launches (Phase 2) |\n| Quarterly restore test | Restore into a scratch project → run smoke tests + row counts | Ops runbook |\n| Storage backups | Not covered by DB backups | Scheduled copy of `private-documents` to separate storage (decide) |\n| Logical exports | `pg_dump` of `app` schema to separate storage (weekly) | Independence from a single provider |\n\n---\n\n## 10. Extensions\n\n| Extension | Why | PRD |\n|---|---|---|\n| `citext` | Case-insensitive unique emails, slugs, domains, coupon codes | §20.2 duplicate prevention |\n| `pg_trgm` | Fuzzy name matching (duplicates), spelling-tolerant search | ORG-09, §7.4 |\n| `unaccent` | Accent and diacritic normalisation (with custom Arabic normalisation function) | §7.4 |\n| `btree_gist` | Exclusion constraints (no overlapping point rule versions) | §8.1 |\n| `pgcrypto` / built-in `gen_random_uuid()` | UUID default fallback | §14.1 |\n| `pg_stat_statements` | Query performance monitoring (enabled by default on Supabase) | §17 |\n\nNot needed now: `postgis` (plain lat/lng suffices, §15.2 maps), `vector` (no semantic search requirement), `pg_cron`.\n\n---\n\n## 11. Environment variables\n\n| Variable | Secret | Example / notes |\n|---|---|---|\n| `NODE_ENV` | — | `production` |\n| `APP_ENV` | — | `local` \\| `test` \\| `staging` \\| `production` |\n| `PORT` | — | `3000` |\n| `API_PUBLIC_URL` | — | `https://api.backofhouse.space` |\n| `CORS_ALLOWED_ORIGINS` | — | Comma-separated |\n| `DATABASE_URL` | ✅ | Runtime, role `boh_app`, `?schema=app` (+ pooler params) |\n| `DIRECT_DATABASE_URL` | ✅ | Migrations, owner role, direct connection |\n| `DATABASE_POOL_SIZE` | — | `10` |\n| `SUPABASE_URL` | — | `https://\u003cref>.supabase.co` |\n| `SUPABASE_JWT_ISSUER` | — | `https://\u003cref>.supabase.co/auth/v1` |\n| `SUPABASE_JWKS_URL` | — | `…/auth/v1/.well-known/jwks.json` |\n| `SUPABASE_SECRET_KEY` | ✅ | Server-side admin key (service role / secret key format per current Supabase) |\n| `SUPABASE_AUTH_HOOK_SECRET` | ✅ | Verifies Send SMS hook calls |\n| `STORAGE_BUCKET_PUBLIC` / `_PRIVATE` / `_QUARANTINE` / `_REPORTS` | — | Bucket names |\n| `SIGNED_URL_TTL_SECONDS` | — | `300` |\n| `EMAIL_PROVIDER` / `EMAIL_API_KEY` / `EMAIL_FROM` | key ✅ | §15.2 |\n| `SMS_PROVIDER` / `SMS_API_KEY` / `SMS_SENDER_ID` | key ✅ | §15.2 |\n| `MALWARE_SCANNER_URL` / `_TOKEN` | token ✅ | TQ-10 |\n| `ANALYTICS_PROVIDER_KEY` | ✅ | §15.2 |\n| `PAYMENT_PROVIDER` / `PAYMENT_API_KEY` / `PAYMENT_WEBHOOK_SECRET` | ✅ | ⏸ Deferred (business rules §11) |\n| `EINVOICE_*` | ✅ | ⏸ Deferred (business rules §11) |\n| `OUTBOX_POLL_INTERVAL_MS` | — | `1000` |\n| `JOBS_ENABLED` | — | `true` on the worker, `false` on the api |\n| `LOG_LEVEL` | — | `info` |\n| `ERROR_TRACKING_DSN` | ✅ | Observability (TQ-09) |\n\nA validated schema (`src/config/env.schema.ts`) fails boot on missing or invalid values. `.env.example` documents every variable without values.\n\n---\n\n## 12. Setup checklist (first implementation step)\n\n- [ ] Create Supabase projects: staging, then production (region per BQ-31)\n- [ ] Enable asymmetric JWT signing keys; note the JWKS URL\n- [ ] Configure Auth (§8.2); test phone numbers for staging\n- [ ] Create `app` schema, `boh_app` role, grants; confirm `app` is **not** in exposed schemas\n- [ ] Local: `supabase init` + `supabase start`; `.env.local`\n- [ ] Prisma: pin version; datasource URLs; first migration with extensions + `raise_immutable()` function\n- [ ] Buckets: `quarantine`, `public-media`, `private-documents` with policies (§6)\n- [ ] Verify pooler mode connectivity from the chosen hosting platform (IPv4/IPv6)\n- [ ] Backups: confirm plan, enable PITR for production when decided\n- [ ] Record all versions and settings in ADR-002 / ADR-003 / ADR-007\n"},{"name":"backend-development-order","title":"Backend Development Order","keywords":"roadmap order phases stages","markdown":"# Backend Development Order\n\n> The build order follows **module dependencies** (`module-dependency-map.md`) and **PRD phase gates** (§6, §21, §26).\n> **Mandatory business rules** (`business-rules.md`) apply to every stage: simple MVP, no premature payment or messaging infrastructure.\n> PRD product decision (§1, §30): *do not build all modules at once.* Complete Phase 0, then launch a trustworthy, claimable, searchable company directory within 90 days before expanding into points, reports or opportunities.\n\n---\n\n## 0. Overview\n\n```mermaid\nflowchart LR\n    S0[Stage 0\u003cbr/>Decisions & data dictionary] --> S1[Stage 1\u003cbr/>Project foundation]\n    S1 --> S2[Stage 2\u003cbr/>Database foundation]\n    S2 --> S3[Stage 3\u003cbr/>Platform: audit · outbox · jobs]\n    S3 --> S4[Stage 4\u003cbr/>Identity]\n    S3 --> S5[Stage 5\u003cbr/>Taxonomy · Media]\n    S4 --> S6[Stage 6\u003cbr/>Access core]\n    S6 --> S7[Stage 7\u003cbr/>Profiles & onboarding]\n    S5 --> S8[Stage 8\u003cbr/>Organizations + memberships]\n    S6 --> S8\n    S8 --> S9[Stage 9\u003cbr/>Verification engine]\n    S9 --> S10[Stage 10\u003cbr/>Claims · approval · verification signals]\n    S10 --> S11[Stage 11\u003cbr/>Projects]\n    S11 --> S12[Stage 12\u003cbr/>Search & public directory]\n    S3 --> S13[Stage 13\u003cbr/>Notifications]\n    S8 --> S14[Stage 14\u003cbr/>Imports & merges]\n    S8 --> S15[Stage 15\u003cbr/>Content · moderation · analytics]\n    S12 --> S16[Stage 16\u003cbr/>Admin · hardening · launch gate]\n    S13 --> S16\n    S14 --> S16\n    S15 --> S16\n    S16 ==>|Phase 1 gate §21| P2[Phase 2]\n    P2 ==> P3[Phase 3] ==> P4[Phase 4] ==> P5[Phase 5]\n```\n\n### Parallel lanes for Phase 1\n\n```mermaid\ngantt\n    title Phase 1 lanes (relative, not a schedule)\n    dateFormat  X\n    axisFormat  %s\n    section Foundation\n    Stage 1-3 foundation            :f1, 0, 3\n    section Lane A identity & directory core\n    Identity                        :a1, after f1, 1\n    Access core                     :a2, after a1, 1\n    Organizations + memberships     :a3, after a2, 2\n    Verification engine             :a4, after a3, 1\n    Claims & company verification   :a5, after a4, 1\n    Projects                        :a6, after a5, 1\n    section Lane B reference & files\n    Taxonomy                        :b1, after f1, 1\n    Media & documents               :b2, after b1, 1\n    Profiles & onboarding           :b3, after a2, 1\n    section Lane C read side & comms\n    Notifications                   :c1, after f1, 2\n    Search & public directory       :c2, after a6, 2\n    section Lane D data & ops\n    Imports & merges                :d1, after a3, 2\n    Content, moderation, analytics  :d2, after a3, 2\n    section Gate\n    Admin, hardening, launch        :g1, after c2, 2\n```\n\n---\n\n## Stage 0 · Decisions & data dictionary (PRD Phase 0, §6)\n\n| | |\n|---|---|\n| **Must exist first** | This architecture documentation |\n| **Deliverables** | Answers to the blocking questions below; data dictionary; taxonomy seed (categories, services, regions and cities, skills, §26 P0); permission matrix sign-off (§6 Phase 0 \"permissions matrix\"); Supabase projects (staging) |\n| **Resolved 2026-09-15** | BQ-01 (web + mobile), BQ-30 (OTP + password), BQ-03/04/05 (memberships, one owner, owner creates + admin approves), BQ-06 (companies only), BQ-07, BQ-08, BQ-46/47/48/49 — see `open-questions.md` §0 |\n| **Still blocking** | **TQ-01/TQ-02** (Supabase Auth client-direct vs API facade), **TQ-05/06/07** (API contract with both clients), **BQ-53** (company VERIFIED rule), **BQ-56** (ownership transfer), **BQ-57** (approval criteria), **BQ-58** (sign-in options), **BQ-68** (remaining: same identifier for both account types, type change, staff account type), **BQ-75** (membership flow), **RG-28** (industries list review), **BQ-63/64** (industries, public team), **BQ-21** (value lists for Phase 1 fields), **BQ-31** (region), **BQ-51** (buyer pilot scope), **RG-09** (import format), **RG-14** (notification catalog, incl. push for Flutter), **TQ-09** (hosting) |\n| **Parallel** | Taxonomy data preparation; company data cleaning (§22) |\n| **Test before moving on** | Decisions recorded in `architecture-decisions.md` / `open-questions.md` |\n\n## Stage 1 · Project foundation\n\n| | |\n|---|---|\n| **Must exist first** | Stage 0 decisions on hosting and API contract |\n| **Build** | NestJS app (TypeScript strict); `config` with env validation; pino logger with redaction; request-id / trace id; global error filter (`{code, message, trace_id, errors}`); ValidationPipe (422); response envelope; `/health` (liveness/readiness); OpenAPI (Swagger) generation; security headers; CORS; throttler; `api` + `worker` entrypoints; ESLint + Prettier + **dependency-cruiser**; Jest (unit/integration/e2e); GitHub Actions CI (lint, typecheck, test, audit, secret scan); Dockerfile; `.env.example`; README |\n| **Parallel** | Stage 2 local database setup |\n| **Depends on it** | Everything |\n| **Test before moving on** | CI green; the error format matches the frontend parser; health check deployed to staging |\n\n## Stage 2 · Database foundation\n\n| | |\n|---|---|\n| **Must exist first** | Stage 1 |\n| **Build** | Prisma (pinned version, multi-file schema); `app` schema; extensions migration (`citext`, `pg_trgm`, `unaccent`, `btree_gist`); `boh_app` role and grants; RLS enable helper; `raise_immutable()` trigger function; `app.normalize_ar()` function; `PrismaService`; `TransactionR le         NOT STARTED\n├── Service        NOT STARTED\n├── Controller     NOT STARTED\n├── Tests          NOT STARTED\n└── Documentation  NOT STARTED\n\nBilling (⏸ DEFERRED — future monetization, rules §11)\n├── Database       NOT STARTED\n├── Module         NOT STARTED\n├── Service        NOT STARTED\n├── Controller     NOT STARTED\n├── Tests          NOT STARTED\n└── Documentation  NOT STARTED\n\nEngagement (points, levels, badges, visibility)\n├── Database       NOT STARTED\n├── Module         NOT STARTED\n├── Service        NOT STARTED\n├── Controller     NOT STARTED\n├── Tests          NOT STARTED\n└── Documentation  NOT STARTED\n\nEvents\n├── Database       NOT STARTED\n├── Module         NOT STARTED\n├── Service        NOT STARTED\n├── Controller     NOT STARTED\n├── Tests          NOT STARTED\n└── Documentation  NOT STARTED\n```\n\n| Critical journey (§20.2) | Status |\n|---|---|\n| Payment & renewal: no double subscription, correct invoice | ⏸ DEFERRED (rules §11) |\n| Points: once only, explainable, reversible | NOT STARTED |\n| Attendance: no points for booking without attendance | NOT STARTED |\n\n---\n\n## Phase 3: Professionals & opportunities\n\n```text\nTalent\n├── Database       NOT STARTED\n├── Module         NOT STARTED\n├── Service        NOT STARTED\n├── Controller     NOT STARTED\n├── Tests          NOT STARTED\n└── Documentation  NOT STARTED\n\nOpportunities (unified model, applications, supplier responses)\n├── Database       NOT STARTED\n├── Module         NOT STARTED\n├── Service        NOT STARTED\n├── Controller     NOT STARTED\n├── Tests          NOT STARTED\n└── Documentation  NOT STARTED\n```\n\n---\n\n## Phase 4: Intelligence & institutional\n\n```text\nIntelligence\n├── Database       NOT STARTED\n├── Module         NOT STARTED\n├── Service        NOT STARTED\n├── Controller     NOT STARTED\n├── Tests          NOT STARTED\n└── Documentation  NOT STARTED\n\nInstitutional (ON HOLD — BQ-51)\n├── Database       NOT STARTED\n├── Module         NOT STARTED\n├── Service        NOT STARTED\n├── Controller     NOT STARTED\n├── Tests          NOT STARTED\n└── Documentation  NOT STARTED\n```\n\n| Critical journey (§20.2) | Status |\n|---|---|\n| Comparison: no confidential data or small samples | NOT STARTED |\n| Institution export: permission, purpose, watermark and log correct | NOT STARTED |\n\n---\n\n## Phase 5: Observatory & partner API\n\n```text\nObservatory      NOT STARTED (not designed — RG-19)\nPartner API      NOT STARTED (not designed — RG-19)\n```\n\n---\n\n## Blocking questions tracker\n\n| Question | Blocks | Status |\n|---|---|---|\n| BQ-01 clients | Stage 1 | ✅ RESOLVED — web + Flutter mobile, one API |\n| BQ-30 authentication method | Stage 4 | ✅ RESOLVED — OTP + password |\n| BQ-03 / BQ-04 / BQ-05 / BQ-49 memberships and owners | Stage 8 | ✅ RESOLVED — many memberships, one owner per company, owner creates, admin approves, several companies per owner |\n| BQ-06 organization types | Stage 8 | ✅ RESOLVED — every organization is a company |\n| BQ-46 / BQ-47 / BQ-48 approval and verification | Stage 10 | ✅ RESOLVED — separate; independent signals; human reviewers only |\n| BQ-07 / BQ-08 verified professional, rewards | Phase 2 | ✅ RESOLVED — verification independent of levels; points are not a currency |\n| TQ-01 / TQ-02 auth integration (client-direct vs facade) | Stage 4 | OPEN |\n| TQ-05 / TQ-06 / TQ-07 API contract | Stage 1 | OPEN |\n| BQ-53 company VERIFIED rule | Stage 10, 12 | OPEN (working assumption: registration signal) |\n| BQ-56 ownership transfer | Stage 10 | OPEN (admin-only transfer until decided) |\n| BQ-57 approval criteria, resubmission, imports | Stage 10, 14 | OPEN |\n| BQ-58 sign-in options | Stage 4 | OPEN (password sign-in only until decided) |\n| BQ-51 buyer entities | Phase 1 pilot scope, Phase 4 | PARTLY RESOLVED — supplier requests are B2B between companies (rules §7) |\n| BQ-59 / BQ-60 / BQ-61 rewards, account contexts, company types | Stages 4, 6–8, Phase 2 | ✅ RESOLVED 2026-09-17 |\n| BQ-68 company account model | Stages 4, 6, 8 | MOSTLY RESOLVED — one Company Account per company; remaining identifier / type-change / staff questions |\n| BQ-75 membership flow | Stage 8 | OPEN |\n| BQ-69 / BQ-72 / BQ-73 / BQ-74 | Phases 1, 3 | ✅ RESOLVED 2026-09-17 |\n| BQ-70 Companies to Watch weights and slots | Phase 1 | MOSTLY RESOLVED |\n| BQ-71 Profile Highlight | Phase 2 | OPEN |\n| RG-28 industries list | Stage 5 | DRAFT READY — needs business review |\n| BQ-63 / BQ-64 industries, public team | Stage 8 | OPEN |\n| BQ-62 … BQ-66 project, industries, team visibility, supplier requests and responses | Phases 1, 3 | ✅ RESOLVED 2026-09-17 |\n| BQ-67 withdrawal rule and decision changes (transitions resolved) | Phase 3 | PARTLY RESOLVED |\n| BQ-21 Phase 1 value lists | Stage 8, 11 | OPEN |\n| RG-09 import format | Stage 14 | OPEN |\n| RG-14 notification catalog (incl. push) | Stage 13 | OPEN |\n| TQ-09 hosting platform | Stage 1 | OPEN |\n| BQ-31 data residency / region | Production | OPEN |\n"}]}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/11.6.0/mermaid.min.js"></script>
<script>
(function () {
  "use strict";

  var DATA = JSON.parse(document.getElementById("docs-data").textContent);
  var DOCS = DATA.docs;
  var BY_NAME = {};
  DOCS.forEach(function (d) { BY_NAME[d.name] = d; });
  var HOME = DATA.home;
  var current = null;

  document.getElementById("source-line").textContent = DATA.source;

  // ---------- theme ----------
  var THEME_KEY = "boh-docs-theme";
  function readTheme() { try { return localStorage.getItem(THEME_KEY) || "system"; } catch (e) { return "system"; } }
  function writeTheme(v) { try { localStorage.setItem(THEME_KEY, v); } catch (e) { /* ignore */ } }
  function applyTheme(choice) {
    if (choice === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", choice);
    document.querySelectorAll("[data-theme-choice]").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-theme-choice") === choice));
    });
  }
  function isDark() {
    var t = document.documentElement.getAttribute("data-theme");
    if (t) return t === "dark";
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  applyTheme(readTheme());
  document.querySelectorAll("[data-theme-choice]").forEach(function (b) {
    b.addEventListener("click", function () {
      var c = b.getAttribute("data-theme-choice");
      writeTheme(c); applyTheme(c); rerenderDiagrams();
    });
  });
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    var onChange = function () { if (!document.documentElement.getAttribute("data-theme")) rerenderDiagrams(); };
    if (mq.addEventListener) mq.addEventListener("change", onChange);
  }
  // the host viewer may stamp data-theme itself
  new MutationObserver(function () { rerenderDiagrams(); })
    .observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  // ---------- navigation ----------
  var index = document.getElementById("doc-index");
  var picker = document.getElementById("doc-picker");
  DATA.groups.forEach(function (g) {
    var wrap = document.createElement("div");
    wrap.className = "group";
    var label = document.createElement("div");
    label.className = "group-label";
    label.textContent = g.label;
    wrap.appendChild(label);
    var og = document.createElement("optgroup");
    og.label = g.label;
    g.docs.forEach(function (name) {
      var d = BY_NAME[name];
      if (!d) return;
      var a = document.createElement("a");
      a.className = "doc-link" + (name === HOME ? " start" : "");
      a.href = "#" + name;
      a.setAttribute("data-doc", name);
      a.setAttribute("data-search", (d.title + " " + d.name + " " + d.keywords).toLowerCase());
      var t = document.createElement("span");
      t.textContent = d.title;
      a.appendChild(t);
      if (name === HOME) {
        var f = document.createElement("span");
        f.className = "file";
        f.textContent = "start here";
        a.appendChild(f);
      }
      wrap.appendChild(a);
      var o = document.createElement("option");
      o.value = name; o.textContent = d.title;
      og.appendChild(o);
    });
    index.appendChild(wrap);
    picker.appendChild(og);
  });
  picker.addEventListener("change", function () { location.hash = picker.value; });

  document.getElementById("doc-filter").addEventListener("input", function (e) {
    var q = e.target.value.trim().toLowerCase();
    index.querySelectorAll(".doc-link").forEach(function (a) {
      a.hidden = q && a.getAttribute("data-search").indexOf(q) === -1;
    });
    index.querySelectorAll(".group").forEach(function (g) {
      var any = Array.prototype.some.call(g.querySelectorAll(".doc-link"), function (a) { return !a.hidden; });
      g.hidden = !any;
    });
  });

  // ---------- markdown ----------
  function slug(text) {
    return text.toLowerCase().trim()
      .replace(/<[^>]+>/g, "")
      .replace(/[^\p{L}\p{N}\s_-]/gu, "")
      .replace(/\s/g, "-");
  }
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function decodeEntities(s) {
    var ta = document.createElement("textarea"); ta.innerHTML = s; return ta.value;
  }

  var renderer = new marked.Renderer();
  var slugCounts = {};
  renderer.heading = function (text, level, raw) {
    var base = slug(decodeEntities(raw));
    var id = base;
    if (slugCounts[base] != null) { slugCounts[base] += 1; id = base + "-" + slugCounts[base]; }
    else slugCounts[base] = 0;
    return "<h" + level + ' id="' + escapeHtml(current + ":" + id) + '">' + text + "</h" + level + ">\n";
  };
  renderer.code = function (code, lang) {
    if ((lang || "").trim() === "mermaid") {
      return '<div class="diagram pending" data-source="' + escapeHtml(code) + '">Rendering diagram…</div>\n';
    }
    return "<pre><code>" + escapeHtml(code) + "</code></pre>\n";
  };
  renderer.table = function (header, body) {
    return '<div class="table-wrap"><table><thead>' + header + "</thead><tbody>" + body + "</tbody></table></div>\n";
  };
  renderer.link = function (href, title, text) {
    var h = href || "";
    var m = h.match(/^([A-Za-z0-9_-]+)\.md(?:#(.*))?$/);
    if (m && BY_NAME[m[1]]) h = "#" + m[1] + (m[2] ? ":" + m[2] : "");
    else if (h === "index.html") h = "#" + HOME;
    else if (h.charAt(0) === "#") h = "#" + current + ":" + h.slice(1);
    var t = title ? ' title="' + escapeHtml(title) + '"' : "";
    return '<a href="' + escapeHtml(h) + '"' + t + ">" + text + "</a>";
  };
  marked.setOptions({ renderer: renderer, gfm: true, mangle: false, headerIds: false });

  var REF_RE = /\b((?:BQ|TQ|RG|ADR|T|AUTH|ORG)-\d{2,3})\b/g;
  function decorateRefs(root) {
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {
        var p = n.parentNode;
        if (!p || p.closest("pre, code, a, .diagram, h1, h2, h3, h4, th")) return NodeFilter.FILTER_REJECT;
        REF_RE.lastIndex = 0;
        return REF_RE.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
      }
    });
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function (n) {
      var frag = document.createDocumentFragment();
      var s = n.nodeValue, last = 0, m;
      REF_RE.lastIndex = 0;
      while ((m = REF_RE.exec(s))) {
        frag.appendChild(document.createTextNode(s.slice(last, m.index)));
        var span = document.createElement("span");
        span.className = "ref";
        span.textContent = m[1];
        frag.appendChild(span);
        last = m.index + m[1].length;
      }
      frag.appendChild(document.createTextNode(s.slice(last)));
      n.parentNode.replaceChild(frag, n);
    });
  }

  // ---------- diagrams ----------
  var renderSeq = 0;
  function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function initMermaid() {
    var dark = isDark();
    mermaid.initialize({
      startOnLoad: false,
      securityLevel: "strict",
      theme: "base",
      fontFamily: cssVar("--font"),
      themeVariables: {
        darkMode: dark,
        background: cssVar("--surface"),
        fontSize: "14px",
        primaryColor: dark ? "#16213A" : "#EFEDFC",
        primaryBorderColor: cssVar("--accent"),
        primaryTextColor: cssVar("--ink"),
        secondaryColor: dark ? "#101B29" : "#F3F4F8",
        tertiaryColor: dark ? "#0B1420" : "#FFFFFF",
        lineColor: cssVar("--ink-3"),
        textColor: cssVar("--ink"),
        mainBkg: dark ? "#16213A" : "#EFEDFC",
        nodeBorder: cssVar("--accent"),
        clusterBkg: dark ? "#080F17" : "#F7F8FB",
        clusterBorder: cssVar("--line"),
        titleColor: cssVar("--ink"),
        edgeLabelBackground: cssVar("--surface"),
        noteBkgColor: cssVar("--gold-tint"),
        noteTextColor: cssVar("--ink"),
        noteBorderColor: cssVar("--gold"),
        actorBkg: dark ? "#16213A" : "#EFEDFC",
        actorBorder: cssVar("--accent"),
        actorTextColor: cssVar("--ink"),
        signalColor: cssVar("--ink-2"),
        signalTextColor: cssVar("--ink"),
        labelBoxBkgColor: cssVar("--surface-2"),
        labelTextColor: cssVar("--ink"),
        loopTextColor: cssVar("--ink"),
        attributeBackgroundColorOdd: cssVar("--surface"),
        attributeBackgroundColorEven: cssVar("--surface-2")
      },
      flowchart: { useMaxWidth: false, htmlLabels: true, subGraphTitleMargin: { top: 6, bottom: 14 }, padding: 12 },
      er: { useMaxWidth: false },
      sequence: { useMaxWidth: false },
      state: { useMaxWidth: false },
      gantt: { useMaxWidth: false }
    });
  }
  function renderDiagrams(root) {
    if (typeof mermaid === "undefined") {
      root.querySelectorAll(".diagram.pending").forEach(function (el) {
        el.textContent = el.getAttribute("data-source");
      });
      return;
    }
    initMermaid();
    var seq = ++renderSeq;
    var els = Array.prototype.slice.call(root.querySelectorAll(".diagram"));
    (function next(i) {
      if (i >= els.length || seq !== renderSeq) return;
      var el = els[i];
      var src = el.getAttribute("data-source");
      mermaid.render("mmd-" + seq + "-" + i, src).then(function (res) {
        if (seq !== renderSeq) return;
        el.className = "diagram";
        el.innerHTML = res.svg;
        next(i + 1);
      }).catch(function (err) {
        el.className = "diagram failed";
        el.innerHTML = "<strong>Diagram could not be rendered.</strong> Source shown below.<pre><code>" + escapeHtml(src) + "</code></pre>";
        var orphan = document.getElementById("dmmd-" + seq + "-" + i);
        if (orphan) orphan.remove();
        next(i + 1);
      });
    })(0);
  }
  function rerenderDiagrams() {
    var root = document.getElementById("doc");
    root.querySelectorAll(".diagram").forEach(function (el) { el.className = "diagram pending"; el.textContent = "Rendering diagram…"; });
    renderDiagrams(root);
  }

  // ---------- routing ----------
  function route() {
    var hash = decodeURIComponent(location.hash.replace(/^#/, ""));
    var parts = hash.split(":");
    var name = BY_NAME[parts[0]] ? parts[0] : HOME;
    var anchor = parts.length > 1 ? parts.slice(1).join(":") : null;

    if (name !== current) {
      current = name;
      slugCounts = {};
      var d = BY_NAME[name];
      var article = document.getElementById("doc");
      article.innerHTML = marked.parse(d.markdown);
      decorateRefs(article);
      document.getElementById("doc-file").textContent = "docs/" + d.name + ".md";
      document.getElementById("doc-raw").href = d.name + ".md";
      document.title = (name === HOME ? "" : d.title + " · ") + "Back Of House Backend Map";
      index.querySelectorAll(".doc-link").forEach(function (a) {
        if (a.getAttribute("data-doc") === name) a.setAttribute("aria-current", "page");
        else a.removeAttribute("aria-current");
      });
      picker.value = name;
      renderDiagrams(article);
      if (!anchor) window.scrollTo(0, 0);
    }
    if (anchor) {
      var target = document.getElementById(name + ":" + anchor);
      if (target) target.scrollIntoView();
    }
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
