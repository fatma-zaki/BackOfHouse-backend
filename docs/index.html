<script id="docs-data" type="application/json">{"home":"BACK_OF_HOUSE_BACKEND_MAP","source":"PRD v1.0 · 27 Aug 2026 · architecture 2026-09-14","groups":[{"label":"Start","docs":["BACK_OF_HOUSE_BACKEND_MAP","business-rules","open-questions","architecture-decisions"]},{"label":"Domains & modules","docs":["domain-map","nest-module-map","module-dependency-map"]},{"label":"Data","docs":["database-erd","database-entities","enums-and-statuses","database-design-rules","transaction-boundaries"]},{"label":"Access & trust","docs":["auth-architecture","company-context","security-and-audit"]},{"label":"Behaviour","docs":["business-workflows","domain-events","points-architecture","api-map"]},{"label":"Platform & delivery","docs":["supabase-architecture","backend-development-order","backend-implementation-status"]}],"docs":[{"name":"BACK_OF_HOUSE_BACKEND_MAP","title":"Master Architecture Map","keywords":"overview master start summary","markdown":"# Back Of House Backend: Master Architecture Map\n\n> **Start here.** This is the entry point to the backend architecture. Each section summarises one area and links to the detailed document.\n>\n> ⚠️ **Mandatory business rules** — [`business-rules.md`](business-rules.md) (2026-09-17) — override PRD text and apply to every implementation. Read them first.\n>\n> | | |\n> |---|---|\n> | **Source of truth** | *Back Of House Product Requirements & Technical Delivery Specification*, v1.0, 27 Aug 2026 (Arabic), cited as **PRD §x** |\n> | **Stack** | NestJS · TypeScript · PostgreSQL on Supabase · Prisma · REST |\n> | **Style** | Modular monolith (`api` + `worker` from one codebase) |\n> | **Status** | Architecture documented · **no code yet** · created 2026-09-14 · business decisions applied 2026-09-15 · mandatory business rules applied 2026-09-17 |\n> | **Visual viewer** | [`index.html`](index.html) (open in a browser; renders all documents and diagrams) |\n\n## At a glance\n\n| Metric | Value |\n|---|---|\n| Business domains | 12 (§2) |\n| NestJS domain modules | 24 (16 in Phase 1) + 9 platform modules |\n| Database tables | **96** designed (Phase 1: 46 · Phase 2: 27 · Phase 3: 12 · Phase 4: 11); 11 of them ⏸ deferred (9 monetization, 2 messaging/surveys) |\n| Enums | 68 (5 rule-defined · 19 PRD-defined · 12 PRD-derived · 32 proposed) |\n| Domain events | ~100 |\n| Atomic transactions catalogued | 32 (T-01 … T-32; 4 deferred with monetization) |\n| Questions | 13 business decisions + mandatory rules resolved BQ-02 (scope), BQ-25, BQ-29 · BQ-59…66 resolved, BQ-67 partly · open raised questions BQ-51…58, 67 (rest), 68…74 · 27 technical · 27 requirement gaps |\n| Architecture decisions | 30 (9 accepted, ADR-008 partly accepted, 17 proposed, 1 superseded, 2 open) |\n\n## Document index\n\n| # | Area | Document |\n|---|---|---|\n| 0 | **Mandatory business rules** | [business-rules.md](business-rules.md) |\n| 1 | Architecture overview | this file |\n| 2 | Domain map & relationship map | [domain-map.md](domain-map.md) |\n| 3 | NestJS module map | [nest-module-map.md](nest-module-map.md) |\n| 4 | Module dependency graph | [module-dependency-map.md](module-dependency-map.md) |\n| 5 | Database ERD | [database-erd.md](database-erd.md) |\n| 6 | Entity catalog | [database-entities.md](database-entities.md) |\n| 7 | Enums & status machines | [enums-and-statuses.md](enums-and-statuses.md) |\n| 8 | Authentication / authorization / trust | [auth-architecture.md](auth-architecture.md) |\n| 9 | Company context (multi-organization) | [company-context.md](company-context.md) |\n| 10 | Business workflows | [business-workflows.md](business-workflows.md) |\n| 11 | REST API map | [api-map.md](api-map.md) |\n| 12 | Points, levels, visibility | [points-architecture.md](points-architecture.md) |\n| 13 | Domain events | [domain-events.md](domain-events.md) |\n| 14 | Security & audit | [security-and-audit.md](security-and-audit.md) |\n| 15 | Supabase architecture | [supabase-architecture.md](supabase-architecture.md) |\n| 16 | Database design rules | [database-design-rules.md](database-design-rules.md) |\n| 17 | Transaction boundaries | [transaction-boundaries.md](transaction-boundaries.md) |\n| 18 | Development order | [backend-development-order.md](backend-development-order.md) |\n| 19 | Implementation status | [backend-implementation-status.md](backend-implementation-status.md) |\n| 20 | Open questions | [open-questions.md](open-questions.md) |\n| 21 | Architecture decisions | [architecture-decisions.md](architecture-decisions.md) |\n\n---\n\n## 1. Architecture overview\n\nBack Of House is a **national professional platform for Saudi Arabia's events sector** (PRD §1). The first product is a **verified, claimable company directory**. Memberships, points, events, a professional directory, opportunities, benchmarking reports and (on hold, BQ-51) buyer features are built on top of it, **phase by phase behind measurable gates** (§6, §21).\n\n```mermaid\nflowchart LR\n    subgraph Clients\n        APP[Web client + Flutter mobile app\u003cbr/>one API · BQ-01]\n    end\n    subgraph Supabase\n        AUTH[Supabase Auth\u003cbr/>password + OTP · MFA · sessions]\n        PG[(PostgreSQL\u003cbr/>schema app)]\n        ST[(Storage\u003cbr/>public · private · quarantine)]\n    end\n    subgraph NestJS[\"NestJS modular monolith\"]\n        API[api\u003cbr/>REST /api/v1]\n        WRK[worker\u003cbr/>outbox · jobs · cron]\n    end\n    EXT[Email · SMS · Payment gateway P2 ·\u003cbr/>E-invoicing P2 · Analytics · Malware scan]\n\n    APP -- sign-in --> AUTH\n    APP -- Bearer JWT --> API\n    APP -- signed URLs --> ST\n    API -- JWKS --> AUTH\n    API -- Prisma --> PG\n    WRK -- Prisma · pg-boss --> PG\n    API --> ST\n    WRK --> EXT\n```\n\n**Guiding principles**\n\n1. Domain modules with clear table ownership. Writes never cross boundaries.\n2. An acyclic module graph (layered; events and ports for reverse flows).\n3. **Identity ≠ authorization ≠ verification/trust ≠ visibility ≠ points ≠ membership.**\n4. Authorization is enforced in the server **and** in queries (§4). Frontend hiding is never a control.\n5. Important mutations are audited in the same transaction.\n6. No infrastructure without need: no microservices, Kafka, Redis or CQRS.\n7. Phase-gated delivery: Phase 1 first (§30).\n8. **Simple MVP** (business rules §14): reusable models and components, no premature payment or messaging infrastructure, classify every feature with the 11 questions in `business-rules.md` §16.\n\n---\n\n## 2. Domain map\n\n```text\nBACK OF HOUSE BACKEND\n├── 1. Identity & Access ........... users · consents · profiles · roles · memberships · invitations      P1\n├── 2. Directory ................... taxonomy · companies (company type) · approvals · claims · merges · company projects · search · imports P1\n├── 3. Trust ....................... verification cases · independent company signals · evidence documents  P1\n├── 4. Community ................... content (P1) · events, tickets, attendance (P2)\n├── 5. Membership .................. plans · subscriptions · payments · entitlements — ⏸ DEFERRED (rules §11)\n├── 6. Engagement .................. point rules · ledger · balances · levels · badges · visibility        P2\n├── 7. Talent ...................... experiences (confirmed employment) · education · certifications       P3\n├── 8. Opportunities ............... JOB · CO_OP · VOLUNTEERING · SUPPLIER_REQUEST · applications · supplier responses        P3\n├── 9. Intelligence ................ analytics events (P1) · metrics · benchmarks · reports · exports (P4)\n├── 10. Institutional .............. supplier lists · saved searches · RFIs — ON HOLD (BQ-51)             P4\n├── 11. Operations & Governance .... admin · moderation · audit · notifications                           P1\n└── 12. Observatory & Partners ..... not designed                                                         P5\n```\n\n**Not modelled:** comments/social interactions (not in the PRD), a points rewards catalog or redemption (excluded by decision BQ-08), courses (the frontend has a Courses screen, BQ-02), organization types (every organization is a company, BQ-06).\n→ Full map, PRD evidence per domain and diagrams: [domain-map.md](domain-map.md)\n\n---\n\n## 3. Module map\n\n```text\nsrc/\n├── main.ts · worker.ts · app.module.ts\n├── config/          env validation\n├── common/          decorators · guards · filters · interceptors · pipes · errors · pagination · i18n · Arabic text\n├── platform/        database · supabase · storage · messaging · outbox · jobs · idempotency · observability · rate-limit\n└── modules/\n    ├── P1: identity · access · profiles · taxonomy · media · organizations · projects · verification\n    │       search · content · moderation · notifications · audit · analytics · imports · admin\n    ├── P2: engagement · events   (entitlements · billing ⏸ deferred)\n    ├── P3: talent · opportunities\n    └── P4: intelligence · institutional\n```\n\n**Layers (acyclic):**\n\n| Layer | Modules |\n|---|---|\n| L0 | audit |\n| L1 | identity, taxonomy, media, entitlements |\n| L2 | access |\n| L3 | profiles, verification, content, analytics, notifications |\n| L4 | organizations |\n| L5 | projects, imports, billing, talent |\n| L6 | search, engagement, moderation, intelligence, opportunities |\n| L7 | events, admin, institutional |\n\nReverse interactions go through **domain events** (outbox) or **ports** defined by the lower module (verification subject handlers, merge participants, document access policies).\n→ [nest-module-map.md](nest-module-map.md) · [module-dependency-map.md](module-dependency-map.md)\n\n---\n\n## 4. Database ERD (core)\n\n```mermaid\nerDiagram\n    users ||--|| profiles : \"1:1\"\n    users ||--o{ organization_members : \"memberships\"\n    organizations ||--o{ organization_members : \"team\"\n    organizations ||--o{ organization_claims : \"claims\"\n    organization_claims ||--|| verifications : \"reviewed as\"\n    organizations ||--o{ projects : \"publishes\"\n    projects |o--o{ verifications : \"subject\"\n    organizations ||--o{ organization_services : \"offers\"\n    services ||--o{ organization_services : \"\"\n    organizations |o--o| search_documents : \"public projection\"\n    organizations |o--o{ subscriptions : \"P2\"\n    subscriptions |o--o{ entitlements : \"P2\"\n    users |o--o{ point_ledger : \"P2\"\n    organizations |o--o{ point_ledger : \"P2\"\n    events ||--o{ event_registrations : \"P2\"\n    users ||--o{ event_registrations : \"P2\"\n    organizations ||--o{ opportunities : \"P3\"\n    opportunities ||--o{ applications : \"P3\"\n```\n\n- 91 tables. All 38 table names from PRD §14 are kept, plus `organization_approvals` (BQ-05).\n- UUID v7 keys · `timestamptz` UTC · paired `_ar`/`_en` columns · money in halalas.\n- \"Exactly one subject\" relationships use one FK column per target + `CHECK (num_nonnulls(...) = 1)`. There are no untyped polymorphic ids.\n- Append-only tables: `audit_logs`, `point_ledger`, `consents`, `verification_decisions`, `data_exports`, `analytics_events`.\n\n→ [database-erd.md](database-erd.md) (10 focused diagrams) · [database-entities.md](database-entities.md) · [database-design-rules.md](database-design-rules.md)\n\n---\n\n## 5. Entity relationships (the ones that matter most)\n\n| Relationship | Type | Why it matters |\n|---|---|---|\n| User (`account_type` INDIVIDUAL / COMPANY) ⟷ Company via `organization_members` | MANY-TO-MANY | The only source of company permissions; account type and company type grant nothing (rules §1, §2) |\n| Company → exactly one Company Account | 1:1 | `organizations.account_user_id`; one company per Company Account; members are Individual accounts without permissions (BQ-68) |\n| Company → Approval requests | 1:N | Admin publishes the listing; approval is **not** verification (BQ-05, BQ-46) |\n| Organization → Claim → Verification | 1:N → 1:1 | Ownership only after a reviewer's decision (§5.2, §20.2, BQ-48) |\n| Company → Verification signals | 1:N | Registration, domain, each credential, each contact — independent (BQ-47) |\n| Organization → Projects → Verifications | 1:N → 1:N | Case studies, trust and project points |\n| Verification → `verified_at` facts → TRUST points | derived | Trust is derived from evidence and can never be bought |\n| Company → Company projects | 1:N | Past work / portfolio; **not** opportunities (rules §4) |\n| Opportunity → Applications (individuals) | 1:N | One status model; the company decides (rules §8) |\n| Supplier request → Supplier responses (companies) | 1:N | B2B only; individuals never respond (rules §7) |\n| Subscription → Entitlements ⏸ | 1:N | Deferred; paid features never touch trust or organic ranking (rules §11, §12) |\n| Point ledger → balances → levels / badges / visibility | projections | Explainable, reversible, exactly-once |\n| User ⟷ Event via `event_registrations` (+ `attended_at`) | MANY-TO-MANY | Points only after verified attendance |\n| User ⟷ Organization via `experiences` (P3) | MANY-TO-MANY | Employment history; **grants no access** |\n| Buyer company ⟷ Company via lists and RFIs (P4, on hold BQ-51) | MANY-TO-MANY | Private notes never visible to the company |\n\n→ [domain-map.md §3](domain-map.md)\n\n---\n\n## 6. Authentication\n\n**Decision BQ-30: OTP + password.** Recommendation (ADR-003, pending TQ-01/TQ-02): Supabase Auth authenticates; NestJS verifies the JWT through JWKS and authorizes. The same flow serves the **web** and **Flutter** clients through one API (BQ-01).\n\n```text\nSign-up:  email or phone + password ──► Supabase Auth ──one-time code──► identifier confirmed\nSign-in:  identifier + password ──► Supabase Auth ──JWT (sub, session_id, aal)──► NestJS AuthGuard\n   → session still valid? → users row (status, onboarding) → AssuranceGuard (aal2 for staff)\n   → PermissionGuard (company from URL) → EntitlementGuard → service policy → company-scoped query\nRecovery: one-time code to the confirmed identifier → new password → other sessions revoked\n```\n\n- The `users` row is created only after the identifier is confirmed (AUTH-01). Onboarding records terms and consents (§5.1).\n- Global sign-out and admin revocation work immediately through the `session_id` check (AUTH-02).\n- MFA (`aal2`) is enforced for staff (AUTH-03). \"Entities\" have no organization type → BQ-51.\n- Social login is excluded (BQ-30). OTP-only sign-in → **BQ-58**. The Flutter app's `/auth/*` calls → **TQ-02**.\n\n→ [auth-architecture.md](auth-architecture.md)\n\n## 7. Authorization\n\n- **RBAC scoped to a company** (§4). Roles and permissions are defined in code; assignments are data.\n- Platform staff roles: `VERIFICATION_REVIEWER`, `CONTENT_MODERATOR`, `SYSTEM_ADMIN`, `AUDITOR` (all require MFA).\n- `SYSTEM_ADMIN` approves new companies (BQ-05). Verification decisions are made only by `VERIFICATION_REVIEWER` or `SYSTEM_ADMIN`, never automatically, in Phase 1 (BQ-48).\n- Company context: the company's single Company Account holds all company permissions; no roles, no delegation (BQ-68). Individual members hold none. Institution roles were removed (BQ-06).\n- Eight enforcement layers, deny by default, 404 for other companies' resources, **negative authorization tests** for every role × endpoint (§20.1).\n\n```text\nAuthentication  \"Who are you?\"                      Supabase Auth (password + OTP) + users\nAuthorization   \"What may you do?\"                  staff roles · memberships · grants · code catalog\nApproval        \"Is this listing published?\"        organization_approvals (admin) — not verification\nVerification    \"Can we trust this information?\"    independent signal cases → verified_at facts → TRUST points\nVisibility      \"How discoverable?\"                 visibility_snapshots → search signal\nPoints          \"What engagement value?\"            point_ledger → balances → levels/badges (never spent)\nMembership      \"What has been paid for?\"           subscriptions → entitlements\n```\n\n→ [auth-architecture.md §2](auth-architecture.md)\n\n## 8. Account contexts & company context\n\n- **Two account types, two security contexts** (BQ-60): the user chooses **Individual** or **Company** at registration, each with its own flow and data. An Individual token never reaches company routes, and a Company token never reaches individual routes.\n- **A company has exactly one user — its Company Account** (`organizations.account_user_id`, BQ-68). Employees and members use **Individual accounts** and are company **members** with no company permissions.\n- Companies have **one or more company types** (BQ-61) and **one or more industries** (BQ-63); classification ≠ verification ≠ permission.\n- Team members are **shown on the public profile by default**; the company can hide specific members (`show_on_company_profile`, BQ-64).\n- **Supplier requests** are visible only to Company Accounts, and any company may respond (BQ-65, BQ-66).\n- Ownership changes only through company creation, an approved claim or the admin ownership flow (BQ-69). The student concept was removed (BQ-72). JOB has an employment type and needs a verified company to publish (BQ-73).\n- The acting company is explicit in the URL (`/api/v1/organizations/:organizationId/...`) and must be the caller's company. **Companies to Watch** mixes admin picks, activity and verification/completeness; it is neutral and never paid (BQ-70).\n\n→ [company-context.md](company-context.md)\n\n---\n\n## 9. Main workflows\n\n| Workflow | Path | Phase |\n|---|---|---|\n| User | Sign up (password + OTP confirmation) → choose Individual or Company (separate flows and security contexts, BQ-60) → individual profile or company registration → optional verification → searchable (privacy) | 1 |\n| Claim company | Find → claim → automated hints → reviewer decides → company linked to the claimant's Company Account + CLAIMED → members join | 1 |\n| New company | Duplicate check → DRAFT (creator = owner) → admin approval → CLAIMED, public (not verified) → verification signals one by one → plan features | 1 |\n| Project | DRAFT → IN_REVIEW → PUBLISHED / NEEDS_CHANGES / REJECTED → ARCHIVED | 1 |\n| Import | Upload → preview → commit in chunks (UNCLAIMED) → quality report → rollback | 1 |\n| Event | Create → publish → register / waitlist → check-in → **attendance verified → points** → survey / certificate | 2 |\n| Subscription | ⏸ Deferred (rules §11) | — |\n| Points | Verified fact → rule version → ledger → balance → level / badge / visibility | 2 |\n| Opportunity | Company creates any type → publish → individuals apply (JOB, CO_OP, VOLUNTEERING) **or** any company responds (SUPPLIER_REQUEST, Company Accounts only) → close | 3 |\n| Application | SUBMITTED, then any company-chosen status: REVIEWED · SHORTLISTED · CONTACT · ACCEPTED · REJECTED (flexible, BQ-67); applicant may withdraw — the company decides | 3 |\n| Buyer | On hold — every organization is a company (BQ-06 → BQ-51) | 4 |\n\n→ [business-workflows.md](business-workflows.md) · [enums-and-statuses.md](enums-and-statuses.md)\n\n---\n\n## 10. API structure\n\n```text\n/api/v1\n├── /me/...                            own account, onboarding, consents, profile, notifications, registrations\n├── /companies · /projects             public directory & search (P1)\n├── /categories · /services · /locations · /skills\n├── /news · /pages                     content\n├── /organizations/:organizationId/... organization management: profile, team, invitations, projects,\n│                                      approval requests, verification signals, subscription (P2), opportunities (P3), reports (P4)\n├── /verifications/:id/...             applicant evidence & submission\n├── /uploads · /documents/:id/access-url\n├── /events · /levels · /badges                            (P2; /membership-plans ⏸ deferred)\n├── /opportunities (individual audience) · /supplier-requests (company audience) · /professionals (P3)\n├── /market-reports                                        (P4)\n├── /admin/...                         staff back office (MFA)\n└── /webhooks/payments/:provider       ⏸ deferred (rules §11)\n```\n\nErrors `{code, message, trace_id, errors}` · 422 for validation · cursor pagination · `Idempotency-Key` for payments, check-ins and point adjustments.\n→ [api-map.md](api-map.md)\n\n## 11. Points architecture\n\n- The **ledger is the source of truth** (append-only). Corrections are made by `REVERSAL` entries. Rule versions are kept (§8.1).\n- Member categories (§8.2), and company components with caps 100 / 300 / 100 / 100 / 100 (§8.3). Computed components write deltas.\n- Visibility: company 30/25/20/15/10 and professional 30/25/20/15/10 weights (§8.4), with activity decay 100/70/40/20% (§8.5).\n- Anti-abuse: caps, idempotency keys, fingerprints, human review of upper levels, anomaly alerts, appeals (§8.6).\n- Points are **never spent or redeemed**; they drive levels and benefits only (decision BQ-08). Levels never require verification (BQ-07).\n- Company trust points come from each approved verification signal; company approval earns nothing (BQ-46, BQ-47).\n- Points **unlock** Levels, Rewards and Benefits and are **never deducted** (BQ-59). Profile Highlight is a reward, separate from Verification and from Featured / Promoted. *Featured Companies* is now **Companies to Watch**.\n\n→ [points-architecture.md](points-architecture.md)\n\n## 12. Events\n\n- Transactional **outbox** → worker → idempotent handlers (at-least-once). About 100 named events.\n- Main consumers: notifications, search indexer, engagement (points), analytics funnel.\n- These always happen **synchronously in the same transaction**, never through events: audit, verification subject handlers, merge participants, entitlements recalculation, balance projection.\n\n→ [domain-events.md](domain-events.md)\n\n## 13. Notifications\n\n- In-app + email + SMS (§15.2). The Flutter app is confirmed (BQ-01), so push notifications are part of the RG-14 catalog decision.\n- Leaf consumer of domain events; bilingual templates; user preferences (security and transactional types are mandatory); masked destinations.\n\n→ [nest-module-map.md §4.12](nest-module-map.md) · [domain-events.md](domain-events.md)\n\n## 14. Audit & security\n\n- Same-transaction, append-only `audit_logs` for: roles and permissions, ownership, verification decisions, document access, admin actions, points, billing, exports.\n- Uploads: quarantine → type check + hash + malware scan → public or private bucket. Private files through ≤ 5-minute signed URLs, audited.\n- PDPL data classification (§18.1), consent-based analytics linking, no bulk personal-data export, PII redaction in logs.\n- Rate limits per surface; negative authorization tests; penetration test before any buyer-feature launch (BQ-51).\n\n→ [security-and-audit.md](security-and-audit.md) · [transaction-boundaries.md](transaction-boundaries.md)\n\n## 15. Supabase architecture\n\n| Area | Approach |\n|---|---|\n| Schema | Dedicated `app` schema, **not exposed** by the Data API |\n| RLS | Enabled with no policies (deny-all backstop); authorization in NestJS |\n| Connections | Direct or session pooler for api and worker (pg-boss needs session features); direct for migrations |\n| Roles | `postgres` (migrations), `boh_app` (runtime, no UPDATE/DELETE on append-only tables) |\n| Migrations | **Prisma Migrate only** for `app` (+ hand-written SQL); Supabase settings as code |\n| Environments | local (Supabase CLI) · CI (ephemeral Postgres + test JWKS) · staging · production, each a separate Supabase project |\n| Storage | `quarantine`, `public-media`, `private-documents`, `reports` |\n| Backups | Daily + PITR decision (BQ-32); storage objects need their own backup |\n| Extensions | `citext`, `pg_trgm`, `unaccent`, `btree_gist` |\n\n→ [supabase-architecture.md](supabase-architecture.md)\n\n---\n\n## 16. Development order\n\n```text\nStage 0  Decisions & data dictionary (blocking questions)\nStage 1  Project foundation      → Stage 2 Database foundation → Stage 3 Audit · Outbox · Jobs\nStage 4  Identity                ‖ Stage 5 Taxonomy · Media        ‖ Stage 13 Notifications\nStage 6  Access core             → Stage 7 Profiles & onboarding\nStage 8  Organizations + memberships\nStage 9  Verification engine     → Stage 10 Claims & company verification → Stage 11 Projects\nStage 12 Search & public directory ‖ Stage 14 Imports & merges ‖ Stage 15 Content · Moderation · Analytics\nStage 16 Admin · hardening · Phase 1 gate (§20.2 critical journeys, §21)\nPhase 2  engagement → levels / rewards → visibility ‖ events   (billing, entitlements ⏸ deferred)\nPhase 3  talent ‖ unified opportunities → applications + supplier responses   (messaging, matching ⏸ deferred)\nPhase 4  metrics → reports/exports → benchmarks ‖ buyer features (after BQ-51)\n```\n\n→ [backend-development-order.md](backend-development-order.md)\n\n## 17. Implementation status\n\nEverything is **NOT STARTED**. → [backend-implementation-status.md](backend-implementation-status.md)\n\n---\n\n## 18. Open questions\n\n**Resolved on 2026-09-15:** BQ-01 web + mobile · BQ-30 OTP + password · BQ-03 several companies per user · BQ-04 one owner · BQ-05 owner creates, admin approves · BQ-06 companies only · BQ-07 verification independent of levels · BQ-08 points not a currency · BQ-46 approval ≠ verification · BQ-47 independent signals · BQ-48 human reviewers only · BQ-49 several companies per owner.\n\n**Top remaining blockers**\n\n| ID | Question | Blocks |\n|---|---|---|\n| **TQ-01 / TQ-02** | Supabase Auth from the clients directly, or through an API `/auth/*` facade for both web and Flutter? | Stage 4 |\n| **TQ-05 / 06 / 07** | API casing, pagination and envelope contract with both clients | Stage 1 |\n| **BQ-53** | Which verification signals make a company VERIFIED? | Stage 10 |\n| **BQ-56** | How is the single owner replaced or transferred? | Stage 10 |\n| **BQ-57** | Approval criteria, resubmission after rejection, do imports need approval? | Stage 10, 14 |\n| **BQ-58** | Password-only sign-in, or also OTP sign-in / OTP as a second step? | Stage 4 |\n| **BQ-51** | Buyer and government entities now that every organization is a company (incl. Phase 1 pilot buyers) | Pilot scope, Phase 4 |\n| **BQ-52** | Name of the 500–799 level without a verification gate | Phase 2 |\n| **BQ-68 (rest)** | Same email or phone for Individual and Company accounts? Account type change? Staff account type? | Stage 4 |\n| **BQ-75** | How individuals become company members (invite / request / confirm); member self-hiding | Stage 8 |\n| **BQ-70 (rest) / BQ-71** | Companies to Watch weights and slots; Profile Highlight (not decided) | Phases 1–2 |\n| **RG-28** | Review the draft industries list (`business-rules.md` §20) | Stage 5 seeds |\n| **BQ-67 (rest)** | Withdrawal rule; changing a final decision | Phase 3 |\n| **BQ-02** | Courses are in the ecosystem (rules §13); model and phase open | Before courses work |\n| **BQ-31** | Data residency (PDPL) for the Supabase region | Production |\n\nFull register: [open-questions.md](open-questions.md)\n\n## 19. Architecture decisions\n\n| ADR | Decision | Status |\n|---|---|---|\n| 001 | Modular monolith (NestJS) | Accepted |\n| 002 | Prisma (+ SQL in migrations for advanced constraints) | Accepted |\n| 003 | Supabase Auth authenticates, NestJS authorizes | Proposed |\n| 004 | Permissions in code; organization context in URL, not token | Proposed |\n| 005 | UUID v7 | Proposed |\n| 006 | Targeted soft delete; status-based archival | Proposed |\n| 007 | `app` schema + RLS deny-all backstop | Proposed |\n| 008 | REST `/api/v1`, error body, cursor pagination, idempotency | Accepted / Proposed |\n| 009 | Supabase Storage with quarantine + private buckets | Proposed |\n| 010 | pg-boss jobs (no Redis) | Proposed |\n| 011 | Transactional outbox (no broker) | Proposed |\n| 012 | Postgres FTS + trigram over public-only projection | Proposed |\n| 013 | No shared cache initially | Proposed |\n| 014 | Points ledger + balance projection | Proposed |\n| 015 | Single `organizations` table | Superseded by 024 |\n| 016 | Same-transaction append-only audit | Proposed |\n| 017 | First-party analytics table + provider | Proposed |\n| 018 | Organization status derived from facts | Proposed |\n| 019 | JSON casing | **Open** |\n| 020 | Money in minor units | Proposed |\n| 021 | Paired `_ar`/`_en` columns | Proposed |\n| 022 | `api` + `worker` processes | Proposed |\n| 023 | Hosting platform | **Open** |\n| 024 | Every organization is a company (no types) | Accepted (BQ-06) |\n| 025 | Approval, ownership and verification signals are separate | Accepted (BQ-04/05/46/47/48) |\n| 026 | Two account types; company type as classification; `company_projects` | Accepted (rules §1–§4) |\n| 027 | Unified opportunities; individual applications; B2B supplier responses | Accepted (rules §5–§9) |\n| 028 | Monetization deferred; paid visibility separate from verification | Accepted (rules §10–§12) |\n| 029 | Individual and Company accounts are separate security contexts | Accepted (BQ-60) |\n| 030 | One Company Account per company; Individual members without permissions | Accepted (BQ-68, BQ-69, BQ-74) |\n\n→ [architecture-decisions.md](architecture-decisions.md)\n\n---\n\n## Recommended first implementation step\n\n1. **Close the remaining Stage 0 blockers**: the auth integration and API contract with the web and Flutter leads (TQ-01/02, TQ-05/06/07) and hosting (TQ-09). BQ-53, BQ-56, BQ-57 and BQ-58 can follow before Stages 4 and 10.\n2. Then build **Stage 1 + Stage 2** together: the NestJS scaffold with config validation, the error format agreed with the frontend, logging with redaction, health and OpenAPI, CI with dependency-cruiser; plus Prisma on a local Supabase stack with the `app` schema, `boh_app` role, extensions, `TransactionRunner` and the test DB harness.\n\nThese don't depend on any open business rule, and everything else builds on them.\n"},{"name":"business-rules","title":"Business Rules & Implementation Constraints","keywords":"rules mandatory account company type opportunity supplier application monetization mvp","markdown":"# Business Rules & Implementation Constraints\n\n> **Status: MANDATORY.** Received from the product owner on 2026-09-17.\n> These rules apply to every implementation, API contract, database model, permission and feature.\n> **Do not introduce alternative business rules or assumptions unless they are explicitly approved.**\n>\n> **Precedence:** these rules → business decisions in `open-questions.md` §0 → PRD text. Where a rule changes an earlier document, the change is listed in §17 (\"Impact on the architecture\") and the documents have been updated.\n> Where a rule leaves something open, a question is filed in `open-questions.md`. Nothing was silently resolved.\n> **Clarifications added 2026-09-17** (BQ-59 … BQ-67 and further decisions) are marked **✅ Decided** in the sections below and summarised in §18 and §19.\n\n---\n\n## Contents\n\n1. [Account types](#1-account-types)\n2. [Company types](#2-company-types)\n3. [Company profile](#3-company-profile)\n4. [Company projects / portfolio](#4-company-projects--portfolio)\n5. [Opportunity model](#5-opportunity-model)\n6. [Opportunity audience](#6-opportunity-audience)\n7. [Supplier requests](#7-supplier-requests)\n8. [Individual applications](#8-individual-applications)\n9. [Company opportunity management](#9-company-opportunity-management)\n10. [Verification, points and monetization are separate](#10-verification-points-and-monetization-are-separate)\n11. [Future monetization](#11-future-monetization)\n12. [Paid visibility is separate from trust](#12-paid-visibility-is-separate-from-trust)\n13. [Product philosophy](#13-product-philosophy)\n14. [MVP principle](#14-mvp-principle)\n15. [Required domain separation](#15-required-domain-separation)\n16. [Implementation rule: classify before building](#16-implementation-rule-classify-before-building)\n17. [Impact on the architecture](#17-impact-on-the-architecture)\n18. [Clarifications and additional decisions](#18-clarifications-and-additional-decisions-2026-09-17)\n19. [Decisions BQ-62 … BQ-67](#19-decisions-bq-62--bq-67)\n20. [Single Company Account, Companies to Watch, JOB rules, industries list](#20-single-company-account-companies-to-watch-job-rules-industries-list)\n\n---\n\n## 1. Account types\n\n**Rule.** Back Of House has exactly **two** account types:\n\n```text\nAccountType\n├── INDIVIDUAL\n└── COMPANY\n```\n\nDo **not** create account types such as Supplier User, Event Organizer User, Agency User, Venue User or Service Provider User. Those are **company classifications** (§2), not account types.\n\n**Architecture mapping**\n- `users.account_type` is `AccountType = INDIVIDUAL | COMPANY`. It replaces the PRD §5.1 list (interested, student, professional, company representative, entity representative) and resolves **BQ-29**.\n- Permissions still come **only** from `organization_members` (company roles) and `user_platform_roles` (staff). The account type never grants a permission by itself.\n- ✅ **Decided (BQ-60):** at registration the user chooses **Individual** or **Company**. Each type has its **own registration flow and data**. Individual and Company accounts are **separate security contexts**. The Company Account has **its own RBAC**, independent of Individual accounts. An individual who owns a company gets **no** Company Account permissions; ownership never inherits permissions.\n- ✅ **Decided (BQ-72):** the **student** concept is **removed** entirely (no account type, no profile attribute). **CO_OP** remains an opportunity type.\n- ✅ **Decided (BQ-68, BQ-74):** a company has **exactly one user — its Company Account**. Members and employees use **Individual accounts**, related to the company by **membership only**, which grants no company permissions.\n- ✅ **Decided (BQ-69):** ownership is created or changed **only** through the company creation / ownership flow and admin rules. No separate individual-ownership record.\n\n## 2. Company types\n\n**Rule.** A company has a `companyType` (classification). Initial values:\n\n```text\nCompanyType\n├── EVENT_ORGANIZER\n├── SUPPLIER\n├── VENUE\n├── PRODUCTION\n├── AGENCY\n├── SERVICE_PROVIDER\n└── OTHER\n```\n\nCompany type is used for **classification, discovery, filtering, profile presentation and business-specific UX**.\nCompany type must **not** automatically define all permissions. A company can have several capabilities depending on product rules.\n\n**Architecture mapping**\n- ✅ **Decided (BQ-61):** a company can have **several** company types. Stored in `organization_company_types (organization_id, company_type)`. Compatible with **BQ-06** (\"no organization types\"): BQ-06 removed *institution vs company* kinds; company types classify companies.\n- Company type is a search filter and a profile field. **No permission check reads `company_type`** unless a product rule explicitly says so.\n- Company type is separate from the service taxonomy (`categories` / `services`).\n- ✅ **Decided:** company **classification** and company **verification** are separate. Choosing a type (e.g. `SUPPLIER`) verifies nothing and grants nothing.\n\n## 3. Company profile\n\n**Rule.** A company is a professional business identity, not just an account that posts jobs. Where applicable, the profile supports: company information, about, company type, services, industries, projects / portfolio, team, events, opportunities, jobs, supplier activity, contact information. **These sections must be able to evolve independently.**\n\n**Architecture mapping**\n\n| Profile section | Source (owning module) | Status |\n|---|---|---|\n| Company information, about, company type, contact | `organizations`, `organization_contacts` (organizations) | Designed |\n| Services | `organization_services` (organizations + taxonomy) | Designed |\n| Industries | `organization_industries` → `industries` (taxonomy) | ✅ **BQ-63:** multi-select; classification, filtering, discovery; no permissions; independent of company type |\n| Projects / portfolio | `company_projects` (projects) | Designed (§4) |\n| Team | `organization_members` (Individual accounts) + `show_on_company_profile` | ✅ **BQ-64 / BQ-74:** members are Individual accounts shown by default; the company can hide specific members; displayed data comes from their Individual profiles |\n| Events | `events.host_organization_id` (events) | Depends on **BQ-17** (who hosts events) |\n| Opportunities, jobs | `opportunities` (opportunities) | Designed (§5) |\n| Supplier activity | `opportunities` of type SUPPLIER_REQUEST + `supplier_responses` | ✅ **BQ-65:** visible to **Company Accounts only**; never on the public or individual view |\n\nEach section is served by its **own module and endpoint** (e.g. `/companies/:slug/projects`, `/companies/:slug/opportunities`), not by one large profile model, so sections can change independently.\n\n## 4. Company projects / portfolio\n\n**Rule.** Companies can add projects they have previously worked on. A company project is **not** an Opportunity and **not** a Job. It is a separate Company Project / Portfolio domain:\n\n```text\nCompany → Company Projects\n```\n\nFields may include: title, description, location, date / period, category, services provided, images / media, client name (**optional**), other metadata. **Client name is never required** (projects may be confidential). Projects are part of the company's credibility and professional identity.\n\n**Architecture mapping**\n- Table renamed **`projects` → `company_projects`** (Prisma model `CompanyProject`), with `company_project_services` and `company_project_media`. The rename keeps company portfolio work clearly apart from opportunities.\n- Field mapping: title → `name_ar/_en` · description → `scope_description_ar/_en` · location → `location_id` · date / period → `start_date` / `end_date` · category → `project_type` · services → `company_project_services` · media → `company_project_media` · client name → `client_name` (nullable, protected by `client_disclosure`).\n- The module stays `projects` (Company Projects domain). It has no dependency on `opportunities`, and `opportunities` has none on it.\n\n## 5. Opportunity model\n\n**Rule.** One unified **Opportunity** concept, not separate systems per type:\n\n```text\nOpportunityType\n├── JOB\n├── CO_OP\n├── VOLUNTEERING\n└── SUPPLIER_REQUEST\n```\n\n✅ **Decided (BQ-62):** `PROJECT` is **not** an opportunity type. A project is a piece of the company's work, shown in **Company Profile → Projects / Portfolio**. There is no project application, and projects are not listed among opportunities. `CompanyProject` stays a separate domain and model (§4).\n\nThe frontend should reuse Opportunity components and templates; content and available actions change with `opportunityType`.\n\n**Architecture mapping**\n- One `opportunities` table and one `opportunities` module. Type-specific behaviour lives in a single **type policy map** in code (audience, who may respond, which fields are required), not in scattered conditionals.\n- This replaces the PRD §10.2 list. PRD `FREELANCE` has no equivalent. Whether JOB carries an employment type (permanent, temporary) and whether it requires a verified publisher → **BQ-73**.\n\n## 6. Opportunity audience\n\n**Rule.** Visibility respects the intended audience.\n\n| OpportunityType | Audience |\n|---|---|\n| `JOB` | INDIVIDUAL |\n| `CO_OP` | INDIVIDUAL |\n| `VOLUNTEERING` | INDIVIDUAL |\n| `SUPPLIER_REQUEST` | COMPANY |\n\nSupplier requests must **never** be shown to individuals as normal job opportunities.\n\n**Architecture mapping**\n- `OpportunityAudience = INDIVIDUAL | COMPANY`, derived from the type and stored as `opportunities.audience` (generated column) for filtering.\n- Individual-facing listings (`GET /opportunities`) return only `audience = INDIVIDUAL`. Supplier requests are listed separately (`GET /supplier-requests`).\n- ✅ **Decided (BQ-65):** supplier requests are visible to **Company Accounts only**. Individuals cannot see them, not even read-only; visitors cannot see them; they never appear among individual opportunities. All handling happens in the Company Account context.\n\n## 7. Supplier requests\n\n**Rule.** A supplier request is a **B2B** workflow:\n\n```text\nBuyer Company → Supplier Request → Supplier Companies → Supplier Response\n```\n\nIt is **not** an individual job application. Individuals must not be able to apply. Company responses use a separate concept: **`SupplierResponse`**.\n\n**Architecture mapping**\n- A supplier request is an `opportunities` row with `type = SUPPLIER_REQUEST`, published by a **buyer company** (a normal company, BQ-06).\n- Responses are rows in **`supplier_responses`** (responding company + responding user), **never** in `applications`. `applications` has no organization applicant.\n- This answers part of **BQ-51**: buyers of supplier requests are companies. Institutional workspaces, supplier lists and RFIs (§12) stay on hold.\n- ✅ **Decided (BQ-66):** **any** Company Account can respond to **any** supplier request. There is **no** restriction by company type. Individuals cannot respond. A response is linked to the responding company and to the specific supplier request.\n\n```text\nSupplier Request\n   ├── Company A → Response ✅\n   ├── Company B → Response ✅\n   ├── Company C → Response ✅\n   └── Individual → ❌\n```\n\n- Response content and statuses can be defined later if needed; the MVP keeps a message, an optional attachment, and SUBMITTED / WITHDRAWN.\n\n## 8. Individual applications\n\n**Rule.** Individuals apply to eligible individual-facing opportunities. There is **one** application status model:\n\n```text\nSUBMITTED → REVIEWED → SHORTLISTED → CONTACT → DECISION\n                                                 ├── ACCEPTED\n                                                 ├── REJECTED\n                                                 └── WITHDRAWN\n```\n\nDo not create competing status systems (e.g. `SENT → REVIEW → SHORTLIST → INTERVIEW → OFFER`) unless explicitly approved as a future extension.\nBack Of House connects individuals and companies but **does not make the hiring decision**. The company reviews applicants and decides.\n\n**Architecture mapping**\n- `ApplicationStatus = SUBMITTED | REVIEWED | SHORTLISTED | CONTACT | ACCEPTED | REJECTED | WITHDRAWN`. `DECISION` is the **stage** whose outcomes are ACCEPTED, REJECTED and WITHDRAWN. This resolves the status part of **BQ-25**.\n- The publishing company's members change statuses (except WITHDRAWN, which the applicant sets). No platform user or automation makes a decision.\n- ✅ **Decided (BQ-67):** the workflow is **flexible, not sequential**. The company simply chooses the appropriate status, e.g. `SUBMITTED → ACCEPTED`, `SUBMITTED → SHORTLISTED → ACCEPTED`, or `SUBMITTED → REJECTED`. The company decides the application's status. The individual can set `WITHDRAWN` under a withdrawal rule still to be fixed → **BQ-67** (remaining part), together with whether a final decision can be changed.\n\n## 9. Company opportunity management\n\n**Rule.** Companies must eventually be able to create, edit, publish and view their opportunities, view applicants or responses, review applicants and shortlist where applicable. **Keep the initial workflow simple.**\n\n**Future scope unless approved:** interview scheduling, full messaging system, offer management, advanced recruitment pipelines, recruitment analytics. The architecture must stay extensible without building them.\n\n**Architecture mapping**\n- MVP: `opportunities`, `opportunity_skills`, `opportunity_services`, `applications`, `supplier_responses`.\n- **Deferred (not built unless approved):** `application_messages` (the PRD's \"controlled messaging\"), opportunity matching and match notifications, post-closure surveys (`opportunity_feedback`), recruitment analytics. Their designs stay in the docs as reference only.\n\n## 10. Verification, points and monetization are separate\n\n**Rule.**\n- **Verification** is a company's or professional's verification state.\n- **Points** are user activity and engagement, and are used for **Rewards**.\n- **Paid visibility / monetization** are commercial features bought by companies.\n\nNever grant verification automatically because of many points, payment, being featured or high activity. Points never grant verification.\n\n**Architecture mapping**\n- Already enforced by module boundaries: only `verification` creates verification facts; `engagement` owns points; billing and promotions (future) never write to either (see `auth-architecture.md` §0).\n- ✅ **Decided (BQ-59):** points are **not a currency** and are **never deducted** when a Reward is used. Points **unlock** Levels, Rewards and Benefits.\n- ✅ **Decided:** the **Profile Highlight** benefit is separate from **Verification** and from **Featured / Promoted** (paid placement). It is shown with its own label.\n\n## 11. Future monetization\n\n**Rule.** Back Of House will become a commercial platform, but monetization must **not** make the MVP complex. Possible future features:\n\n| Area | Possible features |\n|---|---|\n| Company subscriptions | Enhanced profile, more portfolio projects, advanced visibility, company analytics, premium business tools |\n| Featured opportunities | Paid promotion of jobs, projects, supplier requests |\n| ~~Featured companies~~ → see §12 | \"Featured\" is reserved for future **paid** placement |\n| Sponsored industry content | Clearly identified sponsored news |\n| B2B / supplier monetization | Paid visibility, lead generation, premium supplier tools |\n\n**Do not** build payment, subscription or commission systems now. **Do not** add Stripe, payment gateways, invoices, wallets, commissions or billing infrastructure because they may be needed later. The architecture must remain compatible with adding them.\n\n**Architecture mapping**\n- The `billing` and `entitlements` modules and their tables (`membership_plans`, `plan_features`, `subscriptions`, `invoices`, `payments`, `coupons`, `coupon_redemptions`, `payment_provider_events`, `entitlements`) are **DEFERRED — future monetization reference design**. They are not in any MVP stage.\n- Features that referenced entitlements before (event ticket eligibility by plan, plan limits on invitations or exports) have **no plan checks** in the MVP.\n- Future concepts `Promotion`, `FeaturedListing`, `SponsoredContent` have **no tables**. Extension points kept: `search_documents.is_sponsored` (label only), a module boundary for a future `promotions` module, and the rule that sponsored placement never feeds trust or organic ranking.\n\n## 12. Paid visibility is separate from trust\n\n✅ **Decided (2026-09-17):** the discovery section formerly called *Featured Companies* is now **Companies to Watch**. The words **Featured** and **Promoted** are **reserved** for future paid placement only. Selection criteria for Companies to Watch → **BQ-70**.\n\n**Rule.** `Featured`, `Sponsored` and `Promoted` are completely separate from `Verified`. A paid company is not automatically verified; a featured company is not automatically more trustworthy. The UI must clearly distinguish commercial placement from verification.\n\n**Architecture mapping**\n- API responses expose **separate fields**, never one combined badge: `is_verified` / `verification_signals` (trust), `highlight` (Profile Highlight reward, BQ-59), `companies_to_watch` (discovery section, BQ-70), and a future `promotion` object (`{ type: FEATURED | PROMOTED | SPONSORED }`, paid).\n- Paid placement never changes `visibility_score`, trust points or verification state (PRD §7.5, §8.1).\n\n## 13. Product philosophy\n\n**Rule.** Back Of House is **not** only a job board, a social network, a company directory or an advertising platform. It is an ecosystem for events-industry professionals and companies, connecting:\n\n```text\nIndividuals + Companies + Professional Profiles + Company Portfolios + Services + Jobs + Projects\n+ Co-op Training + Volunteering + Supplier Requests + Events + News + Courses + Rewards\n```\n\nThe implementation stays simple and focused while preserving this ecosystem architecture.\n\n**Architecture mapping**\n- **Courses** are part of the ecosystem → **BQ-02** is resolved on scope. Their model and phase are still open (no tables designed).\n- **Rewards** → see BQ-59.\n\n## 14. MVP principle\n\n**Rule.** Implement what is required now; prepare clean domain boundaries for later.\n\n| Prefer | Avoid |\n|---|---|\n| Reusable domain models | Duplicated models |\n| Reusable UI components | Duplicated opportunity screens |\n| Clear enums | Fake functionality |\n| Clear permissions | Business rules hardcoded across the UI |\n| Clear API boundaries | Premature payment infrastructure |\n| Strong typing | Premature messaging infrastructure |\n| Explicit relationships | Unnecessary abstractions |\n| Extensible architecture | |\n\n**Architecture mapping:** business rules live in the backend's domain services and type policy maps, exposed through explicit API fields (e.g. `audience`, `allowed_actions`), so clients do not duplicate rules.\n\n## 15. Required domain separation\n\n**Rule.** These concepts stay logically separate:\n\n| Concept | Where it lives |\n|---|---|\n| Account | `users` + Supabase Auth; Individual and Company accounts are separate security contexts (BQ-60); one Company Account per company (`organizations.account_user_id`, BQ-68) |\n| Company | `organizations` (organizations) |\n| CompanyType | `organization_company_types` — one or more per company (BQ-61) |\n| Industry | `organization_industries` → `industries` — one or more per company, independent of company type (BQ-63) |\n| CompanyProject | `company_projects` (projects) |\n| Opportunity | `opportunities` — JOB, CO_OP, VOLUNTEERING, SUPPLIER_REQUEST (opportunities) |\n| Application | `applications` — individuals only (opportunities) |\n| SupplierResponse | `supplier_responses` — companies only (opportunities) |\n| Verification | `verifications` + `verified_at` facts (verification) |\n| Points | `point_ledger`, `point_balances` (engagement) |\n| Reward | `rewards` catalog: benefits unlocked by points or levels, never spent (BQ-59), e.g. Profile Highlight |\n\nFuture monetization concepts, **not implemented**, must stay possible:\n\n| Concept | Placeholder |\n|---|---|\n| Subscription | Deferred `billing` design |\n| Payment | Deferred `billing` design |\n| Promotion | Future `promotions` module (no tables) |\n| FeaturedListing | Future `promotions` module (no tables) |\n| SponsoredContent | Future flag on `content_items` + `promotions` (no columns yet) |\n\n## 16. Implementation rule: classify before building\n\nBefore implementing any feature, answer:\n\n1. Is this an **Account** concern?\n2. Is this an **Individual** concern?\n3. Is this a **Company** concern?\n4. Is this **company classification**?\n5. Is this a **Company Project**?\n6. Is this an **Opportunity**?\n7. Is this an **Individual Application**?\n8. Is this a **Supplier Response**?\n9. Is this **Verification**?\n10. Is this **Points / Rewards**?\n11. Is this future **Monetization**?\n\nDo not merge unrelated concepts to reduce tables or screens. Do not create separate systems when a reusable domain model is enough.\n\n**Final principle:** build a **simple, professional MVP** whose domain model is strong enough to grow into a commercial events-industry ecosystem without a major rewrite.\n\n---\n\n## 17. Impact on the architecture\n\nChanges applied across the reference docs on 2026-09-17:\n\n| # | Change | Rule | Documents |\n|---|---|---|---|\n| 1 | `AccountType` = INDIVIDUAL \\| COMPANY (was 5 PRD values) | 1 | enums, entities, open-questions |\n| 2 | New `CompanyType` enum + `organization_company_types` (one or more, BQ-61) | 2 | enums, entities, ERD, api-map, search |\n| 3 | `projects` → `company_projects` (+ services, media) | 4 | entities, ERD, module map, transactions, dev order |\n| 4 | `OpportunityType` = JOB, CO_OP, VOLUNTEERING, SUPPLIER_REQUEST (PROJECT removed by BQ-62); new `OpportunityAudience` | 5, 6 | enums, entities, ERD, api-map, workflows |\n| 5 | New `supplier_responses` table; `applications` individuals only | 7, 8 | entities, ERD, api-map, transactions (T-17, T-31), events, auth |\n| 6 | `ApplicationStatus` = SUBMITTED, REVIEWED, SHORTLISTED, CONTACT, ACCEPTED, REJECTED, WITHDRAWN | 8 | enums, transactions, workflows |\n| 7 | Messaging, matching, surveys → deferred | 9 | entities, module map, api-map, dev order |\n| 8 | Billing and entitlements → deferred future monetization | 11 | module map, dev order, status, api-map, points |\n| 9 | Paid placement fields separate from verification in API responses | 12 | api-map |\n| 10 | Courses in scope (BQ-02 scope resolved); Rewards meaning → BQ-59 | 10, 13 | open-questions, points |\n| 11 | ADR-026 (account & company types), ADR-027 (unified opportunities + supplier responses), ADR-028 (monetization deferred) | all | architecture-decisions |\n\n**Table count:** 96 designed tables (added `supplier_responses`, `organization_company_types`, `rewards`, `industries`, `organization_industries`, `companies_to_watch_selections`; removed `member_permission_grants`). Of these, 9 are deferred monetization designs and 2 are deferred Phase 3 features (`application_messages`, `opportunity_feedback`).\n\n---\n\n## 18. Clarifications and additional decisions (2026-09-17)\n\n| ID | Decision | Applied as |\n|---|---|---|\n| **BQ-59** | Points are not a currency and are never deducted when a Reward is used. Points unlock Levels, Rewards and Benefits. The **Profile Highlight** benefit is separate from Verification and from Featured / Promoted | `rewards` catalog (no spending); `highlight` is its own API field |\n| **BQ-60** | At registration the user chooses Individual or Company, each with its own flow and data. The accounts are **separate security contexts**. Owning a company as an individual grants **no** Company Account permissions | `AccountContextGuard`; company RBAC members must be COMPANY accounts; ADR-029 |\n| **BQ-61** | A company may have **several** company types (Event Organizer, Supplier, Venue, Production, Agency, Service Provider, Other). Classification never grants permissions | `organization_company_types` join table |\n| — | Account types are only `INDIVIDUAL` and `COMPANY` | unchanged |\n| — | ~~Student attribute~~ — removed later by BQ-72 | — |\n| — | **CO_OP** is an opportunity type, not an account type | unchanged |\n| — | Unified opportunity model. SUPPLIER_REQUEST is for companies, not an individual job. (PROJECT removed by BQ-62, see §19) | unchanged |\n| — | `CompanyProject` is a separate domain; table `company_projects` | unchanged |\n| — | *Featured Companies* renamed **Companies to Watch**; **Featured / Promoted** reserved for future paid placement | §11, §12 (criteria → BQ-70) |\n| — | Company **verification** and company **classification** are separate | §2 |\n| — | **Ownership** is not a way to inherit Company Account permissions | ADR-029 |\n| — | The Company Account's permissions are independent of any Individual account (refined by BQ-68: a single company user, no roles) | ADR-029, ADR-030 |\n\nNew open questions: **BQ-68** (company account logins and team), **BQ-69** (individual ownership record), **BQ-70** (Companies to Watch criteria), **BQ-71** (Profile Highlight mechanics), **BQ-72** (student attribute details).\n\n---\n\n## 19. Decisions BQ-62 … BQ-67\n\n| ID | Decision | Applied as |\n|---|---|---|\n| **BQ-62** | `PROJECT` is **not** an opportunity. It is company work shown in Company Profile → Projects / Portfolio. No project application; not listed among opportunities. `CompanyProject` stays a separate domain | `OpportunityType` = JOB, CO_OP, VOLUNTEERING, SUPPLIER_REQUEST |\n| **BQ-63** | Industries are **multi-select**; a company can belong to several. Used for classification, filtering and discovery. No permissions, no RBAC effect. Independent of company type | `industries` lookup + `organization_industries`; search filter `industry` |\n| **BQ-64** | Company members are shown on the Company Profile **by default**. The company can hide specific members. Hiding does not end the membership and does not change internal permissions; it affects public visibility only | `organization_members.show_on_company_profile` (default `true`); `GET /companies/:slug/team` |\n| **BQ-65** | Supplier requests are visible to **Company Accounts only**. Individuals cannot see them, even read-only. Never among individual opportunities. Handled from the Company Account | `/supplier-requests` requires a COMPANY account; excluded from public and individual endpoints |\n| **BQ-66** | **Any** Company Account can respond to **any** supplier request. No company-type restriction. Individuals cannot respond. A response is tied to the company and the specific request. Response statuses and content can be defined later | `supplier_responses`; permission `supplier_response.submit` in the responding company's RBAC |\n| **BQ-67** | Statuses SUBMITTED, REVIEWED, SHORTLISTED, CONTACT, ACCEPTED, REJECTED, WITHDRAWN. Transitions are **flexible, not sequential**; the company chooses the status. The individual can withdraw under a rule to be fixed | Any company-set status from any non-final status; withdrawal rule and decision changes remain open (BQ-67) |\n\nNew open items: **BQ-73** (JOB employment type and verified publisher), **BQ-74** (which member data appears on the public team section), **RG-28** (initial industries list).\n\n---\n\n## 20. Single Company Account, Companies to Watch, JOB rules, industries list\n\n| ID | Decision | Applied as |\n|---|---|---|\n| **BQ-68** | A company has **only one user — its Company Account**. Members and employees have **Individual accounts**; their relation to the company is **membership** | `organizations.account_user_id` (unique); `organization_members` holds Individual accounts only; company roles and `member_permission_grants` removed; ADR-030 |\n| **BQ-69** | Ownership is created or changed **only** through the company creation / ownership flow and the admin rules already decided | T-01 claim, T-02 creation, T-30 admin ownership flow; no individual ownership record |\n| **BQ-70** | **Companies to Watch** is a **mix of factors**: manual selection by a Back Of House admin, an activity-based algorithm, and verification / completeness. It is a neutral replacement for \"Featured\": **not paid placement** and **not** a verification statement | `companies_to_watch_selections` (admin picks) + computed candidates from activity, verification signals and completion; label never \"Featured\" / \"Verified\". Weights, slot count and refresh cadence → BQ-70 (remaining) |\n| **BQ-71** | Profile Highlight — **not decided yet** | Stays open |\n| **BQ-72** | The **student** concept is **removed** entirely | `profiles.is_student` removed; CO_OP stays an opportunity type |\n| **BQ-73** | A JOB has an **employment type** (permanent, temporary, freelance). Publishing a JOB **requires a verified company** | `JobEmploymentType` enum + `opportunities.employment_type` (required for JOB); publish check (T-32) uses the VERIFIED rule (BQ-53) |\n| **BQ-74** | The company has only one account (the Company Account) | Public team shows member Individual accounts with data from their Individual profiles |\n| **RG-28** | Initial industries list prepared from research (below) | Seed for `industries` after business review |\n\n### Draft initial industries (RG-28)\n\n**Draft initial list (RG-28, 2026-09-17) — needs business review before seeding.** Based on common events-industry and MICE segmentation (corporate events & seminars, conferences, exhibitions, incentives, concerts, festivals, sports, social events) and Saudi market context (seasons, esports, government events). Industries describe the **market a company serves**; company types describe **what the company is** (BQ-61, BQ-63).\n\n| # | slug | Arabic | English |\n|---|---|---|---|\n| 1 | `corporate-events` | فعاليات الشركات والندوات | Corporate Events & Seminars |\n| 2 | `conferences-forums` | المؤتمرات والمنتديات والقمم | Conferences, Forums & Summits |\n| 3 | `exhibitions-trade-shows` | المعارض التجارية والمعارض | Exhibitions & Trade Shows |\n| 4 | `meetings-incentives` | الاجتماعات ورحلات الحوافز | Meetings & Incentive Travel |\n| 5 | `brand-activations` | إطلاق المنتجات والتفعيل التسويقي | Product Launches & Brand Activations |\n| 6 | `concerts-live-entertainment` | الحفلات الموسيقية والترفيه الحي | Concerts & Live Entertainment |\n| 7 | `festivals-seasons` | المهرجانات والمواسم | Festivals & Seasons |\n| 8 | `sports-events` | الفعاليات الرياضية | Sports Events |\n| 9 | `esports-gaming` | الرياضات الإلكترونية والألعاب | Esports & Gaming |\n| 10 | `government-national-events` | الفعاليات الحكومية والوطنية | Government & National Events |\n| 11 | `culture-arts-heritage` | الثقافة والفنون والتراث | Culture, Arts & Heritage |\n| 12 | `weddings-private-events` | الأعراس والمناسبات الخاصة | Weddings & Private Events |\n| 13 | `education-training-events` | الفعاليات التعليمية والتدريبية | Education & Training Events |\n| 14 | `community-charity-events` | الفعاليات المجتمعية والخيرية | Community & Charity Events |\n| 15 | `tourism-destination-events` | السياحة وفعاليات الوجهات | Tourism & Destination Events |\n| 16 | `other` | أخرى | Other |\n\nNew open question: **BQ-75** (how individuals become company members, and whether members can hide themselves).\n"},{"name":"open-questions","title":"Open Questions & Ambiguities","keywords":"ambiguities business decision gaps","markdown":"# Open Questions & Ambiguities\n\n> **Source:** `Back_Of_House_Technical_Product_Requirements_AR_v1.0.docx` (v1.0, 27 Aug 2026), cited as **PRD §x**.\n> This register collects everything the PRD leaves unclear. **None of these have been silently resolved** in the architecture. Where the architecture needs a working assumption to continue, it is labelled **ASSUMPTION** and points back to the question ID.\n> Business answers are recorded in the **Decision log** (§0) and applied across all documents. Resolved rows stay in place, marked ✅, so existing references keep working.\n\nLegend\n\n| Tag | Meaning |\n|---|---|\n| `NEEDS BUSINESS DECISION` | Product/business/legal must decide. |\n| `REQUIRES TECHNICAL DECISION` | Engineering can decide; a recommendation is given. |\n| `REQUIREMENT GAP` | Feature is mentioned but not specified enough to build. |\n| **Blocks** | Earliest phase whose build is blocked or at risk. |\n\n---\n\n## 0. Decision log\n\n### 2026-09-17 (final): Single Company Account, BQ-68 … BQ-74, RG-28\n\nFull table in `business-rules.md` §20.\n\n| ID | Decision |\n|---|---|\n| **BQ-68** | A company has one user only (the Company Account); employees and members are Individual accounts related by membership |\n| **BQ-69** | Ownership is created / changed only through the company creation / ownership flow and admin rules |\n| **BQ-70** | Companies to Watch mixes admin selection, activity-based algorithm and verification / completeness; neutral, not paid, not verification |\n| **BQ-71** | Not decided yet |\n| **BQ-72** | Student concept removed entirely |\n| **BQ-73** | JOB has an employment type (permanent, temporary, freelance); publishing a JOB requires a verified company |\n| **BQ-74** | The company has only one account; the public team shows member Individual accounts |\n| **RG-28** | Draft industries list prepared from research; needs business review |\n\nQuestions raised:\n\n| ID | Question | Raised by | Blocks |\n|---|---|---|---|\n| **BQ-75** | **Company membership flow.** How does an individual become a member: the Company Account invites, the individual requests to join, or both? Must the other side confirm? Can a member hide themselves from the public team (their own privacy) in addition to the company hiding them? | BQ-68, BQ-74 | Stage 8 |\n\n\n### 2026-09-17 (latest): BQ-62 … BQ-67\n\nFull table in `business-rules.md` §19.\n\n| ID | Decision |\n|---|---|\n| **BQ-62** | PROJECT is not an opportunity; projects are company portfolio work (`company_projects`). Opportunity types: JOB, CO_OP, VOLUNTEERING, SUPPLIER_REQUEST |\n| **BQ-63** | Industries are multi-select, for classification / filtering / discovery; no permissions; independent of company type |\n| **BQ-64** | Members appear on the public company profile by default; the company can hide specific members (`show_on_company_profile`); public visibility only |\n| **BQ-65** | Supplier requests are visible to Company Accounts only; individuals never see them |\n| **BQ-66** | Any Company Account can respond to any supplier request; no company-type restriction; individuals cannot respond |\n| **BQ-67** | Flexible (non-sequential) application statuses chosen by the company; individual withdrawal under a rule still to be fixed |\n\nQuestions raised:\n\n| ID | Question | Raised by | Blocks |\n|---|---|---|---|\n| **BQ-73** | ✅ **RESOLVED 2026-09-17:** employment type PERMANENT / TEMPORARY / FREELANCE; publishing a JOB requires a verified company (rule BQ-53). *Original:* **JOB details** (left open by BQ-62): does a JOB carry an employment type (permanent, temporary, freelance)? Does publishing a JOB require a verified company (PRD §10.2)? | BQ-62 | Phase 3 |\n| **BQ-74** | ✅ **RESOLVED 2026-09-17:** the company has one account; team members are Individual accounts shown from their profiles. *Original:* **Public team section data.** Company team members are COMPANY accounts without an individual profile (BQ-60). What is shown for each visible member (name, job title, photo), and where is it entered? | BQ-64 | Phase 1 |\n\n\n### 2026-09-17 (later): Clarifications BQ-59, BQ-60, BQ-61 and additional decisions\n\nFull list in `business-rules.md` §18.\n\n| ID | Decision |\n|---|---|\n| **BQ-59** | Points are not a currency and are never deducted when a Reward is used; points unlock Levels / Rewards / Benefits. Profile Highlight is separate from Verification and Featured / Promoted |\n| **BQ-60** | Registration chooses Individual or Company; separate flows and data; **separate security contexts**; the Company Account has its own RBAC; owning a company as an individual grants no Company Account permissions |\n| **BQ-61** | A company can have several company types; classification grants no permissions |\n| — | Student is an Individual profile attribute; CO_OP is an opportunity type; Featured Companies → **Companies to Watch**; Featured / Promoted reserved for paid placement; verification ≠ classification |\n\nQuestions raised:\n\n| ID | Question | Raised by | Blocks |\n|---|---|---|---|\n| **BQ-68** | ⚠️ **MOSTLY RESOLVED 2026-09-17:** one Company Account per company; members are Individual accounts. **Still open:** can one email or phone hold both an Individual and a Company account? Can an account's type change? Which account type holds Back Of House staff roles? *Original:* **Company Account logins.** Does each company team member have their **own** COMPANY-type login (current design), or is there one shared login per company? Can one COMPANY login manage **several** companies (this reinterprets BQ-03 / BQ-49 for company contexts)? Can the same email or phone hold both an Individual and a Company account? Can an account's type ever change? Which account type holds Back Of House staff roles? | BQ-60 | Stages 4, 6, 8 |\n| **BQ-69** | ✅ **RESOLVED 2026-09-17:** ownership only through the creation / ownership flow and admin rules; no individual ownership record. *Original:* **Individual ownership record.** Should \"this individual owns company X\" be recorded or shown on the individual profile at all (it grants no permissions)? If so, how is it confirmed? | BQ-60 | Phase 1 / 3 |\n| **BQ-70** | ⚠️ **MOSTLY RESOLVED 2026-09-17:** mix of admin selection, activity algorithm and verification / completeness; not paid. **Still open:** weights, number of slots, refresh cadence, how long an admin pick lasts. *Original:* **Companies to Watch.** Who selects them (editorial, algorithm), on what criteria, how are they labelled, and is it guaranteed never to be paid? | Decision 2026-09-17 | Phase 1 discovery |\n| **BQ-71** | **Profile Highlight benefit.** Which level or points unlock it; automatic or activated by the user; duration; does it change search ranking or only presentation? Does it apply to companies too? | BQ-59 | Phase 2 |\n| **BQ-72** | ✅ **RESOLVED 2026-09-17:** student concept removed; CO_OP remains an opportunity type. *Original:* **Student attribute.** What data (institution, expected graduation), is it verified, and does it gate CO_OP applications? | Decision 2026-09-17 | Phase 1 / 3 |\n\n\n### 2026-09-17: Mandatory business rules received\n\nThe full rules are in **`business-rules.md`** (they take precedence over PRD text). Questions they resolve:\n\n| ID | Resolution | Rule |\n|---|---|---|\n| **BQ-29** | Account types are exactly `INDIVIDUAL` and `COMPANY` | Rules §1 |\n| **BQ-02** | Courses are part of the ecosystem (scope resolved). Model and phase still open | Rules §13 |\n| **BQ-25** | Application statuses: SUBMITTED → REVIEWED → SHORTLISTED → CONTACT → DECISION (ACCEPTED / REJECTED / WITHDRAWN). Company members decide; the platform never decides | Rules §8 |\n| **BQ-51** (partly) | Supplier requests are a B2B workflow between companies (buyer company → supplier companies → `SupplierResponse`). Institutional workspaces, lists and RFIs remain on hold | Rules §7 |\n| **BQ-24** (partly) | Opportunities are published by companies; supplier requests by a buyer company | Rules §5, §7 |\n\nQuestions raised by the rules:\n\n| ID | Question | Raised by | Blocks |\n|---|---|---|---|\n| **BQ-59** | ✅ **RESOLVED 2026-09-17:** points are never deducted; they unlock Levels / Rewards / Benefits. *Original:* **Rewards vs BQ-08.** Rule §10 says points \"are used for Rewards\"; decision BQ-08 says points are \"not a redemption currency\". Are rewards benefits unlocked by points/levels without spending (current interpretation), or redeemed by spending points? | Rules §10, §13 | Phase 2 |\n| **BQ-60** | ✅ **RESOLVED 2026-09-17:** separate security contexts and registration flows; company RBAC independent; ownership grants nothing. Details → BQ-68, BQ-69. *Original:* **Account type meaning.** Is a COMPANY account a person who manages companies (compatible with BQ-03/BQ-49)? May a COMPANY account apply to individual opportunities, or an INDIVIDUAL account create or join a company? Can the account type change later? | Rules §1 | Phase 1 (onboarding) |\n| **BQ-61** | ✅ **RESOLVED 2026-09-17:** several types per company; no automatic permissions. *Original:* **Company type.** One type per company or several (\"a company can have multiple capabilities\")? Is the list fixed in code or admin-managed? | Rules §2 | Phase 1 |\n| **BQ-62** | ✅ **RESOLVED 2026-09-17:** PROJECT is not an opportunity (company portfolio only). JOB details → BQ-73. *Original:* **Opportunity type mapping.** PRD `PERMANENT_JOB` / `TEMPORARY_CONTRACT` → `JOB` with an employment-type field? `FREELANCE` → `PROJECT`? Does a JOB still require a verified publisher (PRD §10.2)? | Rules §5 | Phase 3 |\n| **BQ-63** | ✅ **RESOLVED 2026-09-17:** multi-select classification, no permissions, independent of company type. *Original:* **Industries** on the company profile: what is an industry, and how does it differ from service categories and company type? | Rules §3 | Phase 1 |\n| **BQ-64** | ✅ **RESOLVED 2026-09-17:** shown by default, hideable per member (`show_on_company_profile`). Displayed data → BQ-74. *Original:* **Public team section.** Which members appear on the public company profile, and with whose consent? | Rules §3 | Phase 1 |\n| **BQ-65** | ✅ **RESOLVED 2026-09-17:** Company Accounts only. *Original:* **Supplier request visibility.** Can visitors or individual accounts see supplier requests read-only? What \"supplier activity\" is public on a company profile? | Rules §6, §7 | Phase 3 |\n| **BQ-66** | ✅ **RESOLVED 2026-09-17:** any Company Account, no type restriction, no individuals; content and statuses later if needed. *Original:* **Supplier response.** Contents (message, attachments, price?), statuses, whether the buyer shortlists or selects, and whether responding is limited by company type | Rules §7 | Phase 3 |\n| **BQ-67** | ⚠️ **PARTLY RESOLVED 2026-09-17:** transitions are flexible; the company chooses any status. **Still open:** the individual's withdrawal rule (from which statuses?), whether ACCEPTED / REJECTED can later be changed, and what happens to undecided applications when an opportunity closes. | Rules §8 | Phase 3 |\n\n\n### 2026-09-15: Business decisions received\n\n| ID | Question | Decision | How it is applied in the architecture |\n|---|---|---|---|\n| **BQ-01** | Which clients does the backend serve? | **Web + Flutter mobile, through one backend/API** | One REST API serves both. SEO data endpoints (slugs, sitemap entries) are in Phase 1 scope. Mobile keeps tokens in secure storage; web keeps the session in HttpOnly cookies. Push notifications remain open (RG-14) |\n| **BQ-30** | Authentication method | **OTP + Password** | Sign-up with email or phone **and** a password; the identifier is confirmed by a one-time code before the account is active (AUTH-01). Sign-in with password. Password recovery by one-time code. AUTH-04 password policy applies. Social login is **excluded**. Whether OTP-only sign-in is also allowed → **BQ-58** |\n| **BQ-03** | Can a user work with more than one company? | **Yes.** A user can be a member of several companies | Many-to-many `organization_members`; the company is always explicit in the URL |\n| **BQ-04** | How many owners per company? | **Exactly one owner** | Refined by BQ-68: the owner is the company's single Company Account (`organizations.account_user_id`). OWNER is never assigned through invitations or role changes. Ownership transfer → **BQ-56** |\n| **BQ-05** | Who creates a company? | **The company owner creates it** | The creator becomes the single OWNER at creation (T-02) |\n| **BQ-05** | Who approves a company? | **An admin reviews and approves** | New `organization_approvals` review (T-29), decided by `SYSTEM_ADMIN`. Approval publishes the listing. Approval criteria and resubmission → **BQ-57** |\n| **BQ-06** | Organization types | **No types. Every organization is a company** | `organizations.type` and `OrganizationType` removed; institution roles (BUYER, READER, AUDITOR) removed. The PRD's buyer and government entity features (§5.4, §12, Phase 4) must be re-scoped → **BQ-51** |\n| **BQ-07** | What is a \"verified professional\"? | **Verification is independent of points and levels** | \"Verified professional\" comes only from approved verifications. Levels are purely points-based; the §9.1 verification gate is removed. Naming of the 500–799 level → **BQ-52** |\n| **BQ-08** | Points and rewards | **Points serve levels and benefits only; they are not a redemption currency** | No rewards catalog, redemption tables or point spending, now by decision |\n| **BQ-46** | Approval vs. verification | **Separate. Approval does not mean verification** | An approved new company is published as CLAIMED (it has an owner). Verification runs separately through signals |\n| **BQ-47** | Company verification | **Several independent verification signals** | Separate verification types for commercial registration, website domain, licenses/certifications and contact details, each with its own lifecycle. Which signals make a company show as VERIFIED → **BQ-53** |\n| **BQ-48** | Who performs verification? *(new question supplied with the decisions)* | **Admin / Reviewer only, in Phase 1** | No automated verification decisions in Phase 1; automated checks only assist reviewers. `verification.review` = `VERIFICATION_REVIEWER`, `SYSTEM_ADMIN` |\n| **BQ-49** | Can a user own more than one company? *(new question supplied with the decisions)* | **Yes** — ⚠️ superseded by BQ-68: each company has its own single Company Account | No per-user limit on OWNER memberships. The one-owner rule applies per company, not per user |\n\n> **Renumbering.** Two IDs in the decision list named different questions from the ones filed earlier under those numbers. Your numbering is kept:\n> the earlier **BQ-48** (editing published projects) is now **BQ-54**, and the earlier **BQ-49** (competing claims) is now **BQ-55**.\n\n### New questions raised by these decisions\n\n| ID | Question | Raised by | Blocks |\n|---|---|---|---|\n| **BQ-51** | **Buyer and government entities without organization types.** The PRD's buyer journey (§5.4), institutional membership for government and contracting entities (§12), the `SUPPLIER_REQUEST` opportunity publisher (§10.2), MFA for \"entities\" (AUTH-03), the `ENTITY_REPRESENTATIVE` account type (§5.1) and the pilot buyers (§1.2, §22, BQ-26) all assume non-company organizations. Now that every organization is a company: are buyer features used **by companies** (e.g. contractors and organizers)? Are government entities out of scope? Or will they be modelled differently later? | BQ-06 | Phase 4 (and the Phase 1 pilot scope) |\n| **BQ-52** | **The 500–799 level** is named \"محترف موثّق\" (verified professional) in §9.1 and gated on verification. With verification independent of levels, what is this level called? | BQ-07 | Phase 2 |\n| **BQ-53** | **Company VERIFIED status.** With independent signals, which signal or combination makes a company show as `VERIFIED` (and match the \"verified\" search filter)? Or is `VERIFIED` replaced by per-signal badges? When is a company `UNDER_VERIFICATION`? | BQ-47 | Phase 1 |\n| **BQ-56** | **Ownership transfer.** With exactly one owner: how is ownership transferred ontend team. | ADR-003 |\n| **TQ-03** | MFA factor for sensitive roles (AUTH-03) | TOTP (Supabase MFA). Enforce `aal2` in NestJS for staff roles. MFA for \"entities\" (AUTH-03) → BQ-51. | ADR-003 |\n| **TQ-04** | SMS provider for Saudi numbers (OTP) | Saudi-registered sender via the Supabase *Send SMS* auth hook. Provider chosen by business. | ADR-003 |\n| **TQ-05** | API JSON casing: the frontend parses `snake_case` (`full_name`, `access_token`, `is_verified`) | Agree one casing with the frontend **before the first endpoint**. | ADR-019 (Open) |\n| **TQ-06** | Pagination: PRD asks for \"stable pagination\" (§15.1); the frontend uses page numbers + `hasMore` | Cursor (keyset) pagination for public and user lists; offset for admin tables. | ADR-008 |\n| **TQ-07** | Response and error envelope | `{ data, meta }` for success; `{ code, message, trace_id, errors }` for errors (fits the frontend's parser); HTTP 422 for validation. | ADR-008 |\n| **TQ-08** | Background job runner | **pg-boss** (queue inside Postgres; no Redis). Revisit if throughput requires it. | ADR-010 |\n| **TQ-09** | Hosting platform for the NestJS service | Undecided. Affects IPv4/IPv6 database connectivity, secrets manager, WAF/CDN (§19). | ADR-023 (Open) |\n| **TQ-10** | Malware scanning of uploads (§18) | Quarantine bucket + scanner worker (ClamAV container or a managed scanning API). | ADR-009 |\n| **TQ-11** | Encryption of sensitive documents beyond storage-level encryption at rest | Private bucket + short-lived signed URLs from day 1. App-level envelope encryption for identity documents is decided before the identity-verification launch. | ADR-009 |\n| **TQ-12** | Arabic search (alef/hamza normalisation, §7.4) | PostgreSQL FTS + `pg_trgm` + custom normalisation function on a **public-only projection table**. Check that the PostgreSQL `arabic` text-search configuration exists on the Supabase version. | ADR-012 |\n| **TQ-13** | Company point components that are *computed* (profile completion ≤100
