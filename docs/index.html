lists (§5.4, §12.1). Soft delete |\n| saved_list_items | §14 ✅ | saved_list_id, company_organization_id, internal_note, added_by | Unique `(saved_list_id, company_organization_id)`; internal notes are **never** visible to the company |\n| saved_searches | — §12.1 | organization_id, created_by_user_id, name, query (jsonb), alerts_enabled, last_alerted_at, deleted_at | Alerts when new matching suppliers appear |\n| rfis | §14 ✅ | requester_organization_id, created_by, subject, message, status (RfiStatus), due_at, sent_at, closed_at | RG-04 |\n| rfi_recipients | — §12.1 | rfi_id, recipient_organization_id, status, response_text, response_document_id, responded_by, responded_at | Unique `(rfi_id, recipient_organization_id)` |\n\n---\n\n## Supporting enums introduced by this catalog\n\nAlso listed in `enums-and-statuses.md` §12: `LocationType` 🟡, `ContactType` 🟡, `EventKind` 🟡, `MetricGroup` 🟢, `SearchSubjectType` 🔴, `AppealSubjectType` 🔴, `AuditActorType` 🔴, `ImportRowAction` 🔴, `PlanAudience` 🔴, `MessageSide` 🔴. Rule-defined: `AccountType`, `CompanyType`, `OpportunityType`, `OpportunityAudience`, `ApplicationStatus` 🔵; `SupplierResponseStatus` 🔴.\n"},{"name":"enums-and-statuses","title":"Enums & Status Map","keywords":"status state machine lifecycle","markdown":"# Enums & Status Map\n\n> Every enum is tagged by how much the PRD supports it:\n>\n> | Tag | Meaning |\n> |---|---|\n> | 🟢 **PRD-DEFINED** | The value list appears verbatim in the PRD (section cited). |\n> | 🟡 **PRD-DERIVED** | Values follow directly from a PRD workflow, but the PRD gives no explicit list. |\n> | 🔴 **PROPOSED** | Technical proposal needed to build. **Not in the PRD. NEEDS BUSINESS DECISION before it is final.** |\n>\n> 🔵 **RULE-DEFINED** = the value list comes from the mandatory `business-rules.md` (2026-09-17), which overrides PRD lists.\n>\n> PostgreSQL enums are named in `PascalCase` in Prisma and `snake_case` in SQL (see `database-design-rules.md`).\n> Transitions marked *(PRD)* are traceable to the PRD; transitions marked *(proposed)* are engineering proposals.\n\n---\n\n## Contents\n\n1. [Identity & access](#1-identity--access)\n2. [Organizations & directory](#2-organizations--directory)\n3. [Verification](#3-verification)\n4. [Media & documents](#4-media--documents)\n5. [Membership & billing](#5-membership--billing-phase-2)\n6. [Points, levels, visibility](#6-points-levels-visibility-phase-2)\n7. [Events](#7-events-phase-2)\n8. [Talent & opportunities](#8-talent--opportunities-phase-3)\n9. [Intelligence & institutional](#9-intelligence--institutional-phase-4)\n10. [Content, moderation, notifications, platform](#10-content-moderation-notifications-platform)\n11. [Supporting enums](#11-supporting-enums-introduced-by-the-entity-catalog)\n12. [Enum index](#12-enum-index)\n\n---\n\n## 1. Identity & access\n\n### AccountType — 🔵 RULE-DEFINED (business rules §1) · Phase 1\n\n```text\nAccountType\n├── INDIVIDUAL\n└── COMPANY\n```\n\n- **Exactly two** account types. Supplier, organizer, agency, venue and service-provider are **company types** (`CompanyType`), never account types.\n- **Set by:** the user **at registration** (BQ-60). Each type has its own registration flow and data.\n- **Meaning:** the account's **security context**. INDIVIDUAL and COMPANY accounts are separate contexts: company routes require a COMPANY account; individual routes require an INDIVIDUAL account. The type alone grants no permission; company permissions belong to the company's single Company Account (`organizations.account_user_id`, BQ-68), staff permissions from `user_platform_roles`.\n- The student concept was **removed** (BQ-72). **CO_OP** is an opportunity type.\n- A company has exactly **one** COMPANY account (`organizations.account_user_id`, BQ-68). People who work for a company use INDIVIDUAL accounts and are **members** (no permissions).\n- Replaces the PRD §5.1 list (interested, student, professional, company representative, entity representative) and the frontend's `professional | company | student | other` (BQ-29 resolved).\n- ✅ BQ-60 / BQ-68 resolved. Remaining details (type change, same identifier for both types, staff account type) → **BQ-68**.\n\n### UserStatus — 🔴 PROPOSED · Phase 1\n\n```text\nUserStatus\n├── ACTIVE        verified identifier + may use the platform\n├── SUSPENDED     blocked by admin (§13 \"تعليق\")\n└── DEACTIVATED   deleted / anonymised (AUTH-06, later)\n```\n\nNo `PENDING` value: a `users` row is created only **after** the OTP is verified. AUTH-01 says no activated account exists without verification. The unverified state lives in Supabase Auth, not here.\n\n```mermaid\nstateDiagram-v2\n    [*] --> ACTIVE : identifier verified (first authenticated call)\n    ACTIVE --> SUSPENDED : admin suspends\n    SUSPENDED --> ACTIVE : admin reinstates\n    ACTIVE --> DEACTIVATED : deletion request processed (AUTH-06, later)\n    SUSPENDED --> DEACTIVATED : deletion processed\n    DEACTIVATED --> [*]\n```\n\n| Transition | Who | Effects |\n|---|---|---|\n| → SUSPENDED | `SYSTEM_ADMIN` | Revoke all sessions; hide the profile from search; audit log; `user.suspended` |\n| → ACTIVE | `SYSTEM_ADMIN` | Audit log; reindex the profile |\n| → DEACTIVATED | System (user request) | Anonymise personal data; end memberships; keep ledger and audit rows with a pseudonymous id |\n\n### PlatformRole — 🟢 PRD-DEFINED (§3 staff roles) · Phase 1\n\n```text\nPlatformRole                (Back Of House staff, table user_platform_roles)\n├── VERIFICATION_REVIEWER   مراجع تحقق\n├── CONTENT_MODERATOR       مشرف محتوى\n├── SYSTEM_ADMIN            مدير نظام\n└── AUDITOR                 مدقق   (read sensitive logs only)\n```\n\n- **Granted or revoked by:** `SYSTEM_ADMIN` only. Always audited. MFA is required to use any of these roles (AUTH-03).\n- Event check-in staff is not a defined role → **BQ-17**.\n- **Verification decisions** are made only by `VERIFICATION_REVIEWER` or `SYSTEM_ADMIN`, always by a person in Phase 1 (BQ-48).\n- **Company approval** is decided by `SYSTEM_ADMIN` (BQ-05).\n\n### ~~OrganizationRole~~ — removed (BQ-68)\n\nA company has a **single user — its Company Account** — which holds all company permissions for its own company. There are no OWNER / EDITOR / ANALYST roles and no delegation. Ownership is `organizations.account_user_id`, set only by company creation (T-02), an approved claim (T-01) or the admin ownership flow (T-30).\n\n### MembershipStatus — 🔴 PROPOSED · Phase 1\n\nMembership = an **Individual account's affiliation** with a company (BQ-68). It grants **no** permissions.\n\n```text\nMembershipStatus\n├── ACTIVE\n└── REMOVED     removed by the Company Account, or the member left\n```\n\n```mermaid\nstateDiagram-v2\n    [*] --> ACTIVE : membership created (flow → BQ-75)\n    ACTIVE --> REMOVED : Company Account removes, or member leaves\n    REMOVED --> ACTIVE : re-joined\n```\n\n- Public visibility is a separate flag (`show_on_company_profile`, BQ-64), not a status.\n\n### InvitationStatus — 🔴 PROPOSED · Phase 1 (AUTH-05)\n\n```text\nInvitationStatus\n├── PENDING\n├── ACCEPTED\n├── REVOKED\n└── EXPIRED\n```\n\nCandidate flow for adding **Individual** members (BQ-75): the Company Account invites; an INDIVIDUAL account accepts. PENDING → ACCEPTED (individual), PENDING → REVOKED (Company Account), PENDING → EXPIRED. PRD AUTH-05 roles no longer apply (BQ-68).\n\n### ConsentPurpose — 🔴 PROPOSED values, 🟢 concept PRD-DEFINED (§5.1, §14 `consents`, §18) · Phase 1\n\n```text\nConsentPurpose              (list incomplete → RG-25)\n├── TERMS_OF_SERVICE\n├── PRIVACY_POLICY\n├── MARKETING_COMMUNICATIONS\n└── ANALYTICS_LINKING       link events to account after consent (§16.1)\n```\n\n---\n\n## 2. Organizations & directory\n\n### CompanyType — 🔵 RULE-DEFINED (business rules §2) · Phase 1\n\n```text\nCompanyType\n├── EVENT_ORGANIZER\n├── SUPPLIER\n├── VENUE\n├── PRODUCTION\n├── AGENCY\n├── SERVICE_PROVIDER\n└── OTHER\n```\n\n- A company can have **several** types (BQ-61), stored in `organization_company_types`. Used for **classification, discovery, filtering, profile presentation and business-specific UX**.\n- **Never** the source of a permission by itself (rules §2). For example, responding to supplier requests is not limited to `SUPPLIER` unless BQ-66 decides so.\n- Compatible with BQ-06: all organizations are companies; this classifies them.\n- ✅ BQ-61 resolved: multiple types; classification never grants permissions.\n- Classification is **separate from verification**: choosing a type verifies nothing (decision 2026-09-17).\n\n### ~~OrganizationType~~ — removed (BQ-06)\n\nEvery organization is a company, so there is no type column or enum. The PRD's government, contracting and research entities (§3, §12) are on hold → **BQ-51**.\n\n### OrganizationApprovalStatus — 🟡 DERIVED from decisions BQ-05, BQ-46 · Phase 1\n\n```text\nOrganizationApprovalStatus        (table organization_approvals)\n├── PENDING          submitted by the owner, waiting for an admin\n├── NEEDS_CHANGES    admin asked for changes (reason required)\n├── APPROVED         listing may be published\n└── REJECTED         final for this request (resubmission → BQ-57)\n```\n\n```mermaid\nstateDiagram-v2\n    [*] --> PENDING : owner submits a DRAFT company\n    PENDING --> APPROVED : SYSTEM_ADMIN approves\n    PENDING --> NEEDS_CHANGES : SYSTEM_ADMIN requests changes\n    NEEDS_CHANGES --> PENDING : owner resubmits\n    PENDING --> REJECTED : SYSTEM_ADMIN rejects\n    APPROVED --> [*]\n    REJECTED --> [*]\n```\n\n| Transition | Who | What happens |\n|---|---|---|\n| → PENDING | Company Account | Mandatory fields validated; duplicate check re-run; queued for admins |\n| → APPROVED | `SYSTEM_ADMIN` | `organizations.approved_at` set; company becomes CLAIMED and public; **no verification signal is set** (BQ-46); audit; `organization.approved` |\n| → NEEDS_CHANGES / REJECTED | `SYSTEM_ADMIN` | Reason required; owner notified |\n\nApproval is **not** a verification case: it lives in `organization_approvals`, not `verifications`.\n\n### OrganizationStatus — 🟢 PRD-DEFINED (§29.1; ORG-07 is a subset) · Phase 1\n\n```text\nOrganizationStatus\n├── DRAFT                مسودة\n├── UNCLAIMED            غير مطالب بها\n├── CLAIMED              مطالَب بها\n├── UNDER_VERIFICATION   قيد التحقق\n├── VERIFIED             موثقة\n├── NEEDS_UPDATE         تحتاج تحديثًا\n├── SUSPENDED            موقوفة\n└── ARCHIVED             مؤرشفة\n```\n\n**Storage rule (ADR-018):** `status` is stored, but the system **recalculates it from facts** instead of setting it freely. The facts are: `approved_at`, `claimed_at` and the owner membership, the approved **verification signals** (BQ-47), staleness (`last_confirmed_at`), `suspended_at` and `archived_at`. So when a suspension is lifted, the correct prior state comes back without keeping a separate history.\n\n| Status | Derived when | Source |\n|---|---|---|\n| `DRAFT` | Created by an owner, not yet approved | BQ-05 |\n| `UNCLAIMED` | Imported, no owner | §22 |\n| `CLAIMED` | Has an owner **and** is published (claim approved, or new company approved) | §5.2, BQ-46 |\n| `UNDER_VERIFICATION` | ⚠️ Rule pending **BQ-53**. **ASSUMPTION:** a CLAIMED company with at least one signal case IN_REVIEW and no VERIFIED status yet | BQ-47 |\n| `VERIFIED` | ⚠️ Rule pending **BQ-53**. **ASSUMPTION** (configurable policy): the `ORGANIZATION_REGISTRATION` signal is approved and not expired | BQ-47 |\n| `NEEDS_UPDATE` | VERIFIED but stale, or a required signal expired | ORG-08 |\n| `SUSPENDED` / `ARCHIVED` | Admin action / merge | §13, ORG-09 |\n\n```mermaid\nstateDiagram-v2\n    [*] --> UNCLAIMED : bulk import (§22)\n    [*] --> DRAFT : owner creates company (BQ-05)\n\n    DRAFT --> CLAIMED : SYSTEM_ADMIN approves (BQ-05) — approval is not verification (BQ-46)\n    UNCLAIMED --> CLAIMED : claim approved by reviewer (§5.2)\n    CLAIMED --> UNDER_VERIFICATION : signal case submitted (rule BQ-53)\n    UNDER_VERIFICATION --> VERIFIED : required signals approved (rule BQ-53)\n    UNDER_VERIFICATION --> CLAIMED : signal rejected\n    VERIFIED --> NEEDS_UPDATE : data stale / signal expired (ORG-08)\n    NEEDS_UPDATE --> VERIFIED : owner updates, signal re-approved\n\n    UNCLAIMED --> SUSPENDED : admin\n    CLAIMED --> SUSPENDED : admin\n    VERIFIED --> SUSPENDED : admin\n    NEEDS_UPDATE --> SUSPENDED : admin\n    SUSPENDED --> CLAIMED : admin lifts (status recalculated)\n\n    UNCLAIMED --> ARCHIVED : admin / merged\n    CLAIMED --> ARCHIVED : admin / merged\n    VERIFIED --> ARCHIVED : admin / merged\n    SUSPENDED --> ARCHIVED : admin\n    ARCHIVED --> [*]\n```\n\n| Transition | Who | Source | What happens |\n|---|---|---|---|\n| (new) → UNCLAIMED | System (import) | §22 | Public fields indexed; unconfirmed contact data **not published** (§22.1). Whether imports need approval → BQ-57 |\n| (new) → DRAFT | Authenticated user | BQ-05 | Duplicate check first (ORG-09); `account_user_id` = the registering Company Account (BQ-68) |\n| DRAFT → CLAIMED | `SYSTEM_ADMIN` approves (T-29) | BQ-05, BQ-46 | Listing published and indexed; `organization.approved`; **no** verification signal set |\n| UNCLAIMED → CLAIMED | `VERIFICATION_REVIEWER` / `SYSTEM_ADMIN` approves a claim (T-01) | §5.2, BQ-48 | Company linked to the claimant's Company Account; audit |\n| → UNDER_VERIFICATION / VERIFIED | Derived from reviewer decisions on signal cases | BQ-47, BQ-53 | Trust points per signal (Phase 2); `organization.verified` when VERIFIED is reached |\n| VERIFIED → NEEDS_UPDATE | Scheduler | ORG-08 | Owner notified; staleness threshold **BQ-20** |\n| → SUSPENDED | `SYSTEM_ADMIN` | §13 | Removed from search; memberships unaffected; audit |\n| → ARCHIVED | `SYSTEM_ADMIN` | §13 | Removed from search; merge record if merged (ORG-09) |\n\n### ClientDisclosureStatus — 🟢 PRD-DEFINED (§7.3) · Phase 1\n\n```text\nClientDisclosureStatus\n├── NOT_DISCLOSED   غير معلن   client name never exposed\n├── DISCLOSED       معلن       company states it has permission\n└── CONFIRMED       تم تأكيده  client confirmed (process → BQ-22)\n```\n\n**Rule (PRD §7.3, §27):** the client name is **never** returned by any public API or written to the search projection unless the status is `DISCLOSED` or `CONFIRMED`.\n\n### ProjectStatus — 🟢 PRD-DEFINED (§29.1; §7.3 subset) · Phase 1 · table `company_projects`\n\n```text\nProjectStatus\n├── DRAFT           مسودة\n├── IN_REVIEW       قيد المراجعة\n├── PUBLISHED       منشور\n├── NEEDS_CHANGES   يحتاج تعديلًا\n├── REJECTED        مرفوض\n└── ARCHIVED        مؤرشف\n```\n\n```mermaid\nstateDiagram-v2\n    [*] --> DRAFT : Company Account creates\n    DRAFT --> IN_REVIEW : submit\n    IN_REVIEW --> PUBLISHED : reviewer approves\n    IN_REVIEW --> NEEDS_CHANGES : reviewer requests changes\n    IN_REVIEW --> REJECTED : reviewer rejects\n    NEEDS_CHANGES --> IN_REVIEW : resubmit\n    PUBLISHED --> ARCHIVED : company or admin\n    NEEDS_CHANGES --> ARCHIVED\n    DRAFT --> ARCHIVED\n    REJECTED --> [*]\n    ARCHIVED --> [*]\n```\n\n| Transition | Who | What happens |\n|---|---|---|\n| → IN_REVIEW | Company Account | Completeness computed; queued (target 3 business days, §23) |\n| → PUBLISHED | Reviewer (**BQ-39**: reviewer or moderator?) | Indexed; `project.published` → project points recalculated (≤ 50, §7.3) |\n| → NEEDS_CHANGES / REJECTED | Reviewer | Company notified with the reason |\n| → ARCHIVED | Company or admin | Removed from search; points recalculated (the change is written to the ledger) |\n\n⚠️ **BQ-54:** does editing a PUBLISHED project send it back to review? Can a REJECTED project be resubmitted?\n\n### CredentialType — 🟢 PRD-DEFINED (ORG-05) · Phase 1\n\n```text\nCredentialType\n├── LICENSE         ترخيص\n└── CERTIFICATION   شهادة\n```\n\n### MediaType — 🟢 PRD-DEFINED (§14 `project_media` → `company_project_media`: images, video, links) · Phase 1\n\n```text\nMediaType\n├── IMAGE\n├── VIDEO\n└── LINK\n```\n\n### CorrectionSuggestionStatus — 🔴 PROPOSED · Phase 1 (§4 reviewer \"suggest correction\", RG-21)\n\n```text\nCorrectionSuggestionStatus\n├── OPEN\n├── ACCEPTED    owner applied it\n├── DISMISSED   owner declined\n└── WITHDRAWN   reviewer withdrew\n```\n\n### MergeStatus — 🔴 PROPOSED · Phase 1 (ORG-09 \"suggest a merge, with a decision record\")\n\n```text\nMergeStatus\n├── PROPOSED\n├── APPROVED    executed; source organization archived\n└── REJECTED    not duplicates\n```\n\n### ImportBatchStatus — 🟡 PRD-DERIVED (§22.1 preview, write, rollback) · Phase 1\n\n```text\nImportBatchStatus\n├── UPLOADED\n├── PREVIEWED     validation + duplicate report, nothing written\n├── COMMITTING\n├── COMMITTED\n├── FAILED\n└── ROLLED_BACK   §22.1 \"undo an import batch\"\n```\n\n---\n\n## 3. Verification\n\n### VerificationStatus — 🟢 PRD-DEFINED (§29.1) · Phase 1\n\n```text\nVerificationStatus\n├── NOT_STARTED   لم يبدأ      (§5.1 \"مسودة\" maps here)\n├── IN_REVIEW     قيد المراجعة\n├── NEEDS_INFO    يحتاج معلومات\n├── APPROVED      مقبول\n├── REJECTED      مرفوض\n└── EXPIRED       منتهي\n```\n\n```mermaid\nstateDiagram-v2\n    [*] --> NOT_STARTED : case opened, evidence being attached\n    NOT_STARTED --> IN_REVIEW : applicant submits\n    IN_REVIEW --> APPROVED : reviewer approves\n    IN_REVIEW --> REJECTED : reviewer rejects\n    IN_REVIEW --> NEEDS_INFO : reviewer requests info\n    NEEDS_INFO --> IN_REVIEW : applicant responds\n    APPROVED --> EXPIRED : scheduler at expires_at (BQ-23)\n    REJECTED --> [*]\n    EXPIRED --> [*]\n```\n\n| Transition | Who | What happens |\n|---|---|---|\n| → IN_REVIEW | Applicant (Individual account, or the Company Account) | Documents locked; queue SLA starts (claims: 2 business days, §23) |\n| → APPROVED | `VERIFICATION_REVIEWER`, `SYSTEM_ADMIN` | **The subject handler runs in the same transaction** (e.g. claim → company linked to the Company Account); decision row; audit; `verification.approved` → trust points (Phase 2) |\n| → REJECTED | Reviewer | Reason required; applicant notified; may open a **new** case |\n| → NEEDS_INFO | Reviewer | Reason required; applicant notified |\n| → EXPIRED | Scheduler | Subject recalculated (e.g. VERIFIED company → NEEDS_UPDATE); trust points reversed per rule |\n\nA reviewer can **never** decide a case they submitted, or a case about an organization they are a member of (conflict-of-interest guard).\n\n**Phase 1 rule (BQ-48):** every decision is made by a person holding `VERIFICATION_REVIEWER` or `SYSTEM_ADMIN`. Automated checks (registration, name, domain matching) are shown to the reviewer as hints and never change a case status.\n\n### VerificationType — 🟡 PRD-DERIVED · Phase 1 unless noted\n\n```text\nVerificationType\n├── USER_IDENTITY              §5.1 identity\n├── USER_EXPERIENCE            §5.1 experience (evidence reviewed by staff)\n│\n│   Company verification signals — independent of each other (BQ-47)\n├── ORGANIZATION_REGISTRATION  commercial registration (السجل)         §8.3\n├── ORGANIZATION_DOMAIN        official website domain (النطاق)          §8.3\n├── ORGANIZATION_CREDENTIAL    one license / certification (التراخيص)   ORG-05, §8.3\n├── ORGANIZATION_CONTACT       one contact channel (تأكيد التواصل)      §8.3\n│\n├── ORGANIZATION_CLAIM         §5.2 ownership claim — grants ownership, verifies NO signal (BQ-46)\n├── PROJECT                    §13 project review\n└── PROJECT_CLIENT             §7.3 client confirmation (process → BQ-22)\n```\n\n- Each signal has its own case, evidence, decision, expiry and trust-point rule. Approving one signal never approves another.\n- Company **approval** (BQ-05) is **not** a verification type: see `OrganizationApprovalStatus`.\n- \"Verified professional\" (§3) = approved `USER_IDENTITY` **and** at least one approved `USER_EXPERIENCE`. It is independent of points and levels (BQ-07).\n- `ENTITY_REPRESENTATIVE` (§5.4) was removed with BQ-06 → **BQ-51**.\n- Company confirmation of an employment relationship (§10.1) is **not** a staff verification. It is `EmploymentConfirmationStatus` (§8 below).\n\n## 4. Media & documents\n\n### FileStatus — 🔴 PROPOSED · Phase 1 (§18 malware scan, type/size limits)\n\n```text\nFileStatus\n├── PENDING_UPLOAD   signed upload URL issued\n├── SCANNING         in quarantine\n├── READY            clean, moved to target bucket\n├── REJECTED         malware / invalid type / too large\n└── DELETED\n```\n\n### DataClassification — 🟢 PRD-DEFINED (§18.1)\n\n```text\nDataClassification\n├── PUBLIC         عام          indexable\n├── INTERNAL       داخلي        authorised staff (e.g. detailed points, ops notes)\n├── CONFIDENTIAL   سري          encrypted + restricted (CR, authorization letters, invoices)\n├── PERSONAL       شخصي         purpose + consent + data-subject rights\n└── AGGREGATED     تحليلي مجمع  minimum sample size, no re-identification\n```\n\nUsed as a **documentation and code-level label** on tables, columns and `documents.classification`. It is not a runtime permission.\n\n---\n\n## 5. Membership & billing — ⏸ DEFERRED future monetization (business rules §11)\n\n### SubscriptionStatus — 🟢 PRD-DEFINED (§29.1)\n\n```text\nSubscriptionStatus\n├── TRIAL          تجريبي\n├── ACTIVE         فعال\n├── GRACE_PERIOD   فترة سماح\n├── PAST_DUE       متأخر\n├── CANCELLED      ملغى\n└── EXPIRED        منتهي\n```\n\nTransitions are **proposed**. The PRD lists the states but not their order, and it gives no durations → **BQ-15**.\n\n```mermaid\nstateDiagram-v2\n    [*] --> TRIAL : trial started (§7.5)\n    [*] --> ACTIVE : first payment succeeded / manual approval for entities\n    TRIAL --> ACTIVE : payment succeeded\n    TRIAL --> EXPIRED : trial ended without payment\n    ACTIVE --> ACTIVE : renewed (§7.5)\n    ACTIVE --> GRACE_PERIOD : renewal payment failed\n    GRACE_PERIOD --> ACTIVE : payment succeeded\n    GRACE_PERIOD --> PAST_DUE : grace window ended\n    PAST_DUE --> ACTIVE : payment succeeded\n    PAST_DUE --> EXPIRED : dunning ended\n    ACTIVE --> CANCELLED : owner cancels (access until period end)\n    CANCELLED --> EXPIRED : period end\n    EXPIRED --> [*]\n```\n\n| Transition | Who | What happens |\n|---|---|---|\n| → ACTIVE | Payment webhook (system) / `SYSTEM_ADMIN` manual approval | Invoice issued; **entitlements recalculated in the same transaction**; `subscription.started` |\n| → GRACE_PERIOD / PAST_DUE | System | Owner notified; entitlements kept during grace (**BQ-15**) |\n| → CANCELLED | Company Account | Paid features keep working until `current_period_end` |\n| → EXPIRED | System | Entitlements drop to the free plan; the paid partner badge is removed. **Trust and organic ranking are unaffected** (§7.5) |\n| Plan change | Company Account | Upgrade immediate, downgrade at period end (§7.5) |\n\n### SubscriberType — 🔴 PROPOSED · → **BQ-14**\n\n```text\nSubscriberType\n├── ORGANIZATION\n└── USER            only if individual paid membership is confirmed\n```\n\n### InvoiceStatus — 🔴 PROPOSED (§7.5 mentions tax invoices, no states)\n\n```text\nInvoiceStatus\n├── DRAFT\n├── ISSUED\n├── PAID\n├── VOID\n└── REFUNDED\n```\n\n### PaymentStatus — 🔴 PROPOSED (§7.5 \"حالة دفع\", no values)\n\n```text\nPaymentStatus\n├── PENDING\n├── SUCCEEDED\n├── FAILED\n└── REFUNDED\n```\n\n### BillingInterval — 🔴 PROPOSED → **BQ-15**\n\n```text\nBillingInterval\n├── MONTHLY\n└── YEARLY\n```\n\n### CouponDiscountType — 🔴 PROPOSED → **RG-11**\n\n```text\nCouponDiscountType\n├── PERCENTAGE\n├── FIXED_AMOUNT\n└── TRIAL_EXTENSION\n```\n\n### EntitlementSource — 🟡 PRD-DERIVED (§7.5 plans, exemptions, manual approval)\n\n```text\nEntitlementSource\n├── PLAN            from active subscription\n├── EXEMPTION       إعفاء — granted by admin\n└── MANUAL_GRANT    manual approval (entities)\n```\n\n---\n\n## 6. Points, levels, visibility (Phase 2)\n\n### PointSubjectType — 🟢 PRD-DEFINED (§8.2 member points, §8.3 company points)\n\n```text\nPointSubjectType\n├── USER\n└── ORGANIZATION\n```\n\n### PointCategory — 🟢 PRD-DEFINED (§8.2, §8.3)\n\n```text\nPointCategory                applies to\n├── PROFILE_COMPLETION       USER + ORGANIZATION   (org cap 100)\n├── ACTIVITY                 USER                  (weekly cap)\n├── RECENT_ACTIVITY          ORGANIZATION          (cap 100, time window)\n├── TRUST                    USER + ORGANIZATION   (after verification; org cap 100)\n├── EXPERIENCE               USER\n├── PROJECTS                 ORGANIZATION          (cap 300; top 10 × ≤ 50)\n├── CONTRIBUTION             USER + ORGANIZATION   (org cap 100)\n└── PENALTY                  USER (+ ORGANIZATION?) deductions\n```\n\n\"Paid visibility\" (§8.3) is **not** a point category. It lives in billing entitlements and never enters the ledger.\n\n### LedgerEntryType — 🟢 PRD-DEFINED (§8.1, §29.2 \"additions and deductions … correction by reverse movement\")\n\n```text\nLedgerEntryType\n├── CREDIT      إضافة\n├── DEBIT       خصم (penalty, or computed-score decrease)\n└── REVERSAL    حركة عكسية — exact negation of one prior entry\n```\n\nLedger rows are **immutable**, with no status column. There is nothing to transition.\n\n### MemberLevel — 🟢 PRD-DEFINED (§9.1), adjusted by BQ-07 · stored as rows in `member_levels`\n\n```text\nMemberLevel            points      extra gate                    assigned by\n├── NEW_MEMBER         0–99        —                             system\n├── ACTIVE_MEMBER      100–249     —                             system\n├── CONTRIBUTING       250–499     —                             system\n├── LEVEL_500          500–799     — (no verification, BQ-07)    system   · name pending BQ-52\n├── COMMUNITY_LEADER   800–1199    + review                      staff review\n└── AMBASSADOR         1200+       + nomination, admin approval  SYSTEM_ADMIN only\n```\n\n- Levels depend **only on points** plus the review/nomination gates of §9.1. Verification never gates a level (BQ-07).\n- Points are **not a currency**: they are never spent or redeemed; levels unlock benefits only (BQ-08).\n- Which balance counts → **BQ-09**.\n\n### LevelAssignmentStatus — 🔴 PROPOSED (§8.6 \"human review for upper levels\")\n\n```text\nLevelAssignmentStatus\n├── PENDING_REVIEW\n├── ACTIVE\n├── REJECTED\n└── REVOKED\n```\n\n### EngagementAlertStatus — 🔴 PROPOSED (§8.6 \"alert on abnormal change\")\n\n```text\nEngagementAlertStatus\n├── OPEN\n├── ACKNOWLEDGED\n└── RESOLVED\n```\n\n---\n\n## 7. Events (Phase 2)\n\n### EventStatus — 🔴 PROPOSED → **BQ-18** (not in §29.1)\n\n```text\nEventStatus\n├── DRAFT\n├── PUBLISHED    registration may open\n├── CANCELLED\n├── COMPLETED    attendance finalised, surveys sent\n└── ARCHIVED\n```\n\n```mermaid\nstateDiagram-v2\n    [*] --> DRAFT : staff creates (BQ-17)\n    DRAFT --> PUBLISHED : publish\n    PUBLISHED --> CANCELLED : cancel (registrants notified)\n    PUBLISHED --> COMPLETED : event ended + attendance finalised\n    COMPLETED --> ARCHIVED\n    CANCELLED --> ARCHIVED\n    ARCHIVED --> [*]\n```\n\n### RegistrationStatus — 🟡 PRD-DERIVED (§9.2 waitlist, cancellation, transfer) · attendance is stored separately\n\n```text\nRegistrationStatus\n├── CONFIRMED     seat held, entry code issued\n├── WAITLISTED    قائمة انتظار\n├── CANCELLED     إلغاء\n└── TRANSFERRED   استبدال — seat moved to another user (rules → RG-02)\n```\n\n```mermaid\nstateDiagram-v2\n    [*] --> CONFIRMED : capacity available + eligible\n    [*] --> WAITLISTED : capacity full\n    WAITLISTED --> CONFIRMED : seat freed (promotion, RG-02)\n    WAITLISTED --> CANCELLED : user leaves waitlist\n    CONFIRMED --> CANCELLED : user cancels\n    CONFIRMED --> TRANSFERRED : user transfers (new CONFIRMED row for recipient)\n    CANCELLED --> [*]\n    TRANSFERRED --> [*]\n```\n\n**Attendance** is recorded on the registration as `attended_at` + `attendance_method`, not as a status, because attendance is a *fact*. Points are awarded **only** when `attended_at` is set (§9.2, §20.2). Booking alone never earns points.\n\n### AttendanceMethod — 🟢 PRD-DEFINED (§9.2 unique entry code + manual fallback)\n\n```text\nAttendanceMethod\n├── ENTRY_CODE   رمز دخول فريد\n└── MANUAL       تسجيل حضور يدوي احتياطي\n```\n\n---\n\n## 8. Talent & opportunities (Phase 3)\n\n### EmploymentConfirmationStatus — 🔴 PROPOSED (§10.1 \"request from the individual, confirmation from the company\")\n\n```text\nEmploymentConfirmationStatus\n├── UNCONFIRMED   no request, or company not on platform\n├── PENDING       individual requested confirmation\n├── CONFIRMED     Company Account confirmed\n└── DECLINED      company declined\n```\n\n### OpportunityType — 🔵 RULE-DEFINED (business rules §5, §6) · Phase 3\n\nOne unified opportunity model; content and actions change with the type.\n\n| Value | Audience | Published by | Response |\n|---|---|---|---|\n| `JOB` | INDIVIDUAL | **Verified** company (BQ-73; rule BQ-53) | Individual application · requires `JobEmploymentType` |\n| `CO_OP` | INDIVIDUAL | Company | Individual application |\n| `VOLUNTEERING` | INDIVIDUAL | Company | Individual application |\n| `SUPPLIER_REQUEST` | COMPANY | Buyer company | `SupplierResponse` from a company — **never** an application |\n\n- ✅ **BQ-62:** `PROJECT` is **not** an opportunity type. Company projects are portfolio items in `company_projects`, with no applications.\n- Replaces the PRD §10.2 list (PERMANENT_JOB, TEMPORARY_CONTRACT, FREELANCE, SUPPLIER_REQUEST, COOP_TRAINING, PROFESSIONAL_VOLUNTEERING). ✅ BQ-73: JOB carries an employment type and requires a verified publisher.\n\n### OpportunityAudience — 🔵 RULE-DEFINED (business rules §6) · Phase 3\n\n```text\nOpportunityAudience        derived from OpportunityType (generated column)\n├── INDIVIDUAL             JOB · CO_OP · VOLUNTEERING\n└── COMPANY                SUPPLIER_REQUEST\n```\n\nIndividual-facing listings never include `COMPANY` audience opportunities. ✅ **BQ-65:** supplier requests are visible to **Company Accounts only** — never to visitors or individuals, not even read-only.\n\n### JobEmploymentType — 🔵 RULE-DEFINED (BQ-73) · Phase 3\n\n```text\nJobEmploymentType          required when OpportunityType = JOB\n├── PERMANENT              دائم\n├── TEMPORARY              مؤقت\n└── FREELANCE              عمل حر\n```\n\n### OpportunityStatus — 🟢 PRD-DEFINED (§29.1; flow §10.3)\n\n```text\nOpportunityStatus\n├── DRAFT       مسودة\n├── IN_REVIEW   مراجعة  (automated check + publishing policy, §10.3)\n├── PUBLISHED   منشورة\n├── PAUSED      متوقفة\n├── CLOSED      مغلقة  (with outcome)\n└── ARCHIVED    مؤرشفة\n```\n\n```mermaid\nstateDiagram-v2\n    [*] --> DRAFT\n    DRAFT --> IN_REVIEW : submit\n    IN_REVIEW --> PUBLISHED : automated/manual review passes\n    IN_REVIEW --> DRAFT : review fails (reason)\n    PUBLISHED --> PAUSED : publisher pauses\n    PAUSED --> PUBLISHED : publisher resumes\n    PUBLISHED --> CLOSED : close with outcome\n    PAUSED --> CLOSED : close with outcome\n    CLOSED --> ARCHIVED\n    ARCHIVED --> [*]\n```\n\n| Transition | Who | What happens |\n|---|---|---|\n| → PUBLISHED | Publishing company; policy check + `CONTENT_MODERATOR` if review is kept | Match notifications are **deferred** (rules §9) |\n| → CLOSED | Publisher | Outcome required; open applications and supplier responses finalised. Surveys are **deferred** (rules §9) |\n\n### OpportunityOutcome — 🔴 PROPOSED → **BQ-25**\n\n```text\nOpportunityOutcome\n├── FILLED\n├── NOT_FILLED\n└── CANCELLED\n```\n\n### ApplicationStatus — 🔵 RULE-DEFINED (business rules §8) · Phase 3\n\nThe **only** application status model. Applies to individual applications (JOB, CO_OP, VOLUNTEERING). Supplier requests use `SupplierResponseStatus`.\n\n```text\nApplicationStatus          stage\n├── SUBMITTED              SUBMITTED\n├── REVIEWED               REVIEWED\n├── SHORTLISTED            SHORTLISTED\n├── CONTACT                CONTACT\n├── ACCEPTED               DECISION\n├── REJECTED               DECISION\n└── WITHDRAWN              DECISION (set by the applicant)\n```\n\n✅ **BQ-67: transitions are flexible, not sequential.** The company chooses the appropriate status; the stages are labels, not a forced order.\n\n```mermaid\nstateDiagram-v2\n    [*] --> SUBMITTED : individual applies\n    state \"Company chooses any status\" as CHOOSE\n    SUBMITTED --> CHOOSE\n    CHOOSE --> REVIEWED\n    CHOOSE --> SHORTLISTED\n    CHOOSE --> CONTACT\n    CHOOSE --> ACCEPTED\n    CHOOSE --> REJECTED\n    REVIEWED --> CHOOSE\n    SHORTLISTED --> CHOOSE\n    CONTACT --> CHOOSE\n    SUBMITTED --> WITHDRAWN : applicant (rule open, BQ-67)\n    ACCEPTED --> [*]\n    REJECTED --> [*]\n    WITHDRAWN --> [*]\n```\n\nExamples: `SUBMITTED → ACCEPTED` · `SUBMITTED → SHORTLISTED → ACCEPTED` · `SUBMITTED → REJECTED`.\n\n| Transition | Who | What happens |\n|---|---|---|\n| Any non-final status → REVIEWED / SHORTLISTED / CONTACT / ACCEPTED / REJECTED | Publishing company members with `opportunity.applications.manage` | Applicant notified; audit. **The company decides; Back Of House never makes the hiring decision** (rules §8) |\n| → WITHDRAWN | Applicant | Company notified. From which statuses → **BQ-67** (open part) |\n\n- ⚠️ Still open (**BQ-67**): the withdrawal rule, and whether ACCEPTED / REJECTED can be changed afterwards. Until decided, ACCEPTED, REJECTED and WITHDRAWN are treated as final.\n- Do **not** add INTERVIEW, OFFER or similar statuses unless approved as a future extension.\n\n### SupplierResponseStatus — 🔴 PROPOSED minimal (business rules §7, BQ-66) · Phase 3\n\n```text\nSupplierResponseStatus\n├── SUBMITTED    responding company sent its response\n└── WITHDRAWN    responding company withdrew it\n```\n\nMinimal on purpose. ✅ BQ-66: any Company Account may respond to any supplier request (no company-type restriction; individuals never). More statuses and content can be defined later if needed.\n\n---\n\n## 9. Intelligence & institutional (Phase 4)\n\n### ReportStatus — 🟢 PRD-DEFINED (§29.1)\n\n```text\nReportStatus\n├── SCHEDULED    مجدول\n├── GENERATING   قيد الإنشاء\n├── READY        جاهز\n├── FAILED       فشل\n└── EXPIRED      منتهي الصلاحية\n```\n\n```mermaid\nstateDiagram-v2\n    [*] --> SCHEDULED : requested or scheduled\n    SCHEDULED --> GENERATING : worker picks up\n    GENERATING --> READY : file stored + data version recorded\n    GENERATING --> FAILED : error\n    FAILED --> SCHEDULED : admin regenerates (§13)\n    READY --> EXPIRED : expires_at\n    EXPIRED --> [*]\n```\n\nA READY report stores its `data_version` and `rule_versions`, so it can be reproduced exactly (§11.3).\n\n### ReportType — 🟡 PRD-DERIVED (§11, §12.2)\n\n```text\nReportType\n├── COMPANY_PERFORMANCE     §11.2\n├── DIRECT_COMPARISON       §11.1 (public data only)\n├── ANONYMOUS_BENCHMARK     §11.1 (sample ≥ 5)\n├── MARKET_REPORT           §4 \"market reports\" by plan\n└── INSTITUTIONAL_REPORT    §12.2 (scope BQ-51)\n```\n\n### ExportFormat — 🟢 PRD-DEFINED (§6 Phase 4 \"PDF/Excel\")\n\n```text\nExportFormat\n├── PDF\n└── XLSX\n```\n\n### RfiStatus — 🔴 PROPOSED → **RG-04**\n\n```text\nRfiStatus                   RfiRecipientStatus\n├── DRAFT                   ├── PENDING\n├── SENT                    ├── RESPONDED\n├── CLOSED                  └── DECLINED\n└── CANCELLED\n```\n\n---\n\n## 10. Content, moderation, notifications, platform\n\n### ContentType — 🟡 PRD-DERIVED (§13 content: pages, news) → **RG-15**\n\n```text\nContentType\n├── PAGE\n└── NEWS\n```\n\n### ContentStatus — 🔴 PROPOSED\n\n```text\nContentStatus\n├── DRAFT\n├── PUBLISHED\n└── ARCHIVED\n```\n\n### AbuseReportStatus — 🔴 PROPOSED (§13 \"البلاغات\", §23 privacy/impersonation reports) → **RG-26**\n\n```text\nAbuseReportStatus\n├── OPEN\n├── IN_REVIEW\n├── ACTIONED\n└── DISMISSED\n```\n\n### AbuseReportTargetType — 🟡 PRD-DERIVED (§13: projects, opportunities; §23 impersonation)\n\n```text\nAbuseReportTargetType\n├── ORGANIZATION\n├── PROJECT\n├── USER_PROFILE\n├── OPPORTUNITY      Phase 3\n└── CONTENT_ITEM\n```\n\n### AppealStatus — 🔴 PROPOSED (§8.6 \"appeal with a decision record\", §13 \"objections\") → **BQ-41**\n\n```text\nAppealStatus\n├── SUBMITTED\n├── UPHELD      original decision reversed\n└── DENIED      original decision stands\n```\n\n### NotificationChannel — 🟡 PRD-DERIVED (§15.2 email + messages; §14 `notifications`)\n\n```text\nNotificationChannel\n├── IN_APP\n├── EMAIL\n└── SMS\n```\n\n`PUSH` is not in the PRD. Add it only if the mobile app is confirmed (**BQ-01**, **RG-14**).\n\n### DeliveryStatus — 🔴 PROPOSED\n\n```text\nDeliveryStatus\n├── QUEUED\n├── SENT\n├── FAILED\n└── SKIPPED   user preference / missing channel\n```\n\n### OutboxStatus — 🔴 PROPOSED (technical, ADR-011)\n\n```text\nOutboxStatus\n├── PENDING\n├── PROCESSED\n└── FAILED    after max attempts → alert\n```\n\n---\n\n## 11. Supporting enums (introduced by the entity catalog)\n\n```text\nLocationType 🟡 (§14 \"regions and cities\")     ContactType 🟡 (ORG-04)\n├── REGION                                     ├── EMAIL\n└── CITY                                       ├── PHONE\n                                               ├── SOCIAL_ACCOUNT   (official accounts)\nEventKind 🟡 (§8.2 meetup 10 / workshop 15)    └── ADDRESS\n├── MEETUP\n├── WORKSHOP                                   MetricGroup 🟢 (§11.2)\n└── OTHER                                      ├── PRESENCE      الحضور\n                                               ├── CONVERSION    التحويل\nSearchSubjectType 🔴                           ├── QUALITY       الجودة\n├── ORGANIZATION                               ├── PROJECTS      المشاريع\n└── PROFESSIONAL                               ├── COMMUNITY     المجتمع\n                                               └── COMPETITION   التنافس\nAppealSubjectType 🔴 (BQ-41)\n├── VERIFICATION_DECISION                      AuditActorType 🔴\n├── ORGANIZATION_STATUS                        ├── USER\n├── ORGANIZATION_MERGE                         ├── STAFF\n└── POINT_LEDGER_ENTRY   (Phase 2)             └── SYSTEM\n\nImportRowAction 🔴                             PlanAudience 🔴 (BQ-14)\n├── CREATE                                     ├── COMPANY\n├── UPDATE                                     └── INDIVIDUAL\n├── SKIP\n└── MERGE_CANDIDATE\n                                               MessageSide 🔴 (Phase 3)\n                                               ├── APPLICANT\n                                               └── PUBLISHER\n```\n\n---\n\n## 12. Enum index\n\n| Enum | Tag | Phase | Owning module |\n|---|---|---|---|\n| AccountType | 🔵 | 1 | identity |\n| CompanyType | 🔵 | 1 | organizations |\n| UserStatus | 🔴 | 1 | identity |\n| ConsentPurpose | 🔴 | 1 | identity |\n| PlatformRole | 🟢 | 1 | access |\n| MembershipStatus | 🔴 | 1 | access |\n| InvitationStatus | 🔴 | 1 | access |\n| OrganizationApprovalStatus | 🟡 | 1 | organizations |\n| OrganizationStatus | 🟢 | 1 | organizations |\n| CredentialType | 🟢 | 1 | organizations |\n| CorrectionSuggestionStatus | 🔴 | 1 | organizations |\n| MergeStatus | 🔴 | 1 | organizations |\n| ClientDisclosureStatus | 🟢 | 1 | projects |\n| ProjectStatus | 🟢 | 1 | projects |\n| MediaType | 🟢 | 1 | media |\n| FileStatus | 🔴 | 1 | media |\n| DataClassification | 🟢 | 1 | media / docs |\n| VerificationStatus | 🟢 | 1 | verification |\n| VerificationType | 🟡 | 1 | verification |\n| ImportBatchStatus | 🟡 | 1 | imports |\n| ContentType | 🟡 | 1 | content |\n| ContentStatus | 🔴 | 1 | content |\n| AbuseReportStatus / TargetType | 🔴 / 🟡 | 1 | moderation |\n| AppealStatus | 🔴 | 1 | moderation |\n| NotificationChannel | 🟡 | 1 | notifications |\n| DeliveryStatus | 🔴 | 1 | notifications |\n| OutboxStatus | 🔴 | 1 | platform/outbox |\n| SubscriptionStatus | 🟢 | 2 | billing |\n| SubscriberType | 🔴 | 2 | billing |\n| InvoiceStatus | 🔴 | 2 | billing |\n| PaymentStatus | 🔴 | 2 | billing |\n| BillingInterval | 🔴 | 2 | billing |\n| CouponDiscountType | 🔴 | 2 | billing |\n| EntitlementSource | 🟡 | 2 | entitlements |\n| PointSubjectType | 🟢 | 2 | engagement |\n| PointCategory | 🟢 | 2 | engagement |\n| LedgerEntryType | 🟢 | 2 | engagement |\n| MemberLevel (rows) | 🟢 | 2 | engagement |\n| LevelAssignmentStatus | 🔴 | 2 | engagement |\n| EngagementAlertStatus | 🔴 | 2 | engagement |\n| EventStatus | 🔴 | 2 | events |\n| RegistrationStatus | 🟡 | 2 | events |\n| AttendanceMethod | 🟢 | 2 | events |\n| EmploymentConfirmationStatus | 🔴 | 3 | talent |\n| OpportunityType | 🔵 | 3 | opportunities |\n| OpportunityAudience | 🔵 | 3 | opportunities |\n| JobEmploymentType | 🔵 | 3 | opportunities |\n| OpportunityStatus | 🟢 | 3 | opportunities |\n| OpportunityOutcome | 🔴 | 3 | opportunities |\n| ApplicationStatus | 🔵 | 3 | opportunities |\n| SupplierResponseStatus | 🔴 | 3 | opportunities |\n| ReportStatus | 🟢 | 4 | intelligence |\n| ReportType | 🟡 | 4 | intelligence |\n| ExportFormat | 🟢 | 4 | intelligence |\n| RfiStatus / RfiRecipientStatus | 🔴 | 4 | institutional |\n\n**Totals:** 68 enums — 🔵 6 rule-defined, 🟢 18 PRD-defined, 🟡 12 PRD-derived, 🔴 32 proposed. Billing enums (SubscriptionStatus, SubscriberType, InvoiceStatus, PaymentStatus, BillingInterval, CouponDiscountType, EntitlementSource, PlanAudience) belong to the **deferred** monetization design (rules §11).\n\n| LocationType, ContactType, EventKind | 🟡 | 1 / 2 | taxonomy, organizations, events |\n| MetricGroup | 🟢 | 4 | intelligence |\n| SearchSubjectType, AppealSubjectType, AuditActorType, ImportRowAction | 🔴 | 1 | search, moderation, audit, imports |\n| PlanAudience, MessageSide | 🔴 | 2 / 3 | billing, opportunities |\n\n> **Code-defined, not database enums:** the permission catalog (`auth-architecture.md`), domain event names (`domain-events.md`) and analytics event names (PRD §16).\n"},{"name":"database-design-rules","title":"Database Design Rules","keywords":"conventions naming uuid soft delete","markdown":"# Database Design Rules\n\n> Project-wide conventions for the `app` schema. PRD basis: §14.1 (non-sequential public ids, UTC, soft delete with retention, creator/modifier for sensitive entities, separation of sensitive data, indexes, historical versions), §15.1, §18.\n> A pull request that breaks a rule must update this document and add an ADR.\n\n---\n\n## 1. Identifiers\n\n| Rule | Detail |\n|---|---|\n| Primary keys | `id uuid PRIMARY KEY` on every non-join table (§14.1 \"non-sequential identifiers usable publicly such as UUID\") |\n| Version | **UUID v7** (time-ordered → better B-tree locality than v4). Generated by Prisma (`@default(uuid(7))`) where supported, with a DB default as fallback for raw SQL and imports. Verify support at setup (TQ-22, ADR-005) |\n| Join tables | Composite primary key of the two FKs (`PRIMARY KEY (organization_id, service_id)`), no surrogate id, **unless** the join row has its own lifecycle (e.g. `organization_members`, `event_registrations`, `benchmark_set_members` have ids) |\n| Public URLs | Use **slugs** for SEO entities (companies, categories, cities, news, events, profiles) and UUIDs for everything else. Never expose sequential numbers |\n| Exception | `invoices.invoice_number`: a legally required sequential number, kept **in addition to** the UUID |\n| External references | Store provider ids in explicit columns (`provider_payment_ref`, `source_record_id`), never as PKs |\n\n## 2. Naming\n\n| Object | Convention | Example |\n|---|---|---|\n| Schema | `app` | |\n| Table | `snake_case`, **plural** | `organization_members` |\n| Join table | `\u003cowner>_\u003crelated plural>` | `company_project_services` |\n| Column | `snake_case` | `verification_expires_at` |\n| FK column | `\u003creferenced singular>_id`; role-prefixed when ambiguous | `organization_id`, `subject_organization_id`, `merged_into_organization_id` |\n| Boolean | `is_` / `has_` prefix | `is_public`, `is_current` |\n| Timestamp | `_at` suffix (`timestamptz`) | `published_at` |\n| Date (no time) | `_on` or `_date` suffix (`date`) | `expires_on`, `start_date` |\n| Money | `_minor` suffix (integer halalas) + `currency` | `total_minor` |\n| Bilingual text | `_ar` / `_en` suffix pairs | `name_ar`, `name_en` |\n| Enum type (SQL) | `snake_case` singular | `organization_status` |\n| Enum type (Prisma) | `PascalCase` | `OrganizationStatus` |\n| Enum values | `UPPER_SNAKE_CASE` | `UNDER_VERIFICATION` |\n| Index | `ix_\u003ctable>__\u003ccolumns>` | `ix_verifications__status_type_due_at` |\n| Unique | `uq_\u003ctable>__\u003ccolumns>` | `uq_organization_members__organization_id_user_id` |\n| Check | `ck_\u003ctable>__\u003crule>` | `ck_point_ledger__amount_not_zero` |\n| FK constraint | `fk_\u003ctable>__\u003ccolumn>` | `fk_company_projects__organization_id` |\n| Prisma model | `PascalCase` **singular**, mapped with `@@map(\"plural_table\")`; fields `camelCase` mapped with `@map(\"snake_case\")` | `model OrganizationMember { … @@map(\"organization_members\") }` |\n\n## 3. Timestamps\n\n| Rule | Detail |\n|---|---|\n| Type | Always `timestamptz`, stored in **UTC** (§14.1). Display in the user's timezone (`users.timezone`, default `Asia/Riyadh`) |\n| `created_at` | `NOT NULL DEFAULT now()` on every table |\n| `updated_at` | `NOT NULL`, maintained by Prisma `@updatedAt`, on every **mutable** table. Omitted on append-only tables |\n| Business timestamps | A column per meaningful event (`submitted_at`, `decided_at`, `published_at`, `attended_at`) instead of inferring from `updated_at` |\n| Business dates | `date` for calendar facts without time (credential expiry, project dates, periods) |\n| Occurrence vs recording | Where they differ, keep both (`point_ledger.occurred_at` vs `created_at`; `analytics_events.occurred_at` vs `received_at`) |\n| Windows | Daily/weekly windows computed in `Asia/Riyadh` (points caps), documented per use |\n\n## 4. Audit fields\n\n| Rule | Detail |\n|---|---|\n| `created_by` / `updated_by` | `uuid NULL REFERENCES users(id)` on tables marked **[sensitive]** in `database-entities.md` (§14.1). `NULL` = system |\n| Decision fields | Entities with decisions carry their own `decided_by`, `decided_at`, `reason` (verification decisions, merges, appeals) |\n| Full history | **Not** stored via triggers on every table. History lives in (a) `audit_logs` for security-relevant changes and (b) purpose-built history tables where the business needs it (`verification_decisions`, `level_assignments`, `point_ledger`, `visibility_snapshots`) |\n\n## 5. Soft delete and archival\n\n**Default: no soft delete.** Use it only where the PRD justifies it (§14.1 \"logical deletion **for operational entities** with a retention policy\").\n\n| Strategy | When | Tables |\n|---|---|---|\n| **Business status** (preferred) | The PRD defines an archive state | `organizations` (ARCHIVED), `company_projects` (ARCHIVED), `opportunities` (ARCHIVED), `events` (ARCHIVED), `content_items` (ARCHIVED) |\n| **`deleted_at`** | User-facing deletion of an operational entity that must be retained or restorable, with no business archive state | `media_assets`, `documents`, `saved_lists`, `saved_searches` |\n| **Anonymisation** | Personal data subject to deletion rights | `users` (DEACTIVATED) + dependent personal fields |\n| **Revocation columns** | Grants and awards whose history matters | `user_platform_roles.revoked_at`, `member_permission_grants.revoked_at`, `badge_awards.revoked_at`, `entitlements.revoked_at`, `benchmark_set_members.removed_at` |\n| **Never deleted** | Append-only facts | `audit_logs`, `point_ledger`, `consents`, `verification_decisions`, `data_exports`, `analytics_events` (partition drop at retention end only) |\n| **Hard delete** | Join rows replaced as a set; drafts never submitted; technical rows | `organization_services`, `profile_skills`, …; DRAFT projects; processed `outbox_events`; expired `idempotency_records` |\n\nSoft-delete implementation rules:\n- Unique constraints on soft-deletable tables are **partial**: `… WHERE deleted_at IS NULL`.\n- Reads exclude deleted rows **explicitly in repositories** (a repository base method), not through a global Prisma extension that hides behaviour.\n- A purge job hard-deletes after the retention period (BQ-33), including storage objects.\n\n## 6. Foreign keys\n\n| Rule | Detail |\n|---|---|\n| Always declare FKs | Every `*_id` column that references an app table has a FK constraint, **except** columns documented as intentionally unconstrained (`audit_logs.entity_id`, `outbox_events.aggregate_id`, `analytics_events.*`) |\n| No polymorphic `(type, id)` pairs | Use one nullable FK per target + `CHECK (num_nonnulls(...) = 1)` (see `verifications`, `abuse_reports`, `appeals`, `point_ledger`) |\n| `ON DELETE` | Default **`RESTRICT`**. `CASCADE` only for pure child rows that have no meaning without the parent **and** whose parent is hard-deletable (join tables, `import_rows` → `import_batches`, `notification_deliveries` → `notifications`). Never cascade from `users` or `organizations` |\n| `ON UPDATE` | Not used (UUIDs don't change) |\n| Cross-schema FKs | **Not allowed** (no FK to `auth.users`, ADR-003) |\n| Index every FK | Every FK column is the leading column of at least one index (Postgres doesn't index FKs automatically) |\n\n## 7. Indexes\n\n| Rule | Detail |\n|---|---|\n| Every index has a reason | Written in `database-entities.md` (§14.1 \"indexes for search, joining and duplicate prevention\") |\n| Tenant access | Composite indexes lead with the tenant/owner column: `(organization_id, status)` |\n| Queues | `(status, due_at)` / `(status, available_at)` for workers and review queues |\n| Partial indexes | For \"active\" subsets: `WHERE revoked_at IS NULL`, `WHERE status IN (…)`, `WHERE is_current` |\n| Text search | GIN on `tsvector`; GIN `gin_trgm_ops` for fuzzy matching; only on `search_documents` and duplicate-detection columns |\n| Arrays | GIN on filter arrays in `search_documents` |\n| JSONB | No GIN on JSONB by default. Add only for a proven query |\n| Review | `pg_stat_statements` + `EXPLAIN ANALYZE` for new list endpoints; remove unused indexes quarterly |\n\n## 8. Unique constraints\n\n| Rule | Detail |\n|---|---|\n| Business uniqueness in the DB | Never rely only on application checks (§20.2 duplicates, double subscriptions, repeated points) |\n| Case-insensitive | `citext` for emails, slugs, domains, coupon codes |\n| Normalised values | Store a normalised form for matching (`commercial_registration_number` digits only, `website_domain` lower-case registrable domain) |\n| Partial uniqueness for state | e.g. one live subscription per subscriber; one open claim per claimant; one current visibility snapshot |\n| Idempotency | `UNIQUE` keys for exactly-once effects: `point_ledger.idempotency_key`, `payment_provider_events (provider, provider_event_id)`, `idempotency_records (scope_key, idempotency_key)` |\n| Prisma | Partial and expression unique indexes are written in migration SQL; Prisma then treats them as plain indexes. Handle `P2002` (unique violation) as a domain error |\n\n## 9. Check constraints\n\nUse CHECKs for invariants that are true regardless of workflow:\n\n- value ranges (`completion_score BETWEEN 0 AND 100`, `points_score BETWEEN 0 AND 50`, `rating BETWEEN 1 AND 5`)\n- \"exactly one of\" subjects (`num_nonnulls(...) = 1`)\n- \"at least one of\" bilingual required fields (`num_nonnulls(name_ar, name_en) >= 1`)\n- date ordering (`end_date >= start_date`)\n- state-dependent requireds (`status \u003c> 'CLOSED' OR outcome IS NOT NULL`)\n- ledger integrity (`amount \u003c> 0`, reversal ⇔ `reverses_entry_id`)\n\nState **transitions** are enforced in domain services, not in CHECKs.\n\n## 10. Enums\n\n| Use a PostgreSQL enum when | Use a lookup table or text code when |\n|---|---|\n| Values are defined by the PRD or code **and** drive logic (statuses, roles, types) | Values are managed by staff without a deploy (categories, services, locations, skills, legal entity types BQ-21, size ranges, plan feature keys, notification types) |\n| Changes are rare and go with code changes | Values need bilingual labels or ordering in data |\n\nRules:\n- Adding a value = a migration (`ALTER TYPE … ADD VALUE`). **Never remove or rename** an enum value in place; deprecate it and migrate data first.\n- Every enum is listed in `enums-and-statuses.md` with its tag (PRD-defined / derived / proposed).\n- Clients must tolerate unknown enum values (forward compatibility).\n\n## 11. JSON fields\n\nJSONB is allowed **only** for:\n\n| Allowed use | Examples |\n|---|---|\n| Structure genuinely varies or is not yet specified, and it is never joined or filtered relationally | `organizations.capacity` (RG), `events.agenda` (RG-01), survey `answers` (RG-05) |\n| Snapshots frozen at a point in time | `invoices.buyer_snapshot`, `visibility_snapshots.components`, `reports.rule_versions` |\n| Raw external payloads | `payment_provider_events.payload`, `import_rows.raw_data` |\n| Event payloads and property bags | `outbox_events.payload`, `analytics_events.properties`, `notifications.payload` |\n| Settings maps validated by schema | `organizations.field_visibility`, `profiles.section_visibility` |\n\nRules: every JSONB column has a **zod schema** in the owning module, validated on write; a `DEFAULT` (`'{}'` or `'[]'`) and `NOT NULL`; no business-critical relationships inside JSON. When a JSON field becomes filterable or relational (e.g. capacity ranges once BQ-21 is decided), promote it to columns or tables.\n\n## 12. Nullability\n\n| Rule | Detail |\n|---|---|\n| `NOT NULL` by default | A column is nullable only when \"unknown / not applicable\" is a real state |\n| Meaningful NULLs | `NULL` timestamps mean \"hasn't happened\" (`published_at`); `NULL` FK means \"no relationship\" (documented) |\n| No sentinel values | No empty strings, `0` or `'1970-01-01'` meaning \"unknown\" |\n| Booleans | Always `NOT NULL` with a default |\n| Arrays / JSONB | `NOT NULL DEFAULT '{}'` / `'[]'` |\n| Bilingual pairs | Both nullable individually + CHECK that at least one is set when required |\n\n## 13. Money, numbers, text\n\n| Rule | Detail |\n|---|---|\n| Money | `integer` minor units (halalas) + `char(3) currency` (default `SAR`). No floats. VAT rate `numeric(5,4)` (ADR-020) |\n| Scores | `smallint` for bounded integer scores; `numeric(5,2)` for weighted scores |\n| Coordinates | `numeric(9,6)` |\n| Text | `text` + application-level length limits (no `varchar(n)` in the DB), except `char(2)`/`char(3)` codes |\n| Bilingual | Paired `_ar`/`_en` columns for the fixed two languages (§17 AR/EN; ADR-021) |\n| Arabic search normalisation | Done in a SQL function `app.normalize_ar(text)` + the same logic in `common/text` for query input; the two implementations are covered by shared test fixtures |\n\n## 14. Transactions and concurrency\n\n| Rule | Detail |\n|---|---|\n| Boundaries | One application-service use case = one transaction. Catalog in `transaction-boundaries.md` |\n| Propagation | `TransactionRunner` (AsyncLocalStorage) so audit, outbox and ports join the same transaction without passing `tx` manually through every layer |\n| Isolation | `READ COMMITTED` (Postgres default) + **explicit row locks** (`SELECT … FOR UPDATE`) for check-then-act invariants (capacity, caps, last owner, coupon limits, benchmark changes). `SERIALIZABLE` only where a lock cannot express the invariant (none identified yet) |\n| Lock order | Lock parents before children and lower ids before higher ids to avoid deadlocks (e.g. merge: lock both organizations ordered by id) |\n| Duration | No network calls (payment gateway, Supabase admin, SMS) **inside** a DB transaction. Call before (with an idempotency key) or after (via outbox) |\n| Retries | Retry serialization and deadlock errors (`40001`, `40P01`) up to 3 times at the TransactionRunner level |\n| Optimistic concurrency | For long-lived edit forms (organization profile), accept `If-Match` / `version` to prevent lost updates (optional, Phase 1 candidate) |\n| Timeouts | `statement_timeout` for the app role (e.g. 15 s API, longer for worker sessions) |\n\n## 15. Data classification tagging\n\nEvery table in `database-entities.md` carries its dominant class (§18.1). Column-level exceptions (e.g. `users.email` = Personal, `organizations.commercial_registration_number` = Public or Confidential per ORG-10 setting) are noted in the data dictionary (Phase 0 deliverable, §6). Personal and Confidential columns:\n- are excluded from `search_documents` and public DTOs;\n- are masked in logs and audit `changes`;\n- are covered by the retention and anonymisation jobs.\n\n## 16. Seeds and reference data\n\n| Seed | Environment | Source |\n|---|---|---|\n| Categories, services, regions and cities, skills | all | Data dictionary (§26 P0) |\n| Member levels | all | §9.1 |\n| Point rules + versions | all (Phase 2) | §8.2, §8.3 + BQ-10 |\n| Membership plans | staging/prod via admin (Phase 2) | §27 |\n| First `SYSTEM_ADMIN` | prod via one-time script (audited) | — |\n| Demo organizations and users | local/test only | Factories |\n\nSeeds are idempotent (upsert by `code` or `slug`).\n"},{"name":"transaction-boundaries","title":"Transaction Boundaries","keywords":"atomic locks transactions","markdown":"# Transaction Boundaries\n\n> Operations that **must be atomic** in PostgreSQL. Each has an id (T-xx) referenced across the docs.\n> Conventions: `database-design-rules.md` §14. Every transaction below also writes `audit_logs` (where listed in `security-and-audit.md` §4) and `outbox_events` **inside** the same transaction.\n> Rule: **no external network calls inside a transaction.** Payment, SMS, email and Supabase admin calls happen before (with idempotency) or after (via outbox).\n\n---\n\n## Summary\n\n| ID | Operation | Module | Locks | Phase | PRD |\n|---|---|---|---|---|---|\n| T-01 | Claim approval → company linked to the claimant's Company Account | verification + organizations + access | case, organization | 1 | §5.2, §20.2 |\n| T-02 | Create company (duplicate-safe, creator = the single owner) | organizations + access | unique constraints | 1 | §5.3, ORG-09, BQ-05 |\n| T-03 | Merge organizations | organizations + participants | both organizations | 1 | ORG-09 |\n| T-04 | Member removal or public-visibility change | access | membership | 1 | BQ-64, BQ-68 |\n| T-05 | Accept membership invitation (Individual account) | access | invitation | 1 | BQ-68, BQ-75 |\n| T-06 | Verification decision | verification + subject handler | case | 1 | §5, §29.1 |\n| T-07 | Project review decision | projects | project | 1 | §7.3 |\n| T-08 | Award / deduct points | engagement | balance row | 2 | §8.1, §8.6 |\n| T-09 | Reverse point entry | engagement | original entry, balance row | 2 | §8.1, §20.2 |\n| T-10 | Level assignment / badge award | engagement | user's active assignment | 2 | §9.1 |\n| T-11 | Event registration (capacity) | events | ticket type / event | 2 | §9.2 |\n| T-12 | Cancel registration + promote waitlist | events | ticket type / event | 2 | §9.2 |\n| T-13 | Check-in (attendance) | events | registration | 2 | §9.2, §20.2 |\n| T-14 | ⏸ deferred (rules §11) · Payment webhook → subscription | billing + entitlements | subscription | 2 | §7.5, §20.2 |\n| T-15 | ⏸ deferred (rules §11) · Plan change | billing + entitlements | subscription | 2 | §7.5 |\n| T-16 | ⏸ deferred (rules §11) · Coupon redemption | billing | coupon | 2 | §7.5 |\n| T-17 | Submit individual application | opportunities | — (unique) | 3 | §10.3, rules §8 |\n| T-18 | Close opportunity | opportunities | opportunity | 3 | §10.3 |\n| T-19 | Change benchmark competitor | intelligence | benchmark set | 4 | §11.1 |\n| T-20 | Export (log before release) | intelligence/institutional + audit | — | 4 | §12.3 |\n| T-21 | Import commit chunk / rollback | imports + organizations | batch | 1 | §22.1 |\n| T-22 | Account deactivation (later) | identity + dependants | user | later | AUTH-06 |\n| T-23 | Staff role grant / revoke | access | — | 1 | §18 |\n| T-24 | Employment confirmation | talent | experience | 3 | §10.1 |\n| T-25 | Registration (Individual or Company flow) | profiles + identity (+ organizations) | user | 1 | §5.1, BQ-60 |\n| T-26 | Suspend / unsuspend (user or organization) | identity / organizations | subject | 1 | §13 |\n| T-27 | ⏸ deferred (rules §11) · Subscription expiry → entitlements | billing + entitlements | subscription | 2 | §7.5 |\n| T-28 | Computed score sync (company components) | engagement | balance row | 2 | §8.3, TQ-13 |\n| T-29 | Company approval decision | organizations | approval request, organization | 1 | BQ-05, BQ-46 |\n| T-30 | Admin ownership flow (link the company to another Company Account) | organizations | organization | 1 | BQ-04, BQ-56, BQ-69 |\n| T-31 | Submit supplier response (B2B) | opportunities | — (unique) | 3 | rules §7 |\n| T-32 | Publish opportunity (JOB requires verified company) | opportunities | opportunity | 3 | rules §9, BQ-73 |\n\n---\n\n## Phase 1\n\n### T-01 · Claim approval → ownership\n\n```text\nBEGIN\n  SELECT verification … FOR UPDATE                       -- status must be IN_REVIEW\n  assert reviewer ≠ claimant and not a member of org      -- conflict of interest\n  SELECT organization … FOR UPDATE                       -- still UNCLAIMED? not SUSPENDED/ARCHIVED?\n  INSERT verification_decisions (IN_REVIEW → APPROVED)\n  UPDATE verifications SET status=APPROVED, decided_at\n  -- subject handler (organizations):\n  UPDATE organization_claims SET closed_at=now()\n  assert claimant.account_type = COMPANY                                  -- BQ-60\n  UPDATE organizations SET account_user_id = claimant   -- UNIQUE: one company per Company Account (BQ-68)\n  UPDATE organizations SET claimed_at=now(), status=CLAIMED (derived)\n  other open claims on this org stay OPEN for reviewer rejection (ASSUMPTION, BQ-55)\n  -- no verification signal is set: approval ≠ verification (BQ-46)\n  INSERT audit_logs (verification.approve, organization.owner_granted)\n  INSERT outbox (verification.approved, organization.claim.approved, organization.owner_granted)\nCOMMIT\n```\n\n**Failure modes prevented:** ownership without a correct review (§20.2); two claims approved concurrently (the organization row lock + `status = UNCLAIMED` check makes the second approval fail with 409); an owner created while the decision row failed to insert.\n\n### T-02 · Create organization (duplicate-safe)\n\n```text\n(before TX) duplicate candidate search → shown to user; user confirms \"not a duplicate\"\nBEGIN\n  INSERT organizations (DRAFT, normalised CR, website_domain, slug)\n      -- UNIQUE(commercial_registration_number) / UNIQUE(slug) violations → 409 DUPLICATE_ORGANIZATION\n  INSERT organization_services / organization_coverage (initial)\n  assert caller.account_type = COMPANY                  -- company context only (BQ-60)\n  INSERT organization_company_types (one or more)         -- BQ-61\n  SET organizations.account_user_id = caller            -- the company's single user (BQ-68); UNIQUE → 409 if this account already has a company\n  INSERT audit_logs · outbox(organization.created)\nCOMMIT\n```\n\n### T-03 · Merge organizations\n\n```text\nBEGIN\n  SELECT organization_merges … FOR UPDATE                -- status PROPOSED\n  SELECT organizations WHERE id IN (source, target) ORDER BY id FOR UPDATE   -- deadlock-safe order\n  assert neither ARCHIVED; target not merged\n  access.mergeMemberships(tx, source, target)            -- de-duplicate: user in both → role rule BQ-50; only ONE owner may remain (BQ-04)\n  for participant in OrganizationMergeParticipants:      -- projects, billing, engagement, opportunities, …\n      participant.moveToTarget(tx, source, target)\n  move organization_contacts/services/coverage/credentials/media (dedupe)\n  re-point open claims and verifications to target, or close them\n  UPDATE organizations(source) SET archived_at, merged_into_organization_id=target, status=ARCHIVED\n  UPDATE organization_merges SET status=APPROVED, decided_by, executed_at\n  INSERT audit_logs (with moved counts) · outbox(organization.merged)\nCOMMIT\n```\n\nParticipant conflicts (e.g. both organizations have a live subscription) **abort** the merge with a clear error for the admin to resolve first.\n\n### T-04 · Member removal or public-visibility change (BQ-64, BQ-68)\n\n```text\nBEGIN\n  assert caller is the company's Company Account (account_user_id)\n  SELECT organization_members … FOR UPDATE              -- target belongs to this company\n  UPDATE show_on_company_profile | status=REMOVED, removed_at, removed_by\n  INSERT audit_logs · outbox(membership.visibility_changed | membership.removed)\nCOMMIT\n```\n\nNo permissions change: memberships never grant any (BQ-68).\n\n### T-05 · Accept membership invitation (candidate flow, BQ-75)\n\n```text\nBEGIN\n  SELECT invitations WHERE token_hash=$h FOR UPDATE      -- status PENDING, expires_at > now()\n  assert caller.account_type = INDIVIDUAL                -- members are Individual accounts (BQ-68)\n  assert caller's verified email/phone matches invitation\n  INSERT organization_members (ACTIVE, show_on_company_profile=true) … ON CONFLICT (organization_id, user_id)\n      DO UPDATE SET status=ACTIVE                        -- re-joining reactivates\n  UPDATE invitations SET status=ACCEPTED, accepted_by, accepted_at\n  INSERT audit_logs · outbox(invitation.accepted, membership.created)\nCOMMIT\n```\n\n### T-06 · Verification decision (generic)\n\n```text\nBEGIN\n  SELECT verifications … FOR UPDATE\n  assert decider holds VERIFICATION_REVIEWER or SYSTEM_ADMIN   -- a person decides, never automation (BQ-48)\n  assert valid transition (IN_REVIEW → APPROVED | REJECTED | NEEDS_INFO)\n  assert conflict-of-interest rules\n  INSERT verification_decisions (reason required for REJECTED/NEEDS_INFO)\n  UPDATE verifications (status, decided_at, expires_at)\n  handler = registry.handlerFor(type)\n  handler.onApproved | onRejected (tx, case)             -- subject state changes, same TX\n  INSERT audit_logs · outbox(verification.\u003cdecision> + subject events)\nCOMMIT\n```\n\nT-01 is the `ORGANIZATION_CLAIM` instance of T-06.\n\n### T-07 · Project review decision\n\n```text\nBEGIN\n  SELECT company_projects … FOR UPDATE                           -- status IN_REVIEW\n  UPDATE company_projects SET status, reviewed_by, published_at (approve) | reason (changes/reject)\n  on approve: recompute completion_score, points_score (≤ 50), fingerprint\n  INSERT audit_logs · outbox(project.published | project.changes_requested | project.rejected, project.score_changed)\nCOMMIT\n```\n\n### T-29 · Company approval decision (BQ-05, BQ-46)\n\n```text\nBEGIN\n  assert actor is SYSTEM_ADMIN with aal2\n  SELECT organization_approvals … FOR UPDATE             -- status PENDING\n  SELECT organizations … FOR UPDATE                      -- status DRAFT, not ARCHIVED\n  approve:\n      UPDATE organization_approvals SET status=APPROVED, decided_by, decided_at\n      UPDATE organizations SET approved_at, approved_by, claimed_at, status = derive(facts) → CLAIMED\n      -- NO verification signal, NO trust points (approval ≠ verification, BQ-46)\n      INSERT outbox(organization.approved, organization.status_changed)   → search index, notification\n  request changes | reject:\n      assert reason present\n      UPDATE organization_approvals SET status=NEEDS_CHANGES|REJECTED, reason, decided_by, decided_at\n      INSERT outbox(organization.approval.changes_requested | organization.approval.rejected)\n  INSERT audit_logs\nCOMMIT\n```\n\n### T-30 · Admin ownership flow (BQ-04, BQ-56, BQ-69)\n\n```text\nBEGIN\n  assert actor is SYSTEM_ADMIN with aal2 and reason present    -- process details → BQ-56\n  SELECT organizations … FOR UPDATE\n  assert new Company Account exists, is ACTIVE, account_type = COMPANY, and has no company\n  UPDATE organizations SET account_user_id = new_account    -- UNIQUE guarantees one company per account\n  revoke sessions of the previous Company Account for this company context (after commit, outbox)\n  INSERT audit_logs (old account, new account, reason) · outbox(organization.ownership.transferred)\nCOMMIT\n```\n\n### T-32 · Publish opportunity (BQ-73)\n\n```text\nBEGIN\n  assert caller is the company's Company Account\n  SELECT opportunities … FOR UPDATE                      -- DRAFT or PAUSED\n  if type = JOB:\n      assert employment_type IS NOT NULL\n      assert organization is VERIFIED (rule BQ-53)       else 409 COMPANY_NOT_VERIFIED\n  UPDATE status=PUBLISHED, published_at\n  INSERT outbox(opportunity.published)\nCOMMIT\n```\n\n### T-21 · Import commit and rollback\n\n- **Commit** runs as a job in **chunks** (e.g. 100 rows per transaction) so one import cannot hold locks for minutes. Each chunk:\n  ```text\n  BEGIN\n    for row in chunk: INSERT organizations (UNCLAIMED, source_import_row_id) + children\n                      contacts inserted with is_public=false (§22.1)\n                      UPDATE import_rows SET created_organization_id, action\n    INSERT outbox(organization.created …)\n  COMMIT\n  ```\n  The batch-level `status` moves UPLOADED → PREVIEWED → COMMITTING → COMMITTED/FAILED. A failed chunk stops the batch; committed chunks remain and can be rolled back.\n- **Rollback**\n  ```text\n  BEGIN\n    SELECT import_batches … FOR UPDATE\n    for org created by batch: if still UNCLAIMED and has no claims/members/projects → archive\n                               else → report as \"cannot roll back\" (kept)\n    UPDATE import_batches SET status=ROLLED_BACK\n    INSERT audit_logs · outbox(import.rolled_back)\n  COMMIT\n  ```\n\n### T-23 · Staff role grant or revoke\n\n```text\nBEGIN\n  assert actor is SYSTEM_ADMIN with aal2; reason present\n  INSERT user_platform_roles | UPDATE SET revoked_at\n      -- partial UNIQUE prevents duplicate active grant\n  assert at least one active SYSTEM_ADMIN remains (on revoke)\n  INSERT audit_logs · outbox(staff_role.granted | revoked)\nCOMMIT\n```\n\n### T-25 · Registration (BQ-60)\n\n```text\nBEGIN\n  SELECT users … FOR UPDATE                              -- account_type IS NULL (idempotent: else return current)\n  INSERT consents (terms, privacy, preferences) with document versions\n  INDIVIDUAL flow:\n      INSERT profiles (full_name, …)\n      UPDATE users SET account_type=INDIVIDUAL, onboarding_completed_at\n  COMPANY flow:\n      UPDATE users SET account_type=COMPANY, onboarding_completed_at\n      run T-02 in the same transaction (DRAFT company + types + industries + account_user_id)\n      -- no individual profile is created for a COMPANY account\n  INSERT audit_logs · outbox(user.registered_as_individual | user.registered_as_company)\nCOMMIT\n```\n\n### T-26 · Suspend or unsuspend\n\n```text\n-- user\nBEGIN\n  UPDATE users SET status=SUSPENDED, suspended_at, suspension_reason\n  INSERT audit_logs · outbox(user.suspended)\nCOMMIT\nAFTER COMMIT (outbox handler): Supabase ban + session revocation (external call, retried)\n\n-- organization\nBEGIN\n  SELECT organizations … FOR UPDATE\n  UPDATE organizations SET suspended_at | NULL; status = derive(facts)\n  INSERT audit_logs · outbox(organization.status_changed)\nCOMMIT\n```\n\nThe API rejects a suspended user immediately (`UserStateGuard` reads `users.status`), so the Supabase call can safely happen after commit.\n\n---\n\n## Phase 2\n\n### T-08 · Award or deduct points\n\n```text\nBEGIN\n  INSERT point_balances (subject, category, 0) ON CONFLICT DO NOTHING\n  SELECT point_balances … FOR UPDATE\n  if frozen_at IS NOT NULL → skip credit (record reason), COMMIT\n  version = active rule version at occurred_at\n  cap checks (SUM / COUNT in ledger for rule+subject within window)  -- under the balance lock\n  amount = clamp to cap / component max\n  INSERT point_ledger (idempotency_key UNIQUE)           -- duplicate → unique violation → return existing (no-op)\n  UPDATE point_balances SET balance = balance + amount, last_entry_id\n  INSERT outbox(points.credited | points.debited)\n  (manual adjustment) INSERT audit_logs\nCOMMIT\n```\n\n### T-09 · Reverse a point entry\n\n```text\nBEGIN\n  SELECT point_ledger WHERE id=$orig FOR UPDATE          -- not itself a REVERSAL\n  SELECT point_balances … FOR UPDATE\n  INSERT point_ledger (REVERSAL, amount = -orig.amount, reverses_entry_id=orig)   -- UNIQUE → only once\n  UPDATE point_balances SET balance = balance - orig.amount\n  INSERT audit_logs (reason) · outbox(points.reversed)\nCOMMIT\n```\n\n### T-10 · Level assignment or badge award\n\n```text\nBEGIN\n  SELECT level_assignments WHERE user_id=$u AND status='ACTIVE' FOR UPDATE\n  UPDATE previous SET ended_at=now()\n  INSERT level_assignments (ACTIVE | PENDING_REVIEW)     -- partial UNIQUE one ACTIVE\n  INSERT audit_logs (manual) · outbox(level.changed | level.review_requested)\nCOMMIT\n```\n\nBadge awards: `INSERT badge_awards` guarded by a partial unique index + audit + outbox.\n\n### T-11 · Event registration with capacity\n\n```text\nBEGIN\n  SELECT events … FOR SHARE                              -- PUBLISHED, sales window open\n  SELECT event_ticket_types … FOR UPDATE                 -- serialises seat allocation per ticket type\n  eligibility: entitlement (feature) / level (min_level) -- read-only checks\n  confirmed = COUNT(registrations WHERE ticket_type AND status='CONFIRMED')\n  if confirmed \u003c capacity (and event capacity):\n       INSERT event_registrations (CONFIRMED, entry_code random)\n  else INSERT event_registrations (WAITLISTED, waitlist_position = max+1)\n      -- partial UNIQUE (event_id, user_id) prevents double registration\n  INSERT outbox(event.registration.confirmed | waitlisted)\nCOMMIT\n```\n\nIf an event-level capacity exists across ticket types, lock the `events` row `FOR UPDATE` instead of `FOR SHARE`.\n\n### T-12 · Cancel and promote the waitlist\n\n```text\nBEGIN\n  SELECT event_registrations WHERE id=$r FOR UPDATE      -- CONFIRMED or WAITLISTED, owned by caller\n  SELECT event_ticket_types … FOR UPDATE\n  UPDATE registration SET status=CANCELLED, cancelled_at, entry_code=NULL\n  if it was CONFIRMED:\n      next = SELECT … WHERE status='WAITLISTED' ORDER BY waitlist_position LIMIT 1 FOR UPDATE SKIP LOCKED\n      UPDATE next SET status=CONFIRMED, entry_code, waitlist_position=NULL\n  INSERT outbox(event.registration.cancelled, event.registration.promoted)\nCOMMIT\n```\n\n### T-13 · Check-in (attendance)\n\n```text\nBEGIN\n  SELECT event_registrations WHERE entry_code=$c (or id) FOR UPDATE\n  assert status CONFIRMED, event in progress window, attended_at IS NULL   -- second scan → 409 ALREADY_CHECKED_IN (idempotent response)\n  UPDATE SET attended_at=now(), attendance_method, checked_in_by\n  INSERT audit_logs (MANUAL only) · outbox(event.attendance.verified)\nCOMMIT\n→ engagement consumes event.attendance.verified → T-08 (idempotency key = rule:registration_id)\n```\n\nAttendance and points are **separate transactions joined by the outbox**. Attendance cannot exist without its event (same TX), and points cannot exist without attendance (the only trigger). Exactly-once is guaranteed by the ledger idempotency key.\n\n### T-14 · Payment webhook → subscription activation\n\n```text\n(verify signature — outside TX)\nBEGIN\n  INSERT payment_provider_events (provider, provider_event_id) ON CONFLICT DO NOTHING RETURNING id\n  if no row → already processed → COMMIT, respond 200\n  SELECT subscriptions … FOR UPDATE\n  UPSERT payments (provider_payment_ref UNIQUE) status SUCCEEDED/FAILED\n  on success: UPDATE invoices SET status=PAID\n              UPDATE subscriptions SET status=ACTIVE, current_period_start/end\n              entitlements.recalculate(tx, subscriber)   -- revoke old PLAN rows, insert new\n  on failure: UPDATE subscriptions → GRACE_PERIOD per policy\n  UPDATE payment_provider_events SET processed_at\n  INSERT audit_logs · outbox(payment.*, subscription.*, entitlements.changed, invoice.issued)\nCOMMIT\n```\n\n**No double subscription (§20.2):** the partial unique index \"one live subscription per subscriber\" makes concurrent checkouts fail on the second insert. Checkout itself creates the pending subscription + invoice in a transaction **before** redirecting to the gateway, using an `Idempotency-Key`.\n\n### T-15 · Plan change\n\n```text\nBEGIN\n  SELECT subscriptions … FOR UPDATE                      -- ACTIVE\n  upgrade:   UPDATE plan_id, price snapshot; create proration invoice (policy BQ-15)\n             entitlements.recalculate(tx)\n  downgrade: UPDATE pending_plan_id (applied by renewal job at period end, which runs T-27-like TX)\n  INSERT audit_logs · outbox(subscription.plan_changed[, entitlements.changed])\nCOMMIT\n(the payment for a proration invoice follows T-14)\n```\n\n### T-16 · Coupon redemption\n\n```text\nBEGIN\n  SELECT coupons WHERE code=$c FOR UPDATE                -- active, in validity window, plan matches\n  assert max_redemptions IS NULL OR redeemed_count \u003c max_redemptions\n  INSERT coupon_redemptions (UNIQUE coupon+subscription)\n  UPDATE coupons SET redeemed_count = redeemed_count + 1\n  apply discount to the open invoice\n  INSERT outbox(coupon.redeemed)\nCOMMIT\n```\n\n### T-27 · Subscription expiry → entitlements\n\n```text\nBEGIN\n  SELECT subscriptions … FOR UPDATE                      -- due by job\n  UPDATE status EXPIRED (or apply pending_plan_id at renewal)\n  entitlements.recalculate(tx) → free plan\n  INSERT audit_logs · outbox(subscription.expired, entitlements.changed)\nCOMMIT\n```\n\n### T-28 · Computed score sync\n\n```text\nBEGIN\n  SELECT point_balances (org, component) FOR UPDATE\n  target = min(cap, calculate(component))                -- reads projects/org via query services\n  delta = target - balance\n  if delta ≠ 0: INSERT point_ledger (CREDIT/DEBIT, idempotency_key = component:org:input_hash)\n                UPDATE point_balances\n                INSERT outbox(points.*)\nCOMMIT\n```\n\n---\n\n## Phase 3\n\n### T-17 · Submit individual application (rules §8)\n\n```text\nBEGIN\n  SELECT opportunities … FOR SHARE                       -- PUBLISHED, before deadline\n  assert opportunity.audience = INDIVIDUAL                -- supplier requests never accept applications (rules §7)\n  assert applicant is an individual user (account-type eligibility → BQ-60)\n  INSERT applications (applicant_user_id, SUBMITTED)     -- UNIQUE (opportunity, applicant)\n  INSERT outbox(application.submitted)\nCOMMIT\n```\n\nStatus changes are single-row updates under `SELECT … FOR UPDATE`: the company may set **any** of REVIEWED, SHORTLISTED, CONTACT, ACCEPTED, REJECTED from a non-final status (flexible, BQ-67). Audited, with `application.status_changed`.\n\n### T-31 · Submit supplier response (rules §7)\n\n```text\nBEGIN\n  SELECT opportunities … FOR SHARE                       -- PUBLISHED, type = SUPPLIER_REQUEST\n  assert caller is responding_organization's Company Account\n  assert responding_organization ≠ opportunity.organization_id   -- a buyer cannot respond to itself\n  -- any company may respond; NO company_type restriction (BQ-66)\n  INSERT supplier_responses (SUBMITTED)                  -- UNIQUE (opportunity, responding_organization)\n  INSERT audit_logs · outbox(supplier_response.submitted)\nCOMMIT\n```\n\n### T-18 · Close an opportunity\n\n```text\nBEGIN\n  SELECT opportunities … FOR UPDATE                      -- PUBLISHED or PAUSED\n  UPDATE status=CLOSED, outcome, closed_at\n  individual audience: UPDATE applications SET status = REJECTED\n        WHERE status IN (SUBMITTED, REVIEWED, SHORTLISTED, CONTACT)   -- ⚠️ closing rule for undecided applicants → BQ-67\n  company audience: supplier responses stay as they are (more statuses only if defined later, BQ-66)\n  INSERT audit_logs · outbox(opportunity.closed, application.status_changed ×n)\nCOMMIT\n```\n\n### T-24 · Employment confirmation\n\n```text\nBEGIN\n  SELECT experiences … FOR UPDATE                        -- PENDING, organization_id = route org\n  assert actor has organization.employment.confirm in that org\n  UPDATE confirmation_status=CONFIRMED|DECLINED, confirmed_by_user_id, confirmed_at\n  INSERT audit_logs · outbox(experience.confirmed | declined)\nCOMMIT\n→ engagement awards TRUST points via T-08\n```\n\n---\n\n## Phase 4\n\n### T-19 · Change benchmark co
