2 | §11.2 | 4 |\n| **RG-13** | Anonymous benchmarks | Definitions of \"size\" and \"region\" groups; the \"top 25%\" calculation | §11.1 | 4 |\n| **RG-14** | Notification catalog | Which events notify whom, on which channel; push notifications for the Flutter app (mobile confirmed by BQ-01) | §6, §13 | 1 |\n| **RG-15** | Content management | Content types beyond pages/news, fields, workflow, news categories (frontend has `/news/categories`) | §13 | 1 |\n| **RG-16** | Badges | Catalog and award criteria | §6 Phase 2 | 2 |\n| **RG-17** | Account suspension, deletion and data export (AUTH-06, \"later\") | Grace periods, anonymisation rules, export format | AUTH-06, §18 | Later |\n| **RG-18** | Institutional access log (§12.1) | Which reads are logged (profile views? searches?). Scope depends on BQ-51 | §12.1 | 4 |\n| **RG-19** | Partner API (Phase 5) | Everything | §15.2 | 5 |\n| **RG-20** | \"Invite a company to update its data\" (§12.1) | Workflow and whether it is a kind of RFI | §12.1 | 4 |\n| **RG-21** | Reviewer \"suggest correction\" (§4) | Workflow, and what happens when the owner ignores it | §4 | 1 |\n| **RG-22** | Level benefits | \"Priority for some activities\" and \"highlighting contributions\" are not defined | §9.1 | 2 |\n| **RG-23** | Contribution evidence | How volunteering, training and initiatives are confirmed (\"review or confirmation\") | §8.2 | 2 |\n| **RG-24** | Company \"recent activity\" component | Time window; how \"responsiveness\" is measured | §8.3 | 2 |\n| **RG-25** | Consent purposes | List of processing purposes requiring consent (§5.1, §18) | §5.1, §18 | 1 |\n| **RG-26** | Abuse reports (بلاغات) | Report categories, resolution actions, penalties | §13, §23 | 1 |\n| **RG-28** | Industries list | ⚠️ Draft list prepared 2026-09-17 (`business-rules.md` §20); needs business review before seeding | BQ-63 | 1 |\n| **RG-27** | Export watermark | What the watermark contains and where it is applied | §20.2 | 4 |\n\n---\n\n## 4. Internal inconsistencies in the PRD (recorded, not resolved)\n\n| # | Inconsistency | Where | Architecture stance |\n|---|---|---|---|\n| I-1 | Company statuses: ORG-07 lists 6 states; §29.1 lists 8 (adds *needs update*, *archived*). | §7.2 vs §29.1 | Use the §29.1 superset. |\n| I-2 | Project statuses: §7.3 has no *rejected*; §29.1 does. | §7.3 vs §29.1 | Use the §29.1 superset. |\n| I-3 | Verification statuses: §5.1 says *draft / under review / needs changes / verified / rejected*; §29.1 says *not started / in review / needs info / approved / rejected / expired*. | §5.1 vs §29.1 | Use §29.1; map *draft* to `NOT_STARTED`. |\n| I-4 | Subscription *suspension* mentioned (§7.5) but absent from subscription statuses (§29.1). | §7.5 vs §29.1 | Not added; see BQ-15. |\n| I-5 | Directory timing (Phase 3 vs Q2) and observatory timing (Phase 5 vs Q4). | §6 vs §29.3 | See BQ-27, BQ-28. |\n| I-6 | Buyer pilot in Phase 1 vs institutional features in Phase 4. | §1.2, §22 vs §6 | See BQ-26, BQ-51. |\n| I-7 | API style: PRD §15.1 allows \"REST or GraphQL\"; this project chose REST. | §15.1 | Recorded in ADR-008. |\n| I-8 | Business decisions deliberately override PRD text: native mobile app in launch scope (§2.2 vs BQ-01); no entity organizations (§12, §14 \"companies **and entities**\" vs BQ-06); no verification gate on levels (§9.1 vs BQ-07); verification decisions human-only in Phase 1 (§5.2 automated matching vs BQ-48). | §2.2, §5.2, §9.1, §12, §14 | Decisions win; PRD text kept for traceability. |\n| I-10 | PRD §4 company roles (owner / editor / analyst, delegation) and AUTH-05 role-scoped team invitations are replaced by one Company Account per company with Individual members (BQ-68). | §4, AUTH-05 | Decision wins. |\n| I-9 | Mandatory rules (2026-09-17) override PRD text: 2 account types (§5.1 has 5); opportunity types JOB/CO_OP/VOLUNTEERING/SUPPLIER_REQUEST (§10.2 has 6); billing and payments deferred (§6 Phase 2, §7.5); controlled messaging deferred (§6 Phase 3). | §5.1, §6, §7.5, §10.2 | `business-rules.md` wins. |\n"},{"name":"architecture-decisions","title":"Architecture Decision Records","keywords":"adr decisions prisma supabase","markdown":"# Architecture Decision Records\n\n> Every significant architectural decision is recorded here.\n> **Status:** `Accepted` (decided; change requires a new ADR) · `Proposed` (recommended; awaiting confirmation) · `Open` (needs a decision; options listed) · `Superseded by ADR-xxx`.\n> The stack decisions directed by the project owner (NestJS, TypeScript, PostgreSQL on Supabase, Prisma, REST) are **Accepted**. Everything else stays **Proposed** until confirmed.\n\n## Index\n\n| ADR | Decision | Status |\n|---|---|---|\n| ADR-001 | Modular monolith in NestJS | Accepted |\n| ADR-002 | Prisma as ORM (with hand-written SQL for advanced constraints) | Accepted |\n| ADR-003 | Supabase Auth for authentication; NestJS for authorization | Proposed |\n| ADR-004 | Code-defined permission catalog; organization context in the URL, not the token | Proposed (context model refined by ADR-029) |\n| ADR-005 | UUID v7 primary keys | Proposed |\n| ADR-006 | Soft delete only where justified; status-based archival preferred | Proposed |\n| ADR-007 | Dedicated `app` schema; RLS deny-all backstop; app-level authorization | Proposed |\n| ADR-008 | REST API conventions: URI versioning, error format, cursor pagination, idempotency | Accepted (REST, `/api/v1`) / Proposed (details) |\n| ADR-009 | Supabase Storage with quarantine, public and private buckets | Proposed |\n| ADR-010 | pg-boss for background jobs (no Redis) | Proposed |\n| ADR-011 | Transactional outbox for domain events (no message broker) | Proposed |\n| ADR-012 | PostgreSQL full-text + trigram search over a public-only projection | Proposed |\n| ADR-013 | No caching layer initially | Proposed |\n| ADR-014 | Points as an append-only ledger with balance projection | Proposed |\n| ADR-015 | One `organizations` table for companies and institutions | Superseded by ADR-024 |\n| ADR-016 | Audit logs written synchronously in the same transaction, append-only | Proposed |\n| ADR-017 | First-party analytics events table + provider forwarding | Proposed |\n| ADR-018 | Organization status stored as the PRD enum, derived from facts | Proposed |\n| ADR-019 | API JSON field casing | **Open** |\n| ADR-020 | Money as integer minor units | Proposed |\n| ADR-021 | Bilingual content as paired `_ar`/`_en` columns | Proposed |\n| ADR-022 | Separate `api` and `worker` processes from one codebase | Proposed |\n| ADR-023 | Hosting platform for NestJS | **Open** |\n| ADR-024 | Every organization is a company (no organization types) | Accepted (business decision BQ-06) |\n| ADR-025 | Company approval, ownership and verification signals are separate | Accepted (business decisions BQ-04, BQ-05, BQ-46, BQ-47, BQ-48) |\n| ADR-026 | Two account types; company types (one or more) as classification; company projects as a separate domain | Accepted (business rules §1–§4, BQ-61) |\n| ADR-027 | Unified opportunity model with separate individual applications and B2B supplier responses | Accepted (business rules §5–§9) |\n| ADR-028 | Monetization deferred; paid visibility always separate from verification | Accepted (business rules §10–§12) |\n| ADR-029 | Individual and Company accounts as separate security contexts | Accepted (BQ-60) |\n| ADR-030 | One Company Account per company; Individual members without permissions | Accepted (BQ-68, BQ-69, BQ-74) |\n\n---\n\n## ADR-001 · Modular monolith in NestJS\n\n```text\nDecision:   Build one NestJS application organised into domain modules with enforced boundaries.\nContext:    PRD §19 recommends \"a modular application service that starts as a single organised\n            application before being split into services\". Phased delivery (§6), a small team (§25),\n            a strong need for transactional consistency (ownership, points, billing).\nOptions:    (a) modular monolith  (b) microservices from day one  (c) unstructured monolith\nChosen:     (a)\nWhy:        Transactions across modules (claim → ownership, payment → entitlements) stay simple ACID\n            transactions; one deploy and one database; boundaries (index.ts exports, dependency-cruiser,\n            events, ports) keep future extraction possible.\nTrade-offs: Discipline required to keep boundaries; a single deploy unit scales as a whole (mitigated\n            by the api/worker split, ADR-022).\nDate:       2026-09-14\n```\n\n## ADR-002 · Prisma as ORM\n\n```text\nDecision:   Use Prisma for schema, migrations and data access.\nContext:    Directed by the project owner unless requirements give a strong reason otherwise. The design\n            needs partial unique indexes, CHECK constraints, exclusion constraints, tsvector/GIN,\n            partitioning, immutability triggers, row locks (FOR UPDATE / SKIP LOCKED).\nOptions:    (a) Prisma  (b) TypeORM  (c) Drizzle / Kysely (SQL-first)  (d) MikroORM\nChosen:     (a) Prisma\nWhy:        Strong type safety, good migration workflow, team familiarity, multi-file schema.\n            None of the advanced requirements is blocked: they are written as SQL inside Prisma migration\n            files (`migrate dev --create-only`), and lock queries use `$queryRaw` tagged templates\n            inside interactive transactions. This is not a strong enough reason to switch ORM.\nTrade-offs: Some schema facts live in SQL rather than schema.prisma (documented in\n            database-entities.md); interactive transactions hold a connection (keep them short);\n            Unsupported(\"tsvector\") fields are not queryable through the typed client (search uses raw SQL).\n            Prisma major-version specifics (config file, driver adapters, pooler parameters) to be\n            pinned at setup (TQ-23).\nDate:       2026-09-14\n```\n\n## ADR-003 · Supabase Auth for authentication; NestJS for authorization\n\n```text\nDecision:   Authenticate users with Supabase Auth (OTP email/phone, sessions, MFA). NestJS verifies\n            Supabase JWTs (JWKS) and performs all authorization from its own tables.\nContext:    AUTH-01..05 require OTP registration (decided 2026-09-15, BQ-30: OTP + password; web + mobile, BQ-01), session refresh and global sign-out, MFA for sensitive\n            roles, password policy with leaked-password protection, attempt limits. The database is already\n            on Supabase. The existing Flutter app expects /auth/* endpoints on the API (TQ-02).\nOptions:    (a) Supabase Auth, client talks to Supabase directly; NestJS handles /me + onboarding\n            (b) Supabase Auth behind a NestJS /auth/* facade (keeps current frontend contract)\n            (c) Custom NestJS auth (passport, own OTP, sessions, TOTP)\n            (d) Other IdP (Auth0, Cognito, Keycloak)\nChosen:     (a), pending confirmation of TQ-01/TQ-02 and BQ-31. BQ-30 (OTP + password) is fully supported:\n            password sign-up with code confirmation, password sign-in, recovery by code\nWhy:        Covers AUTH-01..04 without building security-critical code; JWT `aal` claim supports MFA\n            enforcement by role; `session_id` claim supports immediate revocation; asymmetric JWKS\n            verification requires no shared secret; same vendor as the database.\n            (b) adds a proxy layer with little benefit; (c) is costly and risky; (d) adds another vendor.\nTrade-offs: Vendor coupling for identity; data residency must be confirmed (BQ-31); frontend auth layer\n            must change to the Supabase SDK; app.users must be kept in sync with auth.users by the app\n            (no cross-schema FK); admin session revocation relies on reading auth.sessions (verify).\n            Revisit if BQ-31 requires in-country hosting Supabase can't provide, or the Saudi SMS provider\n            can't be integrated via the Send SMS hook.\nDate:       2026-09-14\n```\n\n## ADR-004 · Permission catalog in code; organization context in the URL\n\n```text\nDecision:   Roles and role→permission mappings are defined in code and versioned in git. Role\n            assignments are data (user_platform_roles; company access via organizations.account_user_id, ADR-030).\n            The acting organization is always the :organizationId path parameter. Roles, memberships,\n            active organization and plan are NEVER in the JWT.\nContext:    PRD §4 RBAC scoped to an organization; §12.3 automatic expiry and periodic review; §20.1\n            negative permission tests; possible multi-organization users (BQ-03).\nOptions:    Catalog: (a) code  (b) roles/permissions tables editable by admins\n            Context: (a) URL path  (b) header  (c) JWT claim  (d) server session\nChosen:     Catalog (a); context (a)\nWhy:        The PRD does not require runtime-defined roles; code makes the matrix reviewable and\n            testable. URL context is explicit and stateless, and revocation is immediate (no stale tokens).\nTrade-offs: New roles need a deploy (acceptable); one membership lookup per request (indexed,\n            request-scoped cache).\nDate:       2026-09-14\n```\n\n## ADR-005 · UUID v7 primary keys\n\n```text\nDecision:   uuid primary keys, version 7, on all non-join tables.\nContext:    §14.1 requires non-sequential, publicly usable identifiers.\nOptions:    (a) UUID v4  (b) UUID v7  (c) bigint identity + public UUID  (d) ULID text\nChosen:     (b)\nWhy:        Non-guessable enough for public ids, time-ordered for index locality and natural sort,\n            native uuid type.\nTrade-offs: Embeds creation time (minor information disclosure, acceptable); requires Prisma/Postgres\n            support or app generation (TQ-22); fallback gen_random_uuid() (v4) as DB default for raw inserts.\nDate:       2026-09-14\n```\n\n## ADR-006 · Soft delete strategy\n\n```text\nDecision:   No global soft delete. Prefer PRD business states (ARCHIVED) for operational entities;\n            `deleted_at` only for user-deletable entities that need retention; anonymisation for personal\n            data; append-only for facts. Rules in database-design-rules.md §5.\nContext:    §14.1 \"logical deletion for operational entities with a retention policy\"; PDPL deletion rights.\nOptions:    (a) deleted_at on every table  (b) targeted strategy  (c) hard deletes + audit only\nChosen:     (b)\nWhy:        Avoids hidden-row bugs and unique-constraint complexity everywhere; matches the PRD's\n            explicit archive states; respects deletion rights.\nTrade-offs: Different tables use different mechanisms (documented per table).\nDate:       2026-09-14\n```\n\n## ADR-007 · `app` schema, RLS backstop, application-level authorization\n\n```text\nDecision:   All tables in a dedicated `app` schema not exposed by Supabase's Data API. RLS enabled\n            with no policies on every app table (deny-all for Supabase client roles). The NestJS app role\n            has BYPASSRLS; authorization is enforced in NestJS. Storage bucket policies restrict client\n            access; private files only through signed URLs.\nContext:    NestJS is the only client of the database; authorization rules are contextual (org role,\n            delegation, entitlements, record state, MFA) — see auth-architecture.md.\nOptions:    (a) app-level authz + RLS backstop  (b) RLS as primary authz with per-request claims\n            (c) no RLS\nChosen:     (a)\nWhy:        Rules are testable in TypeScript; no per-transaction claim setting through the pooler;\n            the RLS backstop still protects against Data API exposure or key leakage.\nTrade-offs: A bug in app authorization isn't caught by the DB → mitigated by negative authz test suite,\n            query-scoped repositories and code review.\nDate:       2026-09-14\n```\n\n## ADR-008 · REST API conventions\n\n```text\nDecision:   REST over HTTPS, URI versioning `/api/v1`; resource-oriented routes with explicit action\n            sub-resources for state transitions (`/submit`, `/approve`); `{data, meta}` success envelope;\n            `{code, message, trace_id, errors}` error body; 422 for validation; cursor pagination for\n            public/user lists; `Idempotency-Key` for payments, check-ins and point adjustments;\n            OpenAPI generated from code.\nContext:    Stack directive: REST. §15.1: documented contracts, clear versioning, stable pagination and\n            limits, idempotency keys for payment/points/attendance, unified errors with code + message +\n            trace id, no sensitive details. PRD allowed REST or GraphQL (I-7).\nOptions:    Versioning (URI / header); pagination (offset / cursor); errors (RFC 7807 / custom)\nChosen:     URI version; cursor (public) + offset (admin); custom error body compatible with the existing\n            frontend parser (root `message` + `errors` map)\nWhy:        Simple for mobile clients; stable pagination under inserts; zero frontend change for errors.\nTrade-offs: Cursor pagination can't jump to page N (frontend uses page numbers today, TQ-06).\nDate:       2026-09-14\n```\n\n## ADR-009 · File storage\n\n```text\nDecision:   Supabase Storage with buckets `quarantine` (private), `public-media` (public read),\n            `private-documents` (private), `reports` (private, Phase 4). Direct client upload via signed\n            upload URLs to quarantine → worker validates type, hashes, scans → moves to target bucket.\n            Private downloads via ≤ 5-minute signed URLs issued after authorization, audited.\nContext:    §15.2 object storage (Phase 1); §18 separate sensitive documents, short-lived links, malware\n            scanning, type/size limits; §8.6 image fingerprints.\nOptions:    (a) Supabase Storage  (b) S3/R2 directly  (c) upload through the API\nChosen:     (a)\nWhy:        Same provider and project per environment; S3-compatible if migration is ever needed;\n            direct upload keeps large files off the API.\nTrade-offs: Malware scanning is not built in (TQ-10); storage is not included in DB backups (separate\n            backup needed); app-level encryption of identity documents still to decide (TQ-11).\nDate:       2026-09-14\n```\n\n## ADR-010 · Background jobs with pg-boss\n\n```text\nDecision:   Use pg-boss (Postgres-backed queue) for async jobs and cron in the worker process.\nContext:    §17/§19 call for queues for heavy tasks (reports, images, notifications, point calculation);\n            don't add infrastructure without need (principle 8).\nOptions:    (a) pg-boss  (b) BullMQ + Redis  (c) @nestjs/schedule only  (d) cloud queue (SQS / Cloud Tasks)\nChosen:     (a), with @nestjs/schedule-style cron registered through pg-boss\nWhy:        No new infrastructure; transactional with the database; retries, backoff, scheduling built in;\n            sufficient for projected volumes (thousands of companies, not millions of jobs/min).\nTrade-offs: Adds DB load; needs session-mode or direct connections (not transaction pooler); if job\n            volume grows, move to BullMQ/Redis or a cloud queue behind the same JobsPort.\nDate:       2026-09-14\n```\n\n## ADR-011 · Domain events via transactional outbox\n\n```text\nDecision:   Modules publish domain events by inserting into `outbox_events` in the same transaction as\n            the state change; a worker dispatches to in-process handlers with per-handler retries.\n            Synchronous in-transaction ports are used where atomicity is required (verification subject\n            handlers, merge participants, entitlements recalculation, audit).\nContext:    Notifications, points, search and analytics must react to many modules without coupling;\n            §20.2 requires points exactly once and no lost effects.\nOptions:    (a) in-process EventEmitter only  (b) outbox + worker  (c) message broker (Kafka/RabbitMQ)\nChosen:     (b)\nWhy:        (a) loses events on crash and runs side effects before commit; (c) is unjustified\n            infrastructure. The outbox gives atomic publish + at-least-once delivery with plain Postgres.\nTrade-offs: Eventual consistency for consumers (seconds); consumers must be idempotent; outbox table\n            needs purging.\nDate:       2026-09-14\n```\n\n## ADR-012 · Search strategy\n\n```text\nDecision:   PostgreSQL search over a `search_documents` projection containing only public fields:\n            tsvector full-text + pg_trgm fuzzy matching + a custom Arabic normalisation function\n            (alef/hamza/ta marbuta/diacritics) + array filters; ranking combines text relevance, filter\n            relevance and visibility score.\nContext:    §7.4 AR/EN search with spelling variants, many filters, SEO pages, no restricted fields in\n            the index, zero-result logging; §17 results \u003c 1 s for most queries; §19 dedicated search engine\n            \"when relational search capabilities are exceeded\".\nOptions:    (a) Postgres FTS on projection  (b) Meilisearch/Typesense  (c) Elasticsearch/OpenSearch\nChosen:     (a)\nWhy:        Volumes (≈ 2,000 companies year 1, §1.2) are well within Postgres capability; no sync infra;\n            the projection design already isolates public data so a later move to (b)/(c) reuses it.\nTrade-offs: Arabic stemming quality is limited (normalisation + trigram compensates); revisit if\n            relevance or latency targets are missed.\nDate:       2026-09-14\n```\n\n## ADR-013 · Caching\n\n```text\nDecision:   No shared cache (Redis) initially. Per-request memoisation (memberships), short-lived\n            in-process caches for taxonomy and JWKS, HTTP caching headers for public reads (CDN).\nContext:    §19 lists a cache for sessions, limits and hot results as reference architecture; principle 8\n            forbids unjustified infrastructure.\nOptions:    (a) none/in-process  (b) Redis now\nChosen:     (a)\nWhy:        Supabase Auth handles sessions; volumes are small; public reads can be CDN-cached.\nTrade-offs: Rate limiting is per instance until a shared store is added (TQ-16); revisit when scaling\n            horizontally or latency targets are missed.\nDate:       2026-09-14\n```\n\n## ADR-014 · Points ledger\n\n```text\nDecision:   Points are recorded only as immutable `point_ledger` entries (CREDIT/DEBIT/REVERSAL) with\n            rule version, source, idempotency key; balances are a projection (`point_balances`) updated in\n            the same transaction and reconciled nightly. Computed company components write deltas.\n            Visibility is calculated from ledger + data into `visibility_snapshots`.\nContext:    §8.1 ledger not directly editable, corrections by reverse movement, rules and versions kept;\n            §8.6 non-repeat keys; §20.2 once, explainable, reversible.\nOptions:    (a) mutable counter  (b) ledger only (sum on read)  (c) ledger + projection\nChosen:     (c)\nWhy:        Satisfies explainability and reversibility; fast reads; exactly-once through unique keys.\nTrade-offs: More tables and write logic; projection drift possible → reconciliation job.\nDate:       2026-09-14\n```\n\n## ADR-015 · Single organizations table\n\n> **Superseded by ADR-024 (2026-09-15).** Kept for history.\n\n```text\nDecision:   Companies and institutions (government, contracting, research) share `organizations` with a\n            `type` column; type-specific rules live in services; institution-only data lives in\n            institutional tables.\nContext:    PRD §14 `organizations: companies and entities`; both need members, roles, invitations,\n            subscriptions, audit context.\nOptions:    (a) one table + type  (b) companies and institutions as separate tables\nChosen:     (a)\nWhy:        One membership/authorization mechanism; follows the PRD data model; supports a company that\n            may also act as buyer if BQ-06 allows.\nTrade-offs: Some columns irrelevant to institutions (nullable); directory queries must filter\n            type = COMPANY.\nDate:       2026-09-14\n```\n\n## ADR-016 · Audit logging\n\n```text\nDecision:   `audit_logs` rows are written synchronously inside the mutating transaction by\n            AuditLogger; the table is append-only (privileges + trigger); sensitive values redacted.\nContext:    §5.2, §12.3, §13, §18 — logging of approvals, permission changes, exports, sign-ins.\nOptions:    (a) same-transaction insert  (b) async via events  (c) DB triggers on all tables\nChosen:     (a)\nWhy:        No committed change without its audit row; explicit \"action\" semantics rather than raw row\n            diffs; no trigger overhead on every table.\nTrade-offs: Developers must call AuditLogger (enforced by review + tests for listed operations).\nDate:       2026-09-14\n```\n\n## ADR-017 · Analytics storage\n\n```text\nDecision:   Capture PRD §16 analytics events in a first-party, monthly-partitioned `analytics_events`\n            table from Phase 1, and forward them to a product analytics provider.\nContext:    §15.2 product analytics (Phase 1); §11.2 Phase 4 company reports need impressions, views,\n            contact clicks history; §16.1 privacy (consent linking, internal/bot exclusion, no fingerprinting).\nOptions:    (a) provider only  (b) first-party table only  (c) both\nChosen:     (c)\nWhy:        Provider serves product analytics; first-party data is required to build auditable,\n            reproducible company metrics (§11.3) without depending on a third party's export.\nTrade-offs: Storage growth (partition + retention); ingestion endpoint needs abuse protection.\nDate:       2026-09-14\n```\n\n## ADR-018 · Organization status derivation\n\n```text\nDecision:   Store `organizations.status` with the exact PRD §29.1 values, but compute it in\n            OrganizationStatusService from stored facts (approved_at, claimed_at, owner membership,\n            approved verification signals per BQ-53, staleness, suspended_at, archived_at) instead of setting it freely.\nContext:    The PRD status list mixes ownership, verification, freshness and moderation states; lifting a\n            suspension must restore the correct state.\nOptions:    (a) free-set single enum  (b) decomposed flags only (no PRD enum)  (c) PRD enum derived from facts\nChosen:     (c)\nWhy:        Keeps PRD vocabulary for APIs and reporting while keeping the concepts separate\n            (verification ≠ ownership ≠ moderation) and restorable.\nTrade-offs: Status and facts can drift if written outside the service → only the service writes them;\n            test for derivation table.\nDate:       2026-09-14\n```\n\n## ADR-019 · API JSON field casing — OPEN\n\n```text\nDecision:   (pending)\nContext:    The existing frontend parses snake_case (`full_name`, `access_token`, `avatar_url`,\n            `is_verified`, `member_type`). NestJS/TypeScript defaults to camelCase.\nOptions:    (a) snake_case JSON — DTO properties declared in snake_case (no transformation layer)\n            (b) camelCase JSON — frontend parsers change\n            (c) camelCase internally + global key-transform interceptor (runtime cost, validation complexity)\nChosen:     —  (recommendation: decide with the frontend team before the first endpoint; (a) avoids frontend\n            changes and a transformation layer)\nWhy:        —\nTrade-offs: —\nDate:       2026-09-14\n```\n\n## ADR-020 · Money representation\n\n```text\nDecision:   Integer minor units (halalas) + ISO currency code (default SAR); VAT rate numeric(5,4).\nContext:    §7.5 plans, tax invoices, payments.\nOptions:    (a) integer minor units  (b) numeric(12,2)  (c) float\nChosen:     (a)\nWhy:        No rounding errors; matches payment gateway APIs.\nTrade-offs: Formatting required at the edges.\nDate:       2026-09-14\n```\n\n## ADR-021 · Bilingual fields\n\n```text\nDecision:   Paired `_ar` / `_en` columns for user- and staff-authored bilingual text; CHECK that at least\n            one is present where required; API returns both.\nContext:    §2.1 bilingual site; §17 Arabic and English without duplicating business logic; no other\n            languages planned (GCC expansion is geographic, §6 Phase 5).\nOptions:    (a) paired columns  (b) JSONB translations map  (c) translations table\nChosen:     (a)\nWhy:        Simple queries, indexable for search, explicit constraints.\nTrade-offs: Adding a third language needs migrations (not foreseen).\nDate:       2026-09-14\n```\n\n## ADR-022 · API and worker processes\n\n```text\nDecision:   Two entrypoints from one codebase: `api` (HTTP) and `worker` (outbox dispatcher, jobs, cron).\n            May run in one process in early Phase 1.\nContext:    §17 stateless services and queues for heavy tasks.\nOptions:    (a) single process  (b) api + worker  (c) separate services per domain\nChosen:     (b) (configurable)\nWhy:        Heavy jobs don't affect request latency; independent scaling; same modules and tests.\nTrade-offs: Two deploy targets.\nDate:       2026-09-14\n```\n\n## ADR-023 · Hosting platform for NestJS — OPEN\n\n```text\nDecision:   (pending, TQ-09)\nContext:    Needs: container hosting for api + worker, secrets manager, IPv4/IPv6 connectivity to Supabase\n            (direct vs session pooler), CDN/WAF (§19), logs/metrics (§17), region close to Saudi users and to\n            the Supabase region (BQ-31), staging + production environments.\nOptions:    e.g. Fly.io, Render, Railway, AWS (ECS/App Runner), GCP Cloud Run, Azure Container Apps,\n            a Saudi cloud region provider\nChosen:     —\nWhy:        —\nTrade-offs: —\nDate:       2026-09-14\n```\n\n## ADR-024 · Every organization is a company\n\n```text\nDecision:   Remove organization types. `organizations` holds companies only; no `type` column, no\n            OrganizationType enum, no institution roles (BUYER, READER, AUDITOR), no institution MFA rule.\nContext:    Business decision BQ-06 (2026-09-15). Supersedes ADR-015. PRD §12 and §14 describe government\n            and contracting entities as organizations.\nOptions:    (a) keep a type column for future use  (b) remove types entirely\nChosen:     (b), as decided by the business\nWhy:        Simpler schema, permissions and queries; no unused states to test.\nTrade-offs: PRD buyer journeys (§5.4, §12), SUPPLIER_REQUEST publishers and the Phase 1 buyer pilot have no\n            home until BQ-51 is answered. Re-introducing entities later needs a migration.\nDate:       2026-09-15\n```\n\n## ADR-025 · Approval, ownership and verification are separate\n\n```text\nDecision:   Three independent mechanisms for companies:\n            1. Ownership — exactly one owner per company (refined by ADR-030: the single Company Account); set by creation, an approved\n               claim, or an audited transfer (T-30). A user may own several companies.\n            2. Approval — the owner creates the company and SYSTEM_ADMIN approves the listing through\n               `organization_approvals` (T-29). Approval publishes the company as CLAIMED and sets no\n               verification and no trust points.\n            3. Verification — independent signal cases (registration, domain, each credential, each contact),\n               decided only by VERIFICATION_REVIEWER or SYSTEM_ADMIN in Phase 1 (no automated decisions).\nContext:    Business decisions BQ-03, BQ-04, BQ-05, BQ-46, BQ-47, BQ-48, BQ-49 (2026-09-15).\nOptions:    (a) approval as a verification type  (b) a separate approvals table\nChosen:     (b)\nWhy:        The business defined approval and verification as different things; a separate table keeps the\n            verification queue, SLA and trust points free of listing approvals.\nTrade-offs: Two review queues for staff. Open details: VERIFIED rule (BQ-53), ownership transfer process\n            (BQ-56), approval criteria and resubmission (BQ-57).\nDate:       2026-09-15\n```\n\n## ADR-026 · Account types, company type, company projects\n\n```text\nDecision:   users.account_type ∈ {INDIVIDUAL, COMPANY}. organization_company_types (one or more) ∈ {EVENT_ORGANIZER, SUPPLIER,\n            VENUE, PRODUCTION, AGENCY, SERVICE_PROVIDER, OTHER} for classification only. The PRD `projects` table is\n            renamed `company_projects` (+ company_project_services, company_project_media).\nContext:    Mandatory business rules §1–§4 (2026-09-17).\nOptions:    (a) account type per business role  (b) two account types + company classification\nChosen:     (b), as mandated\nWhy:        Business roles (supplier, organizer, venue…) describe companies, not logins. Permissions stay in memberships,\n            so a company's type never silently changes what its members can do. The rename avoids confusing past work\n            (company projects) with opportunities. BQ-62 later removed PROJECT from the opportunity types.\nTrade-offs: Open details: account type meaning (BQ-60), single vs multiple company types (BQ-61).\nDate:       2026-09-17\n```\n\n## ADR-027 · Unified opportunities, applications and supplier responses\n\n```text\nDecision:   One `opportunities` table and module for JOB, CO_OP, VOLUNTEERING and SUPPLIER_REQUEST (PROJECT removed by BQ-62), with a\n            generated `audience` and a single type policy map. Individuals apply through `applications` (one status model:\n            SUBMITTED, REVIEWED, SHORTLISTED, CONTACT, ACCEPTED, REJECTED, WITHDRAWN; flexible transitions chosen by the company, BQ-67).\n            Supplier requests are visible to Company Accounts only (BQ-65); any company may respond (BQ-66). Companies respond to\n            supplier requests through `supplier_responses`. Messaging, interviews, offers, matching and surveys deferred.\nContext:    Mandatory business rules §5–§9 (2026-09-17). Replaces the PRD §10.2 type list.\nOptions:    (a) a table and screens per type  (b) unified model  (c) unified model with company applicants in applications\nChosen:     (b)\nWhy:        Reusable models, endpoints and UI components; B2B responses kept apart from individual hiring; no competing\n            status systems.\nTrade-offs: Type-specific fields live in a validated JSON / policy map until they stabilise. Open: BQ-73 (JOB details),\n            withdrawal rule (BQ-67).\nDate:       2026-09-17\n```\n\n## ADR-028 · Monetization deferred; paid visibility separate from trust\n\n```text\nDecision:   Do not build billing, subscriptions, invoices, payment gateways, wallets, commissions or entitlements now. Keep\n            their designs as a compatibility reference. Future Promotion / FeaturedListing / SponsoredContent will be a\n            separate module. Featured / Sponsored / Promoted never write verification, trust points or organic ranking,\n            and API responses expose them as separate fields from verification.\nContext:    Mandatory business rules §10–§12 (2026-09-17). Supersedes the Phase 2 billing build plan (PRD §6, §7.5).\nOptions:    (a) build billing in Phase 2 as planned  (b) defer and keep extension points\nChosen:     (b)\nWhy:        Keeps the MVP simple; module boundaries (billing/entitlements/promotions never import verification or\n            engagement writers) already keep commercial and trust concerns apart.\nTrade-offs: PRD Phase 2 commercial gate (100 paid members) must be restated; plan-based limits are not enforced.\nDate:       2026-09-17\n```\n\n## ADR-029 · Separate account security contexts\n\n```text\nDecision:   users.account_type (INDIVIDUAL | COMPANY) is chosen at registration through two separate flows and fixes\n            the security context of that login. Every non-public route declares its context and AccountContextGuard\n            rejects the other type. Company permissions come only from the company's Company Account\n            (refined by ADR-030: one Company Account per company, no roles). Individual accounts never hold company permissions;\n            ownership, employment or any other individual–company link grants nothing. Company types (one or more per\n            company) never grant permissions.\nContext:    Business decision BQ-60 and BQ-61 (2026-09-17). Changes ADR-004's assumption that one person account reaches\n            company context through memberships.\nOptions:    (a) one person account + company memberships (previous design)  (b) separate account contexts\nChosen:     (b), as decided\nWhy:        Clear separation of individual and company data, flows and permissions; no privilege inheritance through\n            ownership.\nTrade-offs: A person working for a company needs a COMPANY-type login in addition to any individual account. Open\n            details: team logins, several companies per login, same identifier for both types, type change, staff\n            accounts (BQ-68); individual ownership record (BQ-69).\nDate:       2026-09-17\n```\n\n## ADR-030 · One Company Account per company\n\n```text\nDecision:   Each company has exactly one user: its Company Account (organizations.account_user_id, unique, COMPANY accounts\n            only). That account holds every company permission for its own company; there are no company roles and no\n            delegation (organization roles and member_permission_grants removed). People who work for a company use\n            INDIVIDUAL accounts and are company members (organization_members), which grants no permissions and only\n            drives the public team section (show_on_company_profile). Ownership is set by company registration or an\n            approved claim and changed only by the admin ownership flow.\nContext:    Business decisions BQ-68, BQ-69, BQ-74 (2026-09-17). Refines ADR-029; supersedes PRD §4 company roles and\n            AUTH-05 role-scoped team invitations (inconsistency I-10).\nOptions:    (a) Company RBAC with team logins  (b) one Company Account + Individual members\nChosen:     (b), as decided\nWhy:        Simple authorization (one check: account_user_id = caller); clean separation between the company's identity\n            and the people affiliated with it.\nTrade-offs: A shared company login must be protected well (MFA recommended, per-action audit cannot distinguish people);\n            no per-employee permissions. Open: membership flow (BQ-75), same identifier for both account types, type\n            change and staff account type (BQ-68 remaining), ownership flow details (BQ-56).\nDate:       2026-09-17\n```\n\n---\n\n## Decisions intentionally deferred\n\n| Topic | When to decide | Reference |\n|---|---|---|\n| Payment gateway & e-invoicing provider | Only when monetization is requested (ADR-028) | TQ-18 |\n| Malware scanning service | Before Phase 1 launch | TQ-10 |\n| App-level document encryption | Before identity verification launch | TQ-11 |\n| PDF/XLSX generation | Phase 4 | TQ-20 |\n| Dedicated search engine | When ADR-012 targets are missed | ADR-012 |\n| Redis / shared cache | When scaling out | ADR-013, TQ-16 |\n| Analytics warehouse | When Phase 4 volume requires | TQ-19 |\n| Partner API authentication | Phase 5 | RG-19 |\n"},{"name":"domain-map","title":"Domain Map & Domain Relationship Map","keywords":"domains relationships","markdown":"# Domain Map & Domain Relationship Map\n\n> Part 1 (domains) and Part 5 (business relationships), built from the PRD.\n> Each candidate domain from the architecture brief was **checked against the PRD**. The result of that check is in §1.\n> **Mandatory business rules (2026-09-17)** in `business-rules.md` take precedence; §4 below shows the required domain separation.\n\n---\n\n## 1. Candidate domains, checked against the PRD\n\n| Candidate domain | In PRD? | Evidence | Phase | Backend module |\n|---|---|---|---|---|\n| Authentication & Identity | ✅ | AUTH-01..06, §19.1 Identity | 1 | `identity` (+ Supabase Auth) |\n| Users | ✅ | §14 `users` | 1 | `identity` |\n| Profiles | ✅ | §5.1, §14 `profiles` | 1 (basic) / 3 (professional) | `profiles`, `talent` |\n| Companies | ✅ | §7.2 ORG-01..10, §14 `organizations` | 1 | `organizations` |\n| Company Memberships | ✅ | §3, §4, AUTH-05, §14 `organization_members` | 1 | `access` |\n| Roles & Permissions | ✅ | §4 matrix, §3 staff roles | 1 | `access` |\n| Verification | ✅ | §5, §19.1, §14 `verifications` | 1 | `verification` |\n| Directory | ✅ | §7.2–7.4, §19.1 Directory | 1 | `organizations`, `taxonomy`, `search` |\n| Professionals | ✅ | §10.1, §19.1 Talent | 3 | `talent`, `search` |\n| Company projects / portfolio | ✅ | §7.3, §14 `projects` → `company_projects`, rules §4 | 1 | `projects` |\n| Services | ✅ | ORG-03, §14 `categories / services` | 1 | `taxonomy` |\n| Community / Content | ✅ (content: pages, news) · ⚠️ user-generated community content **not specified** | §13 content; §8.2 \"accepted content\", \"helpful answer\" (BQ-34) | 1 | `content` |\n| Comments / Interactions | ❌ **Not specified** | Only implied (§3 \"interaction\", §8.6 \"mutual recommendations\") | — | **Not modelled** (BQ-34, RG-06) |\n| Events | ✅ | §9.2, §14 `events` | 2 | `events` |\n| Event Registration | ✅ | §9.2, §14 `event_registrations` | 2 | `events` |\n| Attendance | ✅ | §9.2 (entry code, manual check-in, points after attendance) | 2 | `events` |\n| Opportunities (unified: JOB, CO_OP, VOLUNTEERING, SUPPLIER_REQUEST) | ✅ | §10.2, §10.3, §14 `opportunities`, rules §5 | 3 | `opportunities` |\n| Applications (individuals only) | ✅ | §14 `applications`, rules §8 | 3 | `opportunities` |\n| Supplier responses (B2B) | ✅ rules §7 | rules §7 | 3 | `opportunities` |\n| Membership (subscriptions) | ⏸ deferred (rules §11) | §7.5, §14 `membership_plans`, `subscriptions`, `entitlements` | future | `billing`, `entitlements` |\n| Points | ✅ | §8.1–8.3 | 2 | `engagement` |\n| Point Ledger | ✅ | §8.1, §14 `point_ledger` | 2 | `engagement` |\n| Levels | ✅ | §9.1 | 2 | `engagement` |\n| Badges | ✅ | §6 Phase 2, §14 `badges`, `badge_awards` | 2 | `engagement` |\n| Rewards / Benefits | Level *benefits* only (§9.1). Points are **not** a redemption currency (decision BQ-08) | §9.1 | 2 | Benefits as eligibility checks; **no rewards tables** |\n| Coupons / Redemptions | ⚠️ Coupons for **billing** only (§7.5); \"coupons & perks\" (§6 Phase 2) undefined; **no points redemption** | §7.5, §6 | 2 | `billing` (`coupons`, `coupon_redemptions`); perks BQ-08 |\n| Visibility Score | ✅ | §8.4, §8.5, §14 `visibility_snapshots` | 2 | `engagement` → `search` |\n| Notifications | ✅ | §13, §14 `notifications`, §15.2 | 1 | `notifications` |\n| Saved Items | ⚠️ Institution supplier lists and saved searches only (§12.1); user bookmarks unclear (BQ-35) | §12.1, §14 `saved_lists` | 4 | `institutional` |\n| Reports / Intelligence | ✅ | §11, §19.1 Intelligence, §14 `metric_*`, `reports` | 4 | `intelligence`, `analytics` (raw data from P1) |\n| Institutional / Buyer | ⚠️ In PRD, but **on hold**: every organization is a company (BQ-06) | §5.4, §12, §19.1 Institutional | 4 · BQ-51 | `institutional` (placeholder) |\n| Admin | ✅ | §13 | 1 | `admin` + admin controllers per module |\n| Audit Logs | ✅ | §14 `audit_logs`, §18 | 1 | `audit` |\n| **Additional domains found in the PRD** | | | | |\n| Consents & privacy | ✅ | §5.1, §14 `consents`, §18 | 1 | `identity` |\n| Taxonomy (categories, services, locations, skills) | ✅ | §14, §26 P0 | 1 | `taxonomy` |\n| Ownership claims | ✅ | §5.2, glossary | 1 | `organizations` |\n| Duplicates & merges | ✅ | ORG-09 | 1 | `organizations` |\n| Documents & media | ✅ | §14 `documents`, `company_project_media` (PRD `project_media`), §18 | 1 | `media` |\n| Search & SEO | ✅ | §7.4, §17 | 1 | `search` |\n| Moderation (abuse reports, appeals) | ✅ | §13, §8.6, §23 | 1 | `moderation` |\n| Product analytics | ✅ | §16, §15.2 | 1 | `analytics` |\n| Data import | ✅ | §22, §22.1 | 1 | `imports` |\n| Benchmarks & comparisons | ✅ | §11.1 | 4 | `intelligence` |\n| RFIs | ✅ | §5.4, §12.1, §14 `rfis` | 4 | `institutional` |\n| Observatory & partner API | ✅ (not specified) | §6 Phase 5 | 5 | future |\n\n---\n\n## 2. Domain map\n\n```text\nBACK OF HOUSE BACKEND\n│\n├── 1. IDENTITY & ACCESS ........................................ Phase 1\n│   ├── Authentication (Supabase Auth)\n│   ├── Users · Consents\n│   ├── Profiles (basic)\n│   └── Access: staff roles · organization memberships · invitations · permissions\n│\n├── 2. DIRECTORY ................................................ Phase 1\n│   ├── Taxonomy: categories · services · regions & cities · skills\n│   ├── Organizations: companies only (BQ-06) · exactly one owner each (BQ-04)\n│   │   ├── contacts · services · coverage · credentials · media\n│   │   ├── admin approval of new companies (BQ-05)\n│   │   ├── ownership claims\n│   │   └── duplicates & merges · correction suggestions\n│   ├── Projects & case studies\n│   ├── Search & SEO (public projection)\n│   └── Imports\n│\n├── 3. TRUST ..................................................... Phase 1\n│   ├── Verification cases · evidence · decisions · expiry (human decisions, BQ-48)\n│   ├── Company verification signals: registration · domain · credential · contact (BQ-47)\n│   └── Documents (private) & media (public)\n│\n├── 4. COMMUNITY ................................................ Phase 1 / 2\n│   ├── Content: pages · news (P1)\n│   └── Events: tickets · registration · waitlist · attendance · feedback (P2)\n│\n├── 5. MEMBERSHIP ............................................... Phase 2\n│   ├── Plans & features\n│   ├── Subscriptions · invoices · payments · coupons\n│   └── Entitlements\n│\n├── 6. ENGAGEMENT ............................................... Phase 2\n│   ├── Point rules & versions\n│   ├── Point ledger & balances\n│   ├── Levels · badges\n│   └── Visibility score\n│\n├── 7. TALENT ................................................... Phase 3\n│   └── Experiences (confirmed employment) · education · certifications · portfolio\n│\n├── 8. OPPORTUNITIES ............................................ Phase 3\n│   └── Opportunities · applications · controlled messaging · matching · outcomes\n│\n├── 9. INTELLIGENCE ............................................. Phase 1 (raw) / 4\n│   ├── Analytics events (P1)\n│   └── Metrics · benchmarks · comparisons · reports · exports (P4)\n│\n├── 10. INSTITUTIONAL ........................................... Phase 4 · on hold (BQ-51)\n│   └── Workspaces · supplier lists · saved searches · RFIs · access log\n│\n├── 11. OPERATIONS & GOVERNANCE ................................. Phase 1\n│   ├── Admin back office\n│   ├── Moderation: abuse reports · appeals\n│   ├── Audit logs · export logs\n│   └── Notifications (email · SMS · in-app)\n│\n└── 12. OBSERVATORY & PARTNERS .................................. Phase 5 (not designed)\n```\n\n```mermaid\nflowchart TB\n    subgraph IA[\"Identity & Access · P1\"]\n        AUTH[Authentication]\n        USR[Users · Consents]\n        PRF[Profiles]\n        ACC[Roles · Memberships · Invitations]\n    end\n    subgraph DIR[\"Directory · P1\"]\n        TAX[Taxonomy]\n        ORG[Organizations]\n        CLM[Claims · Merges]\n        PRJ[Projects]\n        SRC[Search & SEO]\n        IMP[Imports]\n    end\n    subgraph TR[\"Trust · P1\"]\n        VER[Verification]\n        DOC[Documents · Media]\n    end\n    subgraph COM[\"Community\"]\n        CNT[Content · P1]\n        EVT[Events · P2]\n    end\n    subgraph MEM[\"Membership · P2\"]\n        BIL[Plans · Subscriptions · Billing]\n        ENT[Entitlements]\n    end\n    subgraph ENG[\"Engagement · P2\"]\n        PTS[Point ledger]\n        LVL[Levels · Badges]\n        VIS[Visibility]\n    end\n    subgraph TAL[\"Talent · P3\"]\n        EXP[Experiences · Portfolio]\n    end\n    subgraph OPP[\"Opportunities · P3\"]\n        OPS[Opportunities · Applications]\n    end\n    subgraph INT[\"Intelligence · P4\"]\n        ANL[Analytics events · P1]\n        MET[Metrics · Benchmarks · Reports]\n    end\n    subgraph INS[\"Institutional · P4\"]\n        WSP[Lists · Saved searches · RFIs]\n    end\n    subgraph OPS2[\"Operations · P1\"]\n        ADM[Admin]\n        MOD[Moderation]\n        AUD[Audit]\n        NTF[Notifications]\n    end\n\n    AUTH --> USR --> PRF\n    USR --> ACC --> ORG\n    TAX --> ORG\n    ORG --> CLM\n    CLM --> VER\n    ORG --> PRJ\n    PRJ --> VER\n    PRF --> VER\n    VER --> DOC\n    ORG & PRJ & PRF --> SRC\n    IMP --> ORG\n    ORG --> BIL --> ENT\n    VER -- trust --> PTS\n    EVT -- attendance --> PTS\n    PRJ -- project score --> PTS\n    PTS --> LVL\n    PTS --> VIS --> SRC\n    ENT -. label only .-> SRC\n    PRF --> EXP\n    ORG -- confirms --> EXP\n    ORG --> OPS\n    EXP --> OPS\n    ANL --> MET\n    ORG --> MET\n    ORG --> WSP\n    SRC --> WSP\n    MET --> WSP\n    ENT --> MET\n    ENT --> EVT\n    LVL --> EVT\n```\n\n---\n\n## 3. Domain relationship map\n\n```text\nUSER ───────────────────────────────────────────────────────────── (identity)\n │\n ├── PROFILE (1:1) ─────────────── skills · cities · languages · privacy\n │        └── (P3) EXPERIENCES ──── confirmed by ──► ORGANIZATION   (grants no permissions)\n │                 EDUCATION · CERTIFICATIONS · PROFILE PROJECTS ──► PROJECT\n │\n ├── CONSENTS (append-only)\n │\n ├── STAFF ROLES ───────────────── reviewer · moderator · admin · auditor   (platform scope, MFA)\n │\n ├── VERIFICATIONS (as applicant / as subject) ──► DOCUMENTS\n │\n ├── ORGANIZATION MEMBERSHIPS (role, status, expiry) ──── delegated PERMISSION GRANTS\n │        │\n │        └── ORGANIZATION ─────────────────────────────── always a company (BQ-06) · one OWNER (BQ-04)\n │              ├── CONTACTS · SERVICES ──► TAXONOMY · COVERAGE ──► LOCATIONS · CREDENTIALS · MEDIA\n │              ├── APPROVAL REQUESTS (admin, BQ-05) — not verification (BQ-46)\n│              ├── CLAIMS ──► VERIFICATION (1:1) — grants ownership only\n │              ├── VERIFICATION SIGNALS (registration, domain, credential, contact — independent, BQ-47)\n │              ├── MERGES (source/target) · CORRECTION SUGGESTIONS\n │              ├── INVITATIONS ──► MEMBERSHIPS\n │              ├── PROJECTS ──── services · media · client disclosure ──► VERIFICATIONS\n │              ├── SEARCH DOCUMENT (public projection, 0..1)\n │              ├── (P2) SUBSCRIPTION ──► PLAN · INVOICES ──► PAYMENTS · COUPON REDEMPTIONS\n │              │         └── ENTITLEMENTS (effective features)\n │              ├── (P2) POINT LEDGER ──► POINT BALANCES · BADGES · VISIBILITY SNAPSHOTS\n │              ├── (P2) EVENTS hosted / sponsored (BQ-17)\n │              ├── (P3) OPPORTUNITIES ──► APPLICATIONS ──► MESSAGES · FEEDBACK\n │              ├── (P4) BENCHMARK SET ──► 3 COMPETITOR ORGANIZATIONS\n │              ├── (P4) METRIC FACTS · REPORTS ──► DATA EXPORTS\n │              └── (P4, buyer features, BQ-51) SAVED LISTS ──► COMPANY ORGANIZATIONS (+ internal notes)\n │                                     SAVED SEARCHES\n │                                     RFIs ──► RECIPIENT COMPANIES ──► RESPONSES\n │\n ├── (P2) EVENT REGISTRATIONS ──► EVENT ──► TICKET TYPES · SPEAKERS · SPONSORS\n │         └── ATTENDANCE (attended_at) ──► point ledger (via event) ──► FEEDBACK · CERTIFICATE\n │\n ├── (P2) POINT LEDGER ──► BALANCES ──► LEVEL ASSIGNMENTS · BADGE AWARDS · VISIBILITY SNAPSHOTS\n │\n ├── (P3) APPLICATIONS ──► OPPORTUNITY\n │\n ├── ABUSE REPORTS (reporter) · APPEALS (submitter)\n │\n ├── NOTIFICATIONS ──► DELIVERIES · PREFERENCES\n │\n └── AUDIT LOGS (as actor) · ANALYTICS EVENTS (after consent)\n```\n\n### 3.1 Relationships that must never be confused\n\n| Looks similar | Actually different | Why it matters |\n|---|---|---|\n| `organization_members` vs `experiences` | Access rights vs employment history | An ex-employee keeps their confirmed experience but loses all access |\n| `verifications` vs `point_ledger (TRUST)` | Evidence checked vs engagement value derived from it | Expiring a verification reverses trust points; points never create verification |\n| `subscriptions/entitlements` vs `badges` | Paid features vs earned recognition | The paid partner label is an entitlement, never a badge and never trust |\n| `visibility_snapshots` vs search rank | Score vs final position | A score is one signal; relevance still decides (§8.4) |\n| `saved_lists` (institution) vs a company's own data | The buyer's private notes | Notes are never visible to the listed company |\n| `reports` (analytics) vs `abuse_reports` (بلاغات) | Generated intelligence vs moderation cases | The Arabic PRD uses different words; the schema keeps them separate |\n| `organizations.status` vs `verifications.status` | Profile lifecycle vs one evidence case | A company may be VERIFIED while one credential case is REJECTED |\n| `organization_approvals` vs `verifications` | Listing approved by an admin vs evidence checked (BQ-46) | An approved company can have zero verified signals |\n| Verified professional vs member level | Verification facts vs points (BQ-07) | A member with 1,200 points may be unverified, and a verified professional may have 0 points |\n\n### 3.2 Cardinality summary\n\n| Relationship | Type |\n|---|---|\n| User — Profile | ONE-TO-ONE |\n| User ⟷ Organization (membership) | MANY-TO-MANY (`organization_members`) |\n| User ⟷ Organization (employment, P3) | MANY-TO-MANY (`experiences`) |\n| Organization — Claim — Verification | ONE-TO-MANY · ONE-TO-ONE |\n| Organization — Projects | ONE-TO-MANY |\n| Organization ⟷ Service / Location | MANY-TO-MANY |\n| Verification ⟷ Document | MANY-TO-MANY |\n| Organization/User — Point ledger | ONE-TO-MANY (exactly one subject per entry) |\n| Plan — Subscription — Invoice — Payment | ONE-TO-MANY chain |\n| User ⟷ Event (registration) | MANY-TO-MANY (`event_registrations`) |\n| Opportunity — Applications — Messages | ONE-TO-MANY chain |\n| Organization — Benchmark set | ONE-TO-ONE (optional); set ⟷ competitors MANY-TO-MANY (max 3 active) |\n| Buyer company ⟷ Company (lists, RFIs; on hold, BQ-51) | MANY-TO-MANY |\n\n---\n\n## 4. Required domain separation (business rules §15)\n\n```text\nAccount ─────────────── users + Supabase Auth · INDIVIDUAL and COMPANY = separate security contexts (BQ-60)\n  ├── Individual ───── profiles · applications · points · rewards · company memberships (no permissions)\n  └── Company account ─ exactly one per company (organizations.account_user_id) — the only company user\nCompany ─────────────── organizations\n  ├── CompanyType ───── organization_company_types (one or more; classification ≠ verification ≠ permission)\n  ├── Industry ──────── organization_industries (one or more; independent of company type; no permissions)\n  ├── Members ───────── organization_members: Individual accounts, show_on_company_profile (public display only)\n  └── CompanyProject ── company_projects (portfolio — NOT an opportunity, no applications)\nOpportunity ─────────── opportunities (JOB · CO_OP · VOLUNTEERING · SUPPLIER_REQUEST)\n  ├── Application ───── applications (individuals only, INDIVIDUAL audience)\n  └── SupplierResponse  supplier_responses (any company, SUPPLIER_REQUEST; Company Accounts only)\nVerification ────────── verifications + verified_at facts\nPoints ──────────────── point_ledger · point_balances\nReward ──────────────── rewards catalog: unlocked by points / levels, never spent (BQ-59) · e.g. Profile Highlight\nDiscovery ───────────── Companies to Watch: admin picks + activity + verification/completeness (not paid, not verification · BQ-70)\n\nFuture monetization (not implemented, must stay possible):\nSubscription · Payment ─── deferred billing design\nPromotion · FeaturedListing · SponsoredContent ─── future promotions module (no tables) · the words Featured / Promoted are reserved for it\n```\n\nClassify every new feature with the 11 questions in `business-rules.md` §16 before building it.\n"},{"name":"nest-module-map","title":"NestJS Module Map","keywords":"nestjs modules folders structure","markdown":"# NestJS Module Map\n\n> **Style:** a modular monolith (PRD §19: \"a modular application service that starts as a single organised application before being split into services\"; ADR-001).\n> Modules follow the **logical units in PRD §19.1** (Identity, Directory, Verification, Membership, Engagement, Community, Talent, Opportunities, Intelligence, Institutional, Admin, Notifications). Where a unit contains several independent concepts with different lifecycles, it is split further (e.g. Directory → taxonomy, organizations, projects, search).\n> Dependency rules and the graph: `module-dependency-map.md`.\n> **Mandatory business rules:** `business-rules.md` (2026-09-17). ⏸ = designed but deferred; not built unless explicitly requested.\n\n---\n\n## 1. PRD logical units → NestJS modules\n\n| PRD §19.1 unit | Responsibility (PRD) | NestJS modules | Phase |\n|---|---|---|---|\n| Identity | Users, sessions, permissions | `identity`, `access`, `profiles` | 1 |\n| Directory | Companies, classifications, projects, search | `taxonomy`, `organizations`, `projects`, `search`, `imports` | 1 |\n| Verification | Requests, evidence, reviews | `verification`, `media` (documents) | 1 |\n| Membership | Plans, subscriptions, entitlements | `billing`, `entitlements` ⏸ deferred future monetization (rules §11) | — |\n| Engagement | Points, badges, visibility | `engagement` | 2 |\n| Community | Events and content | `events` (P2), `content` (P1) | 1–2 |\n| Talent | Professionals, employment relationships | `talent` | 3 |\n| Opportunities | Opportunities, applications, matching | `opportunities` | 3 |\n| Intelligence | Metrics, comparison, reports | `intelligence`, `analytics` (raw events from P1) | 1 / 4 |\n| Institutional | Entity workspaces, lists, RFIs | `institutional` (on hold: every organization is a company, BQ-06 → BQ-51) | 4 |\n| Admin | Administration, audit, settings | `admin`, `audit`, `moderation` | 1 |\n| Notifications | Email, messages, notifications | `notifications` | 1 |\n\n---\n\n## 2. Source tree\n\n```text\nbackofhousebackend/\n├── prisma/\n│   ├── schema/                         # multi-file Prisma schema, one file per module\n│   │   ├── _base.prisma                # generator, datasource, shared enums\n│   │   ├── identity.prisma\n│   │   ├── access.prisma\n│   │   ├── organizations.prisma\n│   │   └── ...\n│   ├── migrations/                     # Prisma Migrate (+ hand-written SQL for CHECK, partial indexes, RLS, triggers)\n│   └── seed/                           # taxonomy, levels, point rules, first admin\n├── supabase/                           # Supabase CLI config for LOCAL dev only (auth settings, SMS hook, storage buckets)\n├── src/\n│   ├── main.ts\n│   ├── app.module.ts\n│   ├── worker.ts                       # second entrypoint: outbox dispatcher + jobs (same codebase)\n│   │\n│   ├── config/                         # typed, validated env config (fails fast at boot)\n│   │   ├── app.config.ts\n│   │   ├── database.config.ts\n│   │   ├── supabase.config.ts\n│   │   └── env.schema.ts\n│   │\n│   ├── common/                         # framework-level, no business rules\n│   │   ├── decorators/                 # @Public @RequirePermission @RequireEntitlement @CurrentActor @AllowIncompleteOnboarding @AuditAction\n│   │   ├── guards/                     # guard ORDER is set in app.module (see auth-architecture §2.3)\n│   │   ├── filters/                    # global exception → { code, message, trace_id, errors }\n│   │   ├── interceptors/               # request-id, logging, response envelope\n│   │   ├── pipes/                      # ValidationPipe (422), ParseUuid\n│   │   ├── errors/                     # DomainError base + error code registry\n│   │   ├── pagination/                 # cursor encode/decode, Page\u003cT>\n│   │   ├── i18n/                       # LocalizedText type, locale resolution\n│   │   ├── text/                       # Arabic normalisation (alef/hamza/ta marbuta/tashkeel), slugify\n│   │   └── context/                    # RequestContext (AsyncLocalStorage): requestId, actor, org\n│   │\n│   ├── platform/                       # technical infrastructure modules (no business rules)\n│   │   ├── database/                   # PrismaService, TransactionRunner (tx propagation via ALS)\n│   │   ├── supabase/                   # JWKS verifier, Supabase admin client (auth + storage)\n│   │   ├── storage/                    # StoragePort + SupabaseStorageAdapter (signed URLs, buckets)\n│   │   ├── messaging/                  # EmailPort, SmsPort + provider adapters\n│   │   ├── outbox/                     # OutboxWriter (in-tx), OutboxDispatcher (worker), @OnDomainEvent\n│   │   ├── jobs/                       # pg-boss wrapper, @Job handlers, cron schedules\n│   │   ├── idempotency/                # Idempotency-Key interceptor (Phase 2)\n│   │   ├── observability/              # pino logger with redaction, health checks, metrics\n│   │   └── rate-limit/                 # throttler config\n│   │\n│   └── modules/                        # business domains\n│       ├── identity/\n│       ├── access/\n│       ├── profiles/\n│       ├── taxonomy/\n│       ├── media/\n│       ├── organizations/\n│       ├── projects/\n│       ├── verification/\n│       ├── search/\n│       ├── content/\n│       ├── moderation/\n│       ├── notifications/\n│       ├── audit/\n│       ├── analytics/\n│       ├── imports/\n│       ├── admin/\n│       ├── entitlements/               # ⏸ deferred — future monetization (rules §11)\n│       ├── billing/                    # ⏸ deferred — future monetization (rules §11)\n│       ├── engagement/                 # Phase 2\n│       ├── events/                     # Phase 2\n│       ├── talent/                     # Phase 3\n│       ├── opportunities/              # Phase 3\n│       ├── intelligence/               # Phase 4\n│       └── institutional/              # Phase 4\n│\n└── test/\n    ├── e2e/                            # critical journeys (§20.2)\n    ├── authz/                          # permission matrix: positive + NEGATIVE tests (§20.1)\n    └── factories/\n```\n\n### 2.1 Internal layout of a module (example: `organizations`)\n\n```text\nmodules/organizations/\n├── organizations.module.ts\n├── index.ts                        # PUBLIC API: only what other modules may import\n├── controllers/\n│   ├── public-companies.controller.ts      # /companies (public read)\n│   ├── organizations.controller.ts         # /organizations/:organizationId\n│   ├── organization-claims.controller.ts   # /companies/:id/claims, /me/claims\n│   └── admin-organizations.controller.ts   # /admin/organizations\n├── services/                       # application services: use cases + transactions\n│   ├── organizations.service.ts\n│   ├── organization-claims.service.ts\n│   ├── organization-merges.service.ts\n│   └── organizations.query.ts      # read-only service exported to other modules\n├── domain/                         # pure logic, no Nest or Prisma imports → unit-tested\n│   ├── organization-status.ts      # derive status from facts (ADR-018)\n│   ├── completion-score.ts\n│   └── duplicate-matching.ts\n├── policies/                       # resource-level authorization rules\n├── repositories/                   # Prisma access; every tenant query takes organizationId\n├── dto/                            # request/response DTOs (class-validator)\n├── events/                         # event names + payload types this module EMITS\n├── handlers/                       # subscribers for events this module CONSUMES\n│   └── claim-verification.handler.ts   # implements VerificationSubjectHandler\n└── __tests__/\n```\n\n**Module rules**\n1. Other modules import **only from `index.ts`**, which exports a module's query services, ports and event types. Enforced by an ESLint `no-restricted-imports` / dependency-cruiser rule.\n2. **A module writes only to its own tables** (table ownership in `database-entities.md`).\n3. Reads of another module's data go through that module's exported **query service**. One pragmatic exception: Prisma relation `include`s of **identity columns** (`id`, `type`, `status`, `slug`, names) of another module's table are allowed for joins (see `module-dependency-map.md` §3).\n4. Side effects in another module happen through **domain events** (outbox) or a **registered port** (dependency inversion). A direct call to a mutating service is allowed only along a declared dependency edge.\n5. `domain/` has no framework imports.\n\n---\n\n## 3. Platform modules\n\n| Module | Responsibility | Used by | External integration |\n|---|---|---|---|\n| `config` | Load and validate env (zod). Typed config namespaces | all | — |\n| `database` | `PrismaService`; `TransactionRunner.run(fn)` that propagates the transaction through AsyncLocalStorage, so audit and outbox writes join the caller's transaction | all domain modules | Supabase Postgres (Supavisor) |\n| `supabase` | JWT verification via JWKS; Supabase admin client | identity, media/storage | Supabase Auth, Supabase Storage |\n| `storage` | `StoragePort`: signed upload URLs, move between buckets, signed download URLs | media | Supabase Storage |\n| `messaging` | `EmailPort`, `SmsPort` | notifications | Email provider, Saudi SMS provider (§15.2) |\n| `outbox` | `OutboxWriter.emit(event)` in the transaction; `OutboxDispatcher` (worker) delivers to `@OnDomainEvent` handlers with retries | all domain modules | — |\n| `jobs` | pg-boss queues + cron (expiry, staleness, decay, renewals, reconciliation) | many | — |\n| `idempotency` | `Idempotency-Key` header support (§15.1) | billing, events, engagement admin | — |\n| `observability` | Structured logs with **secret and PII redaction** (§28), health endpoints, metrics, trace id | all | Monitoring provider (TQ-09) |\n| `rate-limit` | Throttling per IP, user and route class | global | — |\n\n---\n\n## 4. Domain modules\n\nEach entry lists: **responsibility · entities owned · controllers · services · data access · dependencies · events emitted · events consumed · external integrations.**\n\n### 4.1 `identity`: Phase 1\n\n| Aspect | Detail |\n|---|---|\n| Responsibility | App-side identity: user record, **account type and security context** (INDIVIDUAL / COMPANY, BQ-60), consents, account state, session revocation. Provides `AccountContextGuard`. Authentication is done by Supabase (ADR-003) |\n| Entities owned | `users`, `consents` |\n| Controllers | `MeController` (`/me`, `/me/consents`, `/me/sessions`), `AdminUsersController` (`/admin/users`) |\n| Services | `UsersService` (upsert from token, `markOnboarded(tx)`, suspend/reinstate), `ConsentsService` (`record(tx, …)`), `SessionsService` (revoke through the Supabase admin API) |\n| Guards provided | `AuthGuard` (JWKS verify + `session_id` check), `UserStateGuard` |\n| Data access | `UsersRepository`, `ConsentsRepository` |\n| Depends on | platform: database, supabase, outbox · `audit` |\n| Emits | `user.registered`, `user.onboarding.completed`, `user.suspended`, `user.reinstated`, `user.sessions.revoked`, `consent.changed` |\n| Consumes | — |\n| External | Supabase Auth (admin API, JWKS) |\n\n### 4.2 `access`: Phase 1\n\n| Aspect | Detail |\n|---|---|\n| Responsibility | Authorization: the permission catalog, platform staff roles, `CompanyAccountGuard` (the company's single Company Account, BQ-68), **Individual company memberships** (affiliation only, public team visibility, BQ-64), invitations (candidate flow, BQ-75). Never grants company permissions from memberships (BQ-60) |\n| Entities owned | `user_platform_roles`, `organization_members`, `invitations` |\n| Controllers | `OrganizationMembersController` (`/organizations/:organizationId/members`), `InvitationsController` (`/organizations/:organizationId/invitations`, `/invitations/:token/accept`), `MyCompanyController` (`/me/company`, `/me/company-memberships`), `AdminStaffRolesController` |\n| Services | `AccessService` (resolve permissions; request-scoped cache), `CompanyAccountGuard`, `MembershipsService` (Individual memberships, public team visibility), `InvitationsService`, `StaffRolesService`, `PermissionCatalog` (code) |\n| Guards provided | `AssuranceGuard` (aal2), `PermissionGuard` |\n| Data access | `MembershipsRepository` (joins `organizations.status`, an allowed identity-column read; company access via `account_user_id`, BQ-68), `InvitationsRepository`, `StaffRolesRepository` |\n| Depends on | platform · `identity` (user lookup for invitation matching) · `audit` |\n| Emits | `invitation.created`, `invitation.accepted`, `invitation.revoked`, `membership.created`, `membership.role_changed`, `membership.removed`, `membership.expired`, `organization.owner_granted`, `staff_role.granted`, `staff_role.revoked` |\n| Consumes | `user.suspended` (suspend memberships? **no**, access is blocked by UserStateGuard; recorded only) |\n| Scheduled jobs | Expire memberships and invitations (§12.3) |\n| External | — |\n\n### 4.3 `profiles`: Phase 1\n\n| Aspect | Detail |\n|---|---|\n| Responsibility | **Individual account** profile: name, headline, skills, cities, languages, privacy, completion score (§5.1). Hosts the registration use cases for both flows (`RegistrationService`: individual → profile; company → delegates company creation to `organizations`)* |\n| Entities owned | `profiles`, `profile_skills`, `profile_locations` |\n| Controllers | `RegistrationController` (`POST /registration/individual`, `POST /registration/company`), `MyProfileController` (`/me/profile`), `PublicProfilesController` (`/professionals/:slug`, **Phase 3**) |\n| Services | `OnboardingService` (one transaction: `identity.UsersService.markOnboarded` + `identity.ConsentsService.record` + create profile + audit + outbox), `ProfilesService`, `ProfileCompletionCalculator` (domain), `ProfilesQuery` (exported) |\n| Depends on | platform · `identity` · `taxonomy` · `media` · `audit` |\n| Emits | `profile.updated`, `profile.completion_changed`, `profile.visibility_changed` |\n| Consumes | `user.suspended` (hide from search) |\n| Note | Onboarding lives here, not in `identity`, because it creates a profile. `profiles → identity` is the only allowed direction (`identity` must never import `profiles`) |\n\n\\* `profiles` imports `organizations` only for the company registration flow; if this creates a dependency cycle, the company flow moves to `organizations` (which already depends on lower layers). Decide at implementation.\n\n### 4.4 `taxonomy`: Phase 1\n\n| Aspect | Detail |\n|---|---|\n| Responsibility | Categories tree, services, regions and cities, skills, **industries** (BQ-63). Seeded before development (§26 P0) |\n| Entities owned | `categories`, `services`, `locations`, `skills` |\n| Controllers | `TaxonomyController` (`/categories`, `/services`, `/locations`, `/skills`: public), `AdminTaxonomyController` |\n| Services | `CategoriesService`, `ServicesService`, `LocationsService`, `SkillsService`, `TaxonomyQuery` (exported, cached in memory per instance with a short time-to-live) |\n| Depends on | platform · `audit` |\n| Emits | `taxonomy.changed` (search reindex) |\n| Consumes | — |\n| External | Maps/addresses (§15.2 Phase 1–2), optional |\n\n### 4.5 `media`: Phase 1\n\n| Aspect | Detail |\n|---|---|\n| Responsibility | Upload lifecycle for public media and private documents: signed upload, quarantine, scan, hashing, signed download URLs with audit (§18) |\n| Entities owned | `media_assets`, `documents` |\n| Controllers | `UploadsController` (`POST /uploads`, `POST /uploads/:id/complete`), `DocumentAccessController` (`GET /documents/:id/access-url`) |\n| Services | `UploadsService`, `MediaService`, `DocumentsService` (access check through registered `DocumentAccessPolicy` ports), `FileScanJob`, `PerceptualHashJob` |\n| Depends on | platform: storage, jobs · `audit` |\n| Emits | `media.ready`, `media.rejected`, `document.accessed` |\n| Consumes | — |\n| External | Supabase Storage; malware scanner (TQ-10) |\n\n### 4.6 `organizations`: Phase 1\n\n| Aspect | Detail |\n|---|---|\n| Responsibility | Company records — every organization is a company (BQ-06), classified by `company_type` (rules §2, never a permission source) — (ORG-01..10), claims (§5.2), creation by the owner with duplicate check (§5.3, BQ-05), **admin approval** (BQ-05, separate from verification, BQ-46), independent **verification signals** (BQ-47), ownership transfer (BQ-56), merges (ORG-09), correction suggestions (§4), status derivation (ADR-018), public company read model |\n| Entities owned | `organizations`, `organization_contacts`, `organization_services`, `organization_coverage`, `organization_credentials`, `organization_media`, `organization_claims`, `organization_approvals`, `organization_merges`, `correction_suggestions` |\n| Controllers | `PublicCompaniesController` (`/companies/:slug`), `OrganizationsController`, `OrganizationClaimsController`, `CorrectionSuggestionsController`, `OrganizationApprovalsController` (`/organizations/:organizationId/approval-requests`), `AdminOrganizationApprovalsController`, `AdminOrganizationsController` (suspend, archive, merges, duplicates, owner transfer) |\n| Services | `OrganizationsService`, `OrganizationApprovalsService` (T-29), `OwnershipTransferService` (T-30), `OrganizationClaimsService`, `DuplicateDetectionService`, `OrganizationMergesService`, `OrganizationStatusService`, `CredentialsService`, `OrganizationsQuery` (exported) |\n| Handlers | `ClaimVerificationHandler` (ownership only), `RegistrationSignalHandler`, `DomainSignalHandler`, `CredentialSignalHandler`, `ContactSignalHandler` (implement `VerificationSubjectHandler`, registered with `verification`) |\n| Depends on | platform · `access` (grant ownership) · `taxonomy` · `media` · `verification` (open cases, register handlers) · `audit` |\n| Emits | `organization.created`, `organization.updated`, `organization.status_changed`, `organization.claim.submitted`, `organization.claim.approved`, `organization.claim.rejected`, `organization.approval.submitted`, `organization.approved`, `organization.approval.changes_requested`, `organization.approval.rejected`, `organization.ownership.transferred`, `organization.verification_signal.approved`, `organization.verification_signal.expired`, `organization.verified`, `organization.merged`, `organization.credential.expiring`, `organization.needs_update` |\n| Consumes | `media.rejected` (clear logo/cover) |\n| Scheduled jobs | Credential expiry alerts, staleness check (ORG-08) |\n| External | — |\n\n### 4.7 `projects` (Company Projects / portfolio): Phase 1\n\n| Aspect | Detail |\n|---|---|\n| Responsibility | A company's **past work** — portfolio and case studies (§7.3, business rules §4). Not an Opportunity, not a Job; no dependency on `opportunities`. Client name optional. Mandatory and quality fields, client disclosure, review workflow, completion score and project points score (≤ 50), fingerprint |\n| Entities owned | `company_projects`, `company_project_services`, `company_project_media` |\n| Controllers | `OrganizationProjectsController` (`/organizations/:organizationId/projects`), `PublicProjectsController` (`/companies/:slug/projects`, `/companies/:slug/projects/:projectId`), `AdminProjectsController` (review queue) |\n| Services | `ProjectsService`, `ProjectReviewService`, `ProjectScoreCalculator` (domain), `ProjectsQuery` (exported) |\n| Handlers | `ProjectVerificationHandler`, `ProjectClientVerificationHandler` |\n| Depends on | platform · `organizations` (query: org exists, status) · `taxonomy` · `media` · `verification` · `audit` |\n| Emits | `project.submitted`, `project.published`, `project.changes_requested`, `project.rejected`, `project.archived`, `project.score_changed` |\n| Consumes | `organization.status_changed` (hide projects of suspended or archived organizations from public) |\n| Ports implemented | `OrganizationMergeParticipant`: moves its own `company_projects` rows to the target organization **inside** the merge transaction (T-03). The port is defined by `organizations` and registered by `projects`, so `organizations` never imports `projects` |\n\n### 4.8 `verification`: Phase 1\n\n| Aspect | Detail |\n|---|---|\n| Responsibility | Generic verification engine: cases, evidence, reviewer queue with SLA, decisions and history, expiry. Decisions are always made by a `VERIFICATION_REVIEWER` or `SYSTEM_ADMIN` in Phase 1 (BQ-48). Company approval is **not** handled here (BQ-46). **Knows nothing about subjects**: subject modules register handlers |\n| Entities owned | `verifications`, `verification_documents`, `verification_decisions` |\n| Controllers | `MyVerificationsController` (`/me/verifications`, applicant actions), `OrganizationVerificationsController` (`/organizations/:organizationId/verifications`), `AdminVerificationsController` (queue, assign, approve, request-info, reject) |\n| Services | `VerificationsService` (open, attach, submit, respond), `ReviewService` (decide, runs the handler **inside the transaction**), `VerificationSubjectRegistry`, `VerificationExpiryJob` |\n| Ports exported | `VerificationSubjectHandler { type; onApproved(tx, case); onRejected(tx, case); onExpired(tx, case); canView(actor, case) }` |\n| Depends on | platform · `media` (documents) · `access` (conflict-of-interest: is the reviewer a member of the subject organization?) · `audit` |\n| Emits | `verification.submitted`, `verification.info_requested`, `verification.approved`, `verification.rejected`, `verification.expired` |\n| Consumes | — |\n\n### 4.9 `search`: Phase 1\n\n| Aspect | Detail |\n|---|---|\n| Responsibility | Public directory search (§7.4): public-only projection, Arabic/English normalisation, filters, default sort by relevance + visibility, SEO data (sitemaps) |\n| Entities owned | `search_documents` |\n| Controllers | `CompanySearchController` (`GET /companies`), `ProfessionalSearchController` (`GET /professionals`, Phase 3), `SeoController` (`GET /seo/sitemap-entries`) |\n| Services | `SearchIndexer` (build projection), `CompanySearchService`, `SearchQueryBuilder` |\n| Depends on | platform · `organizations` (query) · `projects` (query) · `profiles` (query) · `taxonomy` · `analytics` (log `search_performed`, zero results) |\n| Emits | — |\n| Consumes | `organization.*`, `project.published/archived`, `profile.updated/visibility_changed`, `taxonomy.changed`, `visibility.recomputed` (P2), `entitlements.changed` (P2, sponsored label) |\n| External | — (a dedicated search engine is deferred, ADR-012) |\n\n### 4.10 `content`: Phase 1\n\n| Aspect | Detail |\n|---|---|\n| Responsibility | Pages and news, bilingual, SEO (§13) |\n| Entities owned | `content_items` |\n| Controllers | `PublicContentController` (`/news`, `/news/:slug`, `/pages/:slug`), `AdminContentController` |\n| Services | `ContentService` |\n| Depends on | platform · `media` · `audit` |\n| Emits | `content.published` |\n| Consumes | — |\n\n### 4.11 `moderation`: Phase 1\n\n| Aspect | Detail |\n|---|---|\n| Responsibility | Abuse reports (§13, §23) and appeals (§8.6, §13) |\n| Entities owned | `abuse_reports`, `appeals` |\n| Controllers | `AbuseReportsController` (`POST /abuse-reports`), `AppealsController` (`POST /appeals`, `/me/appeals`), `AdminModerationController` |\n| Services | `AbuseReportsService`, `AppealsService` |\n| Depends on | platform · `organizations` / `projects` / `profiles` / `content` queries (target existence) · `verification` (decision lookup) · `audit` |\n| Emits | `abuse_report.created`, `abuse_report.resolved`, `appeal.submitted`, `appeal.upheld`, `appeal.denied` |\n| Consumes | — |\n\nCorrective actions after an upheld appeal (e.g. a point reversal, lifting a suspension) are carried out **by the owning module**, either by consuming `appeal.upheld` or through an admin endpoint. `moderation` never writes other modules' tables.\n\n### 4.12 `notifications`: Phase 1\n\n| Aspect | Detail |\n|---|---|\n| Responsibility | In-app notifications, email/SMS delivery, preferences, bilingual templates |\n| Entities owned | `notifications`, `notification_deliveries`, `notification_preferences` |\n| Controllers | `MyNotificationsController` (`/me
