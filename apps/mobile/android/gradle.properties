org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Compile Kotlin inside the Gradle daemon. The separate Kotlin daemon cannot
# reconnect on machines whose Windows format uses Arabic-Indic digits: it
# names its connection files with localized numbers and fails to parse them.
kotlin.compiler.execution.strategy=in-process
# The project (D:) and the pub cache (C:) are on different drives; Kotlin's
# incremental caches cannot relate the two and fail to close.
kotlin.incremental=false
# file_picker 10 compiles Kotlin for JVM 1.8 while its Java targets 11. It
# stays on 10.x because 11+ needs AGP built-in Kotlin, which the plugins
# that still apply the Kotlin Gradle plugin rule out (builtInKotlin=false).
kotlin.jvm.target.validation.mode=warning
