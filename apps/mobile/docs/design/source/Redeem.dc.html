<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reward redeemed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div dir="{{dir}}" lang="{{lang}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: {{c.bg}}; color: {{c.ink}}; font-family: {{body}}; padding-top: 40px">
<header style="display: flex; align-items: center; gap: 12px; padding-inline: 16px; height: 56px; box-sizing: border-box; flex-shrink: 0">
<button type="button" aria-label="{{s.back}}" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid {{c.line}}; background: {{c.card}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="transform: {{flip}}"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg></button>
<h1 style="margin: 0; font-family: {{disp}}; font-size: 20px; font-weight: 700; letter-spacing: {{tt}}">{{s.title}}</h1>
</header>
<main style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; padding: 8px 20px 0; gap: 16px">
<article style="background: {{c.card}}; border: 1px solid {{c.line}}; border-radius: 22px; overflow: hidden; box-shadow: {{c.shadow}}">
<div style="position: relative; height: 130px">
<img src="/_blob/d3734488339e6faea93355cd72580712" alt="" style="width: 100%; height: 100%; display: block; object-fit: cover">
<span style="position: absolute; top: 12px; inset-inline-start: 12px; display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 14px; background: {{c.okSolid}}; color: #ffffff; font-size: 11px; font-weight: 800"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>{{s.redeemed}}</span>
</div>
<div style="padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 10px; font-weight: 800; letter-spacing: {{tag}}; color: {{c.vt}}">{{s.cat}}</span>
<span style="font-family: {{disp}}; font-size: 20px; font-weight: 700">{{s.name}}</span>
<span style="font-size: 12px; color: {{c.muted}}">{{s.detail}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 11px; font-weight: 700; color: {{c.muted}}">{{s.codeL}}</span>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 8px 8px 16px; padding-inline: 16px 8px; border-radius: 16px; border: 2px dashed #6437fa; background: {{c.soft}}">
<span dir="ltr" style="font-family: Poppins, sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 2px; color: {{c.vt}}">BOH-7K2Q-94XM</span>
<button type="button" style="height: 38px; padding: 0 14px; border: 0; border-radius: 19px; background: #6437fa; color: #ffffff; font-family: inherit; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>{{s.copy}}</button>
</div>
<span style="font-size: 11px; color: {{c.muted}}">{{s.valid}}</span>
</div>
</div>
</article>
<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-family: {{disp}}; font-size: 15px; font-weight: 700">{{s.howH}}</h2>
<sc-for list="{{steps}}" as="st" hint-placeholder-count="3">
<div style="display: flex; gap: 12px; align-items: center">
<span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 14px; background: {{c.soft}}; color: {{c.vt}}; font-family: Poppins, sans-serif; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{st.n}}</span>
<span style="font-size: 13px; line-height: 19px">{{st.t}}</span>
</div>
</sc-for>
</section>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-radius: 18px; background: {{c.card}}; border: 1px solid {{c.line}}">
<span style="font-size: 12px; color: {{c.muted}}">{{s.balL}}</span>
<span style="display: flex; align-items: baseline; gap: 6px"><span style="font-size: 12px; color: {{c.muted}}; text-decoration: line-through">1,250</span><span style="font-family: Poppins, sans-serif; font-size: 18px; font-weight: 700; color: {{c.vt}}">450</span><span style="font-size: 11px; color: {{c.muted}}">{{s.pts}}</span></span>
</div>
</main>
<div style="flex-shrink: 0; padding: 12px 20px 34px">
<button type="button" style="width: 100%; height: 52px; border: 0; border-radius: 26px; background: #6437fa; color: #ffffff; font-family: inherit; font-size: 15px; font-weight: 700; box-shadow: 0 10px 26px rgba(100,55,250,0.4); cursor: pointer">{{s.done}}</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light"},"locale":{"editor":"enum","options":["en","ar"],"default":"en"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.mode === 'dark';
    const ar = this.props.locale === 'ar';
    const P = {
      light: { bg: '#f6f4fc', card: '#ffffff', line: '#e4dff3', ink: '#15122e', muted: '#5e5a78', vt: '#5424e0', soft: '#efeafe', okSolid: '#0d6446', shadow: '0 8px 30px rgba(40,20,120,0.06)' },
      dark: { bg: '#05050d', card: '#0b0c1d', line: '#1d1f3d', ink: '#f4f3ff', muted: '#a9a8c3', vt: '#a78bfa', soft: '#141233', okSolid: '#0f5a45', shadow: '0 8px 30px rgba(0,0,0,0.35)' }
    };
    const c = dark ? P.dark : P.light;
    const S = {
      en: {
        back: 'Back', title: 'Your reward', redeemed: 'Redeemed', cat: 'LEARN', name: 'Workshop seat', detail: 'Redeemed for 800 pts · Build Your First AI Product',
        codeL: 'Your code', copy: 'Copy', valid: 'Valid until Oct 31, 2026 · One use',
        howH: 'How to use it', steps: ['Open the workshop page in Discover', 'Tap Register and choose “Use a reward code”', 'Paste your code to confirm your seat'],
        balL: 'Points balance', pts: 'pts', done: 'Done'
      },
      ar: {
        back: 'رجوع', title: 'مكافأتك', redeemed: 'تم الاستبدال', cat: 'تعلّم', name: 'مقعد في ورشة عمل', detail: 'استُبدلت بـ 800 نقطة · ابنِ أول منتج ذكاء اصطناعي',
        codeL: 'رمزك', copy: 'نسخ', valid: 'صالح حتى 31 أكتوبر 2026 · استخدام واحد',
        howH: 'طريقة الاستخدام', steps: ['افتح صفحة الورشة من اكتشف', 'اضغط سجّل واختر «استخدام رمز مكافأة»', 'الصق الرمز لتأكيد مقعدك'],
        balL: 'رصيد النقاط', pts: 'نقطة', done: 'تم'
      }
    };
    const s = ar ? S.ar : S.en;
    const steps = s.steps.map((t, i) => ({ n: String(i + 1), t }));
    return {
      c, s, steps,
      dir: ar ? 'rtl' : 'ltr', lang: ar ? 'ar' : 'en',
      disp: ar ? '"IBM Plex Sans Arabic", sans-serif' : 'Poppins, sans-serif',
      body: ar ? '"IBM Plex Sans Arabic", Poppins, sans-serif' : 'Poppins, "IBM Plex Sans Arabic", sans-serif',
      tt: ar ? '0' : '-0.5px', tag: ar ? '0' : '1px', flip: ar ? 'scaleX(-1)' : 'none'
    };
  }
}
</script>
</body>
</html>
