<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Event details</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div dir="{{dir}}" lang="{{lang}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; overflow: hidden; background: {{c.bg}}; color: {{c.ink}}; font-family: {{body}}">
<div style="position: relative; height: 290px; flex-shrink: 0">
<img src="/_blob/fe99293a7d78b5eec8cf75c718f91260" alt="{{s.title}}" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: cover">
<div style="position: absolute; left: 0; right: 0; top: 0; height: 130px; background: linear-gradient(to bottom, rgba(5,5,13,0.55) 0%, rgba(5,5,13,0) 100%)"></div>
<div style="position: absolute; top: 48px; inset-inline: 16px; display: flex; justify-content: space-between">
<button type="button" aria-label="{{s.back}}" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.25); background: rgba(5,5,13,0.45); color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="transform: {{flip}}"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg></button>
<div style="display: flex; gap: 8px">
<button type="button" aria-label="{{s.share}}" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.25); background: rgba(5,5,13,0.45); color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5M4 14v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"></path></svg></button>
<button type="button" aria-label="{{s.save}}" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.25); background: rgba(5,5,13,0.45); color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"></path></svg></button>
</div>
</div>
</div>
<main style="flex-grow: 1; overflow: hidden; margin-top: -28px; position: relative; border-radius: 28px 28px 0 0; background: {{c.bg}}; padding: 20px 20px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; gap: 8px"><span style="padding: 3px 8px; border-radius: 6px; background: #6437fa; color: #ffffff; font-size: 10px; font-weight: 800; letter-spacing: {{tag}}">{{s.featured}}</span><span style="padding: 3px 8px; border-radius: 6px; background: {{c.tagBg}}; color: {{c.tagFg}}; font-size: 10px; font-weight: 800; letter-spacing: {{tag}}">{{s.type}}</span></div>
<h1 style="margin: 0; font-family: {{disp}}; font-size: 24px; line-height: 30px; font-weight: 700; letter-spacing: {{tt}}">{{s.title}}</h1>
<span style="font-size: 13px; color: {{c.vt}}; font-weight: 600">{{s.topics}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; background: {{c.card}}; border: 1px solid {{c.line}}; border-radius: 20px; box-shadow: {{c.shadow}}">
<sc-for list="{{facts}}" as="f" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 12px; background: {{c.soft}}; color: {{c.vt}}; display: flex; align-items: center; justify-content: center">
<sc-if value="{{f.isDate}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></sc-if>
<sc-if value="{{f.isPlace}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg></sc-if>
<sc-if value="{{f.isPeople}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c1-3.5 3.5-5 6.5-5s5.5 1.5 6.5 5M16 4.5a3.5 3.5 0 0 1 0 7M18 15c2 .6 3.2 2.3 3.5 5"></path></svg></sc-if>
</span>
<div style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 700">{{f.main}}</span><span style="font-size: 12px; color: {{c.muted}}">{{f.sub}}</span></div>
<sc-if value="{{f.link}}" hint-placeholder-val="{{ false }}"><a href="#" style="font-size: 12px; font-weight: 700; color: {{c.vt}}; text-decoration: none; min-height: 32px; display: flex; align-items: center">{{f.link}}</a></sc-if>
</div>
</sc-for>
</div>
<div role="tablist" aria-label="{{s.sections}}" style="display: flex; padding: 4px; border-radius: 22px; background: {{c.soft}}">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" role="tab" aria-selected="{{t.sel}}" style="flex-grow: 1; flex-basis: 0; height: 36px; border: 0; border-radius: 18px; background: {{t.bg}}; color: {{t.color}}; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: {{t.shadow}}">{{t.label}}</button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column">
<span style="font-size: 12px; font-weight: 800; color: {{c.muted}}; letter-spacing: {{tag}}; padding-bottom: 6px">{{s.day}}</span>
<sc-for list="{{agenda}}" as="a" hint-placeholder-count="3">
<div style="display: flex; gap: 14px; padding: 10px 0; border-top: 1px solid {{c.line}}">
<span style="width: 48px; flex-shrink: 0; font-family: Poppins, sans-serif; font-size: 13px; font-weight: 700; color: {{c.vt}}">{{a.time}}</span>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; line-height: 19px; font-weight: 700">{{a.title}}</span><span style="font-size: 12px; color: {{c.muted}}">{{a.where}}</span></div>
</div>
</sc-for>
</div>
</main>
<div style="flex-shrink: 0; display: flex; align-items: center; gap: 14px; padding: 14px 20px 30px; background: {{c.card}}; border-top: 1px solid {{c.line}}; border-radius: 24px 24px 0 0; box-shadow: {{c.navShadow}}">
<div style="display: flex; flex-direction: column"><span style="font-size: 11px; color: {{c.muted}}; font-weight: 600">{{s.priceLabel}}</span><span style="font-family: {{disp}}; font-size: 18px; font-weight: 700">{{s.price}}</span></div>
<button type="button" style="flex-grow: 1; height: 52px; border: 0; border-radius: 26px; background: #6437fa; color: #ffffff; font-family: inherit; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 10px 26px rgba(100,55,250,0.4); cursor: pointer">{{s.register}}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform: {{flip}}"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light"},"locale":{"editor":"enum","options":["en","ar"],"default":"en"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.mode === 'dark';
    const ar = this.props.locale === 'ar';
    const P = {
      light: { bg: '#f6f4fc', card: '#ffffff', line: '#e4dff3', ink: '#15122e', muted: '#5e5a78', vt: '#5424e0', soft: '#efeafe', tagBg: '#ece6ff', tagFg: '#4a22c9', shadow: '0 8px 30px rgba(40,20,120,0.06)', navShadow: '0 -10px 30px rgba(40,20,120,0.07)' },
      dark: { bg: '#05050d', card: '#0b0c1d', line: '#1d1f3d', ink: '#f4f3ff', muted: '#a9a8c3', vt: '#a78bfa', soft: '#141233', tagBg: '#3a1fa8', tagFg: '#ffffff', shadow: '0 8px 30px rgba(0,0,0,0.35)', navShadow: '0 -10px 30px rgba(0,0,0,0.5)' }
    };
    const c = dark ? P.dark : P.light;
    const S = {
      en: {
        back: 'Back', share: 'Share', save: 'Save event', sections: 'Event sections',
        featured: 'FEATURED', type: 'CONFERENCE', title: 'Riyadh Tech Summit 2026', topics: 'Innovation · Technology · Future',
        facts: [['date', 'Thu, Oct 15 – Sat, Oct 17', '9:00 AM – 6:00 PM', ''], ['place', 'Riyadh Front Exhibition Center', 'Riyadh', 'Map'], ['people', '5.2K+ attending', '3 people you know', '']],
        tabs: ['About', 'Agenda', 'Speakers'], day: 'DAY 1 · THU, OCT 15',
        agenda: [['09:00', 'Opening keynote', 'Main Stage'], ['10:30', 'Panel: The future of live experiences', 'Hall B'], ['13:00', 'Workshop: Event tech in practice', 'Lab 2']],
        priceLabel: 'Entry', price: 'Free', register: 'Register'
      },
      ar: {
        back: 'رجوع', share: 'مشاركة', save: 'حفظ الفعالية', sections: 'أقسام الفعالية',
        featured: 'مميّزة', type: 'مؤتمر', title: 'قمة الرياض للتقنية 2026', topics: 'ابتكار · تقنية · مستقبل',
        facts: [['date', 'الخميس 15 – السبت 17 أكتوبر', '9:00 ص – 6:00 م', ''], ['place', 'مركز واجهة الرياض للمعارض', 'الرياض', 'الخريطة'], ['people', '+5.2 ألف مشارك', '3 أشخاص تعرفهم', '']],
        tabs: ['نبذة', 'البرنامج', 'المتحدثون'], day: 'اليوم 1 · الخميس 15 أكتوبر',
        agenda: [['09:00', 'الكلمة الافتتاحية', 'المسرح الرئيسي'], ['10:30', 'جلسة: مستقبل التجارب الحية', 'القاعة B'], ['13:00', 'ورشة: تقنيات الفعاليات عمليًا', 'المعمل 2']],
        priceLabel: 'الدخول', price: 'مجاني', register: 'سجّل الآن'
      }
    };
    const s = ar ? S.ar : S.en;
    const facts = s.facts.map((f) => ({ isDate: f[0] === 'date', isPlace: f[0] === 'place', isPeople: f[0] === 'people', main: f[1], sub: f[2], link: f[3] }));
    const tabs = s.tabs.map((label, i) => ({ label, sel: i === 1 ? 'true' : 'false', bg: i === 1 ? c.card : 'transparent', color: i === 1 ? c.vt : c.muted, shadow: i === 1 ? '0 4px 12px rgba(40,20,120,0.10)' : 'none' }));
    const agenda = s.agenda.map((a) => ({ time: a[0], title: a[1], where: a[2] }));
    return {
      c, s, facts, tabs, agenda,
      dir: ar ? 'rtl' : 'ltr', lang: ar ? 'ar' : 'en',
      disp: ar ? '"IBM Plex Sans Arabic", sans-serif' : 'Poppins, sans-serif',
      body: ar ? '"IBM Plex Sans Arabic", Poppins, sans-serif' : 'Poppins, "IBM Plex Sans Arabic", sans-serif',
      tt: ar ? '0' : '-0.5px', tag: ar ? '0' : '1px', flip: ar ? 'scaleX(-1)' : 'none'
    };
  }
}
</script>
</body>
</html>
