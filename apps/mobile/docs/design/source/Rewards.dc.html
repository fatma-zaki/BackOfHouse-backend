<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rewards</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div dir="{{dir}}" lang="{{lang}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: {{c.bg}}; color: {{c.ink}}; font-family: {{body}}; padding-top: 40px">
<header style="display: flex; align-items: center; justify-content: space-between; padding-inline: 20px 12px; height: 56px; box-sizing: border-box; flex-shrink: 0">
<div style="display: flex; align-items: center; gap: 10px"><div style="width: 4px; height: 24px; background: #6437fa; transform: skewX(-18deg)"></div><h1 style="margin: 0; font-family: {{disp}}; font-size: 24px; line-height: 30px; font-weight: 700; letter-spacing: {{tt}}">{{s.title}}</h1></div>
<a href="#" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 8px; color: {{c.vt}}; text-decoration: none; font-size: 13px; font-weight: 700"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>{{s.history}}</a>
</header>
<main style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; padding: 8px 16px 24px; gap: 14px">
<section style="position: relative; overflow: hidden; flex-shrink: 0; padding: 18px; border-radius: 22px; background: #6437fa; color: #ffffff; box-shadow: 0 12px 30px rgba(100,55,250,0.35); display: flex; flex-direction: column; gap: 14px">
<div style="position: absolute; top: -40px; inset-inline-end: -30px; width: 150px; height: 150px; border-radius: 75px; border: 22px solid rgba(255,255,255,0.08)"></div>
<div style="display: flex; align-items: center; gap: 12px">
<div style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"></path></svg></div>
<div style="display: flex; flex-direction: column"><span style="font-size: 12px; font-weight: 600; opacity: 0.85">{{s.balanceLabel}}</span><span style="font-family: Poppins, sans-serif; font-size: 32px; line-height: 38px; font-weight: 700; letter-spacing: -0.5px">1,250</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="height: 6px; border-radius: 3px; background: rgba(255,255,255,0.25); position: relative; overflow: hidden"><div style="position: absolute; inset-inline-start: 0; top: 0; bottom: 0; width: 72%; border-radius: 3px; background: #ffffff"></div></div>
<div style="display: flex; justify-content: space-between; font-size: 12px"><b style="font-weight: 700">{{s.level}}</b><span style="opacity: 0.85">{{s.toNext}}</span></div>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 10px; padding: 14px; flex-shrink: 0; background: {{c.card}}; border: 1.5px solid {{c.featBorder}}; border-radius: 20px; box-shadow: {{c.shadow}}">
<div style="display: flex; gap: 12px; align-items: flex-start">
<img src="/_blob/17c4ffa8b33f8d93c5fc6d4d6e5955ea" alt="" style="width: 48px; height: 48px; display: block; object-fit: cover; border-radius: 24px; flex-shrink: 0; border: 2px solid {{c.card}}; box-shadow: 0 0 0 2px #6437fa">
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="align-self: flex-start; padding: 2px 7px; border-radius: 6px; background: {{c.soft}}; color: {{c.vt}}; font-size: 9.5px; font-weight: 800; letter-spacing: {{tag}}">{{s.hlEyebrow}}</span>
<span style="font-family: {{disp}}; font-size: 15px; line-height: 20px; font-weight: 700">{{s.hlTitle}}</span>
<span style="font-size: 12px; line-height: 17px; color: {{c.muted}}">{{s.hlBody}}</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<button type="button" style="flex-grow: 1; height: 42px; border: 0; border-radius: 21px; background: #6437fa; color: #ffffff; font-family: inherit; font-size: 13px; font-weight: 700; box-shadow: 0 8px 20px rgba(100,55,250,0.35); cursor: pointer">{{s.redeem}}</button>
</div>
<span style="font-size: 11px; line-height: 15px; color: {{c.muted}}">{{s.hlNote}}</span>
</section>
<div style="display: flex; justify-content: space-between; align-items: center; padding-inline: 4px">
<div style="display: flex; align-items: center; gap: 10px"><div style="width: 4px; height: 20px; background: #6437fa; transform: skewX(-18deg)"></div><h2 style="margin: 0; font-family: {{disp}}; font-size: 18px; line-height: 24px; font-weight: 700; letter-spacing: {{tt}}">{{s.catalog}}</h2></div>
</div>
<div style="display: flex; gap: 8px; overflow: hidden; flex-shrink: 0">
<sc-for list="{{cats}}" as="k" hint-placeholder-count="5">
<button type="button" aria-pressed="{{k.sel}}" style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid {{k.border}}; background: {{k.bg}}; color: {{k.color}}; font-family: inherit; font-size: 12px; font-weight: 700; white-space: nowrap; cursor: pointer; flex-shrink: 0">{{k.label}}</button>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{items}}" as="r" hint-placeholder-count="4">
<article style="background: {{c.card}}; border: 1px solid {{c.line}}; border-radius: 18px; overflow: hidden; box-shadow: {{c.shadow}}; display: flex; flex-direction: column">
<img src="{{r.img}}" alt="{{r.title}}" style="width: 100%; height: 62px; display: block; object-fit: cover">
<div style="padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 9.5px; font-weight: 800; letter-spacing: {{tag}}; color: {{r.tagFg}}">{{r.cat}}</span>
<span style="font-size: 13px; line-height: 17px; font-weight: 700">{{r.title}}</span>
<div style="display: flex; align-items: baseline; gap: 4px"><span style="font-family: Poppins, sans-serif; font-size: 15px; font-weight: 700; color: {{r.costColor}}">{{r.cost}}</span><span style="font-size: 11px; color: {{c.muted}}">{{s.pts}}</span></div>
</div>
</article>
</sc-for>
</div>
</main>
<nav aria-label="{{s.nav}}" style="flex-shrink: 0; height: 84px; box-sizing: border-box; padding: 8px 6px 22px; background: {{c.card}}; border-top: 1px solid {{c.line}}; border-radius: 24px 24px 0 0; box-shadow: {{c.navShadow}}; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<button type="button" aria-current="{{t.current}}" style="border: 0; background: transparent; padding: 0; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 3px; color: {{t.color}}; font-size: 11px; line-height: 14px; font-weight: {{t.weight}}; cursor: pointer">
<span style="width: 52px; height: 30px; border-radius: 15px; background: {{t.pill}}; color: {{t.icon}}; display: flex; align-items: center; justify-content: center">
<sc-if value="{{t.isHome}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg></sc-if>
<sc-if value="{{t.isDiscover}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg></sc-if>
<sc-if value="{{t.isNews}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg></sc-if>
<sc-if value="{{t.isRewards}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"></rect><path d="M5 12v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8M12 8v13M12 8c-1-3-3-5-5-4s0 4 5 4zM12 8c1-3 3-5 5-4s0 4-5 4z"></path></svg></sc-if>
<sc-if value="{{t.isProfile}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></sc-if>
</span>
<span>{{t.label}}</span>
</button>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light"},"locale":{"editor":"enum","options":["en","ar"],"default":"en"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.mode === 'dark';
    const ar = this.props.locale === 'ar';
    const P = {
      light: { bg: '#f6f4fc', card: '#ffffff', line: '#e4dff3', featBorder: '#cbbdfb', ink: '#15122e', muted: '#5e5a78', vt: '#5424e0', soft: '#efeafe', shadow: '0 8px 30px rgba(40,20,120,0.06)', navShadow: '0 -10px 30px rgba(40,20,120,0.07)',
        tags: { learn: '#4a22c9', attend: '#0d6446', career: '#80520a', comm: '#1c4aab' } },
      dark: { bg: '#05050d', card: '#0b0c1d', line: '#1d1f3d', featBorder: '#3a2d8f', ink: '#f4f3ff', muted: '#a9a8c3', vt: '#a78bfa', soft: '#141233', shadow: '0 8px 30px rgba(0,0,0,0.35)', navShadow: '0 -10px 30px rgba(0,0,0,0.5)',
        tags: { learn: '#a78bfa', attend: '#4ade80', career: '#fbbf24', comm: '#7fb0ff' } }
    };
    const c = dark ? P.dark : P.light;
    const S = {
      en: {
        title: 'Rewards', history: 'History', nav: 'Main',
        balanceLabel: 'Points to spend', level: 'Level 3', toNext: '250 pts to Level 4',
        hlEyebrow: 'PROFILE HIGHLIGHT', hlTitle: 'Get seen first in Discover', hlBody: 'Your profile tops the Professionals list for 7 days.',
        redeem: 'Redeem for 500 pts', hlNote: 'Highlight doesn’t change your verification status.',
        catalog: 'Catalog', pts: 'pts', cats: ['All', 'Learn', 'Attend', 'Career', 'Community'],
        tabs: ['Home', 'Discover', 'News', 'Rewards', 'Profile'],
        items: [
          { cat: 'LEARN', tone: 'learn', title: 'Workshop seat', cost: '800', img: '/_blob/d3734488339e6faea93355cd72580712' },
          { cat: 'ATTEND', tone: 'attend', title: 'Summit day pass', cost: '1,500', locked: true, img: '/_blob/fe99293a7d78b5eec8cf75c718f91260' },
          { cat: 'CAREER', tone: 'career', title: 'CV review session', cost: '600', img: '/_blob/612f64f6131a4c2dec0861b2ac2b577b' },
          { cat: 'COMMUNITY', tone: 'comm', title: 'Members’ meetup pass', cost: '300', img: '/_blob/f24ebc38adb28cb2e96a8856980b10e6' }
        ]
      },
      ar: {
        title: 'المكافآت', history: 'السجل', nav: 'التنقل الرئيسي',
        balanceLabel: 'نقاط متاحة للاستبدال', level: 'المستوى 3', toNext: '250 نقطة للمستوى 4',
        hlEyebrow: 'إبراز الملف', hlTitle: 'كن أول من يظهر في اكتشف', hlBody: 'يتصدّر ملفك قائمة المحترفين لمدة 7 أيام.',
        redeem: 'استبدل بـ 500 نقطة', hlNote: 'الإبراز لا يغيّر حالة التحقق من حسابك.',
        catalog: 'الكتالوج', pts: 'نقطة', cats: ['الكل', 'تعلّم', 'حضور', 'مهني', 'مجتمع'],
        tabs: ['الرئيسية', 'اكتشف', 'الأخبار', 'المكافآت', 'ملفي'],
        items: [
          { cat: 'تعلّم', tone: 'learn', title: 'مقعد في ورشة عمل', cost: '800', img: '/_blob/d3734488339e6faea93355cd72580712' },
          { cat: 'حضور', tone: 'attend', title: 'تذكرة يوم في القمة', cost: '1,500', locked: true, img: '/_blob/fe99293a7d78b5eec8cf75c718f91260' },
          { cat: 'مهني', tone: 'career', title: 'جلسة مراجعة السيرة الذاتية', cost: '600', img: '/_blob/612f64f6131a4c2dec0861b2ac2b577b' },
          { cat: 'مجتمع', tone: 'comm', title: 'دخول لقاء الأعضاء', cost: '300', img: '/_blob/f24ebc38adb28cb2e96a8856980b10e6' }
        ]
      }
    };
    const s = ar ? S.ar : S.en;
    const active = 3;
    const keys = ['isHome', 'isDiscover', 'isNews', 'isRewards', 'isProfile'];
    const tabs = s.tabs.map((label, i) => {
      const on = i === active;
      const t = { label, color: on ? c.vt : c.muted, icon: on ? (dark ? '#a78bfa' : '#6437fa') : c.muted, pill: on ? c.soft : 'transparent', weight: on ? 800 : 600, current: on ? 'page' : 'false' };
      keys.forEach((k, j) => { t[k] = i === j; });
      return t;
    });
    const cats = s.cats.map((label, i) => ({ label, sel: i === 0 ? 'true' : 'false', bg: i === 0 ? c.ink : c.card, color: i === 0 ? c.bg : c.ink, border: i === 0 ? c.ink : c.line }));
    const items = s.items.map((r) => ({ ...r, tagFg: c.tags[r.tone], costColor: r.locked ? c.muted : c.vt }));
    return {
      c, s, tabs, cats, items,
      dir: ar ? 'rtl' : 'ltr', lang: ar ? 'ar' : 'en',
      disp: ar ? '"IBM Plex Sans Arabic", sans-serif' : 'Poppins, sans-serif',
      body: ar ? '"IBM Plex Sans Arabic", Poppins, sans-serif' : 'Poppins, "IBM Plex Sans Arabic", sans-serif',
      tt: ar ? '0' : '-0.4px', tag: ar ? '0' : '1px', flip: ar ? 'scaleX(-1)' : 'none'
    };
  }
}
</script>
</body>
</html>
