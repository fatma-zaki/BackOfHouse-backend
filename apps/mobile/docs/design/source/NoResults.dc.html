<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search: no results</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div dir="{{dir}}" lang="{{lang}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: {{c.bg}}; color: {{c.ink}}; font-family: {{body}}; padding-top: 40px">
<header style="display: flex; align-items: center; gap: 10px; padding-inline: 16px; height: 64px; box-sizing: border-box; flex-shrink: 0">
<button type="button" aria-label="{{s.back}}" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid {{c.line}}; background: {{c.card}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="transform: {{flip}}"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg></button>
<label style="flex-grow: 1; height: 48px; box-sizing: border-box; padding: 0 6px 0 16px; padding-inline: 16px 6px; display: flex; align-items: center; gap: 10px; border-radius: 24px; background: {{c.card}}; border: 1.5px solid #6437fa; color: {{c.ink}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input type="search" value="{{s.q}}" aria-label="{{s.searchL}}" style="flex-grow: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 14px; color: {{c.ink}}">
<button type="button" aria-label="{{s.clear}}" style="width: 36px; height: 36px; border: 0; border-radius: 18px; background: {{c.soft}}; color: {{c.vt}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</label>
</header>
<div style="display: flex; gap: 8px; padding: 4px 16px 0; flex-shrink: 0">
<span style="height: 32px; padding: 0 12px; border-radius: 16px; background: #6437fa; color: #ffffff; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px">{{s.f1}}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></span>
<span style="height: 32px; padding: 0 12px; border-radius: 16px; background: #6437fa; color: #ffffff; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px">{{s.f2}}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></span>
</div>
<main style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 32px 80px; gap: 16px; text-align: center">
<div style="position: relative; width: 150px; height: 130px">
<div style="position: absolute; left: 14px; top: 20px; width: 84px; height: 84px; border-radius: 20px; border: 2px solid {{c.line2}}; transform: rotate(-8deg)"></div>
<div style="position: absolute; left: 40px; top: 10px; width: 84px; height: 84px; border-radius: 20px; background: {{c.soft}}; border: 2px solid {{c.line2}}"></div>
<div style="position: absolute; left: 60px; top: 36px; width: 52px; height: 52px; border-radius: 26px; border: 5px solid #6437fa; box-sizing: border-box"></div>
<div style="position: absolute; left: 104px; top: 82px; width: 28px; height: 7px; border-radius: 4px; background: #6437fa; transform: rotate(45deg); transform-origin: left center"></div>
<div style="position: absolute; left: 118px; top: 8px; width: 12px; height: 12px; background: #6437fa"></div>
</div>
<h1 style="margin: 0; font-family: {{disp}}; font-size: 21px; line-height: 28px; font-weight: 700; letter-spacing: {{tt}}">{{s.h}}</h1>
<p style="margin: 0; font-size: 13px; line-height: 20px; color: {{c.muted}}">{{s.p}}</p>
<div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 4px">
<sc-for list="{{sugs}}" as="g" hint-placeholder-count="3"><button type="button" style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid {{c.line}}; background: {{c.card}}; color: {{c.ink}}; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer">{{g}}</button></sc-for>
</div>
<button type="button" style="margin-top: 8px; height: 48px; padding: 0 24px; border: 0; border-radius: 24px; background: #6437fa; color: #ffffff; font-family: inherit; font-size: 14px; font-weight: 700; box-shadow: 0 10px 26px rgba(100,55,250,0.35); cursor: pointer">{{s.cta}}</button>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light"},"locale":{"editor":"enum","options":["en","ar"],"default":"en"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.mode === 'dark';
    const ar = this.props.locale === 'ar';
    const P = {
      light: { bg: '#f6f4fc', card: '#ffffff', line: '#e4dff3', line2: '#cbbdfb', ink: '#15122e', muted: '#5e5a78', vt: '#5424e0', soft: '#efeafe' },
      dark: { bg: '#05050d', card: '#0b0c1d', line: '#1d1f3d', line2: '#3a2d8f', ink: '#f4f3ff', muted: '#a9a8c3', vt: '#a78bfa', soft: '#141233' }
    };
    const c = dark ? P.dark : P.light;
    const S = {
      en: {
        back: 'Back', searchL: 'Search events', clear: 'Clear search', q: 'drone light show', f1: 'Jeddah', f2: 'This week',
        h: 'No events match your search', p: 'Try fewer filters or a broader word. Here are a few popular searches:',
        sugs: ['Light shows', 'Concerts', 'Riyadh'], cta: 'Clear filters'
      },
      ar: {
        back: 'رجوع', searchL: 'ابحث في الفعاليات', clear: 'مسح البحث', q: 'عرض طائرات مسيّرة', f1: 'جدة', f2: 'هذا الأسبوع',
        h: 'لا توجد فعاليات تطابق بحثك', p: 'جرّب تصفية أقل أو كلمة أعم. إليك بعض عمليات البحث الشائعة:',
        sugs: ['عروض ضوئية', 'حفلات', 'الرياض'], cta: 'مسح التصفية'
      }
    };
    const s = ar ? S.ar : S.en;
    return {
      c, s, sugs: s.sugs,
      dir: ar ? 'rtl' : 'ltr', lang: ar ? 'ar' : 'en',
      disp: ar ? '"IBM Plex Sans Arabic", sans-serif' : 'Poppins, sans-serif',
      body: ar ? '"IBM Plex Sans Arabic", Poppins, sans-serif' : 'Poppins, "IBM Plex Sans Arabic", sans-serif',
      tt: ar ? '0' : '-0.5px', flip: ar ? 'scaleX(-1)' : 'none'
    };
  }
}
</script>
</body>
</html>
