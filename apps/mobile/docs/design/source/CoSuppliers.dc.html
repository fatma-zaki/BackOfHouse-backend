<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Supplier requests</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div dir="{{dir}}" lang="{{lang}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: {{c.bg}}; color: {{c.ink}}; font-family: {{body}}; padding-top: 40px">
<header style="display: flex; align-items: center; justify-content: space-between; padding-inline: 20px 16px; height: 56px; box-sizing: border-box; flex-shrink: 0">
<div style="display: flex; align-items: center; gap: 10px"><div style="width: 4px; height: 24px; background: #6437fa; transform: skewX(-18deg)"></div><h1 style="margin: 0; font-family: {{disp}}; font-size: 22px; line-height: 30px; font-weight: 700; letter-spacing: {{tt}}">{{s.title}}</h1></div>
<button type="button" aria-label="{{s.newReq}}" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #6437fa; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0; box-shadow: 0 8px 20px rgba(100,55,250,0.35); cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
</header>
<main style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; padding: 8px 16px 24px; gap: 12px">
<div role="tablist" aria-label="{{s.title}}" style="display: flex; padding: 4px; border-radius: 22px; background: {{c.soft}}; flex-shrink: 0">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" role="tab" aria-selected="{{t.sel}}" style="flex-grow: 1; flex-basis: 0; height: 36px; border: 0; border-radius: 18px; background: {{t.bg}}; color: {{t.color}}; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; box-shadow: {{t.shadow}}; white-space: nowrap">{{t.label}}</button>
</sc-for>
</div>
<sc-for list="{{reqs}}" as="r" hint-placeholder-count="2">
<article style="display: flex; flex-direction: column; gap: 12px; padding: 14px; background: {{c.card}}; border: 1px solid {{r.border}}; border-radius: 20px; box-shadow: {{c.shadow}}">
<div style="display: flex; align-items: center; gap: 10px">
<img src="{{r.img}}" alt="" style="width: 40px; height: 40px; display: block; object-fit: cover; border-radius: 12px; flex-shrink: 0">
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 12px; font-weight: 700">{{r.from}}</span><span style="font-size: 11px; color: {{c.muted}}">{{r.when}}</span></div>
<span style="padding: 3px 9px; border-radius: 12px; background: {{r.sBg}}; color: {{r.sFg}}; font-size: 10.5px; font-weight: 800; white-space: nowrap">{{r.status}}</span>
</div>
<span style="font-family: {{disp}}; font-size: 16px; line-height: 21px; font-weight: 700">{{r.title}}</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<div style="padding: 8px 10px; border-radius: 12px; background: {{c.bg}}; display: flex; flex-direction: column"><span style="font-size: 10px; font-weight: 800; letter-spacing: {{tag}}; color: {{c.muted}}">{{s.budget}}</span><span style="font-size: 13px; font-weight: 700">{{r.budget}}</span></div>
<div style="padding: 8px 10px; border-radius: 12px; background: {{c.bg}}; display: flex; flex-direction: column"><span style="font-size: 10px; font-weight: 800; letter-spacing: {{tag}}; color: {{c.muted}}">{{s.due}}</span><span style="font-size: 13px; font-weight: 700">{{r.due}}</span></div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{r.tags}}" as="tg" hint-placeholder-count="2"><span style="padding: 3px 9px; border-radius: 12px; background: {{c.soft}}; color: {{c.vt}}; font-size: 11px; font-weight: 700">{{tg}}</span></sc-for></div>
<button type="button" style="height: 44px; border: {{r.btnBorder}}; border-radius: 22px; background: {{r.btnBg}}; color: {{r.btnFg}}; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: {{r.btnShadow}}">{{r.cta}}</button>
</article>
</sc-for>
</main>
<nav aria-label="{{s.nav}}" style="flex-shrink: 0; height: 84px; box-sizing: border-box; padding: 8px 6px 22px; background: {{c.card}}; border-top: 1px solid {{c.line}}; border-radius: 24px 24px 0 0; box-shadow: {{c.navShadow}}; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0">
<sc-for list="{{nav}}" as="t" hint-placeholder-count="5">
<button type="button" aria-current="{{t.current}}" style="border: 0; background: transparent; padding: 0; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 3px; color: {{t.color}}; font-size: 10.5px; line-height: 14px; font-weight: {{t.weight}}; cursor: pointer">
<span style="width: 52px; height: 30px; border-radius: 15px; background: {{t.pill}}; color: {{t.icon}}; display: flex; align-items: center; justify-content: center">
<sc-if value="{{t.k0}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg></sc-if>
<sc-if value="{{t.k1}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"></path></svg></sc-if>
<sc-if value="{{t.k2}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l4-4 4 2 3-2 4 1 3 3M3 11l5 5c1 1 2 1 3 0l1-1M21 11l-5 5M12 15l2 2M14 13l2 2"></path></svg></sc-if>
<sc-if value="{{t.k3}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg></sc-if>
<sc-if value="{{t.k4}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="11" height="18" rx="1"></rect><path d="M15 9h5v12h-5M8 7h3M8 11h3M8 15h3"></path></svg></sc-if>
</span>
<span>{{t.label}}</span>
</button>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light"},"locale":{"editor":"enum","options":["en","ar"],"default":"en"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.mode === 'dark';
    const ar = this.props.locale === 'ar';
    const P = {
      light: { bg: '#f6f4fc', card: '#ffffff', line: '#e4dff3', line2: '#cbbdfb', ink: '#15122e', muted: '#5e5a78', vt: '#5424e0', soft: '#efeafe', shadow: '0 8px 30px rgba(40,20,120,0.06)', navShadow: '0 -10px 30px rgba(40,20,120,0.07)',
        st: { invited: ['#ece6ff', '#4a22c9'], review: ['#e0ebff', '#1c4aab'] } },
      dark: { bg: '#05050d', card: '#0b0c1d', line: '#1d1f3d', line2: '#3a2d8f', ink: '#f4f3ff', muted: '#a9a8c3', vt: '#a78bfa', soft: '#141233', shadow: '0 8px 30px rgba(0,0,0,0.35)', navShadow: '0 -10px 30px rgba(0,0,0,0.5)',
        st: { invited: ['#1f1650', '#a78bfa'], review: ['#0f2350', '#7fb0ff'] } }
    };
    const c = dark ? P.dark : P.light;
    const S = {
      en: {
        title: 'Supplier requests', newReq: 'New supplier request', nav: 'Company', budget: 'BUDGET', due: 'RESPOND BY',
        tabs: ['Invited · 2', 'My responses · 1', 'My requests'],
        navL: ['Dashboard', 'Listings', 'Suppliers', 'News', 'Profile'],
        reqs: [
          ['Riyadh Front Events', 'Invited you · 1d ago', 'invited', 'Invited', 'Stage & lighting for a 3-day summit', 'SAR 60K – 90K', 'Oct 5', ['Staging', 'Lighting', 'Riyadh'], 'Respond', true, '/_blob/fe99293a7d78b5eec8cf75c718f91260'],
          ['Creative Expo Co.', 'You responded · Sep 24', 'review', 'Under review', 'AV rental for an art exhibition', 'SAR 25K – 40K', 'Sep 30', ['Audio-visual', 'Jeddah'], 'View my response', false, '/_blob/1f47ac5ede8419f266fd886cee9a6f94']
        ]
      },
      ar: {
        title: 'طلبات التوريد', newReq: 'طلب توريد جديد', nav: 'الشركة', budget: 'الميزانية', due: 'الرد قبل',
        tabs: ['الدعوات · 2', 'ردودي · 1', 'طلباتي'],
        navL: ['اللوحة', 'الفرص', 'التوريد', 'الأخبار', 'الملف'],
        reqs: [
          ['فعاليات واجهة الرياض', 'دعاك قبل يوم', 'invited', 'مدعو', 'مسرح وإضاءة لقمة مدتها 3 أيام', '60 – 90 ألف ر.س', '5 أكتوبر', ['تجهيز المسارح', 'إضاءة', 'الرياض'], 'تقديم عرض', true, '/_blob/fe99293a7d78b5eec8cf75c718f91260'],
          ['شركة المعرض الإبداعي', 'رددت في 24 سبتمبر', 'review', 'قيد المراجعة', 'تأجير صوتيات ومرئيات لمعرض فني', '25 – 40 ألف ر.س', '30 سبتمبر', ['صوتيات ومرئيات', 'جدة'], 'عرض ردي', false, '/_blob/1f47ac5ede8419f266fd886cee9a6f94']
        ]
      }
    };
    const s = ar ? S.ar : S.en;
    const active = 2;
    const nav = s.navL.map((label, i) => {
      const on = i === active;
      const t = { label, color: on ? c.vt : c.muted, icon: on ? (dark ? '#a78bfa' : '#6437fa') : c.muted, pill: on ? c.soft : 'transparent', weight: on ? 800 : 600, current: on ? 'page' : 'false' };
      for (let j = 0; j < 5; j++) t['k' + j] = i === j;
      return t;
    });
    const tabs = s.tabs.map((label, i) => ({ label, sel: i === 0 ? 'true' : 'false', bg: i === 0 ? c.card : 'transparent', color: i === 0 ? c.vt : c.muted, shadow: i === 0 ? '0 4px 12px rgba(40,20,120,0.10)' : 'none' }));
    const reqs = s.reqs.map((r) => ({
      from: r[0], when: r[1], sBg: c.st[r[2]][0], sFg: c.st[r[2]][1], status: r[3], title: r[4], budget: r[5], due: r[6], tags: r[7], cta: r[8], img: r[10],
      border: r[9] ? c.line2 : c.line,
      btnBg: r[9] ? '#6437fa' : 'transparent', btnFg: r[9] ? '#ffffff' : c.vt, btnBorder: r[9] ? '0' : '1.5px solid #6437fa', btnShadow: r[9] ? '0 8px 20px rgba(100,55,250,0.35)' : 'none'
    }));
    return {
      c, s, nav, tabs, reqs,
      dir: ar ? 'rtl' : 'ltr', lang: ar ? 'ar' : 'en',
      disp: ar ? '"IBM Plex Sans Arabic", sans-serif' : 'Poppins, sans-serif',
      body: ar ? '"IBM Plex Sans Arabic", Poppins, sans-serif' : 'Poppins, "IBM Plex Sans Arabic", sans-serif',
      tt: ar ? '0' : '-0.5px', tag: ar ? '0' : '1px', flip: ar ? 'scaleX(-1)' : 'none'
    };
  }
}
</script>
</body>
</html>
