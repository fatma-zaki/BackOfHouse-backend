<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div dir="{{dir}}" lang="{{lang}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: {{c.bg}}; color: {{c.ink}}; font-family: {{body}}; padding-top: 40px">
<header style="display: flex; align-items: center; justify-content: space-between; padding-inline: 16px; height: 56px; box-sizing: border-box; flex-shrink: 0">
<button type="button" aria-label="{{s.back}}" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid {{c.line}}; background: {{c.card}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="transform: {{flip}}"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg></button>
<img src="{{c.logo}}" alt="Back of House" style="height: 38px; width: auto; display: block">
<span style="width: 44px"></span>
</header>
<main style="flex-grow: 1; display: flex; flex-direction: column; padding: 32px 24px 0; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: {{disp}}; font-size: 30px; line-height: 38px; font-weight: 700; letter-spacing: {{tt}}">{{s.h1a}} <span style="color: {{c.vt}}">{{s.h1b}}</span></h1>
<p style="margin: 0; font-size: 14px; line-height: 21px; color: {{c.muted}}">{{s.sub}}</p>
</div>
<div style="display: flex; flex-direction: column; gap: 14px">
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 700">{{s.email}}</span>
<span style="height: 52px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 10px; border-radius: 16px; background: {{c.card}}; border: 1.5px solid #6437fa; color: {{c.muted}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
<input type="email" value="fatma@example.com" dir="ltr" style="flex-grow: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 14px; color: {{c.ink}}; text-align: start">
</span>
</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; justify-content: space-between"><span style="font-size: 12px; font-weight: 700">{{s.password}}</span><a href="#" style="font-size: 12px; font-weight: 700; color: {{c.vt}}; text-decoration: none">{{s.forgot}}</a></span>
<span style="height: 52px; box-sizing: border-box; padding: 0 6px 0 16px; padding-inline: 16px 6px; display: flex; align-items: center; gap: 10px; border-radius: 16px; background: {{c.card}}; border: 1px solid {{c.line}}; color: {{c.muted}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
<input type="password" value="password123" style="flex-grow: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 14px; color: {{c.ink}}">
<button type="button" aria-label="{{s.show}}" style="width: 40px; height: 40px; border: 0; background: transparent; color: {{c.muted}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
</span>
</label>
</div>
<button type="button" style="height: 54px; border: 0; border-radius: 27px; background: #6437fa; color: #ffffff; font-family: inherit; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 10px 30px rgba(100,55,250,0.4); cursor: pointer">{{s.signin}}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform: {{flip}}"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
<div style="display: flex; align-items: center; gap: 12px; color: {{c.muted}}; font-size: 12px"><span style="flex-grow: 1; height: 1px; background: {{c.line}}"></span>{{s.or}}<span style="flex-grow: 1; height: 1px; background: {{c.line}}"></span></div>
<button type="button" style="height: 54px; border: 1.5px solid {{c.line2}}; border-radius: 27px; background: {{c.card}}; color: {{c.ink}}; font-family: inherit; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"></rect><path d="M11 18h2"></path></svg>{{s.phone}}</button>
</main>
<p style="margin: 0; padding: 0 24px 40px; text-align: center; font-size: 13px; color: {{c.muted}}">{{s.newHere}} <a href="#" style="color: {{c.vt}}; font-weight: 700; text-decoration: none">{{s.create}}</a></p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light"},"locale":{"editor":"enum","options":["en","ar"],"default":"en"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.mode === 'dark';
    const ar = this.props.locale === 'ar';
    const P = {
      light: { bg: '#f6f4fc', card: '#ffffff', line: '#e4dff3', line2: '#cbbdfb', ink: '#15122e', muted: '#5e5a78', vt: '#5424e0', logo: '/_blob/8a2f7555266c2b4d939a8907788882f5' },
      dark: { bg: '#05050d', card: '#0b0c1d', line: '#1d1f3d', line2: '#2a2c4d', ink: '#f4f3ff', muted: '#a9a8c3', vt: '#a78bfa', logo: '/_blob/aed6800614143886079e141957cfdccd' }
    };
    const c = dark ? P.dark : P.light;
    const S = {
      en: { back: 'Back', h1a: 'Welcome', h1b: 'back.', sub: 'Sign in to pick up where you left off.', email: 'Email', password: 'Password', forgot: 'Forgot password?', show: 'Show password', signin: 'Sign in', or: 'or', phone: 'Continue with a phone code', newHere: 'New to Back of House?', create: 'Create account' },
      ar: { back: 'رجوع', h1a: 'أهلًا', h1b: 'بعودتك.', sub: 'سجّل الدخول لتكمل من حيث توقفت.', email: 'البريد الإلكتروني', password: 'كلمة المرور', forgot: 'نسيت كلمة المرور؟', show: 'إظهار كلمة المرور', signin: 'تسجيل الدخول', or: 'أو', phone: 'المتابعة برمز الجوال', newHere: 'جديد في باك أوف هاوس؟', create: 'إنشاء حساب' }
    };
    const s = ar ? S.ar : S.en;
    return {
      c, s,
      dir: ar ? 'rtl' : 'ltr', lang: ar ? 'ar' : 'en',
      disp: ar ? '"IBM Plex Sans Arabic", sans-serif' : 'Poppins, sans-serif',
      body: ar ? '"IBM Plex Sans Arabic", Poppins, sans-serif' : 'Poppins, "IBM Plex Sans Arabic", sans-serif',
      tt: ar ? '0' : '-0.6px', flip: ar ? 'scaleX(-1)' : 'none'
    };
  }
}
</script>
</body>
</html>
