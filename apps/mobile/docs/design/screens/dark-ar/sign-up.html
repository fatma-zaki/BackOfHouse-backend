<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up — Dark · Arabic (RTL)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0;padding:0}
body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;background:#000000}
*{-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<div dir="rtl" lang="ar" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #05050d; color: #f4f3ff; font-family: &quot;IBM Plex Sans Arabic&quot;, Poppins, sans-serif; padding-top: 40px">
<header style="display: flex; align-items: center; justify-content: space-between; padding-inline: 16px; height: 56px; box-sizing: border-box; flex-shrink: 0">
<button type="button" aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #1d1f3d; background: #0b0c1d; color: #f4f3ff; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="transform: scaleX(-1)"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg></button>
<div style="display: flex; align-items: center; gap: 6px"><span style="width: 28px; height: 5px; border-radius: 3px; background: #6437fa"></span><span style="width: 28px; height: 5px; border-radius: 3px; background: #1d1f3d"></span><span style="margin-inline-start: 6px; font-size: 12px; font-weight: 700; color: #a9a8c3">الخطوة 1 من 2</span></div>
</header>
<main style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; padding: 12px 20px 0; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: &quot;IBM Plex Sans Arabic&quot;, sans-serif; font-size: 26px; line-height: 32px; font-weight: 700; letter-spacing: 0">أنشئ حسابك</h1>
<p style="margin: 0; font-size: 13px; line-height: 19px; color: #a9a8c3">انضم إلى مجتمع الفعاليات في السعودية خلال دقيقة.</p>
</div>
<div role="radiogroup" aria-label="نوع الحساب" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">

<button type="button" role="radio" aria-checked="true" style="position: relative; padding: 14px; border-radius: 18px; border: 1.5px solid #6437fa; background: #0b0c1d; color: #f4f3ff; font-family: inherit; text-align: start; display: flex; flex-direction: column; gap: 8px; cursor: pointer; box-shadow: 0 8px 24px rgba(100,55,250,0.18)">
<span style="width: 38px; height: 38px; border-radius: 12px; background: #6437fa; color: #ffffff; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>

</span>
<span style="font-size: 14px; font-weight: 700">فرد</span>
<span style="font-size: 11px; line-height: 15px; color: #a9a8c3">محترفون ومستقلون وطلاب</span>
<span style="position: absolute; top: 12px; inset-inline-end: 12px; width: 18px; height: 18px; box-sizing: border-box; border-radius: 9px; border: 5px solid #6437fa; background: #0b0c1d"></span>
</button>

<button type="button" role="radio" aria-checked="false" style="position: relative; padding: 14px; border-radius: 18px; border: 1.5px solid #1d1f3d; background: #0b0c1d; color: #f4f3ff; font-family: inherit; text-align: start; display: flex; flex-direction: column; gap: 8px; cursor: pointer; box-shadow: none">
<span style="width: 38px; height: 38px; border-radius: 12px; background: #141233; color: #a78bfa; display: flex; align-items: center; justify-content: center">

<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="11" height="18" rx="1"></rect><path d="M15 9h5v12h-5M8 7h3M8 11h3M8 15h3"></path></svg>
</span>
<span style="font-size: 14px; font-weight: 700">شركة</span>
<span style="font-size: 11px; line-height: 15px; color: #a9a8c3">منظمون ووكالات وقاعات وموردون</span>
<span style="position: absolute; top: 12px; inset-inline-end: 12px; width: 18px; height: 18px; box-sizing: border-box; border-radius: 9px; border: 1.5px solid #1d1f3d; background: #0b0c1d"></span>
</button>

</div>
<div style="display: flex; flex-direction: column; gap: 12px">

<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 700">الاسم الكامل</span>
<span style="height: 48px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 10px; border-radius: 14px; background: #0b0c1d; border: 1px solid #1d1f3d; color: #a9a8c3">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>



<input type="text" value="فاطمة زكي" placeholder="فاطمة زكي" dir="auto" style="flex-grow: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 14px; color: #f4f3ff; text-align: start">
</span>
</label>

<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 700">البريد الإلكتروني</span>
<span style="height: 48px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 10px; border-radius: 14px; background: #0b0c1d; border: 1px solid #6437fa; color: #a9a8c3">

<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>


<input type="email" value="fatma@example.com" placeholder="fatma@example.com" dir="ltr" style="flex-grow: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 14px; color: #f4f3ff; text-align: start">
</span>
</label>

<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 700">رقم الجوال</span>
<span style="height: 48px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 10px; border-radius: 14px; background: #0b0c1d; border: 1px solid #1d1f3d; color: #a9a8c3">


<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"></rect><path d="M11 18h2"></path></svg>

<input type="tel" value="+966 5X XXX XXXX" placeholder="+966 5X XXX XXXX" dir="ltr" style="flex-grow: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 14px; color: #f4f3ff; text-align: start">
</span>
</label>

<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 700">كلمة المرور</span>
<span style="height: 48px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 10px; border-radius: 14px; background: #0b0c1d; border: 1px solid #1d1f3d; color: #a9a8c3">



<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
<input type="password" value="" placeholder="••••••••" dir="auto" style="flex-grow: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 14px; color: #f4f3ff; text-align: start">
</span>
</label>

</div>
<label style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: #141233">
<input type="checkbox" style="width: 20px; height: 20px; margin: 0; accent-color: #6437fa; flex-shrink: 0">
<span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 13px; font-weight: 700">أنا طالب حاليًا</span><span style="font-size: 11px; line-height: 15px; color: #a9a8c3">يتيح لك فرص التدريب التعاوني.</span></span>
</label>
</main>
<div style="flex-shrink: 0; padding: 12px 20px 32px; display: flex; flex-direction: column; gap: 10px">
<a href="#" style="height: 54px; border-radius: 27px; background: #6437fa; color: #ffffff; text-decoration: none; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 10px 30px rgba(100,55,250,0.4)">متابعة<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform: scaleX(-1)"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
<p style="margin: 0; text-align: center; font-size: 12px; color: #a9a8c3">لديك حساب بالفعل؟ <a href="#" style="color: #a78bfa; font-weight: 700; text-decoration: none">تسجيل الدخول</a></p>
</div>
</div>
</body>
</html>
