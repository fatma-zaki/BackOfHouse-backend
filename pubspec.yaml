name: backofhouse
description: "Saudi Arabia's professional events community."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & DI
  flutter_riverpod: ^3.0.3

  # Routing
  go_router: ^17.2.1

  # Networking
  dio: ^5.9.0

  # Secure token storage
  flutter_secure_storage: ^10.0.0

  # UI
  cached_network_image: ^3.4.1
  lucide_icons_flutter: ^3.1.19

  # Platform / utilities
  intl: ^0.20.3
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.0
  shared_preferences: ^2.5.3
  file_picker: ^10.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/images/content/
    - assets/icons/

  # Poppins (Latin, all numbers) and Cairo (Arabic), SIL OFL 1.1 â€” see
  # assets/fonts/OFL-*.txt. Bundled so first launch renders offline. Cairo
  # weights are static instances cut from the upstream variable font.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
