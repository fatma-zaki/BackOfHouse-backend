# Admin surface contract (ADR-031). Source of truth: edit this file first, then the code.
# First generated 2026-10-11 from docs/admin/openapi/openapi.yaml by scripts/contracts/convert-admin-handoff.mjs.
openapi: 3.1.0
info:
  title: Back of House — Admin API
  version: 1.0.0
  description: >-
    Contract for the admin back-office (web). Source of truth for the admin surface (ADR-031).


    Conventions: snake_case JSON; enum values UPPER_SNAKE_CASE; single resources `{ data }`, lists `{ data, meta }` with
    `page`, `page_size`, `total`, `total_pages`; errors `{ code, message, trace_id, errors }` (docs/error-codes.md);
    bilingual content as `{ en, ar }`.


    Every operation carries `x-phase` (docs/execution-plan.md) and, where it is permission-gated, `x-permission`.
    Authentication: Google Workspace via OIDC, then an httpOnly session cookie (ADR-032).
servers:
  - url: /api/admin/v1
security:
  - adminSession: []
tags:
  - name: Admin auth
  - name: Admin dashboards
  - name: Admin analytics
  - name: Admin opportunities
  - name: Admin applications
  - name: Admin supplier requests
  - name: Admin users
  - name: Admin companies
  - name: Admin verification
  - name: Admin claims & imports
  - name: Admin events
  - name: Admin news
  - name: Admin rewards & points
  - name: Admin moderation
  - name: Admin support
  - name: Admin broadcasts
  - name: Admin team
  - name: Admin audit
  - name: Admin reports & exports
  - name: Admin settings
paths:
  /{subject}/{id}/notes:
    get:
      tags:
        - Admin users
      summary: Internal notes on a user or company
      operationId: getAdminSubjectIdNotes
      description: '**Permission:** `notes.view`'
      x-phase: '4'
      x-permission: notes.view
      x-screens:
        - admin:user-detail
        - admin:company-detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: subject
          in: path
          required: true
          schema:
            type: string
            enum:
              - users
              - companies
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - adminSession: []
    post:
      tags:
        - Admin users
      summary: Add an internal note
      operationId: postAdminSubjectIdNotes
      description: '**Permission:** `notes.write`'
      x-phase: '4'
      x-permission: notes.write
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: subject
          in: path
          required: true
          schema:
            type: string
            enum:
              - users
              - companies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
              required:
                - body
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - adminSession: []
          csrfToken: []
