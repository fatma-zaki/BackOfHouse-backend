    PlatformSettings:
      type: object
      properties:
        review_sla_hours:
          type: integer
        review_every_opportunity:
          type: boolean
          const: true
          description: Always true (D9)
        hide_contact_details_in_opportunities:
          type: boolean
        auto_flag_fee_opportunities:
          type: boolean
        verified_companies_skip_review:
          type: boolean
          const: false
          description: Always false (D9)
        support_first_reply_hours:
          type: integer
        support_points_monthly_cap:
          type: integer
        admin_email_domain:
          type: string
        admin_idle_timeout_minutes:
          type: integer
        push_quiet_hours:
          type: object
          properties:
            start:
              type: string
              pattern: ^([01]\d|2[0-3]):[0-5]\d$
            end:
              type: string
              pattern: ^([01]\d|2[0-3]):[0-5]\d$
          required:
            - start
            - end
        levels:
          type: array
          items:
            type: object
            properties:
              level:
                type: integer
              min_lifetime_points:
                type: integer
            required:
              - level
              - min_lifetime_points
        app_version:
          type: object
          additionalProperties: false
          description: Forced-update policy served by GET /api/app/v1/meta/app-version (D11)
          required:
            - ios
            - android
          properties:
            ios:
              type: object
              additionalProperties: false
              required:
                - min_supported_version
                - latest_version
                - update_url
              properties:
                min_supported_version:
                  type: string
                  pattern: ^\d+\.\d+\.\d+$
                  example: 1.0.0
                latest_version:
                  type: string
                  pattern: ^\d+\.\d+\.\d+$
                  example: 1.0.0
                update_url:
                  type: string
                  format: uri
            android:
              type: object
              additionalProperties: false
              required:
                - min_supported_version
                - latest_version
                - update_url
              properties:
                min_supported_version:
                  type: string
                  pattern: ^\d+\.\d+\.\d+$
                  example: 1.0.0
                latest_version:
                  type: string
                  pattern: ^\d+\.\d+\.\d+$
                  example: 1.0.0
                update_url:
                  type: string
                  format: uri
      description: >-
        Platform settings (Super admin). Defaults in code; rules fixed by product decisions are enforced:
        review_every_opportunity must be true and verified_companies_skip_review false (D9); levels start at L1 = 0 and
        rise (BQ-76). Invalid input → 422 VALIDATION_FAILED with field errors.
      additionalProperties: false
      required:
        - review_sla_hours
        - review_every_opportunity
        - hide_contact_details_in_opportunities
        - auto_flag_fee_opportunities
        - verified_companies_skip_review
        - support_first_reply_hours
        - support_points_monthly_cap
        - admin_email_domain
        - admin_idle_timeout_minutes
        - push_quiet_hours
        - levels
        - app_version
