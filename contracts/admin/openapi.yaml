  /auth/logout:
    post:
      tags:
        - Admin auth
      summary: Sign out
      operationId: postAdminAuthLogout
      x-phase: '2'
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - adminSession: []
          csrfToken: []
      description: Deletes the server-side session and clears the cookie.
  /auth/oidc/callback:
    get:
      tags:
        - Admin auth
      summary: Google Workspace sign-in callback
      operationId: getAdminAuthOidcCallback
      description: >-
        Exchanges the code, verifies the ID token (issuer, audience, nonce, expiry), then requires BOTH the `hd` claim
        and the verified email domain to equal the Workspace domain. Activates an `INVITED` staff account on first
        sign-in. Sets the `__Host-boh_admin` session cookie (30-min idle, 12 h absolute) and redirects to the admin web
        app. Audited as `admin.sign_in`.
      x-phase: '2'
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Signed in; redirect to the admin web app with the session cookie set
        '401':
          description: '`UNAUTHENTICATED`: invalid state, nonce or ID token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: '`NOT_STAFF`: not our Workspace domain, or no active staff account for this email'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/oidc/start:
    get:
      tags:
        - Admin auth
      summary: Start Google Workspace sign-in
      operationId: getAdminAuthOidcStart
      description: >-
        Redirects to Google with an OIDC authorization request (code flow + PKCE, `hd` set to the Workspace domain).
        Stores `state`, `nonce` and the PKCE verifier in a short-lived httpOnly cookie.
      x-phase: '2'
      security: []
      parameters:
        - name: return_to
          in: query
          required: false
          description: Admin web path to open after sign-in
          schema:
            type: string
      responses:
        '302':
          description: Redirect to Google
        '429':
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /broadcasts:
    get:
      tags:
        - Admin broadcasts
      summary: Sent and scheduled broadcasts
      operationId: getAdminBroadcasts
