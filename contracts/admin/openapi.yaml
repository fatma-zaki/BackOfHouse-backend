      type: object
      required:
        - code
        - message
        - trace_id
      description: 'Error body shared by both surfaces (ADR-008, D3). Codes: docs/error-codes.md.'
      properties:
        code:
          type: string
          description: Stable machine-readable code from docs/error-codes.md, e.g. VALIDATION_FAILED, NOT_STAFF, SERVER_ERROR
        message:
          type: string
          description: For logs only; the client shows its own localised copy.
        trace_id:
          type: string
        errors:
          type: object
          description: Field errors keyed by request field name (422 only)
          additionalProperties:
            type: array
            items:
              type: string
    PlatformSettingsUpdate:
      type: object
      description: >-
        Body of PUT /settings: the full settings as returned by GET /settings. The server validates it against
        PlatformSettings and the product rules (D9, BQ-76) and answers 422 VALIDATION_FAILED with field errors for
        anything missing or invalid. Kept lenient here so the request contract stays compatible; the response schema
        PlatformSettings is the exact shape.
      properties:
        review_sla_hours:
          type: integer
        review_every_opportunity:
          type: boolean
          description: Must be true (D9); other values → 422
        hide_contact_details_in_opportunities:
          type: boolean
        auto_flag_fee_opportunities:
          type: boolean
        verified_companies_skip_review:
          type: boolean
          description: Must be false (D9); other values → 422
        support_first_reply_hours:
          type: integer
        support_points_monthly_cap:
          type: integer
        admin_email_domain:
          type: string
        admin_idle_timeout_minutes:
          type: integer
        push_quiet_hours:
          type: object
          properties:
            start:
              type: string
              description: HH:MM, 24 h, Asia/Riyadh
            end:
              type: string
              description: HH:MM, 24 h, Asia/Riyadh
        levels:
          type: array
          items:
            type: object
            properties:
              level:
                type: integer
              min_lifetime_points:
                type: integer
        app_version:
          type: object
          additionalProperties: false
          description: Forced-update policy served by GET /api/app/v1/meta/app-version (D11)
          required:
            - ios
            - android
          properties:
            ios:
              type: object
              additionalProperties: false
              required:
                - min_supported_version
                - latest_version
                - update_url
              properties:
                min_supported_version:
                  type: string
                  pattern: ^\d+\.\d+\.\d+$
                  example: 1.0.0
                latest_version:
                  type: string
                  pattern: ^\d+\.\d+\.\d+$
                  example: 1.0.0
                update_url:
                  type: string
                  format: uri
            android:
              type: object
              additionalProperties: false
              required:
                - min_supported_version
                - latest_version
                - update_url
              properties:
                min_supported_version:
                  type: string
                  pattern: ^\d+\.\d+\.\d+$
                  example: 1.0.0
                latest_version:
                  type: string
                  pattern: ^\d+\.\d+\.\d+$
                  example: 1.0.0
                update_url:
                  type: string
                  format: uri
    TaxonomyItemUpdate:
      type: object
      description: An item of PUT /taxonomy/{kind}. Omit id to add an item to a list staff can extend.
      properties:
        id:
          type: string
          description: Existing item id, or the code for a fixed list
        name:
          $ref: '#/components/schemas/LocalizedText'
        active:
          type: boolean
          description: Default true; fixed lists cannot be deactivated
        order:
          type: integer
          description: 'Default: position in the array. Must be 0 or more (422 otherwise)'
      required:
        - name
  responses:
    BadRequest:
      description: '`BAD_REQUEST`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: '`UNAUTHENTICATED`: no session, or the session expired (30-min idle, 12 h absolute)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: '`FORBIDDEN`, `PERSONAL_DATA_FORBIDDEN` or `NOT_STAFF`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: '`NOT_FOUND`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: State conflict, e.g. `NOT_EDITABLE`, `INVALID_TRANSITION`, `LAST_SUPER_ADMIN`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: '`VALIDATION_FAILED` (with `errors`) or a business rule, e.g. `MONTHLY_CAP_REACHED`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: '`SERVER_ERROR`: unexpected failure, no details exposed (any operation, 5xx)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 64
      description: >-
        Client-generated UUID. Repeating the request with the same key returns the first result instead of acting twice
        (kept 24 h).
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        enum:
          - en
          - ar
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: __Host-boh_admin
      description: Opaque server-side session (ADR-032). httpOnly, Secure, SameSite=Strict. 30-min idle, 12 h absolute.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required on POST, PUT, PATCH and DELETE (double-submit token issued with the session).
