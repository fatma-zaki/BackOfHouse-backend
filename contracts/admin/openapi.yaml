          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          required: false
          schema:
            type: string
            description: Field name, prefix with - for descending, e.g. -createdAt
        - name: q
          in: query
          required: false
          schema:
            type: string
            description: Free-text search
        - name: from
          in: query
