components:
  schemas:
    LocalizedText:
      type: object
      properties:
        en:
          type: string
        ar:
          type: string
      description: >-
        Bilingual text. Admin endpoints read and write both languages; member endpoints return the single language
        chosen by Accept-Language as a plain string.
    PageMeta:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
        total_pages:
          type: integer
      required:
        - page
        - page_size
        - total
        - total_pages
    CursorMeta:
      type: object
      properties:
        next_cursor:
          oneOf:
            - type: string
            - type: 'null'
        has_more:
          type: boolean
      required:
        - next_cursor
        - has_more
    Money:
      type: object
      properties:
        amount:
          type: integer
          description: Whole SAR (no halalas) unless stated
        currency:
          type: string
          enum:
            - SAR
      required:
        - amount
        - currency
    MoneyRange:
      type: object
      properties:
        min:
          oneOf:
            - type: integer
            - type: 'null'
        max:
          oneOf:
            - type: integer
            - type: 'null'
        currency:
          type: string
          enum:
            - SAR
        note:
          oneOf:
            - type: string
              description: e.g. 'Discussed at interview'
            - type: 'null'
    Upload:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          description: Short-lived signed URL for private files
        mime:
          type: string
        size:
          type: integer
        purpose:
          type: string
          enum:
            - AVATAR
            - COMPANY_LOGO
            - COMPANY_COVER
            - PORTFOLIO
            - VERIFICATION_DOC
            - ARTICLE_COVER
            - EVENT_COVER
            - REWARD_IMAGE
            - IMPORT_FILE
            - TICKET_ATTACHMENT
      required:
        - id
        - url
        - mime
        - purpose
    JobAccepted:
      type: object
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - QUEUED
            - PROCESSING
      required:
        - job_id
        - status
    PortfolioItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        image_url:
          type: string
          format: uri
        description:
          oneOf:
            - type: string
            - type: 'null'
        event_name:
          oneOf:
            - type: string
            - type: 'null'
        year:
          oneOf:
            - type: integer
            - type: 'null'
    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        avatar_url:
          oneOf:
            - type: string
              format: uri
            - type: 'null'
        headline:
          oneOf:
            - type: string
            - type: 'null'
        city:
          oneOf:
            - type: string
            - type: 'null'
        verified:
          type: boolean
        is_student:
          type: boolean
      required:
        - id
        - full_name
        - verified
    PointsTransaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: integer
          description: Positive = earned, negative = spent/adjusted down
        type:
          type: string
          enum:
            - EVENT_ATTENDANCE
            - VOLUNTEER_SHIFT
            - PROFILE_COMPLETED
            - REFERRAL
            - WORKSHOP_ATTENDANCE
            - REWARD_REDEMPTION
            - MANUAL_ADJUSTMENT
            - REVERSAL
        title:
          type: string
        subtitle:
          oneOf:
            - type: string
            - type: 'null'
        source:
          oneOf:
            - type: object
              properties:
                type:
                  type: string
                id:
                  type: string
            - type: 'null'
        reason:
          oneOf:
            - type: string
              description: Required for manual adjustments
            - type: 'null'
        created_by:
          oneOf:
            - type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
              description: Admin who made a manual adjustment
            - type: 'null'
        created_at:
          type: string
          format: date-time
      required:
        - id
        - amount
        - type
        - created_at
    Reward:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          oneOf:
            - type: string
            - type: 'null'
        category:
          type: string
          enum:
            - LEARN
            - ATTEND
            - CAREER
            - COMMUNITY
            - VISIBILITY
        kind:
          type: string
          enum:
            - PROFILE_HIGHLIGHT
            - PARTNER_VOUCHER
            - COURSE
            - EVENT_PASS
            - MERCH
        image_url:
          oneOf:
            - type: string
              format: uri
            - type: 'null'
        cost:
          type: integer
        required_level:
          oneOf:
            - type: integer
            - type: 'null'
        locked:
          type: boolean
          description: Member's level is below requiredLevel
        remaining:
          oneOf:
            - type: integer
              description: null = unlimited
            - type: 'null'
        live:
          type: boolean
      required:
        - id
        - title
        - cost
        - kind
    RewardAdmin:
      allOf:
        - $ref: '#/components/schemas/Reward'
        - type: object
          properties:
            title_i18n:
              $ref: '#/components/schemas/LocalizedText'
            description_i18n:
              $ref: '#/components/schemas/LocalizedText'
            stock:
              oneOf:
                - type: integer
                - type: 'null'
            redeemed_count:
              type: integer
            partner:
              oneOf:
                - type: string
                - type: 'null'
            highlight_days:
              oneOf:
                - type: integer
                  description: For profile_highlight
                - type: 'null'
    Redemption:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reward:
          $ref: '#/components/schemas/Reward'
        user:
          $ref: '#/components/schemas/UserSummary'
        points_spent:
          type: integer
        code:
          oneOf:
            - type: string
            - type: 'null'
        valid_until:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        status:
          type: string
          enum:
            - PENDING_FULFILMENT
            - FULFILLED
            - CANCELLED
        created_at:
          type: string
          format: date-time
        fulfilled_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
      required:
        - id
        - points_spent
        - status
    EarningRule:
      type: object
      properties:
        key:
          type: string
          enum:
            - EVENT_REGISTRATION
            - EVENT_ATTENDANCE
            - VOLUNTEER_SHIFT
            - PROFILE_COMPLETED
            - REFERRAL_ATTENDED
        points:
          type: integer
        enabled:
          type: boolean
        limit_note:
          oneOf:
            - type: string
            - type: 'null'
        locked:
          type: boolean
          description: event_registration is fixed at 0 and cannot be changed
      required:
        - key
        - points
        - enabled
        - locked
    PointsAdjustmentRequest:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        amount:
          type: integer
          description: 'Non-zero. Support role: positive only, max 500 per member per calendar month'
        reason:
          type: string
          enum:
            - ATTENDANCE_NOT_RECORDED
            - VOLUNTEER_SHIFT_MISSING
            - GOODWILL
            - CORRECTION
            - OTHER
        note:
          type: string
          minLength: 5
        event_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        ticket_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        evidence:
          oneOf:
            - type: string
            - type: 'null'
      required:
        - user_id
        - amount
        - reason
        - note
    CompanySummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        logo_url:
          oneOf:
            - type: string
              format: uri
            - type: 'null'
        category:
          type: string
          enum:
            - ORGANIZER
            - VENUE
            - SUPPLIER
            - AGENCY
            - PRODUCTION
        industry:
          oneOf:
            - type: string
            - type: 'null'
        city:
          oneOf:
            - type: string
            - type: 'null'
        verified:
          type: boolean
        open_roles:
          type: integer
        following:
          type: boolean
          description: Only on member endpoints
      required:
        - id
        - slug
        - name
        - verified
    CompanyAdmin:
      allOf:
        - $ref: '#/components/schemas/CompanySummary'
        - type: object
          properties:
